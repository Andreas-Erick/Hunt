                  <button class="text-action" style="margin-top:16px;color:var(--muted);" onclick="switchView('command')">← Back to Today</button>
                ` : `
                  <h2 style="font-family:var(--font-display);font-size:22px;font-weight:600;margin:14px 0 6px;">${doneToday ? "All done for today" : "Nothing queued for today"}</h2>
                  <p style="font-size:13px;color:var(--muted);margin:0 0 20px;max-width:280px;line-height:1.45;">
                    ${doneToday ? `${doneToday} task${doneToday === 1 ? "" : "s"} completed today.` : "Add a task to start a focus session."}
                    ${laterCount ? ` ${laterCount} planned for later.` : ""}
                  </p>
                  <button class="empty-action primary" onclick="openNewTaskSheet()">+ New Task</button>
                `}
              </div>
              <div class="focus-footer">${focusSyncIndicatorHtml()}</div>
            </div>
          `;
        } else {
          const q = state.quests.find(x => x.id === activeTaskObj.questId);
          const hex = ACCENT_HEX[q ? q.accentColor : "slate"] || ACCENT_HEX.slate;
          // slate as text is below 4.5:1 on the page background: the state line uses --muted then
          const stateColor = !af.isRunning ? "var(--dim)" : hex === ACCENT_HEX.slate ? "var(--muted)" : hex;
          const totalElapsed = (activeTaskObj.accumulatedSeconds || 0) + liveDelta;

          container.innerHTML = `
            <div class="focus-stage">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
                <div style="display:flex;align-items:center;gap:8px;min-width:0;font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);">
                  <span style="width:8px;height:8px;border-radius:50%;background:${hex};box-shadow:0 0 8px ${hex};flex-shrink:0;"></span>
                  <span style="min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Focus · ${escapeHtml(q ? q.title : "Other")}</span>
                </div>
                <button class="icon-circle-btn pressable" onclick="returnToQueueFromFocus()" aria-label="End session and go back to Today">${SVG_BACK}</button>
              </div>

              <div class="focus-center">
                <div class="focus-quest-pill" style="border:1px solid ${hex}55;background:${hex}12;">
                  <span style="width:7px;height:7px;border-radius:50%;background:${hex};"></span>
                  <span>${escapeHtml(q ? q.title : "Other work")}</span>
                </div>

                <h1 class="focus-task-title">
                  ${escapeHtml(activeTaskObj.title)}
                </h1>

                <div id="focusBigChrono" class="focus-chrono">
                  ${formatChrono(totalElapsed)}
                </div>

                <div class="focus-state" style="color:${stateColor};">
                  ${af.isRunning ? "● RUNNING" : "PAUSED"}
                </div>

                <div class="focus-actions">
                  <button class="pressable" onclick="toggleTimerPause()" style="height:var(--touch-min);border-radius:14px;border:1px solid var(--border-strong);background:var(--surface-2);color:white;font-family:var(--font-display);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;">
                    ${af.isRunning ? SVG_PAUSE : SVG_PLAY}
                    <span>${af.isRunning ? "Pause" : "Resume"}</span>
                  </button>
                  <button class="pressable" onclick="completeActiveTaskAndNext()" style="height:var(--touch-min);border-radius:14px;border:none;background:var(--emerald);color:#05070a;font-family:var(--font-display);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;">
                    ${SVG_CHECK}
                    <span>Complete</span>
                  </button>
                </div>

                <div class="focus-notes">
                  <textarea rows="2" placeholder="Tap to add session notes..." aria-label="Session notes" oninput="draftTaskField(${jsArg(activeTaskObj.id)}, 'notes', this.value)" onchange="saveTaskText(${jsArg(activeTaskObj.id)}, 'notes', this.value)" style="width:100%;resize:none;border-radius:13px;border:1px solid var(--border);background:var(--surface);padding:10px 14px;text-align:center;font-size:12px;color:var(--text-2);outline:none;">${escapeHtml(activeTaskObj.notes || "")}</textarea>
                </div>
              </div>

              <div class="focus-footer">
                ${focusSyncIndicatorHtml()}
                ${af.isRunning ? `<span aria-hidden="true">·</span><span>Screen stays awake</span>` : ""}
              </div>
            </div>
          `;
        }
      }

      // =====================================================================
      // VIEW 4: QUESTS (Active Quests & Weekly Input Hours + Completed Quests)
      // =====================================================================
      else if (activeView === "quests") {
        const completedQuests = state.quests
          .filter(q => q.archived)
          .sort((a, b) => ((b.completedAt || b.updatedAt || 0) - (a.completedAt || a.updatedAt || 0)));

        // Single-pass O(L) aggregation of 7-day and all-time logged seconds per quest.
        const weekSecByQuest = new Map();
        const totalSecByQuest = new Map();
        for (const l of state.timeLogs) {
          if (!l.questId) continue;
          totalSecByQuest.set(l.questId, (totalSecByQuest.get(l.questId) || 0) + l.durationSeconds);
          if (last7Keys.has(l.dateKey)) {
            weekSecByQuest.set(l.questId, (weekSecByQuest.get(l.questId) || 0) + l.durationSeconds);
          }
        }

        container.innerHTML = `
          <div class="hero-bar">
            <div>
              <div class="hero-eyebrow">Vertical Coherence</div>
              <h1 class="hero-title">Quests</h1>
            </div>
            <div class="step-chip-row">
              <button class="sync-chip pressable" onclick="openGuideView('quests')">
                Guide
              </button>
              <button class="sync-chip pressable" style="background:rgba(0,240,255,0.12);border-color:rgba(0,240,255,0.35);color:var(--cyan);font-weight:600;" onclick="openNewQuestSheet()">
                + New Quest
              </button>
            </div>
          </div>

          ${activeQuests.length === 0 ? emptyCardHtml(
            "No quests yet",
            "A quest groups the work that matters and tracks its weekly hours.",
            [
              { label: "Create your first quest", primary: true, onclick: "openNewQuestSheet()" },
              { label: "Read Quest Guide", onclick: "openGuideView('quests')" }
            ]
          ) : `<div class="quests-grid">` + activeQuests.map(quest => {
            const hex = ACCENT_HEX[quest.accentColor] || ACCENT_HEX.slate;
            const sec = weekSecByQuest.get(quest.id) || 0;
            const hrs = sec / 3600;
            const pct = Math.min(100, Math.round((hrs / Math.max(1, quest.targetWeeklyHours)) * 100));
            const qTasks = state.tasks
              .filter(t => t.questId === quest.id && (t.status === "queued" || t.status === "active"))
              .sort(compareRank);
            const qCompleted = state.tasks
              .filter(t => t.questId === quest.id && t.status === "completed" && t.completedAt && toLocalDateKey(t.completedAt) === todayKey)
              .sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0))
              .slice(0, 3);

            return `
              <div class="review-card" style="padding:20px;">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;">
                  <div style="display:flex;align-items:flex-start;gap:10px;min-width:0;">
                    <span style="width:10px;height:10px;margin-top:7px;border-radius:50%;background:${hex};box-shadow:0 0 8px ${hex};flex-shrink:0;"></span>
                    <h2 style="font-family:var(--font-display);font-size:19px;font-weight:700;line-height:1.26;letter-spacing:-0.015em;margin:0;min-width:0;overflow-wrap:anywhere;text-wrap:balance;">${escapeHtml(quest.title)}</h2>
                  </div>
                  <button class="sync-chip mini-chip-btn" onclick="openQuestEditorSheet(${jsArg(quest.id)})" aria-label="Edit quest ${escapeHtml(quest.title)}">Edit</button>
                </div>

                ${quest.description ? `<p style="font-size:13px;color:var(--muted);margin:8px 0 0;line-height:1.45;overflow-wrap:anywhere;">${escapeHtml(quest.description)}</p>` : ""}

                <div style="margin-top:16px;padding:14px;border-radius:14px;border:1px solid var(--border);background:var(--bg);">
                  <div style="display:flex;justify-content:space-between;align-items:baseline;">
                    <span style="font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--dim);">Quest Hours (7d)</span>
                    <span style="font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;"><strong style="font-family:var(--font-display);font-size:18px;color:white;">${formatTelemetryDuration(sec, "0.0h")}</strong> / ${Number(quest.targetWeeklyHours) || 0}h (${pct}%)</span>
                  </div>
                  <div style="height:6px;background:rgba(255,255,255,0.06);border-radius:999px;overflow:hidden;margin-top:10px;">
                    <div style="height:100%;width:${pct}%;background:${hex};border-radius:999px;"></div>
                  </div>
                </div>

                <div style="display:flex;justify-content:space-between;align-items:center;margin:16px 0 10px;">
                  <span style="font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--dim);">Next Steps (${qTasks.length})</span>
                  <button class="text-action" onclick="openNewTaskSheet(${jsArg(quest.id)})" style="color:${hex};font-size:12px;margin:-14px -8px;" aria-label="Add a step to ${escapeHtml(quest.title)}">+ Add Step</button>
                </div>

                ${qTasks.map(t => renderCompactQueueCard(t)).join("")}
                ${qTasks.length === 0 ? `<div style="font-size:12px;color:var(--dim);padding:2px 2px 0;" data-flip-key="${escapeHtml("quest-empty:" + quest.id)}">No open steps yet.</div>` : ""}
                ${qCompleted.length > 0 ? `
                  <div data-flip-key="${escapeHtml("quest-done:" + quest.id)}" style="font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--dim);margin:14px 0 8px;">Completed today (${qCompleted.length})</div>
                  ${qCompleted.map(t => renderCompletedCard(t, true)).join("")}
                ` : ""}
              </div>
            `;
          }).join("") + `</div>`}

          ${completedQuests.length > 0 ? `
            <div class="section-header-label">Completed Quests (${completedQuests.length})</div>
            <div class="quests-grid">
            ${completedQuests.map(quest => {
              const hex = ACCENT_HEX[quest.accentColor] || ACCENT_HEX.slate;
              const totalSec = totalSecByQuest.get(quest.id) || 0;
              return `
                <div class="review-card" style="padding:18px;background:rgba(17,19,25,0.72);">
                  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;">
                    <div style="display:flex;align-items:flex-start;gap:10px;min-width:0;">
                      <span style="width:9px;height:9px;margin-top:7px;border-radius:50%;background:${hex};opacity:0.65;flex-shrink:0;"></span>
                      <h3 style="font-family:var(--font-display);font-size:17px;font-weight:600;line-height:1.28;margin:0;min-width:0;color:var(--text-2);overflow-wrap:anywhere;text-wrap:balance;">${escapeHtml(quest.title)}</h3>
                    </div>
                    <span style="flex-shrink:0;font-size:11px;font-weight:600;color:var(--emerald);padding:3px 9px;border-radius:999px;border:1px solid rgba(0,255,157,0.3);background:rgba(0,255,157,0.08);">✓ Completed</span>
                  </div>
                  ${quest.description ? `<p style="font-size:12px;color:var(--dim);margin:6px 0 0;line-height:1.45;overflow-wrap:anywhere;">${escapeHtml(quest.description)}</p>` : ""}
                  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);">
                    <span style="font-family:var(--font-mono);font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;">${formatTelemetryDuration(totalSec, "0.0h")} logged</span>
                    <div style="display:flex;align-items:center;gap:8px;">
                      <button class="sync-chip pressable" onclick="reopenQuestItem(${jsArg(quest.id)})" aria-label="Reopen quest ${escapeHtml(quest.title)}">Reopen</button>
                      <button class="sync-chip pressable" style="color:var(--rose);border-color:rgba(255,42,95,0.3);" onclick="deleteQuestItem(${jsArg(quest.id)})" aria-label="Delete quest ${escapeHtml(quest.title)}">Delete</button>
                    </div>
                  </div>
                </div>
              `;
            }).join("")}
            </div>
          ` : ""}
        `;
      }

      // =====================================================================
      // VIEW 5: REVIEW & DEEP-WORK TELEMETRY (Day · Week · Month · Qtr · Year)
      // =====================================================================
      else if (activeView === "telemetry") {
        const safeOffset = Math.min(0, Math.trunc(Number(reviewWeekOffset) || 0));
        const todayNoon = noonOfDateKey(todayKey);

        const calendarSpanDays = (sKey, eKey) => {
          const sp = sKey.split("-").map(Number);
          const ep = eKey.split("-").map(Number);
          return Math.max(1, Math.round((Date.UTC(ep[0], ep[1] - 1, ep[2]) - Date.UTC(sp[0], sp[1] - 1, sp[2])) / 86400000) + 1);
        };
        const stepFromKey = (baseKey, deltaDays) => {
          const d = noonOfDateKey(baseKey);
          d.setDate(d.getDate() + deltaDays);
          return toLocalDateKey(d.getTime());
        };
        const completedTaskKey = (t) => {
          if (!t || t.status !== "completed") return null;
          if (typeof t.completedAt === "number" && Number.isFinite(t.completedAt) && t.completedAt > 0) {
            return toLocalDateKey(t.completedAt);
          }
          if (typeof t.scheduledDate === "string" && DATE_KEY_RE.test(t.scheduledDate)) {
            return t.scheduledDate;
          }
          if (typeof t.updatedAt === "number" && Number.isFinite(t.updatedAt) && t.updatedAt > 0) {
            return toLocalDateKey(t.updatedAt);
          }
          return null;
        };

        let win;
        if (reviewHorizon === "day") {
          const dk = dayKeyOffset(safeOffset, now);
          const d = noonOfDateKey(dk);
          win = {
            horizon: "day",
            startKey: dk,
            endKey: dk,
            totalDays: 1,
            elapsedDays: 1,
            rangeLabel: d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }),
            heading: "Daily review",
            prevLabel: "Previous day",
            nextLabel: "Next day",
            currentLabel: "Today"
          };
        } else if (reviewHorizon === "month") {
          const first = new Date(todayNoon.getFullYear(), todayNoon.getMonth() + safeOffset, 1, 12);
          const last = new Date(first.getFullYear(), first.getMonth() + 1, 0, 12);
          const sKey = toLocalDateKey(first.getTime());
          const eKey = toLocalDateKey(last.getTime());
          const totalDays = last.getDate();
          win = {
            horizon: "month",
            startKey: sKey,
            endKey: eKey,
            totalDays,
            elapsedDays: safeOffset === 0 ? Math.max(1, todayNoon.getDate()) : totalDays,
            rangeLabel: first.toLocaleDateString("en-US", { month: "short", year: "numeric" }),
            heading: "Monthly review",
            prevLabel: "Previous month",
            nextLabel: "Next month",
            currentLabel: "This month"
          };
        } else if (reviewHorizon === "quarter") {
          const curQ = Math.floor(todayNoon.getMonth() / 3);
          const totalQ = todayNoon.getFullYear() * 4 + curQ + safeOffset;
          const qYear = Math.floor(totalQ / 4);
          const qIdx = ((totalQ % 4) + 4) % 4;
          const first = new Date(qYear, qIdx * 3, 1, 12);
          const last = new Date(qYear, qIdx * 3 + 3, 0, 12);
          const sKey = toLocalDateKey(first.getTime());
          const eKey = toLocalDateKey(last.getTime());
          const totalDays = calendarSpanDays(sKey, eKey);
          win = {
            horizon: "quarter",
            startKey: sKey,
            endKey: eKey,
            totalDays,
            elapsedDays: safeOffset === 0 ? Math.min(totalDays, calendarSpanDays(sKey, todayKey)) : totalDays,
            rangeLabel: "Q" + (qIdx + 1) + " " + qYear,
            heading: "Quarterly review",
            prevLabel: "Previous quarter",
            nextLabel: "Next quarter",
            currentLabel: "This qtr"
          };
        } else if (reviewHorizon === "year") {
          const yr = todayNoon.getFullYear() + safeOffset;
          const sKey = yr + "-01-01";
          const eKey = yr + "-12-31";
          const totalDays = calendarSpanDays(sKey, eKey);
          win = {
            horizon: "year",
            startKey: sKey,
            endKey: eKey,
            totalDays,
            elapsedDays: safeOffset === 0 ? Math.min(totalDays, calendarSpanDays(sKey, todayKey)) : totalDays,
            rangeLabel: String(yr),
            heading: "Yearly review",
            prevLabel: "Previous year",
            nextLabel: "Next year",
            currentLabel: "This year"
          };
        } else {
          const sKey = dayKeyOffset(safeOffset * 7 - 6, now);
          const eKey = dayKeyOffset(safeOffset * 7, now);
          const sd = noonOfDateKey(sKey);
          const ed = noonOfDateKey(eKey);
          win = {
            horizon: "week",
            startKey: sKey,
            endKey: eKey,
            totalDays: 7,
            elapsedDays: 7,
            rangeLabel: sd.toLocaleDateString("en-US", { month: "short", day: "numeric" }) + " – " + ed.toLocaleDateString("en-US", { month: "short", day: "numeric" }),
            heading: "Weekly review",
            prevLabel: "Previous week",
            nextLabel: "Next week",
            currentLabel: "This week"
          };
        }

        const selectedQuest = (reviewScope !== "ALL" && reviewScope !== "OTHER")
          ? state.quests.find(q => q.id === reviewScope) || null
          : null;
        const effectiveScope = (reviewScope !== "ALL" && reviewScope !== "OTHER" && !selectedQuest) ? "ALL" : reviewScope;
        const matchesScope = (qId) => {
          const norm = qId || null;
          if (effectiveScope === "ALL") return norm !== null;
          if (effectiveScope === "OTHER") return norm === null;
          return norm === effectiveScope;
        };

        const scopeHex = selectedQuest
          ? (ACCENT_HEX[selectedQuest.accentColor] || ACCENT_HEX.amber)
          : effectiveScope === "OTHER"
          ? "var(--muted)"
          : "var(--amber)";

        // Build horizon buckets
        const buckets = [];
        if (win.horizon === "day") {
          const labels = ["12a", "4a", "8a", "12p", "4p", "8p"];
          const curHour = new Date(now).getHours();
          for (let i = 0; i < 6; i++) {
            buckets.push({ key: win.startKey + "-b" + i, label: labels[i], scopeSec: 0, tasks: 0, isCurrent: win.startKey === todayKey && Math.floor(curHour / 4) === i });
          }
        } else if (win.horizon === "week") {
          for (let i = 0; i < 7; i++) {
            const dk = stepFromKey(win.startKey, i);
            const d = noonOfDateKey(dk);
            buckets.push({ key: dk, label: d.toLocaleDateString("en-US", { weekday: "short" }), scopeSec: 0, tasks: 0, isCurrent: dk === todayKey });
          }
        } else if (win.horizon === "month") {
          const ym = win.startKey.slice(0, 7);
          let sd = 1, wk = 1;
          while (sd <= win.totalDays) {
            const ed = Math.min(win.totalDays, sd + 6);
            const sk = ym + "-" + String(sd).padStart(2, "0");
            const ek = ym + "-" + String(ed).padStart(2, "0");
            buckets.push({ key: ym + "-w" + wk, label: sd + "–" + ed, scopeSec: 0, tasks: 0, isCurrent: todayKey >= sk && todayKey <= ek });
            sd += 7;
            wk++;
          }
        } else if (win.horizon === "quarter") {
          const sp = win.startKey.split("-").map(Number);
          for (let i = 0; i < 3; i++) {
            const d = new Date(sp[0], sp[1] - 1 + i, 1, 12);
            const ym = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
            buckets.push({ key: ym, label: d.toLocaleDateString("en-US", { month: "short" }), scopeSec: 0, tasks: 0, isCurrent: todayKey.startsWith(ym) });
          }
        } else {
          const yr = Number(win.startKey.slice(0, 4));
          for (let m = 0; m < 12; m++) {
            const d = new Date(yr, m, 1, 12);
            const ym = yr + "-" + String(m + 1).padStart(2, "0");
            const sm = d.toLocaleDateString("en-US", { month: "short" });
            buckets.push({ key: ym, label: sm.slice(0, 1), scopeSec: 0, tasks: 0, isCurrent: todayKey.startsWith(ym) });
          }
        }

        const bucketIndex = (dk, ts) => {
          if (win.horizon === "day") {
            if (typeof ts === "number" && Number.isFinite(ts) && ts > 0) return Math.min(5, Math.max(0, Math.floor(new Date(ts).getHours() / 4)));
            return 2;
          }
          if (win.horizon === "week") return calendarSpanDays(win.startKey, dk) - 1;
          if (win.horizon === "month") return Math.floor(((Number(dk.slice(8, 10)) || 1) - 1) / 7);
          if (win.horizon === "quarter") return Math.min(2, Math.max(0, Number(dk.slice(5, 7)) - Number(win.startKey.slice(5, 7))));
          return Math.min(11, Math.max(0, (Number(dk.slice(5, 7)) || 1) - 1));
        };

        const byQuestSec = new Map();
        const byQuestTasks = new Map();
        const activeDaysSet = new Set();
        const focusActiveDaysSet = new Set();
        const scopedLogs = [];
        let questSec = 0;
        let otherSec = 0;
        let scopeSec = 0;
        let sessionsCount = 0;
        let longestSessionSec = 0;

        for (const l of state.timeLogs) {
          if (!l || typeof l.dateKey !== "string") continue;
          if (l.dateKey < win.startKey || l.dateKey > win.endKey) continue;
          const dur = Math.max(0, Number(l.durationSeconds) || 0);
          const qId = l.questId || null;
          if (qId !== null) {
            questSec += dur;
            byQuestSec.set(qId, (byQuestSec.get(qId) || 0) + dur);
          } else {
            otherSec += dur;
          }
          const inScope = matchesScope(qId);
          if (inScope) {
            scopeSec += dur;
            if (dur > 0) {
              sessionsCount++;
              if (dur > longestSessionSec) longestSessionSec = dur;
              activeDaysSet.add(l.dateKey);
              focusActiveDaysSet.add(l.dateKey);
            }
            const b = buckets[bucketIndex(l.dateKey, l.startTime)];
            if (b && dur > 0) b.scopeSec += dur;
          }
          if (effectiveScope === "ALL" || inScope) scopedLogs.push(l);
        }
        scopedLogs.sort((a, b) => (Number(b.startTime) || 0) - (Number(a.startTime) || 0));

        let completedTasksCount = 0;
        let stepTasksCompleted = 0;
        let habitTasksCompleted = 0;
        let otherTasksCompleted = 0;

        for (const t of state.tasks) {
          const dk = completedTaskKey(t);
          if (!dk || dk < win.startKey || dk > win.endKey) continue;
          const qId = t.questId || null;
          if (qId !== null) byQuestTasks.set(qId, (byQuestTasks.get(qId) || 0) + 1);
          else otherTasksCompleted++;
          const inScope = effectiveScope === "ALL" ? true : matchesScope(qId);
          if (!inScope) continue;
          completedTasksCount++;
          if (t.habitId) habitTasksCompleted++;
          else stepTasksCompleted++;
          if (matchesScope(qId)) activeDaysSet.add(dk);
          const b = buckets[bucketIndex(dk, t.completedAt)];
          if (b) b.tasks += 1;
        }

        const chartBuckets = buckets.map(b => ({
          ...b,
          hours: Number((b.scopeSec / 3600).toFixed(1))
        }));

        const grandSec = questSec + otherSec;
        const focusH = Number((scopeSec / 3600).toFixed(1));

        let weeklyTargetBase = 0;
        if (effectiveScope === "ALL") {
          weeklyTargetBase = activeQuests.reduce((a, q) => a + (Number(q.targetWeeklyHours) || 0), 0);
        } else if (selectedQuest) {
          weeklyTargetBase = Number(selectedQuest.targetWeeklyHours) || 0;
        }
        const totalTargetH = weeklyTargetBase <= 0
          ? 0
          : win.horizon === "week"
          ? weeklyTargetBase
          : win.horizon === "day"
          ? Number((weeklyTargetBase / 7).toFixed(1))
          : Math.round((weeklyTargetBase * win.totalDays) / 7);

        const targetPct = totalTargetH > 0 ? Math.round(((scopeSec / 3600) / totalTargetH) * 100) : 0;
        const activeDaysCount = activeDaysSet.size;
        const focusDenomDays = Math.max(1, focusActiveDaysSet.size > 0 ? focusActiveDaysSet.size : activeDaysCount);
        const dailyAvgSec = scopeSec / focusDenomDays;
        const consistencyPct = Math.min(100, Math.round((activeDaysCount / Math.max(1, win.elapsedDays)) * 100));
        const focusPct = grandSec > 0 ? Math.round((scopeSec / grandSec) * 100) : 0;
        const overallQuestPct = grandSec > 0 ? Math.round((questSec / grandSec) * 100) : 0;
        const avgBoutMin = sessionsCount > 0 && scopeSec > 0 ? Math.max(1, Math.round(scopeSec / sessionsCount / 60)) : 0;
        const maxBoutMin = longestSessionSec > 0 ? Math.max(1, Math.round(longestSessionSec / 60)) : 0;

        const maxBucketVal = reviewChartMetric === "tasks"
          ? Math.max(4, ...chartBuckets.map(b => b.tasks))
          : Math.max(1800, ...chartBuckets.map(b => b.scopeSec));

        const hoursByQuest = state.quests
          .map(q => {
            const sec = byQuestSec.get(q.id) || 0;
            const qTasks = byQuestTasks.get(q.id) || 0;
            return { quest: q, sec, hours: Number((sec / 3600).toFixed(1)), tasks: qTasks };
          })
          .filter(x => !x.quest.archived || x.sec > 0 || x.tasks > 0)
          .sort((a, b) => (b.sec - a.sec) || (b.tasks - a.tasks) || ((a.quest.slotIndex || 0) - (b.quest.slotIndex || 0)));
        const maxQuestSec = Math.max(1800, ...hoursByQuest.map(x => x.sec));

        // 16-week Monday-aligned Activity Heatmap
        const HEATMAP_WEEKS = 16;
        const mondayDow = (todayNoon.getDay() + 6) % 7;
        const hmStartKey = stepFromKey(todayKey, -mondayDow - (HEATMAP_WEEKS - 1) * 7);
        const hmMap = new Map();
        for (const l of state.timeLogs) {
          if (!l || typeof l.dateKey !== "string" || l.dateKey < hmStartKey || l.dateKey > todayKey) continue;
          const inHm = effectiveScope === "ALL" ? true : matchesScope(l.questId || null);
          if (!inHm) continue;
          const dur = Math.max(0, Number(l.durationSeconds) || 0);
          if (dur <= 0) continue;
          const cur = hmMap.get(l.dateKey) || { sec: 0, tasks: 0, sessions: 0 };
          cur.sec += dur;
          cur.sessions += 1;
          hmMap.set(l.dateKey, cur);
        }
        for (const t of state.tasks) {
          const dk = completedTaskKey(t);
          if (!dk || dk < hmStartKey || dk > todayKey) continue;
          const inHm = effectiveScope === "ALL" ? true : matchesScope(t.questId || null);
          if (!inHm) continue;
          const cur = hmMap.get(dk) || { sec: 0, tasks: 0, sessions: 0 };
          cur.tasks += 1;
          hmMap.set(dk, cur);
        }

        const hmBaseRgb = selectedQuest
          ? (ACCENT_RGB[selectedQuest.accentColor] || ACCENT_RGB.amber)
          : effectiveScope === "OTHER"
          ? ACCENT_RGB.slate
          : ACCENT_RGB.amber;
        const hmLevelBg = [
          "rgba(255,255,255,0.05)",
          `rgba(${hmBaseRgb},0.22)`,
          `rgba(${hmBaseRgb},0.44)`,
          `rgba(${hmBaseRgb},0.72)`,
          `rgb(${hmBaseRgb})`
        ];

        const hmCols = [];
        const wdTotals = Array.from({ length: 7 }, () => ({ sec: 0, tasks: 0, days: 0 }));
        const wdNames = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
        let prevHmMonth = -1;
        let hmActiveDays = 0;
        let hmRunStreak = 0;
        let hmBestStreak = 0;
        let inspectedCell = null;
        let todayCell = null;

        for (let w = 0; w < HEATMAP_WEEKS; w++) {
          let mLabel = "";
          const cells = [];
          for (let dow = 0; dow < 7; dow++) {
            const dk = stepFromKey(hmStartKey, w * 7 + dow);
            const d = noonOfDateKey(dk);
            if (dow === 0) {
              const m = d.getMonth();
              if (m !== prevHmMonth) {
                mLabel = d.toLocaleDateString("en-US", { month: "short" });
                prevHmMonth = m;
              }
            }
            const isFuture = dk > todayKey;
            const rec = isFuture ? null : hmMap.get(dk);
            const sec = rec ? rec.sec : 0;
            const tCount = rec ? rec.tasks : 0;
            const sCount = rec ? rec.sessions : 0;
            const hrs = Number((sec / 3600).toFixed(1));
            const score = (sec / 3600) + tCount * 0.35;
            const lvl = isFuture || (sec <= 0 && tCount <= 0) ? 0 : score < 1 ? 1 : score < 2.5 ? 2 : score < 4.5 ? 3 : 4;
            const shortLbl = d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });

            if (!isFuture) {
              wdTotals[dow].sec += sec;
              wdTotals[dow].tasks += tCount;
              wdTotals[dow].days += 1;
              if (sec > 0 || tCount > 0) {
                hmActiveDays++;
                hmRunStreak++;
                if (hmRunStreak > hmBestStreak) hmBestStreak = hmRunStreak;
              } else {
                hmRunStreak = 0;
              }
            }
            const cellObj = { dateKey: dk, shortLbl, sec, hours: hrs, tasks: tCount, sessions: sCount, lvl, isToday: dk === todayKey, isFuture };
            if (cellObj.isToday) todayCell = cellObj;
            if (!isFuture && selectedReviewHeatmapKey === dk) inspectedCell = cellObj;
            cells.push(cellObj);
          }
          hmCols.push({ weekKey: cells[0].dateKey, monthLabel: mLabel, cells });
        }
        if (!inspectedCell) inspectedCell = todayCell;

        let hmCurrentStreak = 0;
        const todayHm = hmMap.get(todayKey);
        const startOff = todayHm && (todayHm.sec > 0 || todayHm.tasks > 0) ? 0 : -1;
        for (let off = startOff; ; off--) {
          const dk = stepFromKey(todayKey, off);
          if (dk < hmStartKey) break;
          const r = hmMap.get(dk);
          if (r && (r.sec > 0 || r.tasks > 0)) hmCurrentStreak++;
          else break;
        }

        let bestWd = null;
        let bestWdScore = 0;
        for (let dow = 0; dow < 7; dow++) {
          const wt = wdTotals[dow];
          const sc = wt.sec / 3600 + wt.tasks * 0.25;
          if (sc > bestWdScore && wt.days > 0) {
            bestWdScore = sc;
            bestWd = { label: wdNames[dow], avgHours: Number((wt.sec / 3600 / wt.days).toFixed(1)) };
          }
        }

        const horizonTabs = [
          ["day", "Day"],
          ["week", "Week"],
          ["month", "Month"],
          ["quarter", "Qtr"],
          ["year", "Year"]
        ];

        container.innerHTML = `
          <div class="hero-bar">
            <div>
              <div class="hero-eyebrow">${escapeHtml(win.rangeLabel)}</div>
              <h1 class="hero-title">${escapeHtml(win.heading)}</h1>
            </div>
            <div class="step-chip-row">
              <button class="sync-chip step-chip" aria-label="${escapeHtml(win.prevLabel)}" onclick="reviewWeekOffset--;reviewSessionLimit=REVIEW_SESSION_PAGE;renderApp();">‹</button>
              <button class="sync-chip step-chip" onclick="reviewWeekOffset=0;reviewSessionLimit=REVIEW_SESSION_PAGE;renderApp();" ${safeOffset === 0 ? "disabled" : ""}>${escapeHtml(win.currentLabel)}</button>
              <button class="sync-chip step-chip" aria-label="${escapeHtml(win.nextLabel)}" onclick="if(reviewWeekOffset<0){reviewWeekOffset++;reviewSessionLimit=REVIEW_SESSION_PAGE;renderApp();}" ${safeOffset < 0 ? "" : "disabled"}>›</button>
            </div>
          </div>

          <div class="review-horizon-bar" role="group" aria-label="Review timeframe">
            ${horizonTabs.map(([id, lbl]) => `
              <button class="review-horizon-btn ${win.horizon === id ? "active" : ""}" aria-pressed="${win.horizon === id}" onclick="reviewHorizon=${jsArg(id)};reviewWeekOffset=0;reviewSessionLimit=REVIEW_SESSION_PAGE;renderApp();">${lbl}</button>
            `).join("")}
          </div>

          <div class="chip-strip" role="group" aria-label="Filter review by quest">
            <button class="filter-pill ${effectiveScope === "ALL" ? "active" : ""}" aria-pressed="${effectiveScope === "ALL"}" onclick="reviewScope='ALL';reviewSessionLimit=REVIEW_SESSION_PAGE;renderApp();">
              <span>All Quests</span>
            </button>
            ${state.quests.map(q => {
              const qHex = ACCENT_HEX[q.accentColor] || ACCENT_HEX.slate;
              const isSel = effectiveScope === q.id;
              return `
                <button class="filter-pill ${isSel ? "active" : ""}" aria-pressed="${isSel}" onclick="reviewScope=${jsArg(isSel ? "ALL" : q.id)};reviewSessionLimit=REVIEW_SESSION_PAGE;renderApp();">
                  <span style="width:7px;height:7px;border-radius:50%;background:${qHex};flex-shrink:0;"></span>
                  <span>${escapeHtml(q.title)}</span>
                </button>
              `;
            }).join("")}
            <button class="filter-pill ${effectiveScope === "OTHER" ? "active" : ""}" aria-pressed="${effectiveScope === "OTHER"}" onclick="reviewScope=${jsArg(effectiveScope === "OTHER" ? "ALL" : "OTHER")};reviewSessionLimit=REVIEW_SESSION_PAGE;renderApp();">
              <span style="width:7px;height:7px;border-radius:50%;background:var(--neutral-dot);flex-shrink:0;"></span>
              <span>Other</span>
            </button>
          </div>

          <div class="review-kpi-grid">
            <div class="review-card" style="grid-column:span 2;margin-bottom:0;">
              <div class="hero-eyebrow">${effectiveScope === "OTHER" ? "Other Work Hours" : selectedQuest ? escapeHtml(selectedQuest.title) + " · Hours" : "Quest Hours"}</div>
              <div style="display:flex;align-items:baseline;gap:8px;margin-top:6px;font-variant-numeric:tabular-nums;">
                <span style="font-family:var(--font-display);font-size:36px;font-weight:700;color:${scopeHex};">${formatTelemetryDuration(scopeSec, "0.0h")}</span>
                ${effectiveScope !== "OTHER" ? `<span style="font-size:16px;color:var(--dim);">/ ${totalTargetH}h</span>` : ""}
                <span style="margin-left:auto;font-size:12px;color:var(--muted);">${effectiveScope === "OTHER" ? "Unassigned work" : `${targetPct}% of target`}</span>
              </div>
            </div>

            <div class="review-card" style="margin-bottom:0;">
              <div class="hero-eyebrow">Daily Average</div>
              <div style="font-family:var(--font-display);font-size:28px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;">${formatTelemetryDuration(dailyAvgSec, "0.0h")}</div>
              <div style="font-size:11px;color:var(--dim);margin-top:4px;font-variant-numeric:tabular-nums;">${activeDaysCount}/${win.elapsedDays}d active (${consistencyPct}%)</div>
            </div>

            <div class="review-card" style="margin-bottom:0;">
              <div class="hero-eyebrow">${effectiveScope === "ALL" ? "Quest vs Other" : "Focus Share"}</div>
              <div style="font-family:var(--font-display);font-size:28px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;">${focusPct}<span style="font-size:16px;color:var(--dim);">%</span></div>
              <div style="font-size:11px;color:var(--dim);margin-top:4px;font-variant-numeric:tabular-nums;">Of ${formatTelemetryDuration(grandSec, "0.0h")} total</div>
            </div>

            <div class="review-card" style="margin-bottom:0;" data-review-stat="tasks">
              <div class="hero-eyebrow">Tasks Completed</div>
              <div style="font-family:var(--font-display);font-size:26px;font-weight:700;margin-top:6px;color:var(--emerald);font-variant-numeric:tabular-nums;">${completedTasksCount}</div>
              <div style="font-size:11px;color:var(--dim);margin-top:4px;font-variant-numeric:tabular-nums;">${stepTasksCompleted} steps · ${habitTasksCompleted} habits</div>
            </div>

            <div class="review-card" style="margin-bottom:0;" data-review-stat="sessions">
              <div class="hero-eyebrow">Focus Sessions</div>
              <div style="font-family:var(--font-display);font-size:26px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;">${sessionsCount}</div>
              <div style="font-size:11px;color:var(--dim);margin-top:4px;font-variant-numeric:tabular-nums;">${sessionsCount > 0 ? `Avg ${avgBoutMin}m · Max ${maxBoutMin}m` : "No bouts logged"}</div>
            </div>
          </div>

          <div class="review-tablet-split">
          <div class="review-card">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px;">
              <div class="hero-eyebrow" style="margin-bottom:0;">${reviewChartMetric === "tasks" ? "Completed Tasks" : "Focus Hours"} · ${win.horizon === "day" ? "By Block" : win.horizon === "week" ? "Per Day" : win.horizon === "month" ? "By Week" : "Per Month"}</div>
              <div style="display:flex;gap:6px;">
                <button class="sync-chip mini-chip-btn" aria-pressed="${reviewChartMetric === "hours"}" style="${reviewChartMetric === "hours" ? "background:var(--surface-3);color:white;border-color:var(--border-strong);" : "color:var(--muted);"}" onclick="reviewChartMetric='hours';renderApp();">Hours</button>
                <button class="sync-chip mini-chip-btn" aria-pressed="${reviewChartMetric === "tasks"}" style="${reviewChartMetric === "tasks" ? "background:var(--surface-3);color:white;border-color:var(--border-strong);" : "color:var(--muted);"}" onclick="reviewChartMetric='tasks';renderApp();">Tasks</button>
              </div>
            </div>
            <div style="display:grid;grid-template-columns:repeat(${chartBuckets.length}, minmax(0, 1fr));gap:${chartBuckets.length > 8 ? "4px" : "8px"};align-items:end;">
              ${chartBuckets.map(d => {
                const val = reviewChartMetric === "tasks" ? d.tasks : d.scopeSec;
                const barPct = val > 0 ? Math.max(8, Math.round((val / maxBucketVal) * 100)) : 3;
                const topLabel = reviewChartMetric === "tasks"
                  ? (d.tasks >= 1000 ? (d.tasks / 1000).toFixed(1) + "k" : String(d.tasks))
                  : formatTelemetryDuration(d.scopeSec, "0h", true);
                return `
                  <div style="display:flex;flex-direction:column;align-items:center;min-width:0;">
                    <span style="font-family:var(--font-mono);font-size:${chartBuckets.length > 8 ? "9px" : "10px"};font-variant-numeric:tabular-nums;margin-bottom:8px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:${d.isCurrent ? scopeHex : (val > 0 ? "var(--text-2)" : "var(--dim)")};">
                      ${topLabel}
                    </span>
                    <div class="review-bar-track">
                      <div style="width:100%;height:${barPct}%;border-radius:6px 6px 2px 2px;background:${d.isCurrent ? scopeHex : (val > 0 ? "#3b3f4c" : "rgba(255,255,255,0.05)")};"></div>
                    </div>
                    <span style="font-size:${chartBuckets.length > 8 ? "10px" : "11px"};margin-top:8px;color:${d.isCurrent ? scopeHex : "var(--dim)"};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;">${escapeHtml(d.label)}</span>
                  </div>
                `;
              }).join("")}
            </div>

    function computeTimelineLayout(items, defaultStartHr, defaultEndHr) {
      let minStart = defaultStartHr;
      let maxEnd = defaultEndHr;
      const raw = items.map(it => {
        const d = new Date(it.startTime);
        const sHr = d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600;
        const safeStart = Number.isFinite(sHr) ? Math.max(0, Math.min(23.75, sHr)) : defaultStartHr;
        const durHr = Math.max(0.42, (Math.max(0, Number(it.durationSeconds) || 0)) / 3600);
        const safeEnd = Math.min(24, safeStart + durHr);
        if (safeStart < minStart) minStart = Math.max(0, Math.floor(safeStart));
        if (safeEnd > maxEnd) maxEnd = Math.min(24, Math.ceil(safeEnd));
        return { id: it.id, startHour: safeStart, endHour: safeEnd };
      });
      raw.sort((a, b) => a.startHour - b.startHour || b.endHour - a.endHour);

      const MAX_COLS = 4;
      const placements = new Map();
      let cluster = [];
      let clusterEnd = -1;
      let laneEnds = [];
      const flush = () => {
        if (!cluster.length) return;
        const usedCols = Math.min(MAX_COLS, Math.max(1, ...cluster.map(c => c.col + 1)));
        cluster.forEach(c => {
          placements.set(c.id, {
            startHour: c.startHour,
            colIndex: c.col % usedCols,
            totalCols: usedCols
          });
        });
        cluster = [];
        clusterEnd = -1;
        laneEnds = [];
      };
      raw.forEach(item => {
        if (cluster.length && item.startHour >= clusterEnd - 0.01) flush();
        let assigned = -1;
        for (let i = 0; i < laneEnds.length; i++) {
          if (laneEnds[i] <= item.startHour + 0.01) {
            assigned = i;
            laneEnds[i] = item.endHour;
            break;
          }
        }
        if (assigned === -1) {
          if (laneEnds.length < MAX_COLS) {
            assigned = laneEnds.length;
            laneEnds.push(item.endHour);
          } else {
            let earliest = 0;
            for (let i = 1; i < laneEnds.length; i++) if (laneEnds[i] < laneEnds[earliest]) earliest = i;
            assigned = earliest;
            laneEnds[earliest] = Math.max(laneEnds[earliest], item.endHour);
          }
        }
        cluster.push({ ...item, col: assigned });
        if (item.endHour > clusterEnd) clusterEnd = item.endHour;
      });
      flush();
      return { startHour: minStart, endHour: maxEnd, placements };
    }

    function renderTimelineHtml(todayLogs, activeTaskObj, af, liveDelta) {
      const hasLive = !!(activeTaskObj && af && af.isRunning && af.sessionStartedAt);
      const layoutInputs = todayLogs.map(l => ({
        id: l.id,
        startTime: l.startTime,
        durationSeconds: l.durationSeconds
      }));
      if (hasLive) {
        layoutInputs.push({
          id: "__live_running__",
          startTime: af.sessionStartedAt,
          durationSeconds: Math.max(60, liveDelta || 0)
        });
      }
      const layout = computeTimelineLayout(layoutInputs, 8, 22);
      const START_HR = layout.startHour;
      const END_HR = layout.endHour;
      const HR_PX = 48;
      const hours = [];
      for (let h = START_HR; h <= END_HR; h++) hours.push(h);

      const dNow = new Date();
      const curFloat = dNow.getHours() + dNow.getMinutes() / 60;

      const blocksHtml = todayLogs.map(log => {
        const sD = new Date(log.startTime);
        const eD = new Date(log.endTime);
        const pl = layout.placements.get(log.id);
        const sHr = pl ? pl.startHour : (sD.getHours() + sD.getMinutes() / 60);
        const durHr = Math.max(0.35, log.durationSeconds / 3600);
        const clamped = Math.max(START_HR, Math.min(END_HR - 0.4, sHr));
        const topPx = (clamped - START_HR) * HR_PX;
        const heightPx = Math.max(32, Math.min((END_HR - clamped) * HR_PX, durHr * HR_PX));
        const colIdx = pl ? pl.colIndex : 0;
        const totCols = pl ? pl.totalCols : 1;
        const leftCss = `calc(50px + (100% - 54px) * ${colIdx} / ${totCols})`;
        const widthCss = `calc((100% - 54px) / ${totCols} - ${totCols > 1 ? 3 : 0}px)`;
        const hex = ACCENT_HEX[log.accentColorSnapshot] || ACCENT_HEX.cyan;
        const sStr = String(sD.getHours()).padStart(2, "0") + ":" + String(sD.getMinutes()).padStart(2, "0");
        const eStr = String(eD.getHours()).padStart(2, "0") + ":" + String(eD.getMinutes()).padStart(2, "0");

        return `
          <div data-timeline-col="${escapeHtml(colIdx)}" style="position:absolute;left:${leftCss};width:${widthCss};top:${topPx}px;height:${heightPx}px;border-radius:10px;border:1px solid ${hex}66;background-image:repeating-linear-gradient(-45deg, ${hex}22, ${hex}22 6px, ${hex}0a 6px, ${hex}0a 12px);padding:6px 10px;overflow:hidden;">
            <div style="position:absolute;left:0;top:0;bottom:0;width:3px;background:${hex};"></div>
            <div style="font-size:12px;font-weight:500;color:white;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(log.taskTitleSnapshot)}</div>
            ${heightPx >= 42 ? `<div style="font-family:var(--font-mono);font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${sStr} – ${eStr}</div>` : ""}
          </div>
        `;
      }).join("");

      let liveBlockHtml = "";
      if (hasLive) {
        const sD = new Date(af.sessionStartedAt);
        const pl = layout.placements.get("__live_running__");
        const sHr = pl ? pl.startHour : (sD.getHours() + sD.getMinutes() / 60);
        const clamped = Math.max(START_HR, Math.min(END_HR - 0.4, sHr));
        const topPx = (clamped - START_HR) * HR_PX;
        const heightPx = Math.max(34, ((liveDelta || 0) / 3600) * HR_PX);
        const colIdx = pl ? pl.colIndex : 0;
        const totCols = pl ? pl.totalCols : 1;
        const leftCss = `calc(50px + (100% - 54px) * ${colIdx} / ${totCols})`;
        const widthCss = `calc((100% - 54px) / ${totCols} - ${totCols > 1 ? 3 : 0}px)`;
        const lq = state.quests.find(x => x.id === activeTaskObj.questId);
        const hex = ACCENT_HEX[lq ? lq.accentColor : "cyan"] || ACCENT_HEX.cyan;
        liveBlockHtml = `
          <div style="position:absolute;left:${leftCss};width:${widthCss};top:${topPx}px;height:${heightPx}px;border-radius:10px;border:1px solid ${hex}99;background:${hex}1e;padding:6px 10px;overflow:hidden;">
            <div style="font-size:12px;font-weight:600;color:white;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(activeTaskObj.title)}</div>
          </div>
        `;
      }

      const nowLineHtml = (curFloat >= START_HR && curFloat <= END_HR) ? `
        <div style="position:absolute;left:44px;right:0;top:${(curFloat - START_HR) * HR_PX}px;display:flex;align-items:center;pointer-events:none;">
          <span style="width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber);"></span>
          <div style="flex:1;height:1.5px;background:var(--amber);"></div>
        </div>
      ` : "";

      return `
        <div class="review-card" style="padding:16px 14px;">
          ${todayLogs.length || hasLive ? "" : `<div class="timeline-empty">No focus sessions yet today<span>Start one from the Priority Queue and it shows up here.</span></div>`}
          <div style="position:relative;height:${(END_HR - START_HR) * HR_PX}px;">
            ${hours.map(hr => `
              <div style="position:absolute;left:0;right:0;top:${(hr - START_HR) * HR_PX}px;display:flex;align-items:flex-start;">
                <span style="width:44px;font-family:var(--font-mono);font-size:10px;color:var(--dim);transform:translateY(-6px);">${String(hr).padStart(2, "0")}:00</span>
                <div style="flex:1;border-top:1px solid rgba(255,255,255,0.05);"></div>
              </div>
            `).join("")}
            ${blocksHtml}
            ${liveBlockHtml}
            ${nowLineHtml}
          </div>
        </div>
      `;
    }

    // 500 ms ticker: live timers + relative sync ages. Skipped while hidden; writes only changed text.
    function tick() {
      if (isAppHidden()) return;
      // midnight with the app open (e.g. screen kept awake by a running timer): materialize the new day's
      // habits, roll over "Completed today", the date, today's hours and the timeline.
      if (lastRenderedDateKey && toLocalDateKey() !== lastRenderedDateKey) {
        materializeDailyHabits(toLocalDateKey());
        renderAppSafely();
      }
      if (document.body && document.body.classList.contains("keyboard-open")) updateKeyboardClass(); // backstop
      updateSyncIndicator(); // "Synced · now" -> "Synced · 2m", next-try countdown in an open sync sheet
      const af = state.activeFocus;
      if (!af || !af.activeTaskId || !af.isRunning || !af.sessionStartedAt) return;
      const task = state.tasks.find(t => t.id === af.activeTaskId);
      if (!task) return;
      const sec = (task.accumulatedSeconds || 0) + Math.max(0, Math.floor((Date.now() - af.sessionStartedAt) / 1000));
      const formatted = formatChrono(sec);

      setTextIfChanged(document.getElementById("focusBigChrono"), formatted);
      setTextIfChanged(document.getElementById("headerChronoText"), formatted);
      document.querySelectorAll("[data-task-timer]").forEach(el => {
        if (el.getAttribute("data-task-timer") !== task.id) return;
        const prefix = el.hasAttribute("data-prefix") ? el.getAttribute("data-prefix") : "· ";
        setTextIfChanged(el, prefix + formatted);
      });
    }
    setInterval(tick, 500);

    // ----- Structured Diagnostics, Breadcrumb Flight Recorder & Global Fault Traps -----
    const MOBILE_BREADCRUMB_CAP = 120;
    const mobileBreadcrumbs = [];
    let mobileLastCrash = null;
    const SENSITIVE_DIAG_KEY_RE = /(token|secret|password|authorization|cookie|synckey|key)/i;
    function redactDiagText(raw) {
      return String(raw || "")
        .replace(/\bBearer\s+[A-Za-z0-9._~+/=-]{8,}/gi, "Bearer [REDACTED]")
        .replace(/\b[0-9a-fA-F]{64}\b/g, "[REDACTED]")
        .slice(0, 300);
    }
    function redactDiagContext(ctx) {
      if (!ctx || typeof ctx !== "object") return undefined;
      const out = {};
      for (const k of Object.keys(ctx)) {
        out[k] = SENSITIVE_DIAG_KEY_RE.test(k) ? "[REDACTED]" : typeof ctx[k] === "string" ? redactDiagText(ctx[k]) : ctx[k];
      }
      return out;
    }
    function newCorrelationId() {
      try {
        if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") return crypto.randomUUID();
      } catch (e) {}
      return "mcid-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
    }
    function recordMobileBreadcrumb(level, domain, event, context, correlationId, durationMs) {
      const rec = {
        timestamp: new Date().toISOString(),
        level,
        domain,
        event,
        ...(correlationId ? { correlationId } : {}),
        ...(typeof durationMs === "number" && Number.isFinite(durationMs) ? { durationMs: Math.max(0, Math.round(durationMs)) } : {}),
        ...(context ? { context: redactDiagContext(context) } : {})
      };
      mobileBreadcrumbs.push(rec);
      if (mobileBreadcrumbs.length > MOBILE_BREADCRUMB_CAP) {
        mobileBreadcrumbs.splice(0, mobileBreadcrumbs.length - MOBILE_BREADCRUMB_CAP);
      }
      return rec;
    }
    function installMobileFaultTraps() {
      window.addEventListener("error", (ev) => {
        const msg = redactDiagText(ev && (ev.message || (ev.error && ev.error.message)) || "Unhandled error");
        mobileLastCrash = { timestamp: new Date().toISOString(), kind: "error", message: msg, breadcrumbs: mobileBreadcrumbs.slice() };
        recordMobileBreadcrumb("FATAL", "runtime", "unhandled_error", { message: msg });
      });
      window.addEventListener("unhandledrejection", (ev) => {
        const reason = ev && ev.reason;
        const msg = redactDiagText(reason && reason.message ? reason.message : reason);
        mobileLastCrash = { timestamp: new Date().toISOString(), kind: "unhandledrejection", message: msg, breadcrumbs: mobileBreadcrumbs.slice() };
        recordMobileBreadcrumb("ERROR", "runtime", "unhandled_rejection", { message: msg });
      });
    }
    window.__huntDiagnostics = {
      getBreadcrumbs: () => mobileBreadcrumbs.slice(),
      getLastCrash: () => mobileLastCrash,
      record: recordMobileBreadcrumb
    };

    // Boot: paint first; sync work starts only after the first frame (and never blocks it). A screen that
    // fails to draw must not stop the rest of boot: lifecycle hooks and sync still start, so a sync can
    // still bring the data back.
    installMobileFaultTraps();
    ingestPairingTokenFromPageUrl();
    if (materializeDailyHabitsInto(state, toLocalDateKey()) > 0) {
      persistState();
      syncMeta.localRev++;
    }
    try {
      renderApp();
      recordMobileBreadcrumb("INFO", "boot", "render_ok", { view: activeView });
    } catch (e) {
      recordMobileBreadcrumb("FATAL", "boot", "render_failed", { message: e && e.message });
      console.error("[hunt] boot.render_failed", e);
      const main = document.getElementById("mainContainer");
      if (main) main.innerHTML = `<div class="empty-card"><div class="empty-title">Hunt couldn't show this screen</div><p class="empty-sub">Your data is still saved on this phone. Try another tab, or reopen the app.</p></div>`;
    }
    syncKeepScreenOn();
    installLifecycleHooks();
    installUiHooks();
    installKeyboardHooks();
    afterFirstPaint(() => scheduleSync(0));
    setTimeout(prewarmAudio, 1500);
  </script>
</body>
</html>
