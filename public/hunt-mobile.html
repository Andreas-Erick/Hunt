        deletedQuestIds: Array.from(delQuests),
        deletedTaskIds: Array.from(delTasks),
        deletedLogIds: Array.from(delLogs),
        deletedHabitIds: Array.from(delHabits),
        activeFocus: mf
      };
    }

    function mergeHabits(base, inc, delHabits, delQuests) {
      const clean = h => ({ ...h, questId: (h.questId && delQuests.has(h.questId)) ? null : (h.questId || null) });
      const hMap = new Map();
      asArray(base.habits).forEach(h => { if (!delHabits.has(h.id)) hMap.set(h.id, clean(h)); });
      asArray(inc.habits).forEach(h => {
        if (delHabits.has(h.id)) return;
        const cleanH = clean(h);
        const ex = hMap.get(cleanH.id);
        if (!ex) {
          hMap.set(cleanH.id, cleanH);
          return;
        }
        const exTs = ex.updatedAt ?? ex.createdAt ?? 0;
        const inTs = cleanH.updatedAt ?? cleanH.createdAt ?? 0;
        const win = inTs > exTs ? cleanH : inTs < exTs ? ex : tieWinner(ex, cleanH);
        if (win !== ex) hMap.set(cleanH.id, win);
      });
      return hMap;
    }

    function mergeQuests(base, inc, delQuests) {
      const qMap = new Map();
      asArray(base.quests).forEach(q => { if (!delQuests.has(q.id)) qMap.set(q.id, q); });
      asArray(inc.quests).forEach(q => {
        if (delQuests.has(q.id)) return;
        const ex = qMap.get(q.id);
        if (!ex) {
          qMap.set(q.id, q);
          return;
        }
        const exTs = ex.updatedAt ?? ex.createdAt ?? 0;
        const inTs = q.updatedAt ?? q.createdAt ?? 0;
        const win = inTs > exTs ? q : inTs < exTs ? ex : tieWinner(ex, q);
        if (win !== ex) qMap.set(q.id, win);
      });
      return qMap;
    }

    function mergeTasks(base, inc, delTasks, delQuests) {
      const clean = t => ({ ...t, questId: (t.questId && delQuests.has(t.questId)) ? null : t.questId });
      const tMap = new Map();
      asArray(base.tasks).forEach(t => { if (!delTasks.has(t.id)) tMap.set(t.id, clean(t)); });
      asArray(inc.tasks).forEach(t => {
        if (delTasks.has(t.id)) return;
        const cleanT = clean(t);
        const ex = tMap.get(cleanT.id);
        if (!ex) {
          tMap.set(cleanT.id, cleanT);
          return;
        }
        const exTs = ex.updatedAt ?? ex.completedAt ?? ex.createdAt ?? 0;
        const inTs = cleanT.updatedAt ?? cleanT.completedAt ?? cleanT.createdAt ?? 0;
        const win = inTs > exTs ? cleanT : inTs < exTs ? ex : tieWinner(ex, cleanT);
        tMap.set(cleanT.id, { ...win, accumulatedSeconds: Math.max(ex.accumulatedSeconds || 0, cleanT.accumulatedSeconds || 0) });
      });
      return tMap;
    }

    // A focus on a completed or missing task is cleared with a deterministic timestamp (not "now"): newer
    // than the focus it clears and the completion (+1, as in syncTypes.ts), so a focus started on this
    // phone while a request was in flight still wins the next comparison.
    function clearFocusOfFinishedTask(focus, tMap) {
      if (!focus.activeTaskId) return focus;
      const task = tMap.get(focus.activeTaskId);
      if (task && task.status !== "completed") return focus;
      const finishedAt = task ? (task.completedAt || task.updatedAt || 0) : 0;
      return emptyFocus(Math.max(focus.updatedAt || 0, finishedAt) + 1);
    }

    function isRunningSession(f) {
      return !!(f && f.isRunning && f.activeTaskId && f.sessionStartedAt);
    }

    // logs: a Map id -> log (merge) or an array (state.timeLogs).
    function isSessionLogged(logs, focus) {
      for (const l of (Array.isArray(logs) ? logs : logs.values())) {
        if (l.taskId === focus.activeTaskId && l.startTime === focus.sessionStartedAt) return true;
      }
      return false;
    }

    // R4: when did a losing running session (task X, start S) really end? At the start of the newer,
    // different session that replaced it (the winning focus, or any later log of another session),
    // never later than now and never before S + 1 s. The winner's updatedAt is NOT used: a pause or
    // clear of an unrelated older session would cut this one short.
    function losingSessionEnd(bf, mf, logs, now) {
      const S = bf.sessionStartedAt, X = bf.activeTaskId;
      let end = now;
      if (mf.isRunning && mf.sessionStartedAt && !(mf.activeTaskId === X && mf.sessionStartedAt === S) && mf.sessionStartedAt > S) {
        end = Math.min(end, mf.sessionStartedAt);
      }
      for (const l of logs.values()) {
        const start = Number(l.startTime);
        if (start > S && !(l.taskId === X && l.startTime === S)) end = Math.min(end, start);
      }
      return Math.max(S + 1000, end);
    }

    // This phone's running burst lost to a different session: log it (R3 id, ending per R4) before it
    // disappears. The id log-<sessionStartedAt>-<taskId> plus the "already logged?" check (same task +
    // start time, e.g. the laptop paused this very session) make it idempotent. Returns true when it
    // wrote a log (requeueStrandedActiveTasks puts the task back in the queue).
    function flushLosingLocalBurst(bf, mf, maps, now) {
      if (!isRunningSession(bf)) return false;
      if (mf.isRunning && mf.activeTaskId === bf.activeTaskId && mf.sessionStartedAt === bf.sessionStartedAt) return false;
      const task = maps.tMap.get(bf.activeTaskId);
      if (!task) return false;
      const logId = sessionLogId(bf.activeTaskId, bf.sessionStartedAt);
      if (maps.lMap.has(logId) || maps.delLogs.has(logId) || isSessionLogged(maps.lMap, bf)) return false;
      const end = losingSessionEnd(bf, mf, maps.lMap, now);
      const secs = Math.max(1, Math.round((end - bf.sessionStartedAt) / 1000));
      const quest = task.questId ? maps.qMap.get(task.questId) : null;
      maps.lMap.set(logId, {
        id: logId,
        taskId: task.id,
        taskTitleSnapshot: task.title,
        questId: task.questId,
        questCodeSnapshot: quest ? quest.title : "Other",
        accentColorSnapshot: quest ? quest.accentColor : "slate",
        startTime: bf.sessionStartedAt,
        endTime: end,
        durationSeconds: secs,
        dateKey: toLocalDateKey(end)
      });
      maps.tMap.set(task.id, { ...task, accumulatedSeconds: (task.accumulatedSeconds || 0) + secs });
      return true;
    }

    // Only the focus task may be 'active': any other one (paused here, then another device started or
    // cleared focus) goes back to the queue, so 'next task' picks it again. Returns how many changed.
    function requeueStrandedActiveTasks(tMap, mf, now) {
      let n = 0;
      tMap.forEach((t, id) => {
        if (t.status !== "active" || id === mf.activeTaskId) return;
        tMap.set(id, { ...t, status: "queued", updatedAt: nextStamp(t, now) });
        n++;
      });
      return n;
    }

    // Concurrent offline work on two devices: max() alone under-counts, the union of logs does not.
    function raiseCountersToLoggedTotals(tMap, lMap) {
      const logged = new Map();
      lMap.forEach(l => logged.set(l.taskId, (logged.get(l.taskId) || 0) + (Number(l.durationSeconds) || 0)));
      tMap.forEach((t, id) => {
        const total = logged.get(id) || 0;
        if (total > (t.accumulatedSeconds || 0)) tMap.set(id, { ...t, accumulatedSeconds: total });
      });
    }

    // ----- Transport -----
    // Result shape (same for both transports): { id, ok, reason, url, code, ms, attempts, body }.
    // reason: "ok" | "no_network" | "unreachable" | "refused" | "server_timeout" | "auth" | "too_large" |
    // "http_<code>" | "error", plus JS-side "busy" (native already syncing), "js_timeout", "bad_response".
    function syncFailure(reason) {
      return { id: null, ok: false, reason, url: null, code: 0, ms: 0, attempts: [], body: "" };
    }

    const pendingNativeSyncs = new Map(); // requestId -> { resolve, timer }
    let nativeSyncSeq = 0;

    // Native -> JS: the result of AndroidBridge.syncWithLaptopAsync.
    window.__huntSyncDone = function (result) {
      const id = result && result.id != null ? String(result.id) : "";
      const entry = pendingNativeSyncs.get(id);
      if (!entry) return; // unknown, or already given up by the watchdog
      pendingNativeSyncs.delete(id);
      clearTimeout(entry.timer);
      entry.resolve(result);
    };

    function hasAsyncBridge() {
      return !!(window.AndroidBridge && window.AndroidBridge.syncWithLaptopAsync);
    }

    function sendSyncRequest(candidates, body, force) {
      if (hasAsyncBridge()) return postSyncNative(candidates, body, force);
      return withWatchdog(postSyncFetch(candidates, body));
    }

    function postSyncNative(candidates, body, force) {
      return new Promise(resolve => {
        const id = "s" + Date.now().toString(36) + "-" + (++nativeSyncSeq);
        const timer = setTimeout(() => {
          if (pendingNativeSyncs.delete(id)) resolve(syncFailure("js_timeout"));
        }, SYNC_WATCHDOG_MS);
        pendingNativeSyncs.set(id, { resolve, timer });
        const accepted = bridgeCall("syncWithLaptopAsync", id, JSON.stringify(candidates), body, !!force);
        if (accepted) return; // the answer arrives later via window.__huntSyncDone
        clearTimeout(timer);
        pendingNativeSyncs.delete(id);
        resolve(syncFailure(accepted === false ? "busy" : "error"));
      });
    }

    function withWatchdog(promise) {
      return new Promise(resolve => {
        const timer = setTimeout(() => resolve(syncFailure("js_timeout")), SYNC_WATCHDOG_MS);
        promise.then(
          r => { clearTimeout(timer); resolve(r); },
          () => { clearTimeout(timer); resolve(syncFailure("error")); }
        );
      });
    }

    function httpFailureReason(code) {
      if (code === 401) return "auth";
      if (code === 413) return "too_large";
      return "http_" + code;
    }

    // Browser copy: one candidate at a time; stop at the first server that answers (2xx or an HTTP error).
    async function postSyncFetch(candidates, body) {
      const started = Date.now();
      if (typeof navigator !== "undefined" && navigator.onLine === false) return syncFailure("no_network");
      const attempts = [];
      for (const url of candidates) {
        if (attempts.length && Date.now() - started > FETCH_BUDGET_MS) break;
        const attempt = await fetchSyncOnce(url, body);
        attempts.push({ url, reason: attempt.reason, ms: attempt.ms });
        if (attempt.answered) {
          return { id: null, ok: attempt.reason === "ok", reason: attempt.reason, url, code: attempt.code, ms: Date.now() - started, attempts, body: attempt.body };
        }
      }
      return { ...syncFailure(pickFailureReason(attempts)), ms: Date.now() - started, attempts };
    }

    async function fetchSyncOnce(url, body) {
      const started = Date.now();
      const correlationId = newCorrelationId();
      const ctrl = typeof AbortController === "function" ? new AbortController() : null;
      const timer = setTimeout(() => { if (ctrl) ctrl.abort(); }, FETCH_TIMEOUT_MS);
      const headers = {
        "Content-Type": "application/json",
        "X-Hunt-Client": "mobile-web",
        "X-Hunt-Correlation-Id": correlationId
      };
      const token = readBrowserSyncToken();
      if (token) headers["X-Hunt-Token"] = token; // unpaired: the laptop answers 401 -> "auth"
      try {
        const res = await fetch(url + "/api/sync", {
          method: "POST",
          cache: "no-store",
          signal: ctrl ? ctrl.signal : undefined,
          headers,
          body
        });
        if (!res.ok) {
          try { await res.text(); } catch (e) {}
          const ms = Date.now() - started;
          recordMobileBreadcrumb("WARN", "sync", "http_error", { status: res.status }, correlationId, ms);
          return { reason: httpFailureReason(res.status), code: res.status, body: "", answered: true, ms };
        }
        try {
          const text = await res.text();
          const ms = Date.now() - started;
          recordMobileBreadcrumb("DEBUG", "sync", "http_ok", { status: res.status }, correlationId, ms);
          return { reason: "ok", code: res.status, body: text, answered: true, ms };
        } catch (e) {
          const ms = Date.now() - started;
          recordMobileBreadcrumb("WARN", "sync", "body_timeout", {}, correlationId, ms);
          return { reason: "server_timeout", code: res.status, body: "", answered: false, ms };
        }
      } catch (e) {
        const ms = Date.now() - started;
        recordMobileBreadcrumb("WARN", "sync", "unreachable", {}, correlationId, ms);
        return { reason: "unreachable", code: 0, body: "", answered: false, ms };
      } finally {
        clearTimeout(timer);
      }
    }

    // Most informative failure wins: refused / server_timeout say more than unreachable.
    function pickFailureReason(attempts) {
      const reasons = attempts.map(a => a.reason);
      const best = ["refused", "server_timeout", "unreachable"].find(r => reasons.includes(r));
      return best || reasons[0] || "unreachable";
    }

    // ----- Scheduler -----
    // Healthy: one sync every 5 s. Failing: 5 -> 10 -> 20 s (+-15 % jitter), then 25.5-30 s (cap).
    // After each request an immediate follow-up runs only when something is pending AND the laptop just
    // answered: (again || dirty) && !failures ? 0 : nextDelay(). Local mutations ask for a debounced sync
    // (600 ms) that never pulls a retry earlier than the backoff allows. Hidden app: no timer at all.
    function isAppHidden() {
      return appInBackground || document.hidden === true;
    }

    // Cap first, then jitter: below the cap +-15 %; at the cap 85-100 % of it (30 s stays the maximum,
    // and capped retries do not all land on an exact 30 s grid).
    function nextDelay() {
      const raw = syncRun.failures ? SYNC_BASE_MS * Math.pow(2, syncRun.failures - 1) : SYNC_BASE_MS;
      const jitter = raw >= SYNC_BACKOFF_CAP_MS ? 0.85 + Math.random() * 0.15 : 0.85 + Math.random() * 0.3;
      return Math.round(Math.min(SYNC_BACKOFF_CAP_MS, raw) * jitter);
    }

    function clearSyncTimer() {
      clearTimeout(syncRun.timer);
      syncRun.timer = 0;
      syncRun.dueAt = 0;
    }

    // Arms the single sync timer, replacing any earlier one. While an Undo toast for a delete is showing,
    // automatic syncs wait for it: a tombstone that reached the laptop could not be taken back.
    function scheduleSync(delay) {
      clearSyncTimer();
      syncRun.paused = false;
      if (isAppHidden()) return;
      delay = Math.max(delay, syncHoldRemaining());
      syncRun.dueAt = Date.now() + delay;
      syncRun.timer = setTimeout(() => {
        syncRun.timer = 0;
        syncRun.dueAt = 0;
        runSync(false);
      }, delay);
    }

    function requestSyncSoon() {
      if (syncRun.inFlight) return; // the running request re-syncs on completion when dirty
      let delay = SYNC_DEBOUNCE_MS;
      if (syncRun.failures) delay = Math.max(delay, syncRun.retryAt - Date.now());
      scheduleSync(delay);
    }

    // Resume / network back: sync right away (or right after the running request).
    function kickSync() {
      if (syncRun.inFlight) {
        syncRun.again = true;
        return;
      }
      scheduleSync(0);
    }

    // Starts a sync now (or joins the running one). Resolves with the transport result.
    // onlyUrls (optional): try just these routes (Sync Now retrying the routes an automatic round skipped).
    function runSync(force, onlyUrls) {
      if (syncRun.inFlight) {
        syncRun.again = true;
        return syncRun.inFlight;
      }
      clearSyncTimer();
      syncRun.paused = false;
      const sentRev = syncMeta.localRev;
      const body = JSON.stringify(state);
      const subset = Array.isArray(onlyUrls) ? sanitizeUrlList(onlyUrls) : [];
      syncRun.manual = !!force;
      syncRun.sentRouteEpoch = syncRun.routeEpoch;
      syncRun.inFlight = sendSyncRequest(subset.length ? subset : buildCandidateUrls(), body, !!force)
        .catch(() => syncFailure("error"))
        .then(result => handleSyncResult(result, sentRev))
        .finally(finishSyncCycle);
      updateSyncIndicator();
      return syncRun.inFlight;
    }

    function parseSyncBody(body) {
      try {
        const data = JSON.parse(body);
        if (isPlainRecord(data) && isPlainRecord(data.payload)) return data;
        if (isPlainRecord(data) && Array.isArray(data.tasks)) return { payload: data }; // legacy bare payload
      } catch (e) {}
      return null;
    }

    function handleSyncResult(result, sentRev) {
      result = result || syncFailure("error");
      try {
        syncRun.lastResult = result;
        if (result.reason === "busy") return result; // native is still busy: retry later, not a failure
        syncRun.lastManual = !!syncRun.manual;
        syncRun.results++;
        syncMeta.lastAttemptAt = Date.now();
        const data = result.ok ? parseSyncBody(result.body) : null;
        if (result.ok && !data) result = { ...result, ok: false, reason: "bad_response", body: "" };
        // the answer counts as synced only once it is merged into the phone's data
        if (result.ok) {
          try {
            applyRemotePayload(data.payload);
          } catch (e) {
            console.error("[hunt] sync.merge_failed", e);
            result = { ...result, ok: false, reason: "bad_response", body: "" };
          }
        }
        if (result.ok) onSyncSuccess(result, data, sentRev);
        else onSyncFailure(result);
        syncRun.lastResult = result;
        saveSyncMeta(false);
      } catch (e) {
        console.error("[hunt] sync.result_failed", e);
      }
      return result;
    }

    function onSyncSuccess(result, data, sentRev) {
      syncRun.failures = 0;
      syncRun.retryAt = 0;
      syncRun.okThisSession++;
      networkDown = false;
      isLaptopReachable = true;
      syncMeta.lastOkAt = Date.now();
      syncMeta.lastError = null;
      syncMeta.syncedRev = Math.min(syncMeta.localRev, Math.max(syncMeta.syncedRev, sentRev));
      const answeredUrl = normalizeLaptopUrl(result.url);
      if (answeredUrl) syncMeta.lastUrl = answeredUrl;
      if (Array.isArray(data.lanUrls)) syncMeta.lanUrls = sanitizeLanUrls(data.lanUrls);
    }

    function onSyncFailure(result) {
      syncRun.failures++;
      isLaptopReachable = false;
      syncMeta.lastError = result.reason || "error";
      if (result.reason === "no_network") networkDown = true;
    }

    // Failures that repeat identically until something changes (pairing key, size, a 4xx other than
    // 408/429, an answer that is not Hunt's): never retried on a timer.
    function isDeterministicFailure(result) {
      if (!result || result.ok) return false;
      const reason = String(result.reason || "");
      if (reason === "auth" || reason === "too_large" || reason === "bad_response") return true;
      const m = /^http_(\d+)$/.exec(reason);
      const code = m ? Number(m[1]) : 0;
      return code >= 400 && code < 500 && code !== 408 && code !== 429;
    }

    function finishSyncCycle() {
      try {
        const busy = !!(syncRun.lastResult && syncRun.lastResult.reason === "busy");
        const again = syncRun.again;
        syncRun.inFlight = null;
        syncRun.manual = false;
        syncRun.again = false;
        const dirty = pendingChangeCount() > 0;
        let delay = (again || dirty) && !syncRun.failures ? 0 : nextDelay();
        if (busy) delay = Math.max(delay, SYNC_BASE_MS);
        syncRun.retryAt = syncRun.failures ? Date.now() + delay : 0;
        if (!again && isDeterministicFailure(syncRun.lastResult)) {
          // Paused: resending the whole state would fail the same way. Sync Now, returning to the app,
          // the network coming back, an edit, or a new address or pairing key start the next attempt.
          clearSyncTimer();
          syncRun.paused = true;
        } else {
          scheduleSync(delay);
        }
        updateSyncIndicator();
      } catch (e) {
        console.error("[hunt] sync.schedule_failed", e);
      }
    }

    // Can Sync Now answer with the result of the automatic request it waited for, instead of a second
    // full round? Yes when that request succeeded (and nothing changed on the phone since it was sent),
    // or failed after really trying every route. No when native was busy (nothing was tried), a route
    // was skipped (reason "skipped_*": VPN off / time budget; the forced round tries it), the user
    // picked another address after it was sent, or edits made meanwhile (e.g. a delete whose Undo
    // window Sync Now just ended) still have to go out: the laptop just answered, so that round is quick.
    function skippedAttemptUrls(result) {
      if (!result) return [];
      return asArray(result.attempts)
        .filter(a => a && a.url && /^skipped/.test(String(a.reason || "")))
        .map(a => a.url);
    }

    // Same ranking as native: an answer from the laptop beats "slow/refused", which beats "unreachable".
    function failureRank(reason) {
      const r = String(reason || "");
      if (r === "auth" || r === "too_large" || r === "bad_response" || /^http_/.test(r)) return 4;
      if (r === "refused" || r === "server_timeout") return 3;
      if (r === "error" || r === "js_timeout") return 2;
      if (r === "unreachable") return 1;
      return 0;
    }

    // Automatic round (skipped some routes) + Sync Now's round over just those routes = one answer.
    function combineSyncFailures(auto, forced) {
      const tried = asArray(auto.attempts).filter(a => a && !/^skipped/.test(String(a.reason || "")));
      const reason = failureRank(forced.reason) > failureRank(auto.reason) ? forced.reason : auto.reason;
      return {
        ...forced,
        ok: false,
        reason,
        code: reason === forced.reason ? forced.code : auto.code,
        ms: (Number(auto.ms) || 0) + (Number(forced.ms) || 0),
        attempts: tried.concat(asArray(forced.attempts))
      };
    }

    function autoResultAnswersSyncNow(result, sentRouteEpoch) {
      if (!result || result.reason === "busy") return false;
      if (sentRouteEpoch !== syncRun.routeEpoch) return false;
      if (result.ok) return pendingChangeCount() === 0;
      return !asArray(result.attempts).some(a => a && /^skipped/.test(String(a.reason || "")));
    }

    // Manual "Sync Now": reset the backoff; if an automatic request is running, wait for it and use its
    // result when that answers the question (see above); otherwise do a fresh forced round trip.
    // An explicit sync also ends any pending Undo window (its delete goes out with Sync Now's round).
    let manualSyncPromise = null;
    function syncNow() {
      if (!manualSyncPromise) {
        settleHeldToasts();
        manualSyncPromise = (async () => {
          syncRun.failures = 0;
          syncRun.retryAt = 0;
          if (syncRun.inFlight) {
            const sentRouteEpoch = syncRun.sentRouteEpoch;
            let autoResult = null;
            try { autoResult = await syncRun.inFlight; } catch (e) {}
            if (autoResultAnswersSyncNow(autoResult, sentRouteEpoch)) {
              // that result is now Sync Now's answer: a failure must show as one (no reconnect grace)
              if (syncRun.lastResult === autoResult) syncRun.lastManual = true;
              updateSyncIndicator();
              return autoResult;
            }
            // The automatic round really tried every route except the skipped ones (Tailscale with the
            // VPN off, time budget): only those are new, so try just them instead of waiting on a
            // stalled laptop a second time. Their failure is combined with the automatic one.
            const skippedUrls = skippedAttemptUrls(autoResult);
            if (autoResult && !autoResult.ok && autoResult.reason !== "busy" &&
                sentRouteEpoch === syncRun.routeEpoch && skippedUrls.length && !syncRun.inFlight) {
              syncRun.failures = 0;
              const forced = await runSync(true, skippedUrls);
              if (forced && !forced.ok && forced.reason !== "busy" && syncRun.lastResult === forced) {
                const combined = combineSyncFailures(autoResult, forced);
                syncRun.lastResult = combined;
                syncMeta.lastError = combined.reason;
                saveSyncMeta(false);
                updateSyncIndicator();
                return combined;
              }
              return forced;
            }
          }
          syncRun.failures = 0;
          return runSync(true);
        })().finally(() => { manualSyncPromise = null; });
        updateSyncIndicator(); // "Syncing…" right away, also while it waits for the automatic request
      }
      return manualSyncPromise;
    }

    // Merge the laptop's answer into the CURRENT state (never the sent snapshot), so edits made while
    // the request was in flight survive. Identical result -> no writes, no DOM work. When the merge
    // itself created data the laptop does not have yet (a flushed burst log, a re-queued task), that
    // counts as a local change: the chip shows it as unsynced and the follow-up sync runs at once.
    function applyRemotePayload(payload) {
      flushFieldDrafts();
      const report = { createdLocal: false };
      const merged = mergePayloads(state, payload, report);
      const materialized = materializeDailyHabitsInto(merged, toLocalDateKey());
      if (report.createdLocal || materialized > 0) syncMeta.localRev++;
      const mergedJson = JSON.stringify(merged);
      if (mergedJson === JSON.stringify(state)) return false;
      state = merged;
      persistState(mergedJson);
      try {
        renderAppSafely();
      } catch (e) {
        console.error("[hunt] sync.render_failed", e); // the merge itself is done and saved
      }
      return true;
    }

    // ----- Rendering that never clobbers typing or a tap in progress -----
    let renderWaitingForBlur = false;
    let renderWaitingForGesture = false; // one deferred render armed for the current touch/click
    let pointerIsDown = false;
    let lastRenderedDateKey = ""; // local day renderApp() last drew (tick() re-renders when it changes)
    let renderCount = 0;          // renderApp() calls so far (a deferred render is dropped if one ran since)

    // ignorePointer: the gesture wait timed out (see renderAfterGesture); render even if still "down".
    function renderAppSafely(ignorePointer) {
      // A finger (or mouse button) is down: rebuilding the view now could slide another card under it,
      // and the tap would then complete / open the wrong task. Render right after the gesture instead;
      // however many merges arrive meanwhile, only one listener is armed.
      if (pointerIsDown && ignorePointer !== true) {
        if (!renderWaitingForGesture) {
          renderWaitingForGesture = true;
          renderAfterGesture();
        }
        updateSyncIndicator();
        return;
      }
      const el = document.activeElement;
      const main = document.getElementById("mainContainer");
      if (el && main && main.contains(el) && /^(INPUT|TEXTAREA)$/.test(el.tagName)) {
        if (!renderWaitingForBlur) {
          renderWaitingForBlur = true;
          el.addEventListener("blur", () => {
            renderWaitingForBlur = false;
            renderAfterGesture();
          }, { once: true });
        }
        updateSyncIndicator();
        return;
      }
      renderApp();
    }

    // Renders once the current tap is over, so the node under the finger is not replaced mid-tap.
    // - No pointer down (a blur): the blur came from the mousedown of the next tap, and mousedown,
    //   mouseup and click run in that same task (also for touch), so the next task is after the click.
    // - Pointer down: wait for pointerup, then for the tap's click. For touch, Chrome sends the click
    //   in a LATER task than pointerup (GestureTap), so rendering right after pointerup would still move
    //   the card before the click lands. No click within 350 ms (long press, drag): render anyway.
    //   pointercancel (the touch became a scroll): no click follows, render right away. A press held
    //   longer than 1.5 s (or a lost pointerup) does not hold the render back any longer.
    // Skipped when anything re-rendered meanwhile (e.g. the tap's own handler): that drew the latest state.
    function renderAfterGesture() {
      const countAtArm = renderCount;
      const later = force => setTimeout(() => {
        if (renderCount === countAtArm) renderAppSafely(force);
      }, 0);
      if (!pointerIsDown) {
        renderWaitingForGesture = false;
        later(false);
        return;
      }
      let stage = "down";
      let timer = 0;
      const finish = force => {
        if (stage === "done") return;
        stage = "done";
        clearTimeout(timer);
        document.removeEventListener("pointerup", onUp, true);
        document.removeEventListener("pointercancel", onUp, true);
        document.removeEventListener("click", onClick, true);
        renderWaitingForGesture = false;
        later(force);
      };
      const onUp = e => {
        if (stage !== "down") return;
        if (e.type === "pointercancel") {
          finish(false);
          return;
        }
        stage = "up";
        clearTimeout(timer);
        timer = setTimeout(() => finish(false), 350);
      };
      const onClick = () => {
        if (stage === "up") finish(false); // capture phase: the deferred render runs after the tap's handlers
      };
      document.addEventListener("pointerup", onUp, true);
      document.addEventListener("pointercancel", onUp, true);
      document.addEventListener("click", onClick, true);
      timer = setTimeout(() => finish(true), 1500);
    }

    // ----- Header sync chip -----
    // phase: "connecting" (first attempt of this session still pending) | "syncing" (a request is in
    // flight for a user Sync Now, or pushing changes to a reachable laptop) | "pending" (laptop reachable,
    // changes waiting for the next sync, nothing in flight: the chip keeps its "Synced · 2m" label) |
    // "ok" | "offline" (calm: everything works on the phone) | "attention" (the laptop answered but
    // refused: pairing key, size, server error). Background retries while offline never flash "Syncing…".
    function isAttentionReason(reason) {
      return reason === "auth" || reason === "too_large" || reason === "bad_response" || /^http_\d+$/.test(reason || "");
    }

    // One failed poll right after a success (flaky Wi-Fi) does not flip the chip; the next one decides.
    // Never for a failed Sync Now: the user asked, so the chip, the status card and the result line
    // all show that failure.
    function inReconnectGrace() {
      return !isLaptopReachable && !networkDown && syncRun.failures === 1 && syncRun.okThisSession > 0 &&
        !syncRun.lastManual && Date.now() - syncMeta.lastOkAt < 20000 && !isAttentionReason(syncMeta.lastError);
    }

    function getSyncPhase() {
      const pending = pendingChangeCount();
      // a Sync Now waiting for the automatic request it joined counts as syncing too
      if (syncRun.inFlight && (syncRun.manual || manualSyncPromise)) return "syncing";
      if (!syncRun.results) return "connecting";
      if (!isLaptopReachable && !inReconnectGrace()) return isAttentionReason(syncMeta.lastError) ? "attention" : "offline";
      if (syncRun.inFlight && pending > 0) return "syncing";
      return pending > 0 ? "pending" : "ok";
    }

    function getSyncStatus() {
      return {
        phase: getSyncPhase(),
        pending: pendingChangeCount(),
        inFlight: !!syncRun.inFlight,
        failures: syncRun.failures,
        retryAt: syncRun.retryAt,
        lastOkAt: syncMeta.lastOkAt,
        lastAttemptAt: syncMeta.lastAttemptAt,
        lastError: syncMeta.lastError,
        lastUrl: syncMeta.lastUrl,
        lanUrls: syncMeta.lanUrls.slice(),
        lastResult: syncRun.lastResult
      };
    }

    // "now", "4m", "3h", "2d": compact age for the chip.
    function relativeShort(ts) {
      const s = Math.max(0, (Date.now() - ts) / 1000);
      if (s < 60) return "now";
      if (s < 3600) return Math.floor(s / 60) + "m";
      if (s < 86400) return Math.floor(s / 3600) + "h";
      return Math.floor(s / 86400) + "d";
    }

    // "just now", "4 min ago", "3 h ago", "2 days ago": for sentences in the sync sheet.
    function relativeLong(ts) {
      const s = Math.max(0, (Date.now() - ts) / 1000);
      if (s < 45) return "just now";
      if (s < 3600) return Math.max(1, Math.round(s / 60)) + " min ago";
      if (s < 86400) return Math.floor(s / 3600) + " h ago";
      const d = Math.floor(s / 86400);
      return d === 1 ? "yesterday" : d + " days ago";
    }

    // "today 14:32" or "Tue, Nov 18 14:32".
    function absoluteTime(ts) {
      const d = new Date(ts);
      const time = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      if (toLocalDateKey(ts) === toLocalDateKey()) return "today " + time;
      return d.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" }) + " " + time;
    }

    // Everything the chip (and the Focus-view indicator) shows, derived from scheduler + device meta.
    // compact: shorter offline label while the live timer pill shares the header (360 px screens).
    function syncChipModel(compact) {
      const phase = getSyncPhase();
      const pending = pendingChangeCount();
      let label;
      if (phase === "connecting") label = "Connecting…";
      else if (phase === "syncing") label = "Syncing…"; // only while a request is really in flight
      // "pending" (e.g. the 5 s Undo hold after a delete): nothing is being sent yet, so keep the last label
      else if (phase === "ok" || phase === "pending") label = syncMeta.lastOkAt ? "Synced · " + relativeShort(syncMeta.lastOkAt) : "Synced";
      else if (phase === "attention") label = "Check sync";
      else if (pending) label = compact ? pending + " unsynced" : "Offline · " + pending + " unsynced";
      else label = "On phone";
      const dot = { connecting: "connecting", syncing: "syncing", pending: "online", ok: "online", attention: "attention" }[phase] || "offline";
      return { phase, label, dot, pending };
    }

    function setTextIfChanged(el, text) {
      if (el && el.textContent !== text) el.textContent = text;
    }

    function setAttrIfChanged(el, name, value) {
      if (el && el.getAttribute(name) !== value) el.setAttribute(name, value);
    }

    // Replaces innerHTML only when the generated markup differs from what this element last received.
    function setHtmlIfChanged(el, html) {
      if (!el || el.__huntHtml === html) return false;
      el.__huntHtml = html;
      el.innerHTML = html;
      return true;
    }

    function paintSyncIndicator(dotId, textId, buttonId, model) {
      const dot = document.getElementById(dotId);
      const txt = document.getElementById(textId);
      const btn = document.getElementById(buttonId);
      if (dot) {
        const cls = "dot-indicator " + model.dot;
        if (dot.className !== cls) dot.className = cls;
        setAttrIfChanged(dot, "data-phase", model.phase);
      }
      setTextIfChanged(txt, model.label);
      if (btn) {
        setAttrIfChanged(btn, "data-phase", model.phase);
        setAttrIfChanged(btn, "aria-label", "Sync status: " + model.label + ". Open sync settings");
      }
    }

    // Renders the header chip, the Focus-view indicator and an open sync sheet from sync meta.
    // Touches the DOM only where something visibly changed (idle syncs cause zero mutations).
    function updateSyncIndicator() {
      const pill = document.getElementById("activeHeaderPill");
      const compact = !!(pill && pill.firstElementChild);
      paintSyncIndicator("headerSyncDot", "headerSyncText", "syncChipBtn", syncChipModel(compact));
      if (document.getElementById("focusSyncText")) {
        paintSyncIndicator("focusSyncDot", "focusSyncText", "focusSyncBtn", syncChipModel(false));
      }
      if (isSyncSheetOpen()) refreshSyncSheet();
    }

    // Markup for the Focus view's indicator (rendered with the view, then kept current in place).
    function focusSyncIndicatorHtml() {
      const m = syncChipModel(false);
      return `<button class="focus-sync-btn" id="focusSyncBtn" data-phase="${m.phase}" onclick="openSyncSheet()" aria-label="Sync status: ${escapeHtml(m.label)}. Open sync settings">
          <span id="focusSyncDot" class="dot-indicator ${m.dot}" data-phase="${m.phase}"></span><span id="focusSyncText">${escapeHtml(m.label)}</span>
        </button>`;
    }

    function updateHeaderStatus() {
      const pillContainer = document.getElementById("activeHeaderPill");
      if (pillContainer) {
        const af = state.activeFocus;
        const activeTask = af && af.activeTaskId ? state.tasks.find(t => t.id === af.activeTaskId) : null;
        let html = "";
        let chrono = "";
        if (activeTask && activeView !== "focus") {
          const delta = af.isRunning && af.sessionStartedAt ? Math.max(0, Math.floor((Date.now() - af.sessionStartedAt) / 1000)) : 0;
          chrono = formatChrono((activeTask.accumulatedSeconds || 0) + delta);
          html = `<button class="live-timer-chip pressable" onclick="switchView('focus')" aria-label="${af.isRunning ? "Focus running" : "Focus paused"}: ${escapeHtml(activeTask.title)}. Open Focus"><span style="width:6px;height:6px;border-radius:50%;background:${af.isRunning ? "var(--emerald)" : "var(--neutral-dot)"};"></span><span id="headerChronoText">${chrono}</span></button>`;
        }
        // rebuild only when the pill itself changes; otherwise just keep its time current
        const key = html.replace(/<span id="headerChronoText">[^<]*<\/span>/, "");
        if (pillContainer.__huntKey !== key) {
          pillContainer.__huntKey = key;
          pillContainer.innerHTML = html;
        } else if (chrono) {
          setTextIfChanged(document.getElementById("headerChronoText"), chrono);
        }
      }
      updateSyncIndicator();
    }

    function setActiveView(view) {
      activeView = view;
      ["command", "plan", "focus", "quests", "habits", "telemetry"].forEach(id => {
        const btn = document.getElementById("nav-" + id);
        if (!btn) return;
        const cls = id === view ? "nav-tab active" : "nav-tab";
        if (btn.className !== cls) btn.className = cls;
        if (id === view) setAttrIfChanged(btn, "aria-current", "page");
        else if (btn.hasAttribute("aria-current")) btn.removeAttribute("aria-current");
      });
      if (document.body) setAttrIfChanged(document.body, "data-view", view);
    }

    function switchView(view) {
      playClickSound();
      setActiveView(view);
      renderApp();
    }

    // ----- Lifecycle: native events + page visibility -----
    function onAppHidden() {
      appInBackground = true;
      pointerIsDown = false; // a gesture never continues across backgrounding (no stuck deferred render)
      flushFieldDrafts();
      persistPending = false; // written right here, synchronously
      persistState();
      saveSyncMeta(true);
      // unsent New Task text (device-local, never synced): survives Android killing the app
      const sc = document.getElementById("sheetContainer");
      if (isSheetOpen() && sc && sc.dataset.sheet === "newTask") captureComposerDraft();
      storeComposerDraft();
      clearSyncTimer();
    }

    function onAppVisible() {
      const wasHidden = appInBackground;
      appInBackground = false;
      syncRun.failures = Math.min(syncRun.failures, 1);
      syncRun.retryAt = 0;
      if (wasHidden) renderAppSafely(); // time-dependent views (timers, date rollover)
      kickSync();
    }

    function onNetworkOnline() {
      networkDown = false;
      syncRun.failures = 0;
      syncRun.retryAt = 0;
      kickSync();
    }

    function onNetworkOffline() {
      networkDown = true;
      if (syncRun.results) isLaptopReachable = false;
      updateSyncIndicator();
    }

    window.__huntLifecycle = function (phase) {
      if (phase === "pause") onAppHidden();
      else if (phase === "resume") onAppVisible();
    };

    window.__huntNetwork = function (info) {
      if (info && info.online) onNetworkOnline();
      else onNetworkOffline();
    };

    // Android Back: close a sheet, else return to Today; false lets native move the task to the back.
    window.__huntBack = function () {
      if (isSheetOpen()) {
        closeSheet();
        return true;
      }
      if (activeView !== "command") {
        switchView("command");
        return true;
      }
      return false;
    };

    // ----- On-screen keyboard: hide the bottom nav + FAB while typing -----
    // With adjustResize the WebView shrinks above the keyboard, so the fixed nav (and the FAB) would sit
    // on top of the keyboard and squeeze the field being typed in. body.keyboard-open hides them while a
    // text field has focus AND the viewport is clearly shorter than its full height at this width (so
    // closing the keyboard with Back, which keeps the field focused, brings them back). Without any
    // height reading a focused field alone decides. Checked again by tick() while the class is set.
    // innerWidth -> { max, min, suspect }: tallest/shortest viewport height seen at that width. suspect =
    // the first reading at this width came while typing (e.g. rotated with the keyboard up), so it may
    // already be keyboard-reduced; trusted once a keyboard transition (>=15% height change) was seen at
    // this width, or once no field has focus. Android may report the full height first and the reduced
    // one right after (or the other way round), both orders must work.
    const viewportHeights = {};
    let nativeImeActive = false;
    let lastNativeImeDp = 0;

    // Called frame-by-frame by MainActivity's WindowInsetsAnimation.Callback on Android 11+.
    window.__huntSetIme = function (rawDp) {
      nativeImeActive = true;
      const dp = typeof rawDp === "number" && Number.isFinite(rawDp)
        ? Math.max(0, Math.min(1200, Math.round(rawDp)))
        : 0;
      if (dp !== lastNativeImeDp) {
        lastNativeImeDp = dp;
        document.documentElement.style.setProperty("--kb", dp + "px");
      }
      const body = document.body;
      if (!body) return;
      const open = dp > 20;
      if (body.classList.contains("keyboard-open") !== open) {
        body.classList.toggle("keyboard-open", open);
      }
    };

    function isTextEntry(el) {
      if (!el || el.disabled || el.readOnly) return false;
      if (el.tagName === "TEXTAREA") return true;
      if (el.tagName === "INPUT") return !/^(button|checkbox|color|file|hidden|image|radio|range|reset|submit)$/i.test(el.type || "text");
      return el.isContentEditable === true;
    }

    function updateKeyboardClass() {
      const body = document.body;
      if (!body) return;
      if (nativeImeActive) {
        body.classList.toggle("keyboard-open", lastNativeImeDp > 20);
        return;
      }
      const vv = window.visualViewport;
      const h = (vv && vv.height) || window.innerHeight || 0;
      const w = Math.round(window.innerWidth || 0);
      const typing = isTextEntry(document.activeElement);
      let vh = w ? viewportHeights[w] : null;
      if (w && h && !vh) {
        vh = viewportHeights[w] = { max: h, min: h, suspect: typing };
      } else if (vh && h) {
        if (h > vh.max) vh.max = h;
        if (h < vh.min) vh.min = h;
      }
      if (vh && vh.suspect && (!typing || vh.max >= vh.min / 0.85)) vh.suspect = false;
      const full = vh ? vh.max : 0;
      const shrunk = !h || !full || (vh && vh.suspect) || h < full * 0.85;
      const open = isTextEntry(document.activeElement) && shrunk;
      if (body.classList.contains("keyboard-open") === open) return;
      body.classList.toggle("keyboard-open", open);
      // Only scroll a sheet field if it is actually clipped below the sheet's visible area;
      // scrolling a field that is already in view at the top of the sheet causes a visible jerk.
      const el = document.activeElement;
      const sc = document.getElementById("sheetContainer");
      const sheet = sc ? sc.querySelector(".bottom-sheet") : null;
      if (open && sheet && sheet.contains(el) && typeof el.scrollIntoView === "function") {
        setTimeout(() => {
          if (document.activeElement !== el) return;
          try {
            const sr = sheet.getBoundingClientRect();
            const er = el.getBoundingClientRect();
            if (sr.height > 0 && er.bottom > sr.bottom - 64) {
              el.scrollIntoView({ block: "nearest", behavior: "smooth" });
            }
          } catch (e) {}
        }, 100);
      }
    }

    function installKeyboardHooks() {
      updateKeyboardClass(); // records the full height at boot (keyboard closed)
      document.addEventListener("focusin", updateKeyboardClass);
      // focus moving between two fields: focusout then focusin in the same task, so no flash
      document.addEventListener("focusout", () => setTimeout(updateKeyboardClass, 0));
      window.addEventListener("resize", updateKeyboardClass);
      if (window.visualViewport) window.visualViewport.addEventListener("resize", updateKeyboardClass);
    }

    // UI-only listeners: keep the keyboard open while choosing a pill in a sheet, Escape closes a sheet
    // (browser copy), and a no-op touchstart so :active press feedback also works in mobile Safari.
    function installUiHooks() {
      const sc = document.getElementById("sheetContainer");
      if (sc) {
        sc.addEventListener("mousedown", e => {
          const pill = e.target && e.target.closest ? e.target.closest(".sheet-pill") : null;
          const el = document.activeElement;
          if (pill && el && sc.contains(el) && /^(INPUT|TEXTAREA)$/.test(el.tagName)) e.preventDefault();
        });
      }
      document.addEventListener("keydown", e => {
        if (e.key === "Escape" && isSheetOpen()) closeSheet();
      });
      document.addEventListener("touchstart", () => {}, { passive: true });
    }

    function installLifecycleHooks() {
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) onAppHidden();
        else onAppVisible();
      });
      window.addEventListener("pagehide", onAppHidden);
      window.addEventListener("pageshow", e => { if (e.persisted) onAppVisible(); });
      window.addEventListener("online", onNetworkOnline);
      window.addEventListener("offline", onNetworkOffline);
      document.addEventListener("pointerdown", () => { pointerIsDown = true; }, true);
      document.addEventListener("pointerup", () => { pointerIsDown = false; }, true);
      document.addEventListener("pointercancel", () => { pointerIsDown = false; }, true);
    }

    function afterFirstPaint(fn) {
      if (typeof requestAnimationFrame === "function" && !document.hidden) {
        requestAnimationFrame(() => setTimeout(fn, 0));
      } else {
        setTimeout(fn, 0);
      }
    }

    // =========================================================================
    // TOASTS: brief confirmations and Undo. One host, auto-dismiss.
    // A delete's tombstone is written immediately (safe if the app is killed); while its Undo toast is
    // up, automatic syncs wait (holdSync) so Undo can still take the tombstone back.
    // An Undo (or Restore) window always runs its full time: a tap on the toast outside its button does
    // nothing, and a new toast replaces the oldest plain one. At most two are visible, unless several
    // Undo windows are open at once (e.g. three quick deletes): those stack until they end.
    // =========================================================================
    const TOAST_MS = 4000;
    const UNDO_TOAST_MS = 5000;
    const MAX_TOASTS = 2;
    const toasts = []; // { el, timer, expiresAt, undo, holdSync, done }

    function showToast(message, opts) {
      opts = opts || {};
      const host = document.getElementById("toastHost");
      if (!host) return null;
      while (toasts.length >= MAX_TOASTS) {
        const victim = toasts.find(t => !t.undo);
        if (!victim) break;
        finishToast(victim, false);
      }
      const ms = opts.ms || (opts.undo ? UNDO_TOAST_MS : TOAST_MS);
      const el = document.createElement("div");
      el.className = "toast";
      el.innerHTML = `<span class="toast-msg">${escapeHtml(message)}</span>` +
        (opts.undo ? `<button class="toast-action" type="button">${escapeHtml(opts.actionLabel || "Undo")}</button>` : "");
      const toast = { el, timer: 0, expiresAt: Date.now() + ms, undo: opts.undo || null, holdSync: !!(opts.undo && opts.holdSync), done: false };
      toast.timer = setTimeout(() => finishToast(toast, false), ms);
      el.addEventListener("click", e => {
        const undoTapped = !!(e.target && e.target.closest && e.target.closest(".toast-action"));
        if (toast.undo && !undoTapped) return; // a stray tap must not end the Undo window early
        finishToast(toast, undoTapped);
      });
      host.appendChild(el);
      toasts.push(toast);
      // the commit already armed a debounced sync: push it behind the Undo window
      if (toast.holdSync && syncRun.dueAt) scheduleSync(Math.max(0, syncRun.dueAt - Date.now()));
      return toast;
    }

    function finishToast(toast, runUndo) {
      if (!toast || toast.done) return;
      toast.done = true;
      const i = toasts.indexOf(toast);
      if (i >= 0) toasts.splice(i, 1);
      clearTimeout(toast.timer);
      const el = toast.el;
      el.classList.add("leaving");
      setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 160);
      if (runUndo && toast.undo) {
        playClickSound();
        toast.undo();
      } else if (toast.holdSync) {
        requestSyncSoon(); // the Undo window closed: let the delete go out now
      }
    }

    function settleHeldToasts() {
      toasts.filter(t => t.holdSync).forEach(t => finishToast(t, false));
    }

    // ms until no Undo toast holds automatic syncs back (0 = no hold). The hold lasts while such a toast
    // exists (not just by the clock): after a pause its timer may fire late, and Undo stays tappable.
    function syncHoldRemaining() {
      let until = 0;
      toasts.forEach(t => { if (t.holdSync && t.expiresAt > until) until = t.expiresAt; });
      return until ? Math.max(100, until - Date.now() + 50) : 0;
    }

    function cloneJson(value) {
      return value === undefined ? undefined : JSON.parse(JSON.stringify(value));
    }

    function shortTitle(text) {
      const s = String(text || "").trim();
      return s.length > 42 ? s.slice(0, 41) + "…" : s;
    }

    // =========================================================================
    // CORE FOCUS & TASK OPERATIONS (every mutation ends in commitLocalChange)
    // =========================================================================
    // Logs a running session (default: the current focus) up to endAt (default: now) under the shared id
    // log-<sessionStartedAt>-<taskId> (R3) and adds it to the task's counter. Skipped (returns 0: no log,
    // no counter change) when that session is already logged or its log was deleted: same id, a tombstone
    // for that id, or any log with the same task + start time (the other device ended this very session).
    // The caller's action (pause, complete, switch, return) goes ahead either way.
    function flushActiveBurst(endAt, focus) {
      const af = focus || state.activeFocus;
      if (!isRunningSession(af)) return 0;
      const task = state.tasks.find(t => t.id === af.activeTaskId);
      if (!task) return 0;
      const logId = sessionLogId(task.id, af.sessionStartedAt);
      if (state.timeLogs.some(l => l.id === logId) || asArray(state.deletedLogIds).includes(logId) ||
        isSessionLogged(state.timeLogs, af)) return 0;
      const now = Date.now();
      const end = Number.isFinite(endAt) ? endAt : now;
      const elapsed = Math.max(1, Math.round((end - af.sessionStartedAt) / 1000));
      task.accumulatedSeconds = (task.accumulatedSeconds || 0) + elapsed;
      task.updatedAt = nextStamp(task, now);
      const q = state.quests.find(x => x.id === task.questId);
      state.timeLogs.unshift({
        id: logId,
        taskId: task.id,
        taskTitleSnapshot: task.title,
        questId: task.questId,
        questCodeSnapshot: q ? q.title : "Other",
        accentColorSnapshot: q ? q.accentColor : "slate",
        startTime: af.sessionStartedAt,
        endTime: end,
        durationSeconds: elapsed,
        dateKey: toLocalDateKey(end)
      });
      return elapsed;
    }

    function habitTaskId(habitId, dateKey) {
      return "habtsk-" + dateKey + "-" + habitId;
    }

    function isTaskVisibleToday(task, todayKey) {
      if (task.habitId) return task.scheduledDate === todayKey;
      return !task.scheduledDate || task.scheduledDate <= todayKey;
    }

    function buildHabitTaskRow(habit, dateKey) {
      const stamp = Math.max(1, Number(habit.createdAt) || 1);
      return {
        id: habitTaskId(habit.id, dateKey),
        title: habit.title,
        notes: habit.notes || "",
        questId: habit.questId || null,
        habitId: habit.id,
        status: "queued",
        rank: Number.isFinite(habit.rank) ? habit.rank : 1000,
        accumulatedSeconds: 0,
        scheduledDate: dateKey,
        createdAt: stamp,
        updatedAt: stamp
      };
    }

    function materializeDailyHabitsInto(targetState, dateKey) {
      const habits = asArray(targetState.habits).slice().sort(compareRank);
      if (!habits.length) return 0;
      const delTasks = new Set(asArray(targetState.deletedTaskIds));
      const existingIds = new Set(asArray(targetState.tasks).map(t => t.id));
      let added = 0;
      for (const h of habits) {
        const tid = habitTaskId(h.id, dateKey);
        if (existingIds.has(tid) || delTasks.has(tid)) continue;
        targetState.tasks.push(buildHabitTaskRow(h, dateKey));
        existingIds.add(tid);
        added++;
      }
      if (added > 0) targetState.tasks.sort(compareRank);
      return added;
    }

    function materializeDailyHabits(dateKey) {
      const dk = dateKey || toLocalDateKey();
      const added = materializeDailyHabitsInto(state, dk);
      if (added > 0) commitLocalChange();
      return added;
    }

    function computeHabitStreak(completedSet, todayKey) {
      let offset = completedSet.has(todayKey) ? 0 : -1;
      let streak = 0;
      const baseMs = noonOfDateKey(todayKey).getTime();
      while (completedSet.has(dayKeyOffset(offset, baseMs))) {
        streak++;
        offset--;
      }
      return streak;
    }

    function initializeFocus(taskId) {
      closeSheet();
      const cur = state.activeFocus;
      if (taskId && cur && cur.activeTaskId === taskId && cur.isRunning && cur.sessionStartedAt) {
        // already running: just open it (restarting would silently drop the running burst)
        playClickSound();
        setActiveView("focus");
        renderApp();
        return;
      }
      playLockSound();
      const now = Date.now();
      const af = state.activeFocus;
      let endedPrevious = false;
      if (af && af.activeTaskId && af.activeTaskId !== taskId) {
        if (af.isRunning && af.sessionStartedAt) flushActiveBurst();
        const prev = state.tasks.find(t => t.id === af.activeTaskId);
        if (prev && prev.status === "active") {
          prev.status = "queued";
          prev.updatedAt = nextStamp(prev, now);
        }
        endedPrevious = true;
      }

      let target = taskId ? state.tasks.find(t => t.id === taskId) : null;
      if (!target) {
        const todayKey = toLocalDateKey(now);
        const queued = state.tasks.filter(t => t.status === "queued" && isTaskVisibleToday(t, todayKey)).sort(compareRank);
        const questTasks = queued.filter(t => t.questId !== null);
        target = questTasks[0] || queued[0] || state.tasks.find(t => t.status === "queued");
      }
      if (!target) {
        // The previous session was already flushed: clear it so it cannot be counted twice.
        if (endedPrevious) {
          state.activeFocus = emptyFocus(nextStamp(state.activeFocus, now));
          commitLocalChange();
        }
        return;
      }

      target.status = "active";
      target.updatedAt = nextStamp(target, now);
      state.activeFocus = { activeTaskId: target.id, isRunning: true, sessionStartedAt: now, updatedAt: nextStamp(state.activeFocus, now) };
      setActiveView("focus");
      commitLocalChange();
    }

    function toggleTimerPause() {
      playClickSound();
      const af = state.activeFocus;
      if (!af || !af.activeTaskId) return;
      const now = Date.now();
      const fStamp = nextStamp(af, now);
      if (af.isRunning) {
        flushActiveBurst();
        state.activeFocus = { activeTaskId: af.activeTaskId, isRunning: false, sessionStartedAt: null, updatedAt: fStamp };
      } else {
        state.activeFocus = { activeTaskId: af.activeTaskId, isRunning: true, sessionStartedAt: now, updatedAt: fStamp };
      }
      commitLocalChange();
    }

    function returnToQueueFromFocus() {
      playClickSound();
      const af = state.activeFocus;
      const now = Date.now();
      if (af && af.activeTaskId) {
        if (af.isRunning && af.sessionStartedAt) flushActiveBurst();
        const t = state.tasks.find(x => x.id === af.activeTaskId);
        if (t && t.status === "active") {
          t.status = "queued";
          t.updatedAt = nextStamp(t, now);
        }
      }
      state.activeFocus = emptyFocus(nextStamp(state.activeFocus, now));
      setActiveView("command");
      commitLocalChange();
    }

    function completeActiveTaskAndNext() {
      playCompleteSound();
      const af = state.activeFocus;
      if (!af || !af.activeTaskId) return;
      const twoBeatScene = activeView !== "focus" ? captureTwoBeatTaskScene(af.activeTaskId) : null;
      const now = Date.now();
      const currentTask = state.tasks.find(t => t.id === af.activeTaskId);
      if (!currentTask) return;

      if (af.isRunning && af.sessionStartedAt) {
        flushActiveBurst();
      } else if ((currentTask.accumulatedSeconds || 0) === 0) {
        state.activeFocus.sessionStartedAt = now - 1000;
        state.activeFocus.isRunning = true;
        flushActiveBurst();
      }

      currentTask.status = "completed";
      currentTask.completedAt = now;
      currentTask.updatedAt = nextStamp(currentTask, now);
      justCompletedTaskId = currentTask.id;

      const todayKey = toLocalDateKey(now);
      const remaining = state.tasks.filter(t => t.status === "queued" && isTaskVisibleToday(t, todayKey)).sort(compareRank);
      const nextQuest = remaining.filter(t => t.questId !== null);
      const nextTask = nextQuest[0] || remaining[0] || null;

      const fStamp = nextStamp(state.activeFocus, now);
      state.activeFocus = emptyFocus(fStamp);
      if (activeView === "focus" && !nextTask) {
        setActiveView("command");
      }
      commitLocalChange();
      if (twoBeatScene) playTwoBeatTaskCompletion(twoBeatScene, currentTask.id);
      showToast(nextTask ? "Completed · " + shortTitle(currentTask.title) : "Completed · queue clear for today");
    }

    function prefersReducedMotionMobile() {
      try {
        return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
      } catch (e) {
        return false;
      }
    }

    // Captures pre-completion card geometry and builds an in-place visual ghost so Beat 1
    // (check fill + stroke draw + title strikethrough) runs calmly in place for 230ms before
    // Beat 2 smoothly collapses the queue and glides the completed card into Completed.
    function captureTwoBeatTaskScene(taskId) {
      const root = document.getElementById("mainContainer");
      if (!root || typeof root.animate !== "function" || prefersReducedMotionMobile()) return null;
      const allCards = Array.from(root.querySelectorAll("[data-flip-task-id]"));
      const sourceEl = allCards.find(el => el.getAttribute("data-flip-task-id") === taskId && !el.classList.contains("completed"));
      if (!sourceEl) return null;
      const rootRect = root.getBoundingClientRect();
      const sourceRect = sourceEl.getBoundingClientRect();
      if (sourceRect.width <= 0 || sourceRect.height <= 0) return null;

      const itemRects = new Map();
      const hadEmptyCard = !!root.querySelector(".empty-card");
      allCards.forEach(el => {
        const id = el.getAttribute("data-flip-task-id");
        if (!id || id === taskId) return;
        const prefix = el.classList.contains("completed") ? "done:" : "open:";
        itemRects.set(prefix + id, el.getBoundingClientRect());
      });
      root.querySelectorAll("[data-flip-key]").forEach(el => {
        const key = el.getAttribute("data-flip-key");
        if (key) itemRects.set("flow:" + key, el.getBoundingClientRect());
      });

      const taskObj = state.tasks.find(x => x.id === taskId);
      const q = taskObj ? state.quests.find(x => x.id === taskObj.questId) : null;
      const hex = ACCENT_HEX[q ? q.accentColor : "emerald"] || ACCENT_HEX.emerald;

      const ghost = sourceEl.cloneNode(true);
      ghost.removeAttribute("id");
      ghost.removeAttribute("data-flip-task-id");
      ghost.setAttribute("aria-hidden", "true");
      ghost.querySelectorAll("[id],[data-flip-task-id],[onclick]").forEach(node => {
        node.removeAttribute("id");
        node.removeAttribute("data-flip-task-id");
        node.removeAttribute("onclick");
      });
      ghost.style.position = "absolute";
      ghost.style.top = (sourceRect.top - rootRect.top) + "px";
      ghost.style.left = (sourceRect.left - rootRect.left) + "px";
      ghost.style.width = sourceRect.width + "px";
      ghost.style.margin = "0";
      ghost.style.pointerEvents = "none";
      ghost.style.zIndex = "20";

      const checkBtn = ghost.querySelector(".task-check-ring, .btn-complete-circle");
      if (checkBtn) {
        checkBtn.style.background = hex;
        checkBtn.style.borderColor = "transparent";
        checkBtn.style.color = "#05070a";
        checkBtn.style.boxShadow = "0 0 14px -2px " + hex;
        checkBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#05070a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline data-ghost-check="1" points="20 6 9 17 4 12" style="stroke-dasharray:24;stroke-dashoffset:0;"/></svg>`;
      }
      const titleEl = ghost.querySelector(".queue-item-title, .spotlight-title");
      if (titleEl) {
        titleEl.style.color = "var(--muted)";
        titleEl.style.textDecoration = "line-through";
        titleEl.style.textDecorationColor = "rgba(163, 171, 188, 0.85)";
      }
      const focusBtn = ghost.querySelector(".btn-primary-focus");
      if (focusBtn) {
        focusBtn.style.opacity = "0.4";
      }

      return { ghost, itemRects, hadEmptyCard };
    }

    function playTwoBeatTaskCompletion(scene, taskId) {
      if (!scene || !scene.ghost || prefersReducedMotionMobile()) return;
      const root = document.getElementById("mainContainer");
      if (!root || typeof root.animate !== "function") return;

      const BEAT1_MS = 230;
      const FLOW_MS = 320;
      const EASE = "cubic-bezier(0.22, 1, 0.36, 1)";
      const ghost = scene.ghost;
      root.appendChild(ghost);

      let cleaned = false;
      const removeGhost = () => {
        if (cleaned) return;
        cleaned = true;
        if (ghost.parentNode) ghost.parentNode.removeChild(ghost);
      };

      const checkBtn = ghost.querySelector(".task-check-ring, .btn-complete-circle");
      if (checkBtn && typeof checkBtn.animate === "function") {
        checkBtn.animate(
          [
            { transform: "scale(0.78)" },
            { transform: "scale(1.14)", offset: 0.6 },
            { transform: "scale(1)" }
          ],
          { duration: 210, easing: EASE }
        );
      }
      const checkPoly = ghost.querySelector("[data-ghost-check]");
      if (checkPoly && typeof checkPoly.animate === "function") {
        checkPoly.animate(
          [{ strokeDashoffset: "24" }, { strokeDashoffset: "0" }],
          { duration: 185, easing: EASE }
        );
      }

      const ghostAnim = ghost.animate(
        [
          { opacity: 1, transform: "translate3d(0, 0, 0) scale(1)", offset: 0 },
          { opacity: 1, transform: "translate3d(0, 0, 0) scale(1)", offset: 0.48 },
          { opacity: 0, transform: "translate3d(0, 12px, 0) scale(0.98)", offset: 1 }
        ],
        { duration: 480, easing: EASE, fill: "forwards" }
      );
      if (ghostAnim && typeof ghostAnim.addEventListener === "function") {
        ghostAnim.addEventListener("finish", removeGhost);
        ghostAnim.addEventListener("cancel", removeGhost);
      }
      setTimeout(removeGhost, 540);

      if (!scene.hadEmptyCard) {
        const emptyEl = root.querySelector(".empty-card");
        if (emptyEl && typeof emptyEl.animate === "function") {
          emptyEl.animate(
            [
              { opacity: 0, transform: "translate3d(0, 8px, 0)" },
              { opacity: 1, transform: "translate3d(0, 0, 0)" }
            ],
            { delay: BEAT1_MS + 10, duration: 280, easing: EASE, fill: "backwards" }
          );
        }
      }

      root.querySelectorAll("[data-flip-task-id]").forEach(el => {
        if (typeof el.animate !== "function") return;
        const id = el.getAttribute("data-flip-task-id");
        if (!id) return;
        const isDone = el.classList.contains("completed");
        if (id === taskId && isDone) {
          el.animate(
            [
              { opacity: 0, transform: "translate3d(0, -16px, 0) scale(0.985)" },
              { opacity: 1, transform: "translate3d(0, 0, 0) scale(1)" }
            ],
            { delay: BEAT1_MS + 15, duration: FLOW_MS, easing: EASE, fill: "backwards" }
          );
          return;
        }
        const first = scene.itemRects.get((isDone ? "done:" : "open:") + id);
        if (!first) return;
        const last = el.getBoundingClientRect();
        const dx = first.left - last.left;
        const dy = first.top - last.top;
        if (Math.abs(dx) < 1 && Math.abs(dy) < 1.5) return;
        el.animate(
          [
            { transform: `translate3d(${dx}px, ${dy}px, 0)` },
            { transform: "translate3d(0, 0, 0)" }
          ],
          { delay: BEAT1_MS, duration: FLOW_MS, easing: EASE, fill: "backwards" }
        );
      });

      root.querySelectorAll("[data-flip-key]").forEach(el => {
        if (typeof el.animate !== "function") return;
        const key = el.getAttribute("data-flip-key");
        if (!key) return;
        const first = scene.itemRects.get("flow:" + key);
        if (!first) {
          el.animate(
            [
              { opacity: 0, transform: "translate3d(0, 6px, 0)" },
              { opacity: 1, transform: "translate3d(0, 0, 0)" }
            ],
            { delay: BEAT1_MS + 10, duration: 260, easing: EASE, fill: "backwards" }
          );
          return;
        }
        const last = el.getBoundingClientRect();
        const dx = first.left - last.left;
        const dy = first.top - last.top;
        if (Math.abs(dx) < 1 && Math.abs(dy) < 1.5) return;
        el.animate(
          [
            { transform: `translate3d(${dx}px, ${dy}px, 0)` },
            { transform: "translate3d(0, 0, 0)" }
          ],
          { delay: BEAT1_MS, duration: FLOW_MS, easing: EASE, fill: "backwards" }
        );
      });
    }

    function captureTaskFlipRects() {
      const rects = new Map();
      const root = document.getElementById("mainContainer");
      if (!root) return rects;
      root.querySelectorAll("[data-flip-task-id]").forEach(el => {
        const id = el.getAttribute("data-flip-task-id");
        if (id) rects.set(id, el.getBoundingClientRect());
      });
      return rects;
    }

    function playTaskFlipGlide(firstRects, movedTaskId) {
      if (!firstRects || !firstRects.size || prefersReducedMotionMobile()) return;
      const root = document.getElementById("mainContainer");
      if (!root) return;
      root.querySelectorAll("[data-flip-task-id]").forEach(el => {
        if (typeof el.animate !== "function") return;
        const id = el.getAttribute("data-flip-task-id");
        const isMoved = id === movedTaskId;
        if (isMoved) {
          el.animate(
            [
              { opacity: 0, transform: "translate3d(0, 12px, 0) scale(0.985)" },
              { opacity: 1, transform: "translate3d(0, 0, 0) scale(1)" }
            ],
            { duration: 280, easing: "cubic-bezier(0.22, 1, 0.36, 1)" }
          );
          return;
        }
        const first = id ? firstRects.get(id) : null;
        if (!first) return;
        const last = el.getBoundingClientRect();
        const dx = first.left - last.left;
        const dy = first.top - last.top;
        if (Math.abs(dx) < 1 && Math.abs(dy) < 2) return;
        el.animate(
          [
            { transform: `translate3d(${dx}px, ${dy}px, 0)` },
            { transform: "translate3d(0, 0, 0)" }
          ],
          { duration: 280, easing: "cubic-bezier(0.22, 1, 0.36, 1)" }
        );
      });
    }

    function completeTaskDirect(taskId) {
      closeSheet();
      if (state.activeFocus && state.activeFocus.activeTaskId === taskId) {
        completeActiveTaskAndNext();
        return;
      }
      playCompleteSound();
      const twoBeatScene = captureTwoBeatTaskScene(taskId);
      const now = Date.now();
      const t = state.tasks.find(x => x.id === taskId);
      if (!t) return;
      const prev = { status: t.status, completedAt: t.completedAt };
      t.status = "completed";
      t.completedAt = now;
      t.updatedAt = nextStamp(t, now);
      justCompletedTaskId = taskId;
      commitLocalChange();
      if (twoBeatScene) playTwoBeatTaskCompletion(twoBeatScene, taskId);
      // Undo is a new edit (newer updatedAt), so it also wins if the completion already synced.
      showToast("Completed · " + shortTitle(t.title), { undo: () => undoCompleteTask(taskId, now, prev) });
    }

    function undoCompleteTask(taskId, completedAt, prev) {
      const t = state.tasks.find(x => x.id === taskId);
      if (!t || t.status !== "completed" || t.completedAt !== completedAt) return; // changed since
      const firstRects = captureTaskFlipRects();
      t.status = prev.status && prev.status !== "completed" ? prev.status : "queued";
      if (prev.completedAt === undefined || prev.completedAt === null) delete t.completedAt;
      else t.completedAt = prev.completedAt;
      t.updatedAt = nextStamp(t);
      commitLocalChange();
      playTaskFlipGlide(firstRects, taskId);
    }

    function reopenTaskDirect(taskId) {
      playClickSound();
      const firstRects = captureTaskFlipRects();
      const now = Date.now();
      const t = state.tasks.find(x => x.id === taskId);
      if (!t) return;
      t.status = "queued";
      t.completedAt = undefined;
      t.updatedAt = nextStamp(t, now);
      commitLocalChange();
      playTaskFlipGlide(firstRects, taskId);
    }

    // Only the moved task changes (rank above the current top): a reorder never overrides edits or
    // completions the laptop made to other tasks.
    function promoteTaskToTop(taskId) {
      closeSheet();
      playClickSound();
      const pending = state.tasks.filter(t => t.status === "queued" || t.status === "active").sort(compareRank);
      const idx = pending.findIndex(t => t.id === taskId);
      if (idx <= 0) return;
      const moved = pending[idx];
      moved.rank = (Number(pending[0].rank) || 0) - 1000;
      moved.updatedAt = nextStamp(moved);
      commitLocalChange();
    }

    // Deletes write the tombstone immediately; Undo restores the exact previous objects and removes the
    // tombstone through the normal commit path (the hold keeps the tombstone on the phone meanwhile).
    function deleteTaskItem(taskId) {
      closeSheet();
      playClickSound();
      const task = state.tasks.find(t => t.id === taskId);
      if (!task) return;
      const deletedAt = Date.now();
      const removed = cloneJson(task);
      const prevFocus = cloneJson(state.activeFocus);
      const hadTombstone = asArray(state.deletedTaskIds).includes(taskId);
      if (!state.deletedTaskIds) state.deletedTaskIds = [];
      if (!hadTombstone) state.deletedTaskIds.push(taskId);
      state.tasks = state.tasks.filter(t => t.id !== taskId);
      let focusAfter = null;
      if (state.activeFocus && state.activeFocus.activeTaskId === taskId) {
        state.activeFocus = emptyFocus(nextStamp(state.activeFocus, deletedAt));
        focusAfter = JSON.stringify(state.activeFocus);
      }
      commitLocalChange();
      showToast("Deleted · " + shortTitle(removed.title), {
        holdSync: !hadTombstone,
        undo: () => undoDeleteTask(removed, hadTombstone, prevFocus, focusAfter, deletedAt)
      });
    }

    // Restores the task. If focus is still where the delete left it, its running session comes back
    // too. If focus moved on meanwhile, the task returns to the queue (R6 stamp) and the session it was
    // running in is logged up to the delete time (R3 id + dedupe), so that time is not lost.
    function undoDeleteTask(removed, hadTombstone, prevFocus, focusAfter, deletedAt) {
      if (state.tasks.some(t => t.id === removed.id)) return;
      if (!hadTombstone) state.deletedTaskIds = asArray(state.deletedTaskIds).filter(id => id !== removed.id);
      state.tasks.push(removed);
      if (focusAfter && JSON.stringify(state.activeFocus) === focusAfter) {
        // a new edit (R6): it also wins if the cleared focus already synced
        state.activeFocus = { ...prevFocus, updatedAt: nextStamp(state.activeFocus) };
      } else {
        const now = Date.now();
        if (focusAfter && isRunningSession(prevFocus) && prevFocus.activeTaskId === removed.id) {
          flushActiveBurst(Number.isFinite(deletedAt) ? deletedAt : now, prevFocus);
          state.timeLogs.sort((a, b) => (b.startTime || 0) - (a.startTime || 0));
        }
        const cur = state.activeFocus;
        if (removed.status === "active" && !(cur && cur.activeTaskId === removed.id)) {
          removed.status = "queued";
          removed.updatedAt = nextStamp(removed, now);
        }
      }
      state.tasks.sort(compareRank);
      commitLocalChange();
    }

    function deleteLogItem(logId) {
      playClickSound();
      const log = state.timeLogs.find(l => l.id === logId);
      if (!log) return;
      const removed = cloneJson(log);
      const hadTombstone = asArray(state.deletedLogIds).includes(logId);
      if (!state.deletedLogIds) state.deletedLogIds = [];
      if (!hadTombstone) state.deletedLogIds.push(logId);
      state.timeLogs = state.timeLogs.filter(l => l.id !== logId);
      commitLocalChange();
      showToast("Session deleted · " + shortTitle(removed.taskTitleSnapshot), {
        holdSync: !hadTombstone,
        undo: () => undoDeleteLog(removed, hadTombstone)
      });
    }

    function undoDeleteLog(removed, hadTombstone) {
      if (state.timeLogs.some(l => l.id === removed.id)) return;
      if (!hadTombstone) state.deletedLogIds = asArray(state.deletedLogIds).filter(id => id !== removed.id);
      state.timeLogs.push(removed);
      state.timeLogs.sort((a, b) => (b.startTime || 0) - (a.startTime || 0));
      commitLocalChange();
    }

    // =========================================================================
    // SLIDE-UP BOTTOM SHEETS (New Task Composer, Task Inspector, Quest Editor)
    // =========================================================================
    function isSheetOpen() {
      const sc = document.getElementById("sheetContainer");
      return !!sc && sc.style.display !== "none" && sc.style.display !== "";
    }

    // Closing DISCARDS the sheet's DOM, so the next sheet never reads a previous form's stale inputs
    // (Edit Quest showing/saving another quest's values, New Task re-opening with the last task).
    // discardDraft: the × button of New Task drops the unsent text; Back / backdrop keep it as a draft.
    // Typed text is never dropped silently: New Quest / Edit Quest dismissed with changes (Back,
    // backdrop, Escape, ×) and New Task closed with × while it has text show a toast whose Restore
    // brings the sheet back as it was. Saving, creating or deleting clears the form first (no toast).
    function closeSheet(discardDraft) {
      const sc = document.getElementById("sheetContainer");
      if (!sc) return;
      // Blur first so a pending onchange (Task Options title / notes) commits before the sheet goes away.
      const el = document.activeElement;
      if (el && el !== document.body && sc.contains(el) && typeof el.blur === "function") el.blur();
      let restore = discardedQuestForm();
      if (sc.dataset.sheet === "newTask") {
        captureComposerDraft();
        if (discardDraft === true && composerDraft) {
          restore = draftRestoreOffer(composerDraft, composerDateKey);
          composerDraft = null;
        }
        storeComposerDraft();
      }
      sc.style.display = "none";
      sc.innerHTML = "";
      delete sc.dataset.sheet;
      ["topHeader", "mainContainer", "fabBtn", "bottomNav"].forEach(id => {
        const bgEl = document.getElementById(id);
        if (bgEl) bgEl.removeAttribute("inert");
      });
      if (document.body) document.body.classList.remove("sheet-open");
      if (restore) showToast(restore.message, { actionLabel: "Restore", undo: restore.undo });
    }

    // Opens (or swaps) the sheet. Only a sheet that was closed glides up; swapping content in an open
    // sheet does not replay the animation.
    function showSheet(kind, innerHtml) {
      const sc = document.getElementById("sheetContainer");
      if (!sc) return null;
      const wasOpen = isSheetOpen();
      if (wasOpen && sc.dataset.sheet === "newTask" && kind !== "newTask") {
        captureComposerDraft();
        storeComposerDraft();
      }
      sc.dataset.sheet = kind;
      sc.style.display = "flex";
      sc.innerHTML = `<div class="bottom-sheet${wasOpen ? "" : " entering"}" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">${innerHtml}</div>`;
      ["topHeader", "mainContainer", "fabBtn", "bottomNav"].forEach(id => {
        const bgEl = document.getElementById(id);
        if (bgEl) bgEl.setAttribute("inert", "");
      });
      if (document.body) document.body.classList.add("sheet-open");
      return sc;
    }

    // discardDraftOnClose: × of the New Task sheet drops the unsent text (closeSheet(true)).
    function sheetHeaderHtml(title, discardDraftOnClose) {
      const closeArg = discardDraftOnClose ? "true" : "";
      return `
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="sheet-head">
          <h3 id="sheetTitle" class="sheet-title">${title}</h3>
          <button class="sheet-close" onclick="closeSheet(${closeArg})" aria-label="Close">×</button>
        </div>`;
    }

    // Pill groups update in place (no re-render: the sheet stays put and the keyboard stays open).
    function selectPill(btn) {
      if (!btn || !btn.parentElement) return;
      btn.parentElement.querySelectorAll(".sheet-pill").forEach(b => {
        const on = b === btn;
        b.classList.toggle("selected", on);
        b.setAttribute("aria-pressed", on ? "true" : "false");
      });
    }
