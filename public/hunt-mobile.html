        id: "hab-" + now + "-" + Math.random().toString(36).slice(2, 6),
        title,
        notes: nEl ? nEl.value.trim() : "",
        questId: selectedHabitQuestId || null,
        rank,
        createdAt: now,
        updatedAt: now
      };
      const firstRects = captureTaskFlipRects();
      if (!state.habits) state.habits = [];
      state.habits.push(habit);
      const todayKey = toLocalDateKey(now);
      materializeDailyHabitsInto(state, todayKey);
      closeSheet();
      commitLocalChange();
      playTaskFlipGlide(firstRects, habitTaskId(habit.id, todayKey));
      showToast("Habit added · " + shortTitle(title));
    }

    function openHabitEditorSheet(habitId) {
      playClickSound();
      const h = asArray(state.habits).find(x => x.id === habitId);
      if (!h) return;
      selectedHabitQuestId = h.questId || null;

      showSheet("habit:" + h.id, `
          ${sheetHeaderHtml("Edit Daily Habit")}

          <input id="editHabitTitleInput" class="sheet-input" value="${escapeHtml(h.title)}" aria-label="Habit title" enterkeyhint="done" onkeydown="if(isSubmitKey(event)) saveHabitEdits(${jsArg(h.id)})" />
          <textarea id="editHabitNotesInput" class="sheet-input" rows="2" placeholder="Optional default notes..." aria-label="Habit notes">${escapeHtml(h.notes || "")}</textarea>

          <div class="sheet-label">Assigned Quest</div>
          <div class="sheet-pill-group" role="group" aria-label="Habit quest">
            ${activeQuestsList().map(q => `
              <button class="sheet-pill ${selectedHabitQuestId === q.id ? 'selected' : ''}" aria-pressed="${selectedHabitQuestId === q.id}" onclick="selectPill(this);selectedHabitQuestId=${jsArg(q.id)};">
                <span style="width:8px;height:8px;border-radius:50%;background:${ACCENT_HEX[q.accentColor] || ACCENT_HEX.slate};"></span>
                <span>${escapeHtml(q.title)}</span>
              </button>
            `).join("")}
            <button class="sheet-pill ${selectedHabitQuestId === null ? 'selected' : ''}" aria-pressed="${selectedHabitQuestId === null}" onclick="selectPill(this);selectedHabitQuestId=null;">
              <span style="width:8px;height:8px;border-radius:50%;background:var(--slate);"></span>
              <span>Other work</span>
            </button>
          </div>

          <div class="sheet-footer-row" style="margin-top:8px;">
            <button class="danger-outline-btn" onclick="deleteHabitItem(${jsArg(h.id)})">Delete Habit</button>
            <button class="pressable" onclick="saveHabitEdits(${jsArg(h.id)})" style="height:var(--touch-min);padding:0 22px;border-radius:12px;border:none;background:white;color:#05070a;font-family:var(--font-display);font-weight:700;font-size:13px;cursor:pointer;">Save</button>
          </div>
      `);
    }

    function saveHabitEdits(habitId) {
      const h = asArray(state.habits).find(x => x.id === habitId);
      if (!h) { closeSheet(); return; }
      const tEl = document.getElementById("editHabitTitleInput");
      const nEl = document.getElementById("editHabitNotesInput");
      const title = tEl ? tEl.value.trim().slice(0, 300) : "";
      if (!title) {
        if (tEl) { tEl.focus(); tEl.style.borderColor = "var(--rose)"; }
        return;
      }
      playClickSound();
      const prevNotes = h.notes || "";
      const nextNotes = nEl ? nEl.value.trim() : prevNotes;
      const nextQuestId = selectedHabitQuestId || null;
      const before = JSON.stringify(h);
      h.title = title;
      h.notes = nextNotes;
      h.questId = nextQuestId;
      closeSheet();
      if (JSON.stringify(h) === before) return;
      const now = Date.now();
      h.updatedAt = nextStamp(h, now);
      // Keep today's open materialized task aligned.
      const todayTask = state.tasks.find(t => t.id === habitTaskId(h.id, toLocalDateKey(now)));
      if (todayTask && (todayTask.status === "queued" || todayTask.status === "active")) {
        todayTask.title = h.title;
        todayTask.questId = h.questId;
        if ((todayTask.notes || "") === prevNotes) todayTask.notes = h.notes;
        todayTask.updatedAt = nextStamp(todayTask, now);
      }
      commitLocalChange();
      showToast("Habit saved");
    }

    function deleteHabitItem(habitId) {
      playClickSound();
      const h = asArray(state.habits).find(x => x.id === habitId);
      if (!h) { closeSheet(); return; }
      const removed = cloneJson(h);
      const hadHabitTomb = asArray(state.deletedHabitIds).includes(habitId);
      if (!state.deletedHabitIds) state.deletedHabitIds = [];
      if (!hadHabitTomb) state.deletedHabitIds.push(habitId);
      state.habits = asArray(state.habits).filter(x => x.id !== habitId);

      const todayTid = habitTaskId(habitId, toLocalDateKey());
      const todayTask = state.tasks.find(t => t.id === todayTid);
      let removedTask = null;
      let hadTaskTomb = false;
      if (todayTask && todayTask.status === "queued" && (todayTask.accumulatedSeconds || 0) === 0) {
        removedTask = cloneJson(todayTask);
        hadTaskTomb = asArray(state.deletedTaskIds).includes(todayTid);
        if (!state.deletedTaskIds) state.deletedTaskIds = [];
        if (!hadTaskTomb) state.deletedTaskIds.push(todayTid);
        state.tasks = state.tasks.filter(t => t.id !== todayTid);
      }
      closeSheet();
      commitLocalChange();
      showToast("Habit deleted · " + shortTitle(removed.title), {
        holdSync: !hadHabitTomb,
        undo: () => undoDeleteHabit(removed, hadHabitTomb, removedTask, hadTaskTomb)
      });
    }

    function undoDeleteHabit(removed, hadHabitTomb, removedTask, hadTaskTomb) {
      if (asArray(state.habits).some(x => x.id === removed.id)) return;
      if (!hadHabitTomb) state.deletedHabitIds = asArray(state.deletedHabitIds).filter(id => id !== removed.id);
      if (!state.habits) state.habits = [];
      state.habits.push(removed);
      state.habits.sort(compareRank);
      if (removedTask && !state.tasks.some(t => t.id === removedTask.id)) {
        if (!hadTaskTomb) state.deletedTaskIds = asArray(state.deletedTaskIds).filter(id => id !== removedTask.id);
        state.tasks.push(removedTask);
        state.tasks.sort(compareRank);
      }
      commitLocalChange();
    }

    function toggleHabitToday(habitId) {
      const todayKey = toLocalDateKey();
      const tid = habitTaskId(habitId, todayKey);
      let t = state.tasks.find(x => x.id === tid);
      if (!t) {
        // Re-materialize if needed (even if user had dismissed today's copy earlier).
        const h = asArray(state.habits).find(x => x.id === habitId);
        if (!h) return;
        state.deletedTaskIds = asArray(state.deletedTaskIds).filter(id => id !== tid);
        t = buildHabitTaskRow(h, todayKey);
        state.tasks.push(t);
        state.tasks.sort(compareRank);
      }
      if (t.status === "completed") reopenTaskDirect(t.id);
      else completeTaskDirect(t.id);
    }

    function focusHabitToday(habitId) {
      const todayKey = toLocalDateKey();
      const tid = habitTaskId(habitId, todayKey);
      let t = state.tasks.find(x => x.id === tid);
      if (!t) {
        const h = asArray(state.habits).find(x => x.id === habitId);
        if (!h) return;
        state.deletedTaskIds = asArray(state.deletedTaskIds).filter(id => id !== tid);
        t = buildHabitTaskRow(h, todayKey);
        state.tasks.push(t);
        state.tasks.sort(compareRank);
      }
      if (t.status === "completed") reopenTaskDirect(t.id);
      initializeFocus(t.id);
    }

    // Render Compact Queue Row Card (#02+)
    function renderCompactQueueCard(task) {
      const q = state.quests.find(x => x.id === task.questId);
      const hex = ACCENT_HEX[q ? q.accentColor : "slate"];
      const af = state.activeFocus;
      const isRunningHere = af && af.activeTaskId === task.id && af.isRunning;
      const delta = isRunningHere && af.sessionStartedAt ? Math.max(0, Math.floor((Date.now() - af.sessionStartedAt) / 1000)) : 0;
      const totalSec = (task.accumulatedSeconds || 0) + delta;
      const title = escapeHtml(task.title);

      return `
        <div class="queue-item-card" data-flip-task-id="${escapeHtml(task.id)}">
          <div class="card-edge-bar" style="background:${hex};"></div>

          <button class="task-check-ring" onclick="completeTaskDirect(${jsArg(task.id)})" aria-label="Complete ${title}">
            ${SVG_CHECK}
          </button>

          <div class="queue-item-body" role="button" onclick="initializeFocus(${jsArg(task.id)})">
            <div class="queue-item-title">${title}</div>
            ${task.notes ? `<div style="font-size:12px;color:var(--dim);margin-top:3px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(task.notes)}</div>` : ""}
            <div class="queue-item-sub">
              <span style="display:inline-flex;align-items:center;gap:5px;min-width:0;max-width:100%;">
                <span style="width:6px;height:6px;border-radius:50%;background:${hex};flex-shrink:0;"></span>
                <span class="quest-label-ellipsis">${escapeHtml(q ? q.title : "Other work")}</span>
              </span>
              ${task.habitId ? `<span style="font-size:10px;color:var(--dim);padding:1px 6px;border-radius:999px;border:1px solid var(--border);flex-shrink:0;">Daily</span>` : ""}
            </div>
          </div>

          <div class="queue-item-right">
            <button class="mini-play-btn" onclick="initializeFocus(${jsArg(task.id)})" aria-label="${isRunningHere ? "Open focus on" : "Start focus on"} ${title}">
              ${totalSec > 0 || isRunningHere ? `<span data-task-timer="${escapeHtml(task.id)}" data-prefix="">${formatChrono(totalSec)}</span>` : ""}
              ${SVG_PLAY}
            </button>
            <button class="more-dots-btn" onclick="openTaskInspectorSheet(${jsArg(task.id)})" aria-label="Task options for ${title}">
              ${SVG_MORE}
            </button>
          </div>
        </div>
      `;
    }

    function renderCompletedCard(t, showTime) {
      const q = state.quests.find(x => x.id === t.questId);
      const hex = ACCENT_HEX[q ? q.accentColor : "slate"] || ACCENT_HEX.slate;
      const fresh = justCompletedTaskId === t.id;
      if (fresh) justCompletedTaskId = null;
      const title = escapeHtml(t.title);
      return `
        <div class="queue-item-card completed${fresh ? " just-completed" : ""}" data-flip-task-id="${escapeHtml(t.id)}">
          <div class="card-edge-bar" style="background:${hex};"></div>
          <button class="task-check-ring done" style="background:${hex};" onclick="reopenTaskDirect(${jsArg(t.id)})" aria-label="Reopen ${title}">${SVG_CHECK}</button>
          <div class="queue-item-body">
            <div class="queue-item-title" style="text-decoration:line-through;color:var(--muted);">${title}</div>
            <div class="queue-item-sub">
              <span class="quest-label-ellipsis">${escapeHtml(q ? q.title : "Other work")}</span>
              ${showTime && t.accumulatedSeconds > 0 ? `<span style="font-family:var(--font-mono);flex-shrink:0;font-variant-numeric:tabular-nums;">· ${formatChrono(t.accumulatedSeconds)}</span>` : ""}
            </div>
          </div>
          <button class="completed-delete-btn" onclick="deleteTaskItem(${jsArg(t.id)})" aria-label="Delete completed task ${title}">${SVG_TRASH}</button>
        </div>
      `;
    }

    // actions[].onclick is handler code written in this file; any data inside it is passed via jsArg().
    function emptyCardHtml(title, sub, actions) {
      return `
        <div class="empty-card">
          <div class="empty-title">${escapeHtml(title)}</div>
          ${sub ? `<p class="empty-sub">${escapeHtml(sub)}</p>` : ""}

    function evaluateGuideTaskDraft(title, notes) {
      const trimmed = typeof title === "string" ? title.trim() : "";
      const trimmedNotes = typeof notes === "string" ? notes.trim() : "";
      if (!trimmed) {
        return { verdict: "empty", score: 0, maxScore: 8, summary: "Type a task draft or tap an example to get instant science feedback.", checks: [] };
      }
      const sample = trimmed.slice(0, 1000);
      const words = sample.split(/\s+/).filter(Boolean);
      const lower = sample.toLowerCase();
      const firstToken = (words[0] || "").replace(/^[^A-Za-z0-9\u00C0-\u024F]+|[^A-Za-z0-9\u00C0-\u024F]+$/g, "").toLowerCase();
      const startsVague = GUIDE_VAGUE_STARTERS.some(p => lower === p.trim() || lower.startsWith(p));
      let verbCheck;
      if (startsVague) {
        verbCheck = { id: "verb", label: "Concrete starting verb", status: "fail", principle: "Implementation Intentions", detail: "Starts with a vague filler phrase. Replace it with a physical verb (Draft, Sketch, Implement, Run)." };
      } else if (GUIDE_CONCRETE_VERBS.has(firstToken)) {
        verbCheck = { id: "verb", label: "Concrete starting verb", status: "pass", principle: "Implementation Intentions", detail: 'Opens with an observable action ("' + words[0] + '"), removing initiation friction.' };
      } else if (firstToken && !/^[a-z]+$/.test(firstToken)) {
        verbCheck = { id: "verb", label: "Concrete starting verb", status: words.length >= 3 ? "pass" : "warn", principle: "Implementation Intentions", detail: words.length >= 3 ? "Multi-word phrasing — make sure it opens with a concrete physical action." : "Add a concrete starting verb so the first 30 seconds are clear." };
      } else {
        verbCheck = { id: "verb", label: "Concrete starting verb", status: "fail", principle: "Implementation Intentions", detail: "Reads like a topic/noun. Start with a concrete verb (Draft, Build, Fix, Review, Run)." };
      }

      let specCheck;
      if (words.length < 3) {
        specCheck = { id: "spec", label: "Specific next step", status: "fail", principle: "Goal Specificity", detail: "Too brief — name the specific section, artifact, or route." };
      } else if (trimmed.length > 120 || words.length > 20) {
        specCheck = { id: "spec", label: "Specific next step", status: "warn", principle: "Cognitive Load", detail: "Keep the title punchy and move supporting details into Notes." };
      } else {
        specCheck = { id: "spec", label: "Specific next step", status: "pass", principle: "Goal Specificity", detail: "Specific enough to act on immediately without re-planning." };
      }

      const bundles = (lower.match(/\band\b|&|;/g) || []).length;
      const oversized = GUIDE_OVERSIZED.some(p => lower.includes(p));
      let sizeCheck;
      if (oversized || bundles >= 2) {
        sizeCheck = { id: "size", label: "Single-sitting size (20–90m)", status: "fail", principle: "Zeigarnik Effect", detail: "Looks like a bundled mini-project. Split into single-sitting tasks." };
      } else if (bundles === 1 && words.length > 10) {
        sizeCheck = { id: "size", label: "Single-sitting size (20–90m)", status: "warn", principle: "Zeigarnik Effect", detail: "Two joined clauses — verify both fit inside one 20–90 min bout." };
      } else {
        sizeCheck = { id: "size", label: "Single-sitting size (20–90m)", status: "pass", principle: "Zeigarnik Effect", detail: "Focused on one cohesive action rather than a multi-day project." };
      }

      const hasQty = /\b\d+\b/.test(lower);
      const hasBound = /\b(intro|section|chapter|draft|wireframe|prototype|tests?|bug|fix|page|email|km|miles?|minutes?|min|hours?|summary|outline|notes|checklist|pr|review|v1)\b/.test(lower);
      let doneCheck;
      if (trimmedNotes.length >= 12 || (hasQty && words.length >= 3)) {
        doneCheck = { id: "done", label: "Clear finish line", status: "pass", principle: "Progress Principle", detail: trimmedNotes.length >= 12 ? "Clear completion criteria captured in Notes." : "Measurable boundary gives a clean completion signal." };
      } else if (hasBound && words.length >= 4) {
        doneCheck = { id: "done", label: "Clear finish line", status: "pass", principle: "Progress Principle", detail: "Names a concrete deliverable you can cleanly check off." };
      } else {
        doneCheck = { id: "done", label: "Clear finish line", status: "warn", principle: "Progress Principle", detail: "Add a quantity (e.g., '3 wireframes', '500 words') or a 1-line Definition of Done in Notes." };
      }

      const checks = [verbCheck, specCheck, sizeCheck, doneCheck];
      const score = checks.reduce((acc, c) => acc + (c.status === "pass" ? 2 : c.status === "warn" ? 1 : 0), 0);
      const verdict = score >= 7 ? "strong" : score >= 4 ? "fair" : "weak";
      const summary = verdict === "strong" ? "Ready for Focus — clear action, realistic scope, and a clean finish line."
        : verdict === "fair" ? "Good start — tighten the highlighted items so starting feels effortless."
        : "Too ambiguous or oversized — sharpen the starting verb and narrow it to one sitting.";
      return { verdict, score, maxScore: 8, summary, checks };
    }

    function evaluateGuideQuestDraft(title, desc, hoursVal, existingCount, existingHours) {
      const trimmed = typeof title === "string" ? title.trim() : "";
      const trimmedDesc = typeof desc === "string" ? desc.trim() : "";
      if (!trimmed) {
        return { verdict: "empty", score: 0, maxScore: 8, summary: "Draft a Quest title, purpose, and weekly hours to test its design.", checks: [] };
      }
      const sample = trimmed.slice(0, 1000);
      const words = sample.split(/\s+/).filter(Boolean);
      const lower = sample.toLowerCase();
      const hrs = Number(hoursVal);
      const exCnt = Number.isFinite(existingCount) ? Math.max(0, Math.floor(existingCount)) : 0;
      const exHrs = Number.isFinite(existingHours) ? Math.max(0, existingHours) : 0;
      const totalCnt = exCnt + 1;

      const capCheck = totalCnt <= 3
        ? { id: "cap", label: "Goal shielding (1–3 Quests)", status: "pass", principle: "Goal Shielding", detail: "Fits the 1–3 active Quest sweet spot (" + totalCnt + " total)." }
        : totalCnt === 4
        ? { id: "cap", label: "Goal shielding (1–3 Quests)", status: "warn", principle: "Goal Shielding", detail: "You already have 3 active Quests — adding a 4th can dilute attention." }
        : { id: "cap", label: "Goal shielding (1–3 Quests)", status: "fail", principle: "Goal Shielding", detail: totalCnt + " active Quests exceeds working-memory limits. Retire one first." };

      let hoursCheck;
      if (!Number.isFinite(hrs) || hrs < 1) {
        hoursCheck = { id: "hrs", label: "Calibrated weekly input", status: "fail", principle: "Planning Fallacy", detail: "Set a realistic weekly target of at least 1 hour." };
      } else {
        const proj = exHrs + hrs;
        if (hrs <= 20 && proj <= 30) {
          hoursCheck = { id: "hrs", label: "Calibrated weekly input", status: "pass", principle: "Goal-Setting Theory", detail: hrs + " h/wk (" + proj.toFixed(0) + " h/wk total) sits in a sustainable range." };
        } else if (hrs <= 30 && proj <= 40) {
          hoursCheck = { id: "hrs", label: "Calibrated weekly input", status: "warn", principle: "Planning Fallacy", detail: proj.toFixed(0) + " h/wk combined deep work is ambitious — leave room for Other work." };
        } else {
          hoursCheck = { id: "hrs", label: "Calibrated weekly input", status: "fail", principle: "Planning Fallacy", detail: hrs + " h/wk (" + proj.toFixed(0) + " h/wk total) risks chronic missed targets. Lower to a steady pace." };
        }
      }

      const isWish = GUIDE_WISH_STARTERS.some(p => lower.startsWith(p));
      const idCheck = isWish
        ? { id: "id", label: "Actionable Quest identity", status: "fail", principle: "Process vs. Outcome", detail: "Phrased as an abstract wish. Frame it around a concrete craft or pursuit." }
        : words.length < 2
        ? { id: "id", label: "Actionable Quest identity", status: "warn", principle: "Goal Specificity", detail: "Give it a vivid 2–6 word mission name instead of a single generic word." }
        : trimmed.length > 70
        ? { id: "id", label: "Actionable Quest identity", status: "warn", principle: "Cognitive Load", detail: "Trim the title to a crisp headline and put details in Description." }
        : { id: "id", label: "Actionable Quest identity", status: "pass", principle: "Goal Specificity", detail: "Memorable, concrete mission title that anchors daily tasks." };

      const purposeCheck = trimmedDesc.length >= 24
        ? { id: "why", label: "Intrinsic purpose & scope", status: "pass", principle: "Self-Determination Theory", detail: "Clearly states what moves this Quest forward and why it matters." }
        : trimmedDesc.length > 0
        ? { id: "why", label: "Intrinsic purpose & scope", status: "warn", principle: "Self-Determination Theory", detail: "Add a bit more context on what work counts and why it matters to you." }
        : { id: "why", label: "Intrinsic purpose & scope", status: "fail", principle: "Self-Determination Theory", detail: "Missing description — stating why it matters sustains follow-through." };

      const checks = [capCheck, hoursCheck, idCheck, purposeCheck];
      const score = checks.reduce((acc, c) => acc + (c.status === "pass" ? 2 : c.status === "warn" ? 1 : 0), 0);
      const verdict = score >= 7 ? "strong" : score >= 4 ? "fair" : "weak";
      const summary = verdict === "strong" ? "Well-calibrated Quest — focused scope, realistic budget, and clear purpose."
        : verdict === "fair" ? "Solid foundation — review the tips below so this Quest sticks long-term."
        : "High risk of friction or burnout — narrow scope, calibrate hours, and state why it matters.";
      return { verdict, score, maxScore: 8, summary, checks };
    }

    function auditGuideWorkspace() {
      const activeQuests = state.quests.filter(q => !q.archived);
      const activeQuestCount = activeQuests.length;
      const weeklyBudgetHours = Number(activeQuests.reduce((a, q) => {
        const n = Number(q.targetWeeklyHours);
        return a + (Number.isFinite(n) ? Math.max(0, n) : 0);
      }, 0).toFixed(1));
      const openTasks = state.tasks.filter(t => t.status === "queued" || t.status === "active");
      let strongCount = 0;
      const tasksToSharpen = [];
      for (const t of openTasks) {
        const ev = evaluateGuideTaskDraft(t.title, t.notes);
        if (ev.verdict === "strong") {
          strongCount++;
        } else if (ev.verdict !== "empty" && tasksToSharpen.length < 5) {
          const issue = ev.checks.find(c => c.status === "fail") || ev.checks.find(c => c.status === "warn");
          if (issue) tasksToSharpen.push({ id: t.id, title: t.title, tip: issue.detail });
        }
      }
      const clarityPct = openTasks.length > 0 ? Math.round((strongCount / openTasks.length) * 100) : 100;
      return { activeQuestCount, weeklyBudgetHours, openTaskCount: openTasks.length, strongCount, clarityPct, tasksToSharpen };
    }

          ${audit.tasksToSharpen.length > 0 ? `
            <div class="guide-principle-card">

              <button class="seg-option ${guideLabMode === "quest" ? "active" : ""}" aria-pressed="${guideLabMode === "quest"}" onclick="playClickSound();guideLabMode='quest';renderApp();">Test a Quest</button>

            <div class="sheet-pill-group" style="margin-bottom:14px;">
              ${(guideLabMode === "task" ? GUIDE_TASK_PRESETS : GUIDE_QUEST_PRESETS).map(p => `

              `).join("")}
            </div>

            <div class="guide-workshop-split">
              <div>
            ${guideLabMode === "task" ? `
              <label class="sheet-label" for="guideTaskTitleInput">Task Title</label>
              <input id="guideTaskTitleInput" class="sheet-input" placeholder="e.g. Draft 400 words for essay #4" value="${escapeHtml(guideTaskTitle)}" enterkeyhint="done" oninput="guideTaskTitle=this.value;updateGuideEvalLive();" onkeydown="if(isSubmitKey(event)) saveGuideTask();" />

              <label class="sheet-label" for="guideTaskNotesInput">Definition of Done (Optional Notes)</label>
              <textarea id="guideTaskNotesInput" class="sheet-input" rows="2" placeholder="What does finished look like for this bout?" oninput="guideTaskNotes=this.value;updateGuideEvalLive();">${escapeHtml(guideTaskNotes)}</textarea>

              <div class="sheet-label">Assign to Quest</div>
              <div class="sheet-pill-group" role="group" aria-label="Assign to Quest" style="margin-bottom:14px;">
                ${activeQuestsList().map(q => {
                  const sel = chosenQuestId === q.id;
                  const hex = ACCENT_HEX[q.accentColor] || ACCENT_HEX.slate;
                  return `<button class="sheet-pill ${sel ? "selected" : ""}" aria-pressed="${sel}" onclick="playClickSound();guideTaskQuestId=${jsArg(q.id)};renderApp();"><span style="width:8px;height:8px;border-radius:50%;background:${hex};flex-shrink:0;"></span><span>${escapeHtml(q.title)}</span></button>`;
                }).join("")}
                <button class="sheet-pill ${chosenQuestId === null ? "selected" : ""}" aria-pressed="${chosenQuestId === null}" onclick="playClickSound();guideTaskQuestId=null;renderApp();"><span style="width:8px;height:8px;border-radius:50%;background:var(--slate);flex-shrink:0;"></span><span>Other</span></button>
              </div>

              <button class="guide-action-btn pressable" onclick="saveGuideTask()">+ Add to Today's Queue</button>

              <label class="sheet-label" for="guideQuestTitleInput">Quest Title</label>

              <label class="sheet-label" for="guideQuestDescInput">Why it matters &amp; what moves it forward</label>

              <input id="guideQuestHoursInput" type="number" inputmode="numeric" min="1" max="100" class="sheet-input" value="${escapeHtml(guideQuestHours)}" enterkeyhint="done" oninput="guideQuestHours=this.value;updateGuideEvalLive();" onkeydown="if(isSubmitKey(event)) saveGuideQuest();" />

              <div class="sheet-label">Accent Color</div>

          <button class="sync-chip pressable" onclick="switchView(${jsArg(guideReturnView || "quests")})">← Back</button>
        </div>

    // Main Render Engine
    function renderApp() {
      renderCount++;
      renderWaitingForBlur = false;
      renderWaitingForGesture = false;
      flushFieldDrafts(); // typed-but-uncommitted text must not be replaced by the stored value
      const activeQuests = activeQuestsList();
      if (filterQuestId !== "ALL" && !activeQuests.some(q => q.id === filterQuestId)) filterQuestId = "ALL";
      updateMuteIcon();
      updateHeaderStatus();
      appVersionLabel();
      const topHeader = document.getElementById("topHeader");
      const fabBtn = document.getElementById("fabBtn");
      const container = document.getElementById("mainContainer");
      const now = Date.now();
      const todayKey = toLocalDateKey(now);
      lastRenderedDateKey = todayKey;
      const prevStrip = container.querySelector(".chip-strip");
      const chipScrollLeft = prevStrip ? prevStrip.scrollLeft : 0;

      if (topHeader) topHeader.style.display = activeView === "focus" ? "none" : "flex";
      if (fabBtn) fabBtn.style.display = (activeView === "command" || activeView === "plan") ? "inline-flex" : "none";
      setAttrIfChanged(document.body, "data-view", activeView); // toast position (above the FAB or not)

      const last7Keys = new Set();
      for (let i = 0; i < 7; i++) last7Keys.add(dayKeyOffset(-i, now));

      const af = state.activeFocus;
      const activeTaskObj = af && af.activeTaskId ? state.tasks.find(t => t.id === af.activeTaskId) : null;
      const liveDelta = af && af.isRunning && af.sessionStartedAt ? Math.max(0, Math.floor((now - af.sessionStartedAt) / 1000)) : 0;

      // =====================================================================
      // VIEW 1: TODAY (Spotlight #1 Hero + Compact Queue + Timeline)
      // =====================================================================
      if (activeView === "command") {
        const todayQuestSec = state.timeLogs
          .filter(l => l.dateKey === todayKey && l.questId !== null)
          .reduce((a, b) => a + b.durationSeconds, 0) + (activeTaskObj && activeTaskObj.questId !== null ? liveDelta : 0);

        const weekQuestSec = state.timeLogs
          .filter(l => last7Keys.has(l.dateKey) && l.questId !== null)
          .reduce((a, b) => a + b.durationSeconds, 0) + (activeTaskObj && activeTaskObj.questId !== null ? liveDelta : 0);

        const totalTargetHrs = activeQuests.reduce((a, q) => a + (Number(q.targetWeeklyHours) || 0), 0);
        const weekPct = totalTargetHrs > 0 ? Math.min(100, Math.round(((weekQuestSec / 3600) / totalTargetHrs) * 100)) : 0;

        const eyebrowDate = new Date(now).toLocaleDateString("en-US", { weekday: "long", month: "short", day: "numeric" });

        let pending = state.tasks
          .filter(t => (t.status === "queued" || t.status === "active") && isTaskVisibleToday(t, todayKey))
          .sort(compareRank);
        if (filterQuestId !== "ALL") {
          pending = pending.filter(t => t.questId === filterQuestId);
        }

        const questQueue = pending.filter(t => t.questId !== null);
        const otherQueue = pending.filter(t => t.questId === null);
        // "Completed today": only tasks finished today (respecting the quest filter)
        const completedToday = state.tasks
          .filter(t => t.status === "completed" && t.completedAt && toLocalDateKey(t.completedAt) === todayKey)
          .filter(t => filterQuestId === "ALL" || t.questId === filterQuestId)
          .sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0));
        const completedList = showAllCompletedToday ? completedToday : completedToday.slice(0, COMPLETED_PREVIEW);
        const filterQuest = filterQuestId !== "ALL" ? activeQuests.find(q => q.id === filterQuestId) : null;

        const todayLogs = state.timeLogs
          .filter(l => l.dateKey === todayKey)
          .sort((a, b) => a.startTime - b.startTime);

        const heroTask = questQueue[0] || null;
        const restQuestQueue = questQueue.slice(1);

        let heroHtml = "";
        if (heroTask) {
          const hq = state.quests.find(x => x.id === heroTask.questId);
          const hHex = ACCENT_HEX[hq ? hq.accentColor : "cyan"];
          const isRunningHero = af && af.activeTaskId === heroTask.id && af.isRunning;
          const hSec = (heroTask.accumulatedSeconds || 0) + (isRunningHero ? liveDelta : 0);

          heroHtml = `
            <div class="spotlight-card" data-flip-task-id="${escapeHtml(heroTask.id)}" style="border-color:${hHex}44;">
              <div class="spotlight-top">
                <div style="display:flex;align-items:center;gap:8px;min-width:0;">
                  <span class="next-badge" style="flex-shrink:0;">#01 NEXT UP</span>
                  <span style="display:inline-flex;align-items:center;gap:5px;min-width:0;font-size:12px;font-weight:500;color:${hHex};">
                    <span style="width:7px;height:7px;border-radius:50%;background:${hHex};flex-shrink:0;"></span>
                    <span style="min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(hq ? hq.title : "Quest")}</span>
                  </span>
                </div>
                <button class="more-dots-btn" onclick="openTaskInspectorSheet(${jsArg(heroTask.id)})" aria-label="Task options for ${escapeHtml(heroTask.title)}">${SVG_MORE}</button>
              </div>

              <h2 class="spotlight-title" role="button" onclick="initializeFocus(${jsArg(heroTask.id)})">${escapeHtml(heroTask.title)}</h2>
              ${heroTask.notes ? `<p class="spotlight-notes">${escapeHtml(heroTask.notes)}</p>` : ""}

              <div class="spotlight-actions">
                <button class="btn-primary-focus pressable" style="background:${hHex};" onclick="initializeFocus(${jsArg(heroTask.id)})">
                  ${SVG_PLAY}
                  <span>${isRunningHero ? "Open Focus" : "Start Focus"}</span>
                  ${hSec > 0 || isRunningHero ? `<span style="font-family:var(--font-mono);font-size:12px;opacity:0.8;" data-task-timer="${escapeHtml(heroTask.id)}" data-prefix="· ">· ${formatChrono(hSec)}</span>` : ""}
                </button>
                <button class="btn-complete-circle pressable" onclick="completeTaskDirect(${jsArg(heroTask.id)})" aria-label="Complete ${escapeHtml(heroTask.title)}">
                  ${SVG_CHECK}
                </button>
              </div>
            </div>
          `;
        }

        container.innerHTML = `
          <!-- Clean Single-Line Hero Bar -->
          <div class="hero-bar">
            <div>
              <div class="hero-eyebrow">${eyebrowDate}</div>
              <h1 class="hero-title">Today</h1>
            </div>

            <button type="button" class="hero-stats-pill pressable" onclick="switchView('telemetry')" aria-label="Open weekly review: ${formatTelemetryDuration(todayQuestSec, '0.0h')} today, ${formatTelemetryDuration(weekQuestSec, '0.0h')} of ${totalTargetHrs} weekly hours">
              <div style="display:flex;align-items:baseline;gap:4px;">
                <span style="font-family:var(--font-display);font-size:20px;font-weight:700;color:white;font-variant-numeric:tabular-nums;">${formatTelemetryDuration(todayQuestSec, "0.0h")}</span>
                <span style="font-size:11px;color:var(--muted);">today</span>
              </div>
              <div style="height:4px;width:100%;background:rgba(255,255,255,0.08);border-radius:999px;overflow:hidden;margin:5px 0 4px;">
                <div style="height:100%;width:${weekPct}%;background:var(--cyan);border-radius:999px;"></div>
              </div>
              <div style="font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums;">${formatTelemetryDuration(weekQuestSec, "0.0h")} / ${totalTargetHrs}h wk <span aria-hidden="true" style="color:var(--cyan);font-weight:700;">›</span></div>
            </button>
          </div>

          <!-- Segmented Control (Phone switcher; Tablet shows both Queue & Day Timeline side-by-side) -->
          <div class="segmented-control today-sub-tabs" role="group" aria-label="Today view">
            <button class="seg-option ${homeSubTab === 'queue' ? 'active' : ''}" aria-pressed="${homeSubTab === 'queue'}" onclick="homeSubTab='queue';renderApp();">
              Priority Queue (${questQueue.length})
            </button>
            <button class="seg-option ${homeSubTab === 'timeline' ? 'active' : ''}" aria-pressed="${homeSubTab === 'timeline'}" onclick="homeSubTab='timeline';renderApp();">
              Day Timeline (${todayLogs.length})
            </button>
          </div>

          <div class="today-tablet-split">
            <div class="today-pane today-queue-pane ${homeSubTab === 'queue' ? 'is-active' : ''}">
              <!-- Single-Row Filter Strip -->
              ${activeQuests.length ? `
              <div class="chip-strip" role="group" aria-label="Filter by quest">
                <button class="filter-pill ${filterQuestId === 'ALL' ? 'active' : ''}" aria-pressed="${filterQuestId === 'ALL'}" onclick="filterQuestId='ALL';renderApp();">All Quests</button>
                ${activeQuests.map(q => `
                  <button class="filter-pill ${filterQuestId === q.id ? 'active' : ''}" aria-pressed="${filterQuestId === q.id}" onclick="filterQuestId=(filterQuestId===${jsArg(q.id)}?'ALL':${jsArg(q.id)});renderApp();">
                    <span style="width:7px;height:7px;border-radius:50%;background:${ACCENT_HEX[q.accentColor] || ACCENT_HEX.slate};"></span>
                    <span>${escapeHtml(q.title)}</span>
                  </button>
                `).join("")}
              </div>
              ` : ""}

              <!-- #01 Spotlight Hero Card -->
              ${heroHtml}

              <!-- Up Next Queue -->
              ${restQuestQueue.length > 0 ? `<div class="section-header-label" data-flip-key="sec-upnext">Up Next (${restQuestQueue.length})</div>` : ""}
              ${restQuestQueue.map(t => renderCompactQueueCard(t)).join("")}

              ${questQueue.length === 0 ? (
                filterQuest
                  ? emptyCardHtml("Nothing open in " + filterQuest.title, "Add the next step for this quest, or look at everything.", [
                      { label: "+ Add a step", primary: true, onclick: `openNewTaskSheet(${jsArg(filterQuest.id)})` },
                      { label: "Show all quests", onclick: "filterQuestId='ALL';renderApp();" }
                    ])
                  : (!state.tasks.length && !activeQuests.length)
                    ? emptyCardHtml("A clean slate", "Add the one task that matters most today. Quests group bigger goals and track their weekly hours.", [
                        { label: "+ New Task", primary: true, onclick: "openNewTaskSheet()" },
                        { label: "New Quest", onclick: "openNewQuestSheet()" }
                      ])
                    : !activeQuests.length
                      ? emptyCardHtml("No quest work queued", "Create a quest to give your most important work a home.", [
                          { label: "New Quest", onclick: "openNewQuestSheet()" }
                        ])
                      : emptyCardHtml("Your Quest queue is clear", "Queue the next step of a quest to see it here as #1.", [
                          { label: "+ New Task", primary: true, onclick: "openNewTaskSheet()" }
                        ])
              ) : ""}

              <!-- Other Work -->
              ${otherQueue.length > 0 ? `
                <div class="section-header-label" data-flip-key="sec-other">Other Work</div>
                ${otherQueue.map(t => renderCompactQueueCard(t)).join("")}
              ` : ""}

              <!-- Completed Today -->
              ${completedToday.length > 0 ? `
                <div class="section-header-label" data-flip-key="sec-completed">Completed today (${completedToday.length})</div>
                ${completedList.map(t => renderCompletedCard(t, true)).join("")}
                ${completedToday.length > COMPLETED_PREVIEW ? `
                  <button class="show-more-btn" data-flip-key="btn-showmore" onclick="showAllCompletedToday=!showAllCompletedToday;renderApp();">
                    ${showAllCompletedToday ? "Show less ↑" : `Show all ${completedToday.length} ↓`}
                  </button>
                ` : ""}
              ` : ""}
            </div>

            <div class="today-pane today-timeline-pane ${homeSubTab === 'timeline' ? 'is-active' : ''}">
              <div class="today-timeline-tablet-head">
                <span>Today's Timeline</span>
                <span style="font-family:var(--font-mono);color:var(--dim);text-transform:none;letter-spacing:0;">${todayLogs.length} session${todayLogs.length === 1 ? "" : "s"}</span>
              </div>

      }

      // =====================================================================
      // VIEW 2: PLAN THE WEEK
      // =====================================================================
      else if (activeView === "plan") {
        const cols = [];
        for (let i = -2; i <= 2; i++) {
          const dk = dayKeyOffset(planDayOffset + i, now);
          const d = noonOfDateKey(dk);
          cols.push({
            dateKey: dk,
            weekday: d.toLocaleDateString("en-US", { weekday: "short" }),
            dayNum: String(d.getDate()),
            fullLabel: d.toLocaleDateString("en-US", { weekday: "long", month: "short", day: "numeric" }),
            monthYear: d.toLocaleDateString("en-US", { month: "long", year: "numeric" }),
            isToday: dk === todayKey

        }
        if (!cols.some(c => c.dateKey === selectedPlanDateKey)) {
          selectedPlanDateKey = cols[2].dateKey;
        }
        const activeCol = cols.find(c => c.dateKey === selectedPlanDateKey) || cols[2];
        const dayTasks = state.tasks
          .filter(t => (t.scheduledDate || todayKey) === activeCol.dateKey)
          .sort(compareRank);
        const pendingDay = dayTasks.filter(t => t.status === "queued" || t.status === "active");
        const completedDay = dayTasks.filter(t => t.status === "completed");

        if (isTabletPlanBoard()) {
          container.innerHTML = `
            <div class="hero-bar">
              <div>
                <div class="hero-eyebrow">${activeCol.monthYear}</div>
                <h1 class="hero-title">Plan the week</h1>

              <div class="step-chip-row">

              ${cols.map(c => {

                return `
                  <div class="plan-col-panel ${c.isToday ? 'is-today' : ''} ${isSel ? 'is-selected' : ''}" data-plan-col="${escapeHtml(c.dateKey)}">
                    <button class="plan-day-card pressable ${isSel ? 'active' : ''} ${c.isToday ? 'today-mark' : ''}" aria-pressed="${isSel}" aria-label="${escapeHtml(c.fullLabel)}${c.isToday ? ", today" : ""}, ${cnt} open" onclick="selectedPlanDateKey=${jsArg(c.dateKey)};renderApp();">
                      <span style="font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:${c.isToday ? 'var(--amber)' : 'var(--muted)'};">${c.weekday}${c.isToday ? ' · TODAY' : ''}</span>

                      ${colPending.length === 0 && colDone.length === 0 ? `<div class="plan-col-empty">Nothing planned</div>` : ""}

                      ${colDone.length > 0 ? `<div class="section-header-label" style="margin:12px 0 8px 2px;">Completed (${colDone.length})</div>` : ""}
                      ${colDone.map(t => renderCompletedCard(t, false)).join("")}
                    </div>
                    <button class="plan-col-add-btn pressable" onclick="openNewTaskSheet(undefined, ${jsArg(c.dateKey)})">+ Add for ${escapeHtml(c.weekday)}</button>
                  </div>
                `;
              }).join("")}
            </div>
          `;
        } else {
          container.innerHTML = `
            <div class="hero-bar">
              <div>
                <div class="hero-eyebrow">${activeCol.monthYear}</div>
                <h1 class="hero-title">Plan the week</h1>
              </div>
              <div class="step-chip-row">
                <button class="sync-chip step-chip" aria-label="Previous day" onclick="planDayOffset--;selectedPlanDateKey=dayKeyOffset(planDayOffset);renderApp();">‹</button>
                <button class="sync-chip step-chip" onclick="planDayOffset=0;selectedPlanDateKey=toLocalDateKey();renderApp();">Today</button>
                <button class="sync-chip step-chip" aria-label="Next day" onclick="planDayOffset++;selectedPlanDateKey=dayKeyOffset(planDayOffset);renderApp();">›</button>
              </div>
            </div>

            <div class="plan-strip">
              ${cols.map(c => {
                const cnt = state.tasks.filter(t => (t.scheduledDate || todayKey) === c.dateKey && t.status !== "completed").length;
                return `
                  <button class="plan-day-card pressable ${c.dateKey === activeCol.dateKey ? 'active' : ''} ${c.isToday ? 'today-mark' : ''}" aria-pressed="${c.dateKey === activeCol.dateKey}" aria-label="${escapeHtml(c.fullLabel)}${c.isToday ? ", today" : ""}, ${cnt} open" onclick="selectedPlanDateKey=${jsArg(c.dateKey)};renderApp();">

            <div class="section-header-label" style="margin-top:4px;">${activeCol.fullLabel} ${activeCol.isToday ? '· TODAY' : ''}</div>

            ${pendingDay.length === 0 && completedDay.length === 0 ? emptyCardHtml(

              activeCol.isToday ? "Add what you want to get done today." : "Plan ahead: tasks added here are scheduled for this day.",

      // =====================================================================
      // VIEW 3: FOCUS HUD (Distraction-Free Full-Screen Stopwatch)
      // =====================================================================
      else if (activeView === "focus") {
        if (!activeTaskObj) {
          // same pick as initializeFocus(): today's (or unscheduled) queue, quest work first
          const queued = state.tasks
            .filter(t => t.status === "queued" && isTaskVisibleToday(t, todayKey))
            .sort(compareRank);
          const topTask = queued.find(t => t.questId !== null) || queued[0] || null;
          const doneToday = state.tasks.filter(t => t.status === "completed" && t.completedAt && toLocalDateKey(t.completedAt) === todayKey).length;
          const laterCount = state.tasks.filter(t => t.status === "queued" && t.scheduledDate && t.scheduledDate > todayKey).length;
          const topQuest = topTask ? state.quests.find(x => x.id === topTask.questId) : null;

          container.innerHTML = `
            <div class="focus-idle-stage">
              <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;">

                ${topTask ? `
                  ${topQuest ? `<div style="margin-top:10px;font-size:12px;color:${ACCENT_HEX[topQuest.accentColor] || ACCENT_HEX.slate};max-width:100%;overflow-wrap:anywhere;">${escapeHtml(topQuest.title)}</div>` : ""}
                  <h2 style="font-family:var(--font-display);font-size:24px;font-weight:600;margin:10px 0 24px;line-height:1.3;max-width:100%;overflow-wrap:anywhere;">${escapeHtml(topTask.title)}</h2>
                  <button class="btn-primary-focus pressable" style="max-width:240px;width:100%;flex:none;padding:0 24px;" onclick="initializeFocus(${jsArg(topTask.id)})">
                    ${SVG_PLAY}
                    <span>Start Focus Session</span>
