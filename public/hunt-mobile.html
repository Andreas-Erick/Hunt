                    <div style="font-size:13px;font-weight:600;color:white;overflow-wrap:anywhere;">${escapeHtml(item.title)}</div>
                    <div style="font-size:11px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere;">${escapeHtml(item.tip)}</div>
                  </div>
                  <button class="sync-chip pressable" style="flex-shrink:0;" onclick="loadTaskIntoGuideTester(${jsArg(item.id)})">Test</button>
                </div>
              `).join("")}
            </div>
          ` : ""}

          <div class="guide-principle-card">
            <div class="hero-eyebrow" style="margin-bottom:10px;">Interactive Draft Tester</div>
            <div class="segmented-control" role="group" aria-label="Draft type">
              <button class="seg-option ${guideLabMode === "task" ? "active" : ""}" aria-pressed="${guideLabMode === "task"}" onclick="playClickSound();guideLabMode='task';renderApp();">Test a Task</button>
              <button class="seg-option ${guideLabMode === "quest" ? "active" : ""}" aria-pressed="${guideLabMode === "quest"}" onclick="playClickSound();guideLabMode='quest';renderApp();">Test a Quest</button>
            </div>

            <div class="sheet-pill-group" style="margin-bottom:14px;">
              ${(guideLabMode === "task" ? GUIDE_TASK_PRESETS : GUIDE_QUEST_PRESETS).map(p => `
                <button class="sheet-pill pressable" style="${p.kind === "strong" ? "border-color:rgba(0,255,157,0.3);color:var(--emerald);" : ""}" onclick="${guideLabMode === "task" ? `loadGuideTaskPreset(${jsArg(p.id)})` : `loadGuideQuestPreset(${jsArg(p.id)})`}">${escapeHtml(p.label)}</button>
              `).join("")}
            </div>

            ${guideLabMode === "task" ? `
              <label class="sheet-label" for="guideTaskTitleInput">Task Title</label>
              <input id="guideTaskTitleInput" class="sheet-input" placeholder="e.g. Draft 400 words for essay #4" value="${escapeHtml(guideTaskTitle)}" enterkeyhint="done" oninput="guideTaskTitle=this.value;updateGuideEvalLive();" onkeydown="if(isSubmitKey(event)) saveGuideTask();" />

              <label class="sheet-label" for="guideTaskNotesInput">Definition of Done (Optional Notes)</label>
              <textarea id="guideTaskNotesInput" class="sheet-input" rows="2" placeholder="What does finished look like for this bout?" oninput="guideTaskNotes=this.value;updateGuideEvalLive();">${escapeHtml(guideTaskNotes)}</textarea>

              <div class="sheet-label">Assign to Quest</div>
              <div class="sheet-pill-group" role="group" aria-label="Assign to Quest" style="margin-bottom:14px;">
                ${activeQuestsList().map(q => {
                  const sel = chosenQuestId === q.id;
                  const hex = ACCENT_HEX[q.accentColor] || ACCENT_HEX.slate;
                  return `<button class="sheet-pill ${sel ? "selected" : ""}" aria-pressed="${sel}" onclick="playClickSound();guideTaskQuestId=${jsArg(q.id)};renderApp();"><span style="width:8px;height:8px;border-radius:50%;background:${hex};flex-shrink:0;"></span><span>${escapeHtml(q.title)}</span></button>`;
                }).join("")}
                <button class="sheet-pill ${chosenQuestId === null ? "selected" : ""}" aria-pressed="${chosenQuestId === null}" onclick="playClickSound();guideTaskQuestId=null;renderApp();"><span style="width:8px;height:8px;border-radius:50%;background:var(--slate);flex-shrink:0;"></span><span>Other</span></button>
              </div>

              <button class="guide-action-btn pressable" onclick="saveGuideTask()">+ Add to Today's Queue</button>
            ` : `
              <label class="sheet-label" for="guideQuestTitleInput">Quest Title</label>
              <input id="guideQuestTitleInput" class="sheet-input" placeholder="e.g. Ship v1 of my audio plugin" value="${escapeHtml(guideQuestTitle)}" enterkeyhint="done" oninput="guideQuestTitle=this.value;updateGuideEvalLive();" onkeydown="if(isSubmitKey(event)) saveGuideQuest();" />

              <label class="sheet-label" for="guideQuestDescInput">Why it matters &amp; what moves it forward</label>
              <textarea id="guideQuestDescInput" class="sheet-input" rows="2" placeholder="Core milestones and why this pursuit matters..." oninput="guideQuestDesc=this.value;updateGuideEvalLive();">${escapeHtml(guideQuestDesc)}</textarea>

              <label class="sheet-label" for="guideQuestHoursInput">Weekly Target Hours</label>
              <input id="guideQuestHoursInput" type="number" inputmode="numeric" min="1" max="100" class="sheet-input" value="${escapeHtml(guideQuestHours)}" enterkeyhint="done" oninput="guideQuestHours=this.value;updateGuideEvalLive();" onkeydown="if(isSubmitKey(event)) saveGuideQuest();" />

              <div class="sheet-label">Accent Color</div>
              <div class="sheet-pill-group" role="group" aria-label="Quest accent color" style="margin-bottom:14px;">
                ${["cyan", "amber", "emerald"].map(col => `
                  <button class="sheet-pill ${guideQuestColor === col ? "selected" : ""}" aria-pressed="${guideQuestColor === col}" onclick="playClickSound();guideQuestColor=${jsArg(col)};renderApp();"><span style="width:9px;height:9px;border-radius:50%;background:${ACCENT_HEX[col]};flex-shrink:0;"></span><span style="text-transform:capitalize;">${col}</span></button>
                `).join("")}
              </div>

              <button class="guide-action-btn pressable" onclick="saveGuideQuest()">+ Create Quest</button>
            `}

            <div id="guideEvalBox" style="margin-top:16px;padding:14px;border-radius:14px;border:1px solid var(--border);background:var(--bg);">
              ${renderGuideEvalHtml(ev)}
            </div>
          </div>
        `;
      }

      return `
        <div class="hero-bar">
          <div>
            <div class="hero-eyebrow">Behavioral Science</div>
            <h1 class="hero-title">Quest &amp; Task Guide</h1>
          </div>
          <button class="sync-chip pressable" onclick="switchView(${jsArg(guideReturnView || "quests")})">← Back</button>
        </div>
        ${tabBar}
        ${bodyHtml}
      `;
    }

    // Main Render Engine
    function renderApp() {
      renderCount++;
      renderWaitingForBlur = false;
      renderWaitingForGesture = false;
      flushFieldDrafts(); // typed-but-uncommitted text must not be replaced by the stored value
      const activeQuests = activeQuestsList();
      if (filterQuestId !== "ALL" && !activeQuests.some(q => q.id === filterQuestId)) filterQuestId = "ALL";
      updateMuteIcon();
      updateHeaderStatus();
      const topHeader = document.getElementById("topHeader");
      const fabBtn = document.getElementById("fabBtn");
      const container = document.getElementById("mainContainer");
      const now = Date.now();
      const todayKey = toLocalDateKey(now);
      lastRenderedDateKey = todayKey;
      const prevStrip = container.querySelector(".chip-strip");
      const chipScrollLeft = prevStrip ? prevStrip.scrollLeft : 0;

      if (topHeader) topHeader.style.display = activeView === "focus" ? "none" : "flex";
      if (fabBtn) fabBtn.style.display = (activeView === "command" || activeView === "plan") ? "inline-flex" : "none";
      setAttrIfChanged(document.body, "data-view", activeView); // toast position (above the FAB or not)

      const last7Keys = new Set();
      for (let i = 0; i < 7; i++) last7Keys.add(dayKeyOffset(-i, now));

      const af = state.activeFocus;
      const activeTaskObj = af && af.activeTaskId ? state.tasks.find(t => t.id === af.activeTaskId) : null;
      const liveDelta = af && af.isRunning && af.sessionStartedAt ? Math.max(0, Math.floor((now - af.sessionStartedAt) / 1000)) : 0;

      // =====================================================================
      // VIEW 1: TODAY (Spotlight #1 Hero + Compact Queue + Timeline)
      // =====================================================================
      if (activeView === "command") {
        const todayQuestSec = state.timeLogs
          .filter(l => l.dateKey === todayKey && l.questId !== null)
          .reduce((a, b) => a + b.durationSeconds, 0) + (activeTaskObj && activeTaskObj.questId !== null ? liveDelta : 0);

        const weekQuestSec = state.timeLogs
          .filter(l => last7Keys.has(l.dateKey) && l.questId !== null)
          .reduce((a, b) => a + b.durationSeconds, 0) + (activeTaskObj && activeTaskObj.questId !== null ? liveDelta : 0);

        const totalTargetHrs = activeQuests.reduce((a, q) => a + (Number(q.targetWeeklyHours) || 0), 0);
        const weekPct = totalTargetHrs > 0 ? Math.min(100, Math.round(((weekQuestSec / 3600) / totalTargetHrs) * 100)) : 0;

        const eyebrowDate = new Date(now).toLocaleDateString("en-US", { weekday: "long", month: "short", day: "numeric" });

        let pending = state.tasks
          .filter(t => (t.status === "queued" || t.status === "active") && isTaskVisibleToday(t, todayKey))
          .sort(compareRank);
        if (filterQuestId !== "ALL") {
          pending = pending.filter(t => t.questId === filterQuestId);
        }

        const questQueue = pending.filter(t => t.questId !== null);
        const otherQueue = pending.filter(t => t.questId === null);
        // "Completed today": only tasks finished today (respecting the quest filter)
        const completedToday = state.tasks
          .filter(t => t.status === "completed" && t.completedAt && toLocalDateKey(t.completedAt) === todayKey)
          .filter(t => filterQuestId === "ALL" || t.questId === filterQuestId)
          .sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0));
        const completedList = showAllCompletedToday ? completedToday : completedToday.slice(0, COMPLETED_PREVIEW);
        const filterQuest = filterQuestId !== "ALL" ? activeQuests.find(q => q.id === filterQuestId) : null;

        const todayLogs = state.timeLogs
          .filter(l => l.dateKey === todayKey)
          .sort((a, b) => a.startTime - b.startTime);

        const heroTask = questQueue[0] || null;
        const restQuestQueue = questQueue.slice(1);

        let heroHtml = "";
        if (heroTask) {
          const hq = state.quests.find(x => x.id === heroTask.questId);
          const hHex = ACCENT_HEX[hq ? hq.accentColor : "cyan"];
          const isRunningHero = af && af.activeTaskId === heroTask.id && af.isRunning;
          const hSec = (heroTask.accumulatedSeconds || 0) + (isRunningHero ? liveDelta : 0);

          heroHtml = `
            <div class="spotlight-card" data-flip-task-id="${escapeHtml(heroTask.id)}" style="border-color:${hHex}44;">
              <div class="spotlight-top">
                <div style="display:flex;align-items:center;gap:8px;min-width:0;">
                  <span class="next-badge" style="flex-shrink:0;">#01 NEXT UP</span>
                  <span style="display:inline-flex;align-items:center;gap:5px;min-width:0;font-size:12px;font-weight:500;color:${hHex};">
                    <span style="width:7px;height:7px;border-radius:50%;background:${hHex};flex-shrink:0;"></span>
                    <span style="min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(hq ? hq.title : "Quest")}</span>
                  </span>
                </div>
                <button class="more-dots-btn" onclick="openTaskInspectorSheet(${jsArg(heroTask.id)})" aria-label="Task options for ${escapeHtml(heroTask.title)}">${SVG_MORE}</button>
              </div>

              <h2 class="spotlight-title" role="button" onclick="initializeFocus(${jsArg(heroTask.id)})">${escapeHtml(heroTask.title)}</h2>
              ${heroTask.notes ? `<p class="spotlight-notes">${escapeHtml(heroTask.notes)}</p>` : ""}

              <div class="spotlight-actions">
                <button class="btn-primary-focus pressable" style="background:${hHex};" onclick="initializeFocus(${jsArg(heroTask.id)})">
                  ${SVG_PLAY}
                  <span>${isRunningHero ? "Open Focus" : "Start Focus"}</span>
                  ${hSec > 0 || isRunningHero ? `<span style="font-family:var(--font-mono);font-size:12px;opacity:0.8;" data-task-timer="${escapeHtml(heroTask.id)}" data-prefix="· ">· ${formatChrono(hSec)}</span>` : ""}
                </button>
                <button class="btn-complete-circle pressable" onclick="completeTaskDirect(${jsArg(heroTask.id)})" aria-label="Complete ${escapeHtml(heroTask.title)}">
                  ${SVG_CHECK}
                </button>
              </div>
            </div>
          `;
        }

        container.innerHTML = `
          <!-- Clean Single-Line Hero Bar -->
          <div class="hero-bar">
            <div>
              <div class="hero-eyebrow">${eyebrowDate}</div>
              <h1 class="hero-title">Today</h1>
            </div>

            <div class="hero-stats-pill">
              <div style="display:flex;align-items:baseline;gap:4px;">
                <span style="font-family:var(--font-display);font-size:20px;font-weight:700;color:white;font-variant-numeric:tabular-nums;">${(todayQuestSec / 3600).toFixed(1)}h</span>
                <span style="font-size:11px;color:var(--muted);">today</span>
              </div>
              <div style="height:4px;width:100%;background:rgba(255,255,255,0.08);border-radius:999px;overflow:hidden;margin:5px 0 4px;">
                <div style="height:100%;width:${weekPct}%;background:var(--cyan);border-radius:999px;"></div>
              </div>
              <div style="font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums;">${(weekQuestSec / 3600).toFixed(1)}h / ${totalTargetHrs}h wk</div>
            </div>
          </div>

          <!-- Segmented Control -->
          <div class="segmented-control" role="group" aria-label="Today view">
            <button class="seg-option ${homeSubTab === 'queue' ? 'active' : ''}" aria-pressed="${homeSubTab === 'queue'}" onclick="homeSubTab='queue';renderApp();">
              Priority Queue (${questQueue.length})
            </button>
            <button class="seg-option ${homeSubTab === 'timeline' ? 'active' : ''}" aria-pressed="${homeSubTab === 'timeline'}" onclick="homeSubTab='timeline';renderApp();">
              Day Timeline (${todayLogs.length})
            </button>
          </div>

          ${homeSubTab === "queue" ? `
            <!-- Single-Row Filter Strip -->
            ${activeQuests.length ? `
            <div class="chip-strip" role="group" aria-label="Filter by quest">
              <button class="filter-pill ${filterQuestId === 'ALL' ? 'active' : ''}" aria-pressed="${filterQuestId === 'ALL'}" onclick="filterQuestId='ALL';renderApp();">All Quests</button>
              ${activeQuests.map(q => `
                <button class="filter-pill ${filterQuestId === q.id ? 'active' : ''}" aria-pressed="${filterQuestId === q.id}" onclick="filterQuestId=(filterQuestId===${jsArg(q.id)}?'ALL':${jsArg(q.id)});renderApp();">
                  <span style="width:7px;height:7px;border-radius:50%;background:${ACCENT_HEX[q.accentColor] || ACCENT_HEX.slate};"></span>
                  <span>${escapeHtml(q.title)}</span>
                </button>
              `).join("")}
            </div>
            ` : ""}

            <!-- #01 Spotlight Hero Card -->
            ${heroHtml}

            <!-- Up Next Queue -->
            ${restQuestQueue.length > 0 ? `<div class="section-header-label" data-flip-key="sec-upnext">Up Next (${restQuestQueue.length})</div>` : ""}
            ${restQuestQueue.map(t => renderCompactQueueCard(t)).join("")}

            ${questQueue.length === 0 ? (
              filterQuest
                ? emptyCardHtml("Nothing open in " + filterQuest.title, "Add the next step for this quest, or look at everything.", [
                    { label: "+ Add a step", primary: true, onclick: `openNewTaskSheet(${jsArg(filterQuest.id)})` },
                    { label: "Show all quests", onclick: "filterQuestId='ALL';renderApp();" }
                  ])
                : (!state.tasks.length && !activeQuests.length)
                  ? emptyCardHtml("A clean slate", "Add the one task that matters most today. Quests group bigger goals and track their weekly hours.", [
                      { label: "+ New Task", primary: true, onclick: "openNewTaskSheet()" },
                      { label: "New Quest", onclick: "openNewQuestSheet()" }
                    ])
                  : !activeQuests.length
                    ? emptyCardHtml("No quest work queued", "Create a quest to give your most important work a home.", [
                        { label: "New Quest", onclick: "openNewQuestSheet()" }
                      ])
                    : emptyCardHtml("Your Quest queue is clear", "Queue the next step of a quest to see it here as #1.", [
                        { label: "+ New Task", primary: true, onclick: "openNewTaskSheet()" }
                      ])
            ) : ""}

            <!-- Other Work -->
            ${otherQueue.length > 0 ? `
              <div class="section-header-label" data-flip-key="sec-other">Other Work</div>
              ${otherQueue.map(t => renderCompactQueueCard(t)).join("")}
            ` : ""}

            <!-- Completed Today -->
            ${completedToday.length > 0 ? `
              <div class="section-header-label" data-flip-key="sec-completed">Completed today (${completedToday.length})</div>
              ${completedList.map(t => renderCompletedCard(t, true)).join("")}
              ${completedToday.length > COMPLETED_PREVIEW ? `
                <button class="show-more-btn" data-flip-key="btn-showmore" onclick="showAllCompletedToday=!showAllCompletedToday;renderApp();">
                  ${showAllCompletedToday ? "Show less ↑" : `Show all ${completedToday.length} ↓`}
                </button>
              ` : ""}
            ` : ""}
          ` : `
            ${renderTimelineHtml(todayLogs)}
          `}
        `;
      }

      // =====================================================================
      // VIEW 2: PLAN THE WEEK
      // =====================================================================
      else if (activeView === "plan") {
        const cols = [];
        for (let i = -2; i <= 2; i++) {
          const dk = dayKeyOffset(planDayOffset + i, now);
          const d = noonOfDateKey(dk);
          cols.push({
            dateKey: dk,
            weekday: d.toLocaleDateString("en-US", { weekday: "short" }),
            dayNum: String(d.getDate()),
            fullLabel: d.toLocaleDateString("en-US", { weekday: "long", month: "short", day: "numeric" }),
            monthYear: d.toLocaleDateString("en-US", { month: "long", year: "numeric" }),
            isToday: dk === todayKey
          });
        }
        if (!cols.some(c => c.dateKey === selectedPlanDateKey)) {
          selectedPlanDateKey = cols[2].dateKey;
        }
        const activeCol = cols.find(c => c.dateKey === selectedPlanDateKey) || cols[2];
        const dayTasks = state.tasks
          .filter(t => (t.scheduledDate || todayKey) === activeCol.dateKey)
          .sort(compareRank);
        const pendingDay = dayTasks.filter(t => t.status === "queued" || t.status === "active");
        const completedDay = dayTasks.filter(t => t.status === "completed");

        container.innerHTML = `
          <div class="hero-bar">
            <div>
              <div class="hero-eyebrow">${activeCol.monthYear}</div>
              <h1 class="hero-title">Plan the week</h1>
            </div>
            <div class="step-chip-row">
              <button class="sync-chip step-chip" aria-label="Previous day" onclick="planDayOffset--;selectedPlanDateKey=dayKeyOffset(planDayOffset);renderApp();">‹</button>
              <button class="sync-chip step-chip" onclick="planDayOffset=0;selectedPlanDateKey=toLocalDateKey();renderApp();">Today</button>
              <button class="sync-chip step-chip" aria-label="Next day" onclick="planDayOffset++;selectedPlanDateKey=dayKeyOffset(planDayOffset);renderApp();">›</button>
            </div>
          </div>

          <div class="plan-strip">
            ${cols.map(c => {
              const cnt = state.tasks.filter(t => (t.scheduledDate || todayKey) === c.dateKey && t.status !== "completed").length;
              return `
                <button class="plan-day-card pressable ${c.dateKey === activeCol.dateKey ? 'active' : ''} ${c.isToday ? 'today-mark' : ''}" aria-pressed="${c.dateKey === activeCol.dateKey}" aria-label="${escapeHtml(c.fullLabel)}${c.isToday ? ", today" : ""}, ${cnt} open" onclick="selectedPlanDateKey=${jsArg(c.dateKey)};renderApp();">
                  <span style="font-size:11px;font-weight:600;color:${c.isToday ? 'var(--amber)' : 'var(--muted)'};">${c.weekday}</span>
                  <span style="font-family:var(--font-display);font-size:18px;font-weight:700;margin:3px 0;">${c.dayNum}</span>
                  <span style="font-size:10px;color:var(--dim);">${cnt} open</span>
                </button>
              `;
            }).join("")}
          </div>

          <div class="section-header-label" style="margin-top:4px;">${activeCol.fullLabel} ${activeCol.isToday ? '· TODAY' : ''}</div>

          ${pendingDay.length === 0 && completedDay.length === 0 ? emptyCardHtml(
            "Nothing planned for " + activeCol.weekday,
            activeCol.isToday ? "Add what you want to get done today." : "Plan ahead: tasks added here are scheduled for this day.",
            [{ label: "+ Add for " + activeCol.weekday, primary: true, onclick: `openNewTaskSheet(undefined, ${jsArg(activeCol.dateKey)})` }]
          ) : ""}

          ${pendingDay.map(t => renderCompactQueueCard(t)).join("")}

          ${completedDay.length > 0 ? `<div class="section-header-label" data-flip-key="sec-plan-completed">Completed (${completedDay.length})</div>` : ""}
          ${completedDay.map(t => renderCompletedCard(t, false)).join("")}
        `;
      }

      // =====================================================================
      // VIEW 3: FOCUS HUD (Distraction-Free Full-Screen Stopwatch)
      // =====================================================================
      else if (activeView === "focus") {
        if (!activeTaskObj) {
          // same pick as initializeFocus(): today's (or unscheduled) queue, quest work first
          const queued = state.tasks
            .filter(t => t.status === "queued" && isTaskVisibleToday(t, todayKey))
            .sort(compareRank);
          const topTask = queued.find(t => t.questId !== null) || queued[0] || null;
          const doneToday = state.tasks.filter(t => t.status === "completed" && t.completedAt && toLocalDateKey(t.completedAt) === todayKey).length;
          const laterCount = state.tasks.filter(t => t.status === "queued" && t.scheduledDate && t.scheduledDate > todayKey).length;
          const topQuest = topTask ? state.quests.find(x => x.id === topTask.questId) : null;

          container.innerHTML = `
            <div style="min-height:78vh;display:flex;flex-direction:column;justify-content:space-between;">
              <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;">
                <div class="hero-eyebrow">Focus Mode</div>
                ${topTask ? `
                  ${topQuest ? `<div style="margin-top:10px;font-size:12px;color:${ACCENT_HEX[topQuest.accentColor] || ACCENT_HEX.slate};max-width:100%;overflow-wrap:anywhere;">${escapeHtml(topQuest.title)}</div>` : ""}
                  <h2 style="font-family:var(--font-display);font-size:24px;font-weight:600;margin:10px 0 24px;line-height:1.3;max-width:100%;overflow-wrap:anywhere;">${escapeHtml(topTask.title)}</h2>
                  <button class="btn-primary-focus pressable" style="max-width:240px;width:100%;flex:none;padding:0 24px;" onclick="initializeFocus(${jsArg(topTask.id)})">
                    ${SVG_PLAY}
                    <span>Start Focus Session</span>
                  </button>
                  <button class="text-action" style="margin-top:16px;color:var(--muted);" onclick="switchView('command')">← Back to Today</button>
                ` : `
                  <h2 style="font-family:var(--font-display);font-size:22px;font-weight:600;margin:14px 0 6px;">${doneToday ? "All done for today" : "Nothing queued for today"}</h2>
                  <p style="font-size:13px;color:var(--muted);margin:0 0 20px;max-width:280px;line-height:1.45;">
                    ${doneToday ? `${doneToday} task${doneToday === 1 ? "" : "s"} completed today.` : "Add a task to start a focus session."}
                    ${laterCount ? ` ${laterCount} planned for later.` : ""}
                  </p>
                  <button class="empty-action primary" onclick="openNewTaskSheet()">+ New Task</button>
                `}
              </div>
              <div class="focus-footer">${focusSyncIndicatorHtml()}</div>
            </div>
          `;
        } else {
          const q = state.quests.find(x => x.id === activeTaskObj.questId);
          const hex = ACCENT_HEX[q ? q.accentColor : "slate"] || ACCENT_HEX.slate;
          // slate as text is below 4.5:1 on the page background: the state line uses --muted then
          const stateColor = !af.isRunning ? "var(--dim)" : hex === ACCENT_HEX.slate ? "var(--muted)" : hex;
          const totalElapsed = (activeTaskObj.accumulatedSeconds || 0) + liveDelta;

          container.innerHTML = `
            <div class="focus-stage">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
                <div style="display:flex;align-items:center;gap:8px;min-width:0;font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);">
                  <span style="width:8px;height:8px;border-radius:50%;background:${hex};box-shadow:0 0 8px ${hex};flex-shrink:0;"></span>
                  <span style="min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Focus · ${escapeHtml(q ? q.title : "Other")}</span>
                </div>
                <button class="icon-circle-btn pressable" onclick="returnToQueueFromFocus()" aria-label="End session and go back to Today">${SVG_BACK}</button>
              </div>

              <div class="focus-center">
                <div class="focus-quest-pill" style="border:1px solid ${hex}55;background:${hex}12;">
                  <span style="width:7px;height:7px;border-radius:50%;background:${hex};"></span>
                  <span>${escapeHtml(q ? q.title : "Other work")}</span>
                </div>

                <h1 class="focus-task-title">
                  ${escapeHtml(activeTaskObj.title)}

                  ${qCompleted.map(t => renderCompletedCard(t, true)).join("")}

          ${completedQuests.length > 0 ? `
            <div class="section-header-label">Completed Quests (${completedQuests.length})</div>
            ${completedQuests.map(quest => {

                <div class="review-card" style="padding:18px;background:rgba(17,19,25,0.72);">
                  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;">
                    <div style="display:flex;align-items:flex-start;gap:10px;min-width:0;">

                      <h3 style="font-family:var(--font-display);font-size:17px;font-weight:600;line-height:1.28;margin:0;min-width:0;color:var(--text-2);overflow-wrap:anywhere;text-wrap:balance;">${escapeHtml(quest.title)}</h3>
                    </div>
                    <span style="flex-shrink:0;font-size:11px;font-weight:600;color:var(--emerald);padding:3px 9px;border-radius:999px;border:1px solid rgba(0,255,157,0.3);background:rgba(0,255,157,0.08);">✓ Completed</span>

                    </div>
                  </div>
                </div>
              `;
            }).join("")}
          ` : ""}
        `;
      }

      // =====================================================================
      // VIEW 5: WEEKLY REVIEW
      // =====================================================================
      else if (activeView === "telemetry") {
        const weekDays = [];
        for (let i = 6; i >= 0; i--) {
          const dk = dayKeyOffset(reviewWeekOffset * 7 - i, now);
          const d = noonOfDateKey(dk);
          weekDays.push({
            dateKey: dk,
            weekday: d.toLocaleDateString("en-US", { weekday: "short" }),
            shortDate: d.toLocaleDateString("en-US", { month: "short", day: "numeric" }),
            isToday: dk === todayKey
          });
        }
        const rangeLabel = weekDays[0].shortDate + " – " + weekDays[6].shortDate;
        const weekKeySet = new Set(weekDays.map(d => d.dateKey));
        const weekLogs = state.timeLogs.filter(l => weekKeySet.has(l.dateKey));

        // Single-pass O(L) aggregation by day and by quest.
        const byDay = new Map();
        const byQuest = new Map();
        for (const l of weekLogs) {
          let b = byDay.get(l.dateKey);
          if (!b) { b = { questSec: 0, otherSec: 0 }; byDay.set(l.dateKey, b); }
          if (l.questId !== null) {
            b.questSec += l.durationSeconds;
            byQuest.set(l.questId, (byQuest.get(l.questId) || 0) + l.durationSeconds);
          } else {
            b.otherSec += l.durationSeconds;
          }
        }

        const dailyStats = weekDays.map(day => {
          const b = byDay.get(day.dateKey);
          return {
            ...day,
            questHours: Number(((b ? b.questSec : 0) / 3600).toFixed(1)),
            otherHours: Number(((b ? b.otherSec : 0) / 3600).toFixed(1))
          };
        });

        const totalQuestH = dailyStats.reduce((a, d) => a + d.questHours, 0);
        const totalOtherH = dailyStats.reduce((a, d) => a + d.otherHours, 0);
        const grandTotalH = totalQuestH + totalOtherH;
        const totalTargetH = activeQuests.reduce((a, q) => a + (Number(q.targetWeeklyHours) || 0), 0);
        const targetPct = totalTargetH > 0 ? Math.round((totalQuestH / totalTargetH) * 100) : 0;
        const activeDays = Math.max(1, dailyStats.filter(d => d.questHours > 0 || d.otherHours > 0).length);
        const dailyAvg = totalQuestH / activeDays;
        const focusPct = grandTotalH > 0 ? Math.round((totalQuestH / grandTotalH) * 100) : 0;
        const maxDayH = Math.max(5, ...dailyStats.map(d => d.questHours));

        const hoursByQuest = state.quests
          .map(q => {
            const sec = byQuest.get(q.id) || 0;
            return { quest: q, hours: Number((sec / 3600).toFixed(1)) };
          })
          .filter(x => !x.quest.archived || x.hours > 0);
        const maxQuestH = Math.max(4, ...hoursByQuest.map(x => x.hours));

        container.innerHTML = `
          <div class="hero-bar">
            <div>
              <div class="hero-eyebrow">${rangeLabel}</div>
              <h1 class="hero-title">Weekly review</h1>
            </div>
            <div class="step-chip-row">
              <button class="sync-chip step-chip" aria-label="Previous week" onclick="reviewWeekOffset--;renderApp();">‹</button>
              <button class="sync-chip step-chip" onclick="reviewWeekOffset=0;renderApp();" ${reviewWeekOffset === 0 ? "disabled" : ""}>This week</button>
              <button class="sync-chip step-chip" aria-label="Next week" onclick="if(reviewWeekOffset<0){reviewWeekOffset++;renderApp();}" ${reviewWeekOffset < 0 ? "" : "disabled"}>›</button>
            </div>
          </div>

          <div class="review-kpi-grid">
            <div class="review-card" style="grid-column:span 2;margin-bottom:0;">
              <div class="hero-eyebrow">Quest Hours</div>
              <div style="display:flex;align-items:baseline;gap:8px;margin-top:6px;font-variant-numeric:tabular-nums;">
                <span style="font-family:var(--font-display);font-size:36px;font-weight:700;color:var(--amber);">${totalQuestH.toFixed(1)}h</span>
                <span style="font-size:16px;color:var(--dim);">/ ${totalTargetH}h</span>
                <span style="margin-left:auto;font-size:12px;color:var(--muted);">${targetPct}% of target</span>
              </div>
            </div>

            <div class="review-card" style="margin-bottom:0;">
              <div class="hero-eyebrow">Daily Average</div>
              <div style="font-family:var(--font-display);font-size:28px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;">${dailyAvg.toFixed(1)}h</div>
            </div>

            <div class="review-card" style="margin-bottom:0;">
              <div class="hero-eyebrow">Quest vs Other</div>
              <div style="font-family:var(--font-display);font-size:28px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;">${focusPct}<span style="font-size:16px;color:var(--dim);">%</span></div>
            </div>
          </div>

          <div class="review-card">
            <div class="hero-eyebrow" style="margin-bottom:16px;">Quest Hours · Per Day</div>
            <div style="display:grid;grid-template-columns:repeat(7, 1fr);gap:8px;align-items:end;">
              ${dailyStats.map(d => {
                const barPct = d.questHours > 0 ? Math.max(8, Math.round((d.questHours / maxDayH) * 100)) : 3;
                return `
                  <div style="display:flex;flex-direction:column;align-items:center;">
                    <span style="font-family:var(--font-mono);font-size:10px;font-variant-numeric:tabular-nums;margin-bottom:8px;color:${d.isToday ? 'var(--amber)' : (d.questHours > 0 ? 'var(--text-2)' : 'var(--dim)')};">
                      ${d.questHours > 0 ? d.questHours + "h" : "0h"}
                    </span>
                    <div style="height:130px;width:100%;max-width:32px;display:flex;align-items:flex-end;justify-content:center;">
                      <div style="width:100%;height:${barPct}%;border-radius:6px 6px 2px 2px;background:${d.isToday ? 'var(--amber)' : (d.questHours > 0 ? '#3b3f4c' : 'rgba(255,255,255,0.05)')};"></div>
                    </div>
                    <span style="font-size:11px;margin-top:8px;color:${d.isToday ? 'var(--amber)' : 'var(--dim)'};">${d.weekday}</span>
                  </div>
                `;
              }).join("")}
            </div>
          </div>

          <div class="review-card">
            <div class="hero-eyebrow" style="margin-bottom:14px;">Hours by Quest</div>
            ${hoursByQuest.length === 0 ? `<div style="font-size:13px;color:var(--dim);">No quests yet. Hours per quest appear here once you create one.</div>` : ""}
            ${hoursByQuest.map(({ quest, hours }) => {
              const hex = ACCENT_HEX[quest.accentColor] || ACCENT_HEX.slate;
              const wPct = hours > 0 ? Math.max(8, Math.round((hours / maxQuestH) * 100)) : 0;
              return `
                <div style="margin-bottom:14px;font-size:13px;">
                  <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px;">
                    <div style="display:flex;align-items:flex-start;gap:8px;min-width:0;">
                      <span style="width:8px;height:8px;margin-top:5px;border-radius:50%;background:${hex};flex-shrink:0;"></span>
                      <span style="line-height:1.35;color:var(--text-2);overflow-wrap:anywhere;text-wrap:pretty;">${escapeHtml(quest.title)}</span>
                    </div>
                    <span style="flex-shrink:0;font-family:var(--font-mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--text-2);">${hours}h</span>
                  </div>
                  <div style="height:6px;background:rgba(255,255,255,0.05);border-radius:999px;overflow:hidden;">
                    <div style="height:100%;width:${wPct}%;background:${hex};border-radius:999px;"></div>
                  </div>
                </div>
              `;
            }).join("")}
          </div>

          <div class="review-card">
            <div class="hero-eyebrow" style="margin-bottom:12px;">Quest Work vs Other</div>
            <div style="height:30px;border-radius:9px;background:#1c1f28;overflow:hidden;display:flex;">
              <div style="height:100%;width:${focusPct}%;background:var(--amber);"></div>
            </div>
            <div style="display:flex;gap:18px;margin-top:10px;font-size:12px;">
              <span style="display:flex;align-items:center;gap:6px;"><span style="width:8px;height:8px;border-radius:50%;background:var(--amber);"></span>Quest work · ${totalQuestH.toFixed(1)}h</span>
              <span style="display:flex;align-items:center;gap:6px;color:var(--dim);"><span style="width:8px;height:8px;border-radius:50%;background:#2c2f3a;"></span>Other · ${totalOtherH.toFixed(1)}h</span>
            </div>
          </div>

          <button class="text-action" onclick="showReviewSessionLog=!showReviewSessionLog;renderApp();" aria-expanded="${showReviewSessionLog}" style="color:var(--muted);font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;margin:0 -8px;">
            ${showReviewSessionLog ? "Hide Session Log ↑" : `View Session Log (${weekLogs.length} session${weekLogs.length === 1 ? "" : "s"}) ↓`}
          </button>

          ${showReviewSessionLog ? `
            <div class="review-card" style="margin-top:10px;padding:6px 16px;">
              ${weekLogs.length === 0 ? `<div style="padding:14px 0;font-size:13px;color:var(--dim);text-align:center;">No focus sessions in this week.</div>` : ""}

                    <div style="display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:12px;color:var(--muted);">
                      <span>${formatChrono(log.durationSeconds)}</span>
                      <button class="log-delete-btn" onclick="deleteLogItem(${jsArg(log.id)})" aria-label="Delete session ${escapeHtml(log.taskTitleSnapshot)}">×</button>

          <button class="guide-entry-btn pressable" onclick="openGuideView('workshop')">
            <div>
              <div style="font-family:var(--font-display);font-size:14px;font-weight:700;color:white;">Quest &amp; Task Guide</div>
              <div style="font-size:12px;color:var(--muted);margin-top:2px;">Science principles, draft tester &amp; workspace check</div>
            </div>
            <span style="color:var(--cyan);font-size:16px;font-weight:700;">→</span>
          </button>
        `;
      }

      // =====================================================================
      // VIEW 4B: DAILY HABITS (Recurring Routines)
      // =====================================================================
      else if (activeView === "habits") {
        const habitsList = asArray(state.habits).slice().sort(compareRank);
        const recentDays = [];
        for (let i = 6; i >= 0; i--) recentDays.push(dayKeyOffset(-i, now));

        const completedDatesByHabit = new Map();
        const todayTaskByHabit = new Map();
        for (const t of state.tasks) {
          if (!t.habitId) continue;
          if (t.id === habitTaskId(t.habitId, todayKey) || t.scheduledDate === todayKey) {
            if (!todayTaskByHabit.has(t.habitId) || t.id === habitTaskId(t.habitId, todayKey)) {
              todayTaskByHabit.set(t.habitId, t);
            }
          }
          if (t.status === "completed") {
            const dk = t.scheduledDate || (t.completedAt ? toLocalDateKey(t.completedAt) : null);
            if (dk) {
              if (!completedDatesByHabit.has(t.habitId)) completedDatesByHabit.set(t.habitId, new Set());
              completedDatesByHabit.get(t.habitId).add(dk);
            }
          }
        }

        const doneTodayCount = habitsList.filter(h => {
          const tt = todayTaskByHabit.get(h.id);
          return tt && tt.status === "completed";
        }).length;

        container.innerHTML = `
          <div class="hero-bar">
            <div>
              <div class="hero-eyebrow">Daily Routine</div>
              <h1 class="hero-title">Habits</h1>
            </div>
            <div class="step-chip-row">
              <button class="sync-chip pressable" style="background:rgba(0,240,255,0.12);border-color:rgba(0,240,255,0.35);color:var(--cyan);font-weight:600;" onclick="openNewHabitSheet()">
                + New Habit
              </button>

          </div>

          ${habitsList.length > 0 ? `
            <div style="display:flex;align-items:center;justify-content:space-between;margin:0 0 14px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;">
              <span>Added to Today automatically each day</span>
              <span style="color:white;font-weight:600;">${doneTodayCount} / ${habitsList.length} done today</span>
            </div>
          ` : ""}

          ${habitsList.length === 0 ? emptyCardHtml(
            "No daily habits yet",
            "Create a recurring routine and it will appear in Today's queue every day.",
            [{ label: "+ New Habit", primary: true, onclick: "openNewHabitSheet()" }]
          ) : habitsList.map(h => {
            const q = state.quests.find(x => x.id === h.questId);
            const hex = ACCENT_HEX[q ? q.accentColor : "slate"] || ACCENT_HEX.slate;
            const tt = todayTaskByHabit.get(h.id);
            const doneToday = !!(tt && tt.status === "completed");
            const compSet = completedDatesByHabit.get(h.id) || new Set();
            const streak = computeHabitStreak(compSet, todayKey);
            const title = escapeHtml(h.title);
            const dotsHtml = recentDays.map(dk => {
              const hit = compSet.has(dk);
              const isTodayDot = dk === todayKey;
              return `<span style="width:7px;height:7px;border-radius:50%;${hit ? `background:${hex};` : isTodayDot ? "border:1px solid rgba(255,255,255,0.35);background:transparent;" : "background:rgba(255,255,255,0.1);"}"></span>`;
            }).join("");

            return `
              <div class="queue-item-card ${doneToday ? "completed" : ""}" style="align-items:flex-start;padding-top:14px;padding-bottom:14px;">
                <div class="card-edge-bar" style="background:${hex};"></div>
                <button class="task-check-ring ${doneToday ? "done" : ""}" style="${doneToday ? `background:${hex};` : ""}margin-top:2px;" onclick="toggleHabitToday(${jsArg(h.id)})" aria-label="${doneToday ? "Reopen" : "Complete"} today's habit ${title}" aria-pressed="${doneToday}">
                  ${SVG_CHECK}
                </button>
                <div class="queue-item-body" role="button" onclick="openHabitEditorSheet(${jsArg(h.id)})">
                  <div class="queue-item-title" style="${doneToday ? "text-decoration:line-through;color:var(--muted);" : ""}">${title}</div>
                  ${h.notes ? `<div style="font-size:12px;color:var(--dim);margin-top:3px;line-height:1.35;">${escapeHtml(h.notes)}</div>` : ""}
                  <div class="queue-item-sub" style="margin-top:8px;justify-content:space-between;gap:10px;">
                    <span style="display:inline-flex;align-items:center;gap:5px;min-width:0;flex:1;">
                      <span style="width:6px;height:6px;border-radius:50%;background:${hex};flex-shrink:0;"></span>
                      <span class="quest-label-ellipsis">${escapeHtml(q ? q.title : "Other work")}</span>
                    </span>
                    <span style="display:inline-flex;align-items:center;gap:6px;flex-shrink:0;">
                      <span style="display:inline-flex;align-items:center;gap:4px;">${dotsHtml}</span>
                      ${streak > 0 ? `<span style="font-family:var(--font-mono);font-size:11px;color:var(--text-2);font-variant-numeric:tabular-nums;">${streak}d</span>` : ""}
                    </span>
                  </div>
                </div>
                <div class="queue-item-right">
                  ${!doneToday ? `<button class="mini-play-btn" onclick="focusHabitToday(${jsArg(h.id)})" aria-label="Start focus on ${title}">${SVG_PLAY}</button>` : ""}
                  <button class="more-dots-btn" onclick="openHabitEditorSheet(${jsArg(h.id)})" aria-label="Edit habit ${title}">${SVG_MORE}</button>
                </div>
              </div>
            `;
          }).join("")}
        `;
      }

      // =====================================================================
      // VIEW 6: QUEST & TASK SCIENCE GUIDE
      // =====================================================================
      else if (activeView === "guide") {
        container.innerHTML = renderGuideViewHtml();
      }

      // A re-render (e.g. a sync that brought changes) keeps the quest filter strip where the user left it.
      const nextStrip = chipScrollLeft ? container.querySelector(".chip-strip") : null;
      if (nextStrip) nextStrip.scrollLeft = chipScrollLeft;
    }

    function renderTimelineHtml(todayLogs) {
      const START_HR = 8;
      const END_HR = 22;
      const HR_PX = 48;
      const hours = [];
      for (let h = START_HR; h <= END_HR; h++) hours.push(h);

      const dNow = new Date();
      const curFloat = dNow.getHours() + dNow.getMinutes() / 60;

      const blocksHtml = todayLogs.map(log => {
        const sD = new Date(log.startTime);
        const eD = new Date(log.endTime);
        const sHr = sD.getHours() + sD.getMinutes() / 60;
        const durHr = Math.max(0.35, log.durationSeconds / 3600);
        const clamped = Math.max(START_HR, Math.min(END_HR - 0.4, sHr));
        const topPx = (clamped - START_HR) * HR_PX;
        const heightPx = Math.max(32, Math.min((END_HR - clamped) * HR_PX, durHr * HR_PX));
        const hex = ACCENT_HEX[log.accentColorSnapshot] || ACCENT_HEX.cyan;
        const sStr = String(sD.getHours()).padStart(2, "0") + ":" + String(sD.getMinutes()).padStart(2, "0");
        const eStr = String(eD.getHours()).padStart(2, "0") + ":" + String(eD.getMinutes()).padStart(2, "0");

        return `
          <div style="position:absolute;left:50px;right:4px;top:${topPx}px;height:${heightPx}px;border-radius:10px;border:1px solid ${hex}66;background-image:repeating-linear-gradient(-45deg, ${hex}22, ${hex}22 6px, ${hex}0a 6px, ${hex}0a 12px);padding:6px 10px;overflow:hidden;">
            <div style="position:absolute;left:0;top:0;bottom:0;width:3px;background:${hex};"></div>
            <div style="font-size:12px;font-weight:500;color:white;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(log.taskTitleSnapshot)}</div>
            ${heightPx >= 42 ? `<div style="font-family:var(--font-mono);font-size:10px;color:var(--muted);">${sStr} – ${eStr}</div>` : ""}
          </div>
        `;
      }).join("");

      const nowLineHtml = (curFloat >= START_HR && curFloat <= END_HR) ? `
        <div style="position:absolute;left:44px;right:0;top:${(curFloat - START_HR) * HR_PX}px;display:flex;align-items:center;pointer-events:none;">
          <span style="width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber);"></span>
          <div style="flex:1;height:1.5px;background:var(--amber);"></div>
        </div>
      ` : "";

      return `
        <div class="review-card" style="padding:16px 14px;">
          ${todayLogs.length ? "" : `<div class="timeline-empty">No focus sessions yet today<span>Start one from the Priority Queue and it shows up here.</span></div>`}
          <div style="position:relative;height:${(END_HR - START_HR) * HR_PX}px;">
            ${hours.map(hr => `
              <div style="position:absolute;left:0;right:0;top:${(hr - START_HR) * HR_PX}px;display:flex;align-items:flex-start;">
                <span style="width:44px;font-family:var(--font-mono);font-size:10px;color:var(--dim);transform:translateY(-6px);">${String(hr).padStart(2, "0")}:00</span>
                <div style="flex:1;border-top:1px solid rgba(255,255,255,0.05);"></div>
              </div>
            `).join("")}
            ${blocksHtml}
            ${nowLineHtml}
          </div>
        </div>
      `;
    }

    // 500 ms ticker: live timers + relative sync ages. Skipped while hidden; writes only changed text.
    function tick() {
      if (isAppHidden()) return;
      // midnight with the app open (e.g. screen kept awake by a running timer): materialize the new day's
      // habits, roll over "Completed today", the date, today's hours and the timeline.
      if (lastRenderedDateKey && toLocalDateKey() !== lastRenderedDateKey) {
        materializeDailyHabits(toLocalDateKey());
        renderAppSafely();
      }
      if (document.body && document.body.classList.contains("keyboard-open")) updateKeyboardClass(); // backstop
      updateSyncIndicator(); // "Synced · now" -> "Synced · 2m", next-try countdown in an open sync sheet
      const af = state.activeFocus;
      if (!af || !af.activeTaskId || !af.isRunning || !af.sessionStartedAt) return;
      const task = state.tasks.find(t => t.id === af.activeTaskId);
      if (!task) return;
      const sec = (task.accumulatedSeconds || 0) + Math.max(0, Math.floor((Date.now() - af.sessionStartedAt) / 1000));
      const formatted = formatChrono(sec);

      setTextIfChanged(document.getElementById("focusBigChrono"), formatted);
      setTextIfChanged(document.getElementById("headerChronoText"), formatted);
      document.querySelectorAll("[data-task-timer]").forEach(el => {
        if (el.getAttribute("data-task-timer") !== task.id) return;
        const prefix = el.hasAttribute("data-prefix") ? el.getAttribute("data-prefix") : "· ";
        setTextIfChanged(el, prefix + formatted);
      });
    }
    setInterval(tick, 500);

    // ----- Structured Diagnostics, Breadcrumb Flight Recorder & Global Fault Traps -----
    const MOBILE_BREADCRUMB_CAP = 120;
    const mobileBreadcrumbs = [];
    let mobileLastCrash = null;
    const SENSITIVE_DIAG_KEY_RE = /(token|secret|password|authorization|cookie|synckey|key)/i;
    function redactDiagText(raw) {
      return String(raw || "")
        .replace(/\bBearer\s+[A-Za-z0-9._~+/=-]{8,}/gi, "Bearer [REDACTED]")
        .replace(/\b[0-9a-fA-F]{64}\b/g, "[REDACTED]")
        .slice(0, 300);
    }
    function redactDiagContext(ctx) {
      if (!ctx || typeof ctx !== "object") return undefined;
      const out = {};
      for (const k of Object.keys(ctx)) {
        out[k] = SENSITIVE_DIAG_KEY_RE.test(k) ? "[REDACTED]" : typeof ctx[k] === "string" ? redactDiagText(ctx[k]) : ctx[k];
      }
      return out;
    }
    function newCorrelationId() {
      try {
        if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") return crypto.randomUUID();
      } catch (e) {}
      return "mcid-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
    }
    function recordMobileBreadcrumb(level, domain, event, context, correlationId, durationMs) {
      const rec = {
        timestamp: new Date().toISOString(),
        level,
        domain,
        event,
        ...(correlationId ? { correlationId } : {}),
        ...(typeof durationMs === "number" && Number.isFinite(durationMs) ? { durationMs: Math.max(0, Math.round(durationMs)) } : {}),
        ...(context ? { context: redactDiagContext(context) } : {})
      };
      mobileBreadcrumbs.push(rec);
      if (mobileBreadcrumbs.length > MOBILE_BREADCRUMB_CAP) {
        mobileBreadcrumbs.splice(0, mobileBreadcrumbs.length - MOBILE_BREADCRUMB_CAP);
      }
      return rec;
    }
    function installMobileFaultTraps() {
      window.addEventListener("error", (ev) => {
        const msg = redactDiagText(ev && (ev.message || (ev.error && ev.error.message)) || "Unhandled error");
        mobileLastCrash = { timestamp: new Date().toISOString(), kind: "error", message: msg, breadcrumbs: mobileBreadcrumbs.slice() };
        recordMobileBreadcrumb("FATAL", "runtime", "unhandled_error", { message: msg });
      });
      window.addEventListener("unhandledrejection", (ev) => {
        const reason = ev && ev.reason;
        const msg = redactDiagText(reason && reason.message ? reason.message : reason);
        mobileLastCrash = { timestamp: new Date().toISOString(), kind: "unhandledrejection", message: msg, breadcrumbs: mobileBreadcrumbs.slice() };
        recordMobileBreadcrumb("ERROR", "runtime", "unhandled_rejection", { message: msg });
      });
    }
    window.__huntDiagnostics = {
      getBreadcrumbs: () => mobileBreadcrumbs.slice(),
      getLastCrash: () => mobileLastCrash,
      record: recordMobileBreadcrumb
    };

    // Boot: paint first; sync work starts only after the first frame (and never blocks it). A screen that
    // fails to draw must not stop the rest of boot: lifecycle hooks and sync still start, so a sync can
    // still bring the data back.
    installMobileFaultTraps();
    ingestPairingTokenFromPageUrl();
    if (materializeDailyHabitsInto(state, toLocalDateKey()) > 0) {
      persistState();
      syncMeta.localRev++;
    }
    try {
      renderApp();
      recordMobileBreadcrumb("INFO", "boot", "render_ok", { view: activeView });
    } catch (e) {
      recordMobileBreadcrumb("FATAL", "boot", "render_failed", { message: e && e.message });
      console.error("[hunt] boot.render_failed", e);
      const main = document.getElementById("mainContainer");
      if (main) main.innerHTML = `<div class="empty-card"><div class="empty-title">Hunt couldn't show this screen</div><p class="empty-sub">Your data is still saved on this phone. Try another tab, or reopen the app.</p></div>`;
    }
    syncKeepScreenOn();
    installLifecycleHooks();
    installUiHooks();
    installKeyboardHooks();
    afterFirstPaint(() => scheduleSync(0));
    setTimeout(prewarmAudio, 1500);
  </script>
</body>
</html>
