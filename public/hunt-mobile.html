    // Forms submit on Enter in a one-line field, and on Ctrl/Cmd+Enter in a textarea (Enter adds a line).
    function isSubmitKey(event) {
      if (!event || event.key !== "Enter" || event.isComposing) return false;
      if (event.target && event.target.tagName === "TEXTAREA" && !(event.ctrlKey || event.metaKey)) return false;
      event.preventDefault();
      return true;
    }

    function focusFieldSoon(id) {
      // Focus synchronously inside the tap gesture with preventScroll so Android starts the IME
      // on the exact same frame as the sheet entrance instead of shifting the sheet 60ms later.
      const inp = document.getElementById(id);
      if (inp) {
        try { inp.focus({ preventScroll: true }); } catch (e) { inp.focus(); }
        return;
      }
      setTimeout(() => {
        const el = document.getElementById(id);
        if (el) {
          try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); }
        }
      }, 16);
    }

    // Unsent New Task text survives an accidental dismiss; submitting clears it, × too (with Restore in
    // its toast). It also survives Android killing the app in the background: onAppHidden() saves it
    // under a device-local key (never part of the synced state) and the next launch shows it again in
    // the next New Task sheet.
    const COMPOSER_DRAFT_KEY = "hunt-composer-draft-v1";
    let storedComposerDraftJson = null; // what COMPOSER_DRAFT_KEY holds ("" = nothing); skips redundant writes
    let composerDraft = loadComposerDraft();

    function loadComposerDraft() {
      try {
        const raw = localStorage.getItem(COMPOSER_DRAFT_KEY);
        storedComposerDraftJson = raw || "";
        const d = raw ? JSON.parse(raw) : null;
        if (d && typeof d.title === "string" && typeof d.notes === "string" && (d.title.trim() || d.notes.trim())) {
          return { title: d.title, notes: d.notes };
        }
      } catch (e) {}
      return null;
    }

    // Mirrors composerDraft into localStorage (removes the key when there is no draft).
    function storeComposerDraft() {
      const json = composerDraft ? JSON.stringify({ title: composerDraft.title, notes: composerDraft.notes }) : "";
      if (json === storedComposerDraftJson) return;
      try {
        if (json) localStorage.setItem(COMPOSER_DRAFT_KEY, json);
        else localStorage.removeItem(COMPOSER_DRAFT_KEY);
        storedComposerDraftJson = json;
      } catch (e) {}
    }

    function captureComposerDraft() {
      const t = document.getElementById("sheetTaskTitle");
      const n = document.getElementById("sheetTaskNotes");
      const title = t ? t.value : "";
      const notes = n ? n.value : "";
      composerDraft = title.trim() || notes.trim() ? { title, notes } : null;
    }

    function draftRestoreOffer(draft, dateKey) {
      return { message: "Draft discarded", undo: () => restoreComposerDraft(draft, dateKey) };
    }

    // Restore of a New Task draft dropped with ×: the sheet comes back with it. A different draft kept
    // meanwhile (Back / backdrop) is offered back in turn, so neither is lost silently.
    function restoreComposerDraft(draft, dateKey) {
      if (isSheetOpen()) closeSheet(); // the sheet open now is dismissed the usual way
      const replaced = composerDraft;
      const replacedDateKey = composerDateKey;
      composerDraft = draft;
      composerDateKey = dateKey;
      storeComposerDraft();
      renderNewTaskSheet();
      focusFieldSoon("sheetTaskTitle");
      if (replaced && (replaced.title !== draft.title || replaced.notes !== draft.notes)) {
        const offer = draftRestoreOffer(replaced, replacedDateKey);
        showToast(offer.message, { actionLabel: "Restore", undo: offer.undo });
      }
    }

    // Default composer quest: the remembered choice if it is still active, "Other" (null) if chosen,
    // otherwise the first active quest (never a hardcoded, completed or deleted id).
    function resolveComposerQuestId(questId) {
      if (questId === null) return null;
      const active = activeQuestsList();
      if (questId !== undefined && active.some(q => q.id === questId)) return questId;
      return active.length ? active[0].id : null;
    }

    // composerQuestId holds the user's explicit choice only (undefined = none yet, null = "Other work");
    // the effective quest is resolved at render/submit, so opening the composer before any quest
    // existed does not pin later tasks to "Other work".
    function openNewTaskSheet(preselectedQuestId, preselectedDateKey) {
      playClickSound();
      if (preselectedQuestId !== undefined) composerQuestId = preselectedQuestId;
      composerDateKey = preselectedDateKey || (activeView === "plan" ? selectedPlanDateKey : toLocalDateKey());
      renderNewTaskSheet();
      focusFieldSoon("sheetTaskTitle");
    }

    // Rendered once per open (fresh inputs, or the unsent draft); pills then update in place.
    function renderNewTaskSheet() {
      const shownQuestId = resolveComposerQuestId(composerQuestId); // a sync may have removed the chosen quest
      const todayKey = toLocalDateKey();
      const tomorrowKey = dayKeyOffset(1);
      const draft = composerDraft || { title: "", notes: "" };
      const otherDay = composerDateKey !== todayKey && composerDateKey !== tomorrowKey;

      showSheet("newTask", `
          ${sheetHeaderHtml("New Task", true)}

          <input id="sheetTaskTitle" class="sheet-input" placeholder="What moves the needle?" value="${escapeHtml(draft.title)}" enterkeyhint="done" aria-label="Task title" onkeydown="if(event.key==='Enter') submitNewTaskFromSheet(true)" />
          <textarea id="sheetTaskNotes" class="sheet-input" rows="2" placeholder="Optional session notes..." aria-label="Notes" onkeydown="if(isSubmitKey(event)) submitNewTaskFromSheet(true)">${escapeHtml(draft.notes)}</textarea>

          <div class="sheet-label">Quest</div>
          <div class="sheet-pill-group" role="group" aria-label="Quest">
            ${activeQuestsList().map(q => `
              <button class="sheet-pill ${shownQuestId === q.id ? 'selected' : ''}" aria-pressed="${shownQuestId === q.id}" onclick="composerQuestId=${jsArg(q.id)};selectPill(this);">
                <span style="width:8px;height:8px;border-radius:50%;background:${ACCENT_HEX[q.accentColor] || ACCENT_HEX.slate};"></span>
                <span>${escapeHtml(q.title)}</span>
              </button>
            `).join("")}
            <button class="sheet-pill ${shownQuestId === null ? 'selected' : ''}" aria-pressed="${shownQuestId === null}" onclick="composerQuestId=null;selectPill(this);">
              <span style="width:8px;height:8px;border-radius:50%;background:var(--slate);"></span>
              <span>Other work</span>
            </button>
          </div>

          <div class="sheet-label">Schedule</div>
          <div class="sheet-pill-group" role="group" aria-label="Schedule">
            <button class="sheet-pill ${composerDateKey === todayKey ? 'selected' : ''}" aria-pressed="${composerDateKey === todayKey}" onclick="composerDateKey=${jsArg(todayKey)};selectPill(this);">Today</button>
            <button class="sheet-pill ${composerDateKey === tomorrowKey ? 'selected' : ''}" aria-pressed="${composerDateKey === tomorrowKey}" onclick="composerDateKey=${jsArg(tomorrowKey)};selectPill(this);">Tomorrow</button>
            ${otherDay ? `<button class="sheet-pill selected" aria-pressed="true" onclick="composerDateKey=${jsArg(composerDateKey)};selectPill(this);">${escapeHtml(dateKeyLabel(composerDateKey))}</button>` : ""}
          </div>

          <div class="sheet-actions">
            <button class="pressable" onclick="submitNewTaskFromSheet(true)" style="height:var(--touch-min);border-radius:13px;border:none;background:var(--cyan);color:#05070a;font-family:var(--font-display);font-weight:700;font-size:14px;cursor:pointer;">
              ↑ Add to Top (#1)
            </button>
            <button class="pressable" onclick="submitNewTaskFromSheet(false)" style="height:var(--touch-min);border-radius:13px;border:1px solid var(--border-strong);background:var(--surface-2);color:white;font-family:var(--font-display);font-weight:600;font-size:14px;cursor:pointer;">
              ↓ Add to Bottom
            </button>
          </div>
      `);
    }

    // "Thu, Nov 20" for a YYYY-MM-DD key (local date).
    function dateKeyLabel(dateKey) {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateKey || "");
      if (!m) return dateKey || "";
      const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
      return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
    }

    function submitNewTaskFromSheet(promoteToTop) {
      const titleEl = document.getElementById("sheetTaskTitle");
      const notesEl = document.getElementById("sheetTaskNotes");
      if (!titleEl || !titleEl.value.trim()) {
        if (titleEl) titleEl.focus();
        return;
      }
      playClickSound();
      const now = Date.now();
      const pending = state.tasks.filter(t => t.status === "queued" || t.status === "active").sort(compareRank);
      let rank = 1000;
      if (pending.length > 0) {
        // Add to top: just above the current #1 (only the new task is written; no rank collapse).
        rank = promoteToTop ? (Number(pending[0].rank) || 0) - 1000 : pending[pending.length - 1].rank + 1000;
      }
      const scheduledDate = composerDateKey || toLocalDateKey(now);
      state.tasks.push({
        id: "tsk-" + now + "-" + Math.random().toString(36).slice(2, 6),
        title: titleEl.value.trim(),
        notes: notesEl ? notesEl.value.trim() : "",
        questId: resolveComposerQuestId(composerQuestId),
        status: "queued",
        rank,
        accumulatedSeconds: 0,
        scheduledDate,
        createdAt: now,
        updatedAt: now
      });
      closeSheet();
      composerDraft = null; // submitted: the next New Task starts empty
      storeComposerDraft();
      commitLocalChange();
      const todayKey = toLocalDateKey(now);
      const tomorrowKey = dayKeyOffset(1, now);
      if (scheduledDate === todayKey) showToast(promoteToTop ? "Added to the top of today's queue" : "Added to today's queue");
      else if (scheduledDate === tomorrowKey) showToast("Added for tomorrow");
      else showToast("Added for " + dateKeyLabel(scheduledDate));
    }

    function openTaskInspectorSheet(taskId) {
      playClickSound();
      const task = state.tasks.find(t => t.id === taskId);
      if (!task) return;
      const todayKey = toLocalDateKey();
      const tomorrowKey = dayKeyOffset(1);
      const dayKey = task.scheduledDate || todayKey;
      const otherDay = dayKey !== todayKey && dayKey !== tomorrowKey;

      showSheet("task:" + task.id, `
          ${sheetHeaderHtml("Task Options")}

          <input class="sheet-input" value="${escapeHtml(task.title)}" aria-label="Task title" oninput="draftTaskField(${jsArg(task.id)}, 'title', this.value)" onchange="updateTaskField(${jsArg(task.id)}, 'title', this.value)" />
          <textarea class="sheet-input" rows="3" placeholder="Add session notes..." aria-label="Notes" oninput="draftTaskField(${jsArg(task.id)}, 'notes', this.value)" onchange="updateTaskField(${jsArg(task.id)}, 'notes', this.value)">${escapeHtml(task.notes || "")}</textarea>

          <!-- Quick Actions -->
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;">
            <button class="pressable" onclick="initializeFocus(${jsArg(task.id)})" style="height:var(--touch-min);border-radius:12px;border:none;background:var(--cyan);color:#05070a;font-weight:700;font-size:13px;cursor:pointer;">
              ▶ Start Focus
            </button>
            <button class="pressable" onclick="promoteTaskToTop(${jsArg(task.id)})" style="height:var(--touch-min);border-radius:12px;border:1px solid var(--border-strong);background:var(--surface-2);color:white;font-weight:600;font-size:13px;cursor:pointer;">
              ↑ Move to #1
            </button>
          </div>

          <div class="sheet-label">Assigned Quest</div>
          <div class="sheet-pill-group" role="group" aria-label="Assigned quest">
            ${activeQuestsList().map(q => `
              <button class="sheet-pill ${task.questId === q.id ? 'selected' : ''}" aria-pressed="${task.questId === q.id}" onclick="selectPill(this);updateTaskField(${jsArg(task.id)}, 'questId', ${jsArg(q.id)});">
                <span style="width:8px;height:8px;border-radius:50%;background:${ACCENT_HEX[q.accentColor] || ACCENT_HEX.slate};"></span>
                <span>${escapeHtml(q.title)}</span>
              </button>
            `).join("")}
            <button class="sheet-pill ${task.questId === null ? 'selected' : ''}" aria-pressed="${task.questId === null}" onclick="selectPill(this);updateTaskField(${jsArg(task.id)}, 'questId', null);">
              <span style="width:8px;height:8px;border-radius:50%;background:var(--slate);"></span>
              <span>Other work</span>
            </button>
          </div>

          <div class="sheet-label">Scheduled Day</div>
          <div class="sheet-pill-group" role="group" aria-label="Scheduled day">
            <button class="sheet-pill ${dayKey === todayKey ? 'selected' : ''}" aria-pressed="${dayKey === todayKey}" onclick="selectPill(this);updateTaskField(${jsArg(task.id)}, 'scheduledDate', ${jsArg(todayKey)});">Today</button>
            <button class="sheet-pill ${dayKey === tomorrowKey ? 'selected' : ''}" aria-pressed="${dayKey === tomorrowKey}" onclick="selectPill(this);updateTaskField(${jsArg(task.id)}, 'scheduledDate', ${jsArg(tomorrowKey)});">Tomorrow</button>
            ${otherDay ? `<button class="sheet-pill selected" aria-pressed="true" onclick="selectPill(this);updateTaskField(${jsArg(task.id)}, 'scheduledDate', ${jsArg(dayKey)});">${escapeHtml(dateKeyLabel(dayKey))}</button>` : ""}
          </div>

          <div class="sheet-footer-row">
            <button class="text-action" onclick="completeTaskDirect(${jsArg(task.id)})" style="color:var(--emerald);">✓ Mark Completed</button>
            <button class="danger-outline-btn" onclick="deleteTaskItem(${jsArg(task.id)})">Delete Task</button>
          </div>
      `);
    }

    let selectedQuestColor = "cyan";
    let questFormBaseline = null; // the New Quest / Edit Quest form as it opened (readQuestForm())

    const QUEST_FORM_IDS = {
      create: ["newQuestTitleInput", "newQuestDescInput", "newQuestTargetInput"],
      edit: ["sheetQuestTitle", "sheetQuestDesc", "sheetQuestTarget"]
    };

    // The fields of the quest form open as sheet `kind` ("newQuest" | "quest:<id>"), or null.
    function questFormFields(kind) {
      const sc = document.getElementById("sheetContainer");
      if (!sc || !isSheetOpen() || sc.dataset.sheet !== kind) return null;
      const ids = kind === "newQuest" ? QUEST_FORM_IDS.create : kind.startsWith("quest:") ? QUEST_FORM_IDS.edit : null;
      const els = ids ? ids.map(id => document.getElementById(id)) : [];
      return els.length && els.every(Boolean) ? { title: els[0], desc: els[1], target: els[2] } : null;
    }

    // { kind, title, desc, target, color } of the quest form on screen, or null when none is open.
    function readQuestForm() {
      const sc = document.getElementById("sheetContainer");
      const kind = sc ? sc.dataset.sheet || "" : "";
      const f = questFormFields(kind);
      return f ? { kind, title: f.title.value, desc: f.desc.value, target: f.target.value, color: selectedQuestColor } : null;
    }

    // The quest form being dismissed: a Restore offer when it differs from how it opened, else null.
    function discardedQuestForm() {
      const opened = questFormBaseline;
      questFormBaseline = null;
      const values = readQuestForm();
      if (!opened || !values || JSON.stringify(values) === JSON.stringify(opened)) return null;
      return { message: "Quest edits discarded", undo: () => restoreQuestForm(values) };
    }

    // Restore: the sheet opens again (Edit Quest only while that quest still exists) with the typed
    // values; it still counts as changed, so dismissing it again offers Restore again.
    function restoreQuestForm(values) {
      const questId = values.kind === "newQuest" ? null : values.kind.slice("quest:".length);
      // the quest was deleted meanwhile (e.g. by a sync): nothing to reopen, the sheet open now stays
      if (questId !== null && !state.quests.some(q => q.id === questId)) return;
      if (isSheetOpen()) closeSheet(); // the sheet open now is dismissed the usual way
      if (questId === null) renderNewQuestSheet();
      else renderQuestEditorSheet(questId);
      const f = questFormFields(values.kind);
      if (!f) return;
      f.title.value = values.title;
      f.desc.value = values.desc;
      f.target.value = values.target;
      selectedQuestColor = values.color;
      selectPill(Array.from(document.querySelectorAll("#sheetContainer .sheet-pill[data-color]")).find(b => b.dataset.color === values.color));
    }

    function openNewQuestSheet() {
      playClickSound();
      renderNewQuestSheet();
    }

    function questColorPillsHtml() {
      return ["cyan", "amber", "emerald"].map(col => `
              <button class="sheet-pill ${selectedQuestColor === col ? 'selected' : ''}" aria-pressed="${selectedQuestColor === col}" data-color="${escapeHtml(col)}" onclick="selectedQuestColor=${jsArg(col)};selectPill(this);">
                <span style="width:9px;height:9px;border-radius:50%;background:${ACCENT_HEX[col]};"></span>
                <span style="text-transform:capitalize;">${col}</span>
              </button>
            `).join("");
    }

    // Always fresh (closing a sheet discards it), so no value leaks from an earlier form.
    function renderNewQuestSheet() {
      selectedQuestColor = "cyan";
      showSheet("newQuest", `
          ${sheetHeaderHtml("New Quest")}

          <label class="sheet-label" for="newQuestTitleInput">Quest Title</label>
          <input id="newQuestTitleInput" class="sheet-input" placeholder="e.g. Launch my idea" value="" enterkeyhint="done" onkeydown="if(isSubmitKey(event)) createNewQuestFromSheet()" />

          <label class="sheet-label" for="newQuestDescInput">Description</label>
          <textarea id="newQuestDescInput" class="sheet-input" rows="2" placeholder="What moves this quest forward?" onkeydown="if(isSubmitKey(event)) createNewQuestFromSheet()"></textarea>

          <div class="sheet-label">Accent Color</div>
          <div class="sheet-pill-group" role="group" aria-label="Accent color">
            ${questColorPillsHtml()}
          </div>

          <label class="sheet-label" for="newQuestTargetInput">Weekly Target Hours</label>
          <input id="newQuestTargetInput" type="number" inputmode="numeric" min="1" max="100" class="sheet-input" value="10" enterkeyhint="done" onkeydown="if(isSubmitKey(event)) createNewQuestFromSheet()" />

          <div class="sheet-actions single" style="margin-top:-4px;">
            <button class="pressable" onclick="createNewQuestFromSheet()" style="width:100%;height:var(--touch-min);border-radius:13px;border:none;background:var(--cyan);color:#05070a;font-family:var(--font-display);font-weight:700;font-size:14px;cursor:pointer;">
              Create Quest
            </button>
          </div>
      `);
      questFormBaseline = readQuestForm();
      focusFieldSoon("newQuestTitleInput");
    }

    function createNewQuestFromSheet() {
      const tEl = document.getElementById("newQuestTitleInput");
      const dEl = document.getElementById("newQuestDescInput");
      const hEl = document.getElementById("newQuestTargetInput");
      if (!tEl || !tEl.value.trim()) {
        if (tEl) tEl.focus();
        return;
      }
      playCompleteSound();
      const now = Date.now();
      const title = tEl.value.trim();
      state.quests.push({
        id: "quest-" + now + "-" + Math.random().toString(36).slice(2, 6),
        slotIndex: activeQuestsList().length % 3,
        code: title.slice(0, 10).toUpperCase(),
        title,
        description: dEl ? dEl.value.trim() : "",
        accentColor: selectedQuestColor || "cyan",
        targetWeeklyHours: Math.max(1, Number(hEl ? hEl.value : 10) || 10),
        archived: false,
        createdAt: now,
        updatedAt: now
      });
      questFormBaseline = null; // committed: closing is not a discard
      closeSheet();
      commitLocalChange();
      showToast("Quest created · " + shortTitle(title));
    }

    function openQuestEditorSheet(questId) {
      playClickSound();
      renderQuestEditorSheet(questId);
    }

    // Always rendered from the quest itself: opening quest B after quest A shows B's values.
    function renderQuestEditorSheet(questId) {
      const q = state.quests.find(x => x.id === questId);
      if (!q) return;
      selectedQuestColor = q.accentColor || "cyan";

      showSheet("quest:" + q.id, `
          ${sheetHeaderHtml("Edit Quest")}

          <label class="sheet-label" for="sheetQuestTitle">Quest Title</label>
          <input id="sheetQuestTitle" class="sheet-input" value="${escapeHtml(q.title)}" enterkeyhint="done" onkeydown="if(isSubmitKey(event)) saveQuestFromSheet(${jsArg(q.id)})" />

          <label class="sheet-label" for="sheetQuestDesc">Description</label>
          <textarea id="sheetQuestDesc" class="sheet-input" rows="2" onkeydown="if(isSubmitKey(event)) saveQuestFromSheet(${jsArg(q.id)})">${escapeHtml(q.description || "")}</textarea>

          <div class="sheet-label">Accent Color</div>
          <div class="sheet-pill-group" role="group" aria-label="Accent color">
            ${questColorPillsHtml()}
          </div>

          <label class="sheet-label" for="sheetQuestTarget">Weekly Target Hours</label>
          <input id="sheetQuestTarget" type="number" inputmode="numeric" min="1" max="100" class="sheet-input" value="${escapeHtml(q.targetWeeklyHours)}" enterkeyhint="done" onkeydown="if(isSubmitKey(event)) saveQuestFromSheet(${jsArg(q.id)})" />

          ${!q.archived ? `
            <button class="pressable" onclick="completeQuestItem(${jsArg(q.id)})" style="width:100%;height:var(--touch-min);margin-bottom:10px;border-radius:13px;border:1px solid rgba(0,255,157,0.35);background:rgba(0,255,157,0.08);color:var(--emerald);font-family:var(--font-display);font-weight:700;font-size:14px;cursor:pointer;">
              ✓ Complete Quest
            </button>
          ` : ""}

          <div class="sheet-actions" style="margin-top:-2px;">
            <button class="pressable" onclick="deleteQuestItem(${jsArg(q.id)})" style="height:var(--touch-min);border-radius:13px;border:1px solid rgba(255,42,95,0.35);background:rgba(255,42,95,0.1);color:var(--rose);font-family:var(--font-display);font-weight:700;font-size:14px;cursor:pointer;">
              Delete Quest
            </button>
            <button class="pressable" onclick="saveQuestFromSheet(${jsArg(q.id)})" style="height:var(--touch-min);border-radius:13px;border:none;background:var(--cyan);color:#05070a;font-family:var(--font-display);font-weight:700;font-size:14px;cursor:pointer;">
              Save Changes
            </button>
          </div>
      `);
      questFormBaseline = readQuestForm();
    }

    function saveQuestFromSheet(questId) {
      playClickSound();
      const q = state.quests.find(x => x.id === questId);
      if (!q) return;
      const sc = document.getElementById("sheetContainer");
      if (!sc || sc.dataset.sheet !== "quest:" + questId) return; // the form on screen belongs to another quest
      const tEl = document.getElementById("sheetQuestTitle");
      const dEl = document.getElementById("sheetQuestDesc");
      const hEl = document.getElementById("sheetQuestTarget");
      const before = JSON.stringify(q);
      if (tEl && tEl.value.trim()) q.title = tEl.value.trim();
      if (dEl) q.description = dEl.value.trim();
      if (hEl) q.targetWeeklyHours = Math.max(1, Number(hEl.value) || 10);
      q.accentColor = selectedQuestColor || q.accentColor;
      questFormBaseline = null; // committed: closing is not a discard
      closeSheet();
      if (JSON.stringify(q) === before) return; // nothing edited: no write, no sync
      q.updatedAt = nextStamp(q);
      commitLocalChange();
      showToast("Quest saved");
    }

    function completeQuestItem(questId) {
      playCompleteSound();
      const now = Date.now();
      const quest = state.quests.find(q => q.id === questId);
      questFormBaseline = null;
      if (!quest) {
        closeSheet();
        return;
      }
      const prevArchived = !!quest.archived;
      const prevCompletedAt = quest.completedAt;
      quest.archived = true;
      quest.completedAt = now;
      const completedStamp = nextStamp(quest, now);
      quest.updatedAt = completedStamp;

      const unassigned = [];
      state.tasks.forEach(t => {
        if (t.questId === questId && (t.status === "queued" || t.status === "active")) {
          const unlinkedAt = nextStamp(t, now);
          unassigned.push({ id: t.id, questId: t.questId, unlinkedAt });
          t.questId = null;
          t.updatedAt = unlinkedAt;
        }
      });
      const unassignedHabits = [];
      asArray(state.habits).forEach(h => {
        if (h.questId === questId) {
          const unlinkedAt = nextStamp(h, now);
          unassignedHabits.push({ id: h.id, questId: h.questId, unlinkedAt });
          h.questId = null;
          h.updatedAt = unlinkedAt;
        }
      });
      closeSheet();
      commitLocalChange();
      showToast("Quest completed · " + shortTitle(quest.title), {
        undo: () => undoCompleteQuest(questId, completedStamp, prevArchived, prevCompletedAt, unassigned, unassignedHabits)
      });
    }

    function undoCompleteQuest(questId, completedStamp, prevArchived, prevCompletedAt, unassigned, unassignedHabits) {
      const quest = state.quests.find(q => q.id === questId);
      if (!quest || !quest.archived || quest.updatedAt !== completedStamp) return;
      quest.archived = prevArchived;
      if (prevCompletedAt === undefined) delete quest.completedAt;
      else quest.completedAt = prevCompletedAt;
      quest.updatedAt = nextStamp(quest);
      asArray(unassignedHabits).forEach(u => {
        const h = asArray(state.habits).find(x => x.id === u.id);
        if (h && h.questId === null && h.updatedAt === u.unlinkedAt) {
          h.questId = u.questId;
          h.updatedAt = nextStamp(h);
        }
      });
      asArray(unassigned).forEach(u => {
        const t = state.tasks.find(x => x.id === u.id);
        if (t && t.questId === null && t.updatedAt === u.unlinkedAt) {
          t.questId = u.questId;
          t.updatedAt = nextStamp(t);
        }
      });
      commitLocalChange();
    }

    function reopenQuestItem(questId) {
      playLockSound();
      const quest = state.quests.find(q => q.id === questId);
      if (!quest) return;
      quest.archived = false;
      delete quest.completedAt;
      quest.updatedAt = nextStamp(quest);
      commitLocalChange();
      showToast("Quest reopened · " + shortTitle(quest.title));
    }

    function deleteQuestItem(questId) {
      playClickSound();
      const now = Date.now();
      const quest = state.quests.find(q => q.id === questId);
      questFormBaseline = null; // its sheet closes as a delete (with its own Undo), not as a discard
      if (!quest) {
        closeSheet();
        return;
      }
      const removed = cloneJson(quest);
      const hadTombstone = asArray(state.deletedQuestIds).includes(questId);
      if (!state.deletedQuestIds) state.deletedQuestIds = [];
      if (!hadTombstone) state.deletedQuestIds.push(questId);
      state.quests = state.quests.filter(q => q.id !== questId);
      const unassigned = [];
      state.tasks.forEach(t => {
        if (t.questId === questId) {
          const unlinkedAt = nextStamp(t, now);
          unassigned.push({ id: t.id, questId: t.questId, updatedAt: t.updatedAt, unlinkedAt });
          t.questId = null;
          t.updatedAt = unlinkedAt;
        }
      });
      const unassignedHabits = [];
      asArray(state.habits).forEach(h => {
        if (h.questId === questId) {
          const unlinkedAt = nextStamp(h, now);
          unassignedHabits.push({ id: h.id, questId: h.questId, updatedAt: h.updatedAt, unlinkedAt });
          h.questId = null;
          h.updatedAt = unlinkedAt;
        }
      });
      closeSheet();
      commitLocalChange();
      showToast("Quest deleted · " + shortTitle(removed.title), {
        holdSync: !hadTombstone,
        undo: () => undoDeleteQuest(removed, hadTombstone, unassigned, unassignedHabits)
      });
    }

    // Restores the quest object and re-links the tasks it un-assigned (those not edited since: still
    // carrying the unlink stamp). The re-link is a new edit (R6), so it also wins if the unlink synced.
    function undoDeleteQuest(removed, hadTombstone, unassigned, unassignedHabits) {
      if (state.quests.some(q => q.id === removed.id)) return;
      if (!hadTombstone) state.deletedQuestIds = asArray(state.deletedQuestIds).filter(id => id !== removed.id);
      state.quests.push(removed);
      state.quests.sort((a, b) => (a.slotIndex || 0) - (b.slotIndex || 0));
      asArray(unassignedHabits).forEach(u => {
        const h = asArray(state.habits).find(x => x.id === u.id);
        if (h && h.updatedAt === u.unlinkedAt && h.questId === null) {
          h.questId = u.questId;
          h.updatedAt = nextStamp(h);
        }
      });
      unassigned.forEach(u => {
        const t = state.tasks.find(x => x.id === u.id);
        if (t && t.questId === null && t.updatedAt === u.unlinkedAt) {
          t.questId = u.questId;
          t.updatedAt = nextStamp(t);
        }
      });
      commitLocalChange();
    }

    function isSyncSheetOpen() {
      const sc = document.getElementById("sheetContainer");
      return isSheetOpen() && !!sc && sc.dataset.sheet === "sync";
    }

    // ----- Sync sheet: truthful status, real routes, Sync Now with an in-place result -----
    // Human-readable failure reasons (contract reasons + JS-side ones). Offline reasons are calm.
    const SYNC_REASON_INFO = {
      unreachable: { title: "Laptop not reachable", detail: "It may be asleep, on another network, or Tailscale is off on this phone." },
      no_network: { title: "No network connection", detail: "Connect to Wi-Fi or mobile data and Hunt syncs on its own." },
      refused: { title: "Hunt isn't running on the laptop", detail: "The laptop answered, but the Hunt server is not running. Start Hunt on your laptop." },
      server_timeout: { title: "Laptop server not responding", detail: "Hunt on the laptop accepted the connection but did not answer in time." },
      js_timeout: { title: "The laptop took too long", detail: "The sync did not finish in time." },
      auth: { title: "Not paired, or the key was rejected", detail: "Paste the pairing link from the desktop Phone & Sync window into Laptop address." },
      too_large: { title: "Data too large to sync", detail: "The laptop rejected the sync because the data is too large." },
      bad_response: { title: "Unexpected answer", detail: "Something answered at this address, but it is not the Hunt sync server." },
      busy: { title: "Still finishing the last sync", detail: "Try again in a moment." },
      error: { title: "Couldn't sync", detail: "Something went wrong while syncing." }
    };

    function syncReasonInfo(reason) {
      if (SYNC_REASON_INFO[reason]) return SYNC_REASON_INFO[reason];
      const m = /^http_(\d+)$/.exec(reason || "");
      if (m) return { title: "Laptop server error", detail: "Hunt on the laptop answered with HTTP " + m[1] + "." };
      return SYNC_REASON_INFO.error;
    }

    // { name: "Home Wi-Fi" | "Tailscale" | "Local network" | ..., address: "192.168.2.136" }
    function describeRoute(url) {
      const { host, port } = parseUrlHost(url);
      let name = "Custom";
      if (url === KNOWN_LAPTOP_URLS[0]) name = "Home Wi-Fi";
      else if (isTailscaleHost(host)) name = "Tailscale";
      else if (isPrivateHost(host)) name = "Local network";
      else if (host === "localhost" || host === "127.0.0.1") name = "This device";
      else if (location.host && location.host === host + (port ? ":" + port : "")) name = "This server";
      return { name, address: host + (port && port !== "3000" ? ":" + port : "") };
    }

    let appVersionCache = null;
    function appVersionLabel() {
      if (appVersionCache === null) {
        const v = bridgeCall("getAppVersion");
        appVersionCache = typeof v === "string" ? v.trim() : "";
      }
      if (appVersionCache) return "Hunt for Android · v" + appVersionCache;
      return window.AndroidBridge ? "Hunt for Android" : "Hunt · web companion";
    }

    // Sheet-local UI state (survives in-place refreshes; reset when the sheet is opened fresh).
    const syncSheetUi = { urlDirty: false, hint: "" };
    let lastManualSyncResult = null; // { ...result, at } of the last Sync Now from the sheet
    let shownRouteUrls = [];

    function openSyncSheet() {
      playClickSound();
      renderSyncSheet();
    }

    function renderSyncSheet() {
      if (isSyncSheetOpen()) {
        refreshSyncSheet();
        return;
      }
      syncSheetUi.urlDirty = false;
      syncSheetUi.hint = "";
      if (!manualSyncPromise) lastManualSyncResult = null;
      showSheet("sync", `
          <div class="sheet-handle" aria-hidden="true"></div>
          <div class="sheet-head">
            <div style="display:flex;align-items:center;gap:10px;min-width:0;">
              <span id="syncSheetDot" class="dot-indicator"></span>
              <h3 id="sheetTitle" class="sheet-title">Laptop sync</h3>
            </div>
            <button class="sheet-close" onclick="closeSheet()" aria-label="Close">×</button>
          </div>

          <div id="syncStatusCard" class="sync-status-card"></div>

          <div class="sheet-label">Route</div>
          <div id="syncRoutePills" class="sheet-pill-group" role="group" aria-label="Laptop route"></div>

          <label class="sheet-label" for="modalLaptopUrl">Laptop address</label>
          <input id="modalLaptopUrl" class="sheet-input mono-input" type="url" inputmode="url" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="go" value="${escapeHtml(getLaptopBaseUrl())}" placeholder="Pairing link or http://192.168.2.136:3000" oninput="syncSheetUi.urlDirty=true;setSyncHint('')" onchange="applyLaptopUrlInput(this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();manualSyncFromSheet();}" />
          <div id="syncUrlHint" class="sync-hint" role="alert"></div>

          <button id="syncNowBtn" class="sync-now-btn pressable" onclick="manualSyncFromSheet()"></button>
          <div id="syncResultLine" class="sync-result" aria-live="polite"></div>

          <div class="sync-footer">${escapeHtml(appVersionLabel())}</div>
      `);
      refreshSyncSheet();
    }

    function setSyncHint(text) {
      syncSheetUi.hint = text || "";
      setTextIfChanged(document.getElementById("syncUrlHint"), syncSheetUi.hint);
    }

    function nextTryText() {
      if (syncRun.inFlight) return "Trying now…";
      if (!syncRun.dueAt) return syncRun.paused ? "Paused, tap Sync Now" : "";
      const s = Math.max(1, Math.ceil((syncRun.dueAt - Date.now()) / 1000));
      return "Next automatic try in " + s + " s";
    }

    function syncStatusCardHtml(model) {
      const phase = model.phase;
      const last = syncRun.lastResult;
      let headline;
      let detail = "";
      if (phase === "connecting") {
        headline = "Connecting to your laptop…";
        detail = "Everything you do is saved on this phone first.";
      } else if (phase === "syncing") {
        headline = "Syncing with your laptop…";
      } else if (phase === "ok" || phase === "pending") {
        // pending: nothing is being sent right now; the "waiting to sync" line below says what is left
        headline = "Synced with your laptop";
      } else {
        const info = syncReasonInfo(syncMeta.lastError);
        headline = info.title;
        detail = info.detail;
        if (phase === "offline") detail += " Your tasks and focus sessions are saved on this phone and merge automatically when you reconnect.";
      }
      const lines = [];
      lines.push(syncMeta.lastOkAt
        ? `Last synced ${escapeHtml(relativeLong(syncMeta.lastOkAt))} <span class="sub">· ${escapeHtml(absoluteTime(syncMeta.lastOkAt))}</span>`
        : `<span class="sub">Not synced with a laptop yet</span>`);
      const healthy = phase === "ok" || phase === "pending" || (phase === "syncing" && isLaptopReachable);
      if (healthy && syncMeta.lastUrl) {
        const r = describeRoute(syncMeta.lastUrl);
        lines.push(`via ${escapeHtml(r.name)} <span class="sub">· ${escapeHtml(r.address)}</span>`);
      }
      if ((phase === "offline" || phase === "attention") && last && !last.ok && asArray(last.attempts).length) {
        // routes native never started ("skipped_*": VPN off, time limit) are not listed as tried
        const tried = [];
        const notTried = [];
        asArray(last.attempts).forEach(a => {
          const name = describeRoute(normalizeLaptopUrl(a.url) || a.url).name;
          const skip = skippedRouteNote(a.reason);
          const list = skip === null ? tried : notTried;
          const n = skip ? name + " (" + skip + ")" : name;
          if (!list.includes(n)) list.push(n);
        });
        const shortList = names => escapeHtml(names.slice(0, 3).join(", ")) + (names.length > 3 ? "…" : "");
        if (tried.length) lines.push(`<span class="sub">Tried ${shortList(tried)}</span>`);
        if (notTried.length) lines.push(`<span class="sub">Not tried: ${shortList(notTried)}</span>`);
      }
      if (phase === "offline" || phase === "attention") lines.push(`<span class="sub" id="syncNextTry"></span>`);
      const pending = model.pending;
      if (pending) lines.push(`${pending} change${pending === 1 ? "" : "s"} on this phone waiting to sync`);
      else if (syncMeta.lastOkAt && phase !== "connecting") lines.push(`<span class="sub">All changes synced</span>`);

      // shown only when true (the last round trip was accepted); a rejected key is the headline instead
      let badge = "";
      if (last && last.ok && isLaptopReachable) {
        const routes = buildCandidateUrls().length;
        badge = `<span class="sync-badge ok">● Pairing key accepted${routes > 1 ? " · auto-failover across " + routes + " routes" : ""}</span>`;
      }

      const dotCls = model.dot;
      return `
        <div class="sync-headline"><span class="dot-indicator ${dotCls}"></span><span>${escapeHtml(headline)}</span></div>
        ${detail ? `<p class="sync-detail">${escapeHtml(detail)}</p>` : ""}
        ${lines.map(l => `<div class="sync-meta-line">${l}</div>`).join("")}
        ${badge}
      `;
    }

    // Native reports routes it never started as "skipped_*" (skipped_no_vpn: Tailscale address while
    // the VPN is off; skipped_budget: the sync's time limit ran out first). null = really tried.
    function skippedRouteNote(reason) {
      const r = String(reason || "");
      if (!/^skipped/.test(r)) return null;
      if (r === "skipped_no_vpn") return "VPN off";
      if (r === "skipped_budget") return "time limit";
      return "";
    }

    function routePillsHtml() {
      const primary = getLaptopBaseUrl();
      shownRouteUrls = sanitizeUrlList([primary, ...syncMeta.lanUrls, ...KNOWN_LAPTOP_URLS]);
      const last = syncRun.lastResult;
      return shownRouteUrls.map((url, i) => {
        const r = describeRoute(url);
        const attempt = last ? asArray(last.attempts).find(a => normalizeLaptopUrl(a.url) === url) : null;
        const answered = !!(last && last.ok && normalizeLaptopUrl(last.url) === url);
        const skip = attempt ? skippedRouteNote(attempt.reason) : null;
        const status = answered ? "ok" : attempt ? (skip !== null ? "skipped" : "fail") : "";
        const statusText = answered ? "answered last sync"
          : skip !== null ? "not tried" + (skip ? " (" + skip + ")" : "")
          : attempt ? "not reachable last time" : "not tried yet";
        const selected = url === primary;
        return `<button class="sheet-pill route-pill ${selected ? "selected" : ""}" aria-pressed="${selected}" aria-label="${escapeHtml(r.name + " " + r.address + ", " + statusText)}" onclick="chooseLaptopUrlAt(${i})">
            <span class="route-dot ${status}"></span><span class="route-name">${escapeHtml(r.name)}</span><span class="route-addr">${escapeHtml(r.address)}</span>
          </button>`;
      }).join("");
    }

    function manualResultHtml() {
      if (manualSyncPromise) return "";
      const r = lastManualSyncResult;
      if (!r || r.reason === "bad_url") return "";
      if (r.ok) {
        const via = r.url ? " via " + describeRoute(normalizeLaptopUrl(r.url) || r.url).name : "";
        return `<span class="ok">✓ Synced ${escapeHtml(relativeLong(r.at))}${escapeHtml(via)}</span>`;
      }
      const info = syncReasonInfo(r.reason);
      if (isAttentionReason(r.reason)) return `<span class="warn">${escapeHtml(info.title)}</span>`;
      return `<span>${escapeHtml(info.title)}. Your changes are safe on this phone.</span>`;
    }

    // Updates the open sync sheet in place (no re-open, no slide-up, the URL field keeps its text/caret).
    function refreshSyncSheet() {
      if (!isSyncSheetOpen()) return;
      const model = syncChipModel(false);
      const dot = document.getElementById("syncSheetDot");
      if (dot && dot.className !== "dot-indicator " + model.dot) dot.className = "dot-indicator " + model.dot;
      const card = document.getElementById("syncStatusCard");
      setHtmlIfChanged(card, syncStatusCardHtml(model));
      setAttrIfChanged(card, "data-tone", model.phase === "ok" || model.phase === "pending" ? "ok" : model.phase === "attention" ? "attention" : "neutral");
      setTextIfChanged(document.getElementById("syncNextTry"), nextTryText());
      setHtmlIfChanged(document.getElementById("syncRoutePills"), routePillsHtml());
      const input = document.getElementById("modalLaptopUrl");
      const url = getLaptopBaseUrl();
      if (input && !syncSheetUi.urlDirty && document.activeElement !== input && input.value !== url) input.value = url;
      setTextIfChanged(document.getElementById("syncUrlHint"), syncSheetUi.hint);
      const btn = document.getElementById("syncNowBtn");
      const running = !!manualSyncPromise;
      if (btn) {
        setHtmlIfChanged(btn, running ? `<span class="spinner" aria-hidden="true"></span><span>Syncing…</span>` : `<span aria-hidden="true">↻</span><span>Sync Now</span>`);
        if (btn.disabled !== running) btn.disabled = running;
        setAttrIfChanged(btn, "aria-busy", running ? "true" : "false");
      }
      setHtmlIfChanged(document.getElementById("syncResultLine"), manualResultHtml());
    }

    // A pasted pairing link: its key is saved (APK: native storage; browser copy: localStorage) and the
    // link's origin continues as the laptop address. -> { address, paired } or { error: hint text }.
    function takePairingLink(typed) {
      const link = parsePairingLink(typed);
      if (!link) return { address: typed, paired: false };
      if (link.error) return { error: "That pairing link is incomplete. Copy it again from the laptop's Phone & Sync window." };
      if (!storePairingToken(link.token)) return { error: "This phone did not accept that pairing key. Copy the link again from the laptop's Phone & Sync window." };
      syncRun.routeEpoch++; // a request still out was sent with the old key: Sync Now must not reuse its answer
      return { address: link.url, paired: true };
    }

    // Sync Now with the address or key just chosen; a Sync Now still running used the previous ones, so
    // the new attempt runs right after it (an automatic one when the sheet was closed meanwhile: that
    // Sync Now may have paused syncing, and nothing else would try the new key).
    function manualSyncWithNewSettings() {
      if (manualSyncPromise) manualSyncPromise.then(() => { if (isSyncSheetOpen()) manualSyncFromSheet(); else kickSync(); });
      else manualSyncFromSheet();
    }

    // Typed address or pasted pairing link: validated, saved (tried first next time), pills updated in
    // place. A new pairing key is tried right away (fromSyncNow: the calling Sync Now does that).
    function applyLaptopUrlInput(value, fromSyncNow) {
      const typed = String(value || "").trim();
      if (!typed) {
        setSyncHint("Paste the pairing link from the laptop's Phone & Sync window, or enter its address, for example http://192.168.2.136:3000");
        return false;
      }
      const pairing = takePairingLink(typed);
      if (pairing.error) {
        setSyncHint(pairing.error);
        return false;
      }
      const clean = normalizeLaptopUrl(pairing.address);
      if (!clean) {
        setSyncHint("That doesn't look like an address or a pairing link. Try http://192.168.2.136:3000");
        return false;
      }
      syncSheetUi.urlDirty = false;
      setSyncHint("");
      if (clean !== getLaptopBaseUrl()) setLaptopBaseUrl(clean);
      const input = document.getElementById("modalLaptopUrl");
      // a pasted key never stays visible in the field
      if (input && (pairing.paired || document.activeElement !== input) && input.value !== clean) input.value = clean;
      refreshSyncSheet();
      if (pairing.paired && !fromSyncNow) manualSyncWithNewSettings();
      return true;
    }

    // Tapping a route makes it the preferred one and tries it right away.
    function chooseLaptopUrlAt(index) {
      const url = shownRouteUrls[index];
      if (url) chooseLaptopUrl(url);
    }

    function chooseLaptopUrl(url) {
      const pairing = takePairingLink(String(url || "").trim());
      if (pairing.error) {
        setSyncHint(pairing.error);
        return;
      }
      const clean = normalizeLaptopUrl(pairing.address);
      if (!clean) return;
      const input = document.getElementById("modalLaptopUrl");
      if (input) input.value = clean;
      syncSheetUi.urlDirty = false;
      setSyncHint("");
      if (clean !== getLaptopBaseUrl()) setLaptopBaseUrl(clean);
      refreshSyncSheet();
      manualSyncWithNewSettings();
    }

    // Sync Now: keep an edited address, then await the REAL result and show it in place.
    async function manualSyncFromSheet() {
      if (manualSyncPromise) return manualSyncPromise; // double tap: same round trip
      const input = document.getElementById("modalLaptopUrl");
      if (input && isSyncSheetOpen() && normalizeLaptopUrl(input.value) !== getLaptopBaseUrl()) {
        if (!applyLaptopUrlInput(input.value, true)) return syncFailure("bad_url");
      }
      playClickSound();
      lastManualSyncResult = null;
      const promise = syncNow();
      refreshSyncSheet(); // spinner + "Syncing…" right away
      let result;
      try {
        result = await promise;
      } catch (e) {
        result = syncFailure("error");
      }
      lastManualSyncResult = { ...result, at: Date.now() };
      // syncNow's promise settles before its finally() clears manualSyncPromise: wait one turn
      await Promise.resolve();
      if (isSyncSheetOpen()) refreshSyncSheet();
      return result;
    }

    function saveHabitEdits(habitId) {
      const h = asArray(state.habits).find(x => x.id === habitId);
      if (!h) { closeSheet(); return; }
      const tEl = document.getElementById("editHabitTitleInput");
      const nEl = document.getElementById("editHabitNotesInput");
      const title = tEl ? tEl.value.trim().slice(0, 300) : "";
      if (!title) {
        if (tEl) { tEl.focus(); tEl.style.borderColor = "var(--rose)"; }
        return;
      }
      playClickSound();
      const prevNotes = h.notes || "";
      const nextNotes = nEl ? nEl.value.trim() : prevNotes;
      const nextQuestId = selectedHabitQuestId || null;
      const before = JSON.stringify(h);
      h.title = title;
      h.notes = nextNotes;
      h.questId = nextQuestId;
      closeSheet();
      if (JSON.stringify(h) === before) return;
      const now = Date.now();
      h.updatedAt = nextStamp(h, now);
      // Keep today's open materialized task aligned.
      const todayTask = state.tasks.find(t => t.id === habitTaskId(h.id, toLocalDateKey(now)));
      if (todayTask && (todayTask.status === "queued" || todayTask.status === "active")) {
        todayTask.title = h.title;
        todayTask.questId = h.questId;
        if ((todayTask.notes || "") === prevNotes) todayTask.notes = h.notes;
        todayTask.updatedAt = nextStamp(todayTask, now);
      }
      commitLocalChange();
      showToast("Habit saved");
    }

    function deleteHabitItem(habitId) {
      playClickSound();
      const h = asArray(state.habits).find(x => x.id === habitId);
      if (!h) { closeSheet(); return; }
      const removed = cloneJson(h);
      const hadHabitTomb = asArray(state.deletedHabitIds).includes(habitId);
      if (!state.deletedHabitIds) state.deletedHabitIds = [];
      if (!hadHabitTomb) state.deletedHabitIds.push(habitId);
      state.habits = asArray(state.habits).filter(x => x.id !== habitId);

      const todayTid = habitTaskId(habitId, toLocalDateKey());
      const todayTask = state.tasks.find(t => t.id === todayTid);
      let removedTask = null;
      let hadTaskTomb = false;
      if (todayTask && todayTask.status === "queued" && (todayTask.accumulatedSeconds || 0) === 0) {
        removedTask = cloneJson(todayTask);
        hadTaskTomb = asArray(state.deletedTaskIds).includes(todayTid);
        if (!state.deletedTaskIds) state.deletedTaskIds = [];
        if (!hadTaskTomb) state.deletedTaskIds.push(todayTid);
        state.tasks = state.tasks.filter(t => t.id !== todayTid);
      }
      closeSheet();
      commitLocalChange();
      showToast("Habit deleted · " + shortTitle(removed.title), {
        holdSync: !hadHabitTomb,
        undo: () => undoDeleteHabit(removed, hadHabitTomb, removedTask, hadTaskTomb)
      });
    }

    function undoDeleteHabit(removed, hadHabitTomb, removedTask, hadTaskTomb) {
      if (asArray(state.habits).some(x => x.id === removed.id)) return;
      if (!hadHabitTomb) state.deletedHabitIds = asArray(state.deletedHabitIds).filter(id => id !== removed.id);
      if (!state.habits) state.habits = [];
      state.habits.push(removed);
      state.habits.sort(compareRank);
      if (removedTask && !state.tasks.some(t => t.id === removedTask.id)) {
        if (!hadTaskTomb) state.deletedTaskIds = asArray(state.deletedTaskIds).filter(id => id !== removedTask.id);
        state.tasks.push(removedTask);
        state.tasks.sort(compareRank);
      }
      commitLocalChange();
    }

    function toggleHabitToday(habitId) {
      const todayKey = toLocalDateKey();
      const tid = habitTaskId(habitId, todayKey);
      let t = state.tasks.find(x => x.id === tid);
      if (!t) {
        // Re-materialize if needed (even if user had dismissed today's copy earlier).
        const h = asArray(state.habits).find(x => x.id === habitId);
        if (!h) return;
        state.deletedTaskIds = asArray(state.deletedTaskIds).filter(id => id !== tid);
        t = buildHabitTaskRow(h, todayKey);
        state.tasks.push(t);
        state.tasks.sort(compareRank);
      }
      if (t.status === "completed") reopenTaskDirect(t.id);
      else completeTaskDirect(t.id);
    }

    function focusHabitToday(habitId) {
      const todayKey = toLocalDateKey();
      const tid = habitTaskId(habitId, todayKey);
      let t = state.tasks.find(x => x.id === tid);
      if (!t) {
        const h = asArray(state.habits).find(x => x.id === habitId);
        if (!h) return;
        state.deletedTaskIds = asArray(state.deletedTaskIds).filter(id => id !== tid);
        t = buildHabitTaskRow(h, todayKey);
        state.tasks.push(t);
        state.tasks.sort(compareRank);

      if (t.status === "completed") reopenTaskDirect(t.id);
      initializeFocus(t.id);
    }

      const af = state.activeFocus;
      const isRunningHere = af && af.activeTaskId === task.id && af.isRunning;
      const delta = isRunningHere && af.sessionStartedAt ? Math.max(0, Math.floor((Date.now() - af.sessionStartedAt) / 1000)) : 0;
      const totalSec = (task.accumulatedSeconds || 0) + delta;
      const title = escapeHtml(task.title);

      return `
        <div class="queue-item-card" data-flip-task-id="${escapeHtml(task.id)}">
          <div class="card-edge-bar" style="background:${hex};"></div>

          <button class="task-check-ring" onclick="completeTaskDirect(${jsArg(task.id)})" aria-label="Complete ${title}">

            </div>

          <div class="queue-item-right">
            <button class="mini-play-btn" onclick="initializeFocus(${jsArg(task.id)})" aria-label="${isRunningHere ? "Open focus on" : "Start focus on"} ${title}">

          </div>

    const GUIDE_VAGUE_STARTERS = ["work on","think about","look into","figure out","deal with","handle","try to","do some","do ","stuff","misc","things","various","continue"];
    const GUIDE_OVERSIZED = ["entire","whole","everything","all of","complete overhaul","from scratch","redesign all","finish all"];

    function evaluateGuideTaskDraft(title, notes) {
      const trimmed = typeof title === "string" ? title.trim() : "";
      const trimmedNotes = typeof notes === "string" ? notes.trim() : "";
      if (!trimmed) {
        return { verdict: "empty", score: 0, maxScore: 8, summary: "Type a task draft or tap an example to get instant science feedback.", checks: [] };
      }
      const sample = trimmed.slice(0, 1000);
      const words = sample.split(/\s+/).filter(Boolean);
      const lower = sample.toLowerCase();
      const firstToken = (words[0] || "").replace(/^[^A-Za-z0-9\u00C0-\u024F]+|[^A-Za-z0-9\u00C0-\u024F]+$/g, "").toLowerCase();
      const startsVague = GUIDE_VAGUE_STARTERS.some(p => lower === p.trim() || lower.startsWith(p));
      let verbCheck;
      if (startsVague) {
        verbCheck = { id: "verb", label: "Concrete starting verb", status: "fail", principle: "Implementation Intentions", detail: "Starts with a vague filler phrase. Replace it with a physical verb (Draft, Sketch, Implement, Run)." };
      } else if (GUIDE_CONCRETE_VERBS.has(firstToken)) {
        verbCheck = { id: "verb", label: "Concrete starting verb", status: "pass", principle: "Implementation Intentions", detail: 'Opens with an observable action ("' + words[0] + '"), removing initiation friction.' };
      } else if (firstToken && !/^[a-z]+$/.test(firstToken)) {
        verbCheck = { id: "verb", label: "Concrete starting verb", status: words.length >= 3 ? "pass" : "warn", principle: "Implementation Intentions", detail: words.length >= 3 ? "Multi-word phrasing — make sure it opens with a concrete physical action." : "Add a concrete starting verb so the first 30 seconds are clear." };
      } else {
        verbCheck = { id: "verb", label: "Concrete starting verb", status: "fail", principle: "Implementation Intentions", detail: "Reads like a topic/noun. Start with a concrete verb (Draft, Build, Fix, Review, Run)." };
      }

      let specCheck;
      if (words.length < 3) {
        specCheck = { id: "spec", label: "Specific next step", status: "fail", principle: "Goal Specificity", detail: "Too brief — name the specific section, artifact, or route." };
      } else if (trimmed.length > 120 || words.length > 20) {
        specCheck = { id: "spec", label: "Specific next step", status: "warn", principle: "Cognitive Load", detail: "Keep the title punchy and move supporting details into Notes." };
      } else {
        specCheck = { id: "spec", label: "Specific next step", status: "pass", principle: "Goal Specificity", detail: "Specific enough to act on immediately without re-planning." };
      }

      const bundles = (lower.match(/\band\b|&|;/g) || []).length;
      const oversized = GUIDE_OVERSIZED.some(p => lower.includes(p));
      let sizeCheck;
      if (oversized || bundles >= 2) {
        sizeCheck = { id: "size", label: "Single-sitting size (20–90m)", status: "fail", principle: "Zeigarnik Effect", detail: "Looks like a bundled mini-project. Split into single-sitting tasks." };
      } else if (bundles === 1 && words.length > 10) {
        sizeCheck = { id: "size", label: "Single-sitting size (20–90m)", status: "warn", principle: "Zeigarnik Effect", detail: "Two joined clauses — verify both fit inside one 20–90 min bout." };
      } else {
        sizeCheck = { id: "size", label: "Single-sitting size (20–90m)", status: "pass", principle: "Zeigarnik Effect", detail: "Focused on one cohesive action rather than a multi-day project." };
      }

      const hasQty = /\b\d+\b/.test(lower);
      const hasBound = /\b(intro|section|chapter|draft|wireframe|prototype|tests?|bug|fix|page|email|km|miles?|minutes?|min|hours?|summary|outline|notes|checklist|pr|review|v1)\b/.test(lower);
      let doneCheck;
      if (trimmedNotes.length >= 12 || (hasQty && words.length >= 3)) {
        doneCheck = { id: "done", label: "Clear finish line", status: "pass", principle: "Progress Principle", detail: trimmedNotes.length >= 12 ? "Clear completion criteria captured in Notes." : "Measurable boundary gives a clean completion signal." };
      } else if (hasBound && words.length >= 4) {
        doneCheck = { id: "done", label: "Clear finish line", status: "pass", principle: "Progress Principle", detail: "Names a concrete deliverable you can cleanly check off." };
      } else {
        doneCheck = { id: "done", label: "Clear finish line", status: "warn", principle: "Progress Principle", detail: "Add a quantity (e.g., '3 wireframes', '500 words') or a 1-line Definition of Done in Notes." };
      }

      const checks = [verbCheck, specCheck, sizeCheck, doneCheck];
      const score = checks.reduce((acc, c) => acc + (c.status === "pass" ? 2 : c.status === "warn" ? 1 : 0), 0);
      const verdict = score >= 7 ? "strong" : score >= 4 ? "fair" : "weak";
      const summary = verdict === "strong" ? "Ready for Focus — clear action, realistic scope, and a clean finish line."
        : verdict === "fair" ? "Good start — tighten the highlighted items so starting feels effortless."
        : "Too ambiguous or oversized — sharpen the starting verb and narrow it to one sitting.";
      return { verdict, score, maxScore: 8, summary, checks };
    }

    function evaluateGuideQuestDraft(title, desc, hoursVal, existingCount, existingHours) {
      const trimmed = typeof title === "string" ? title.trim() : "";
      const trimmedDesc = typeof desc === "string" ? desc.trim() : "";
      if (!trimmed) {
        return { verdict: "empty", score: 0, maxScore: 8, summary: "Draft a Quest title, purpose, and weekly hours to test its design.", checks: [] };
      }
      const sample = trimmed.slice(0, 1000);
      const words = sample.split(/\s+/).filter(Boolean);
      const lower = sample.toLowerCase();
      const hrs = Number(hoursVal);
      const exCnt = Number.isFinite(existingCount) ? Math.max(0, Math.floor(existingCount)) : 0;
      const exHrs = Number.isFinite(existingHours) ? Math.max(0, existingHours) : 0;
      const totalCnt = exCnt + 1;

      const capCheck = totalCnt <= 3
        ? { id: "cap", label: "Goal shielding (1–3 Quests)", status: "pass", principle: "Goal Shielding", detail: "Fits the 1–3 active Quest sweet spot (" + totalCnt + " total)." }
        : totalCnt === 4
        ? { id: "cap", label: "Goal shielding (1–3 Quests)", status: "warn", principle: "Goal Shielding", detail: "You already have 3 active Quests — adding a 4th can dilute attention." }
        : { id: "cap", label: "Goal shielding (1–3 Quests)", status: "fail", principle: "Goal Shielding", detail: totalCnt + " active Quests exceeds working-memory limits. Retire one first." };

      let hoursCheck;
      if (!Number.isFinite(hrs) || hrs < 1) {
        hoursCheck = { id: "hrs", label: "Calibrated weekly input", status: "fail", principle: "Planning Fallacy", detail: "Set a realistic weekly target of at least 1 hour." };
      } else {
        const proj = exHrs + hrs;
        if (hrs <= 20 && proj <= 30) {
          hoursCheck = { id: "hrs", label: "Calibrated weekly input", status: "pass", principle: "Goal-Setting Theory", detail: hrs + " h/wk (" + proj.toFixed(0) + " h/wk total) sits in a sustainable range." };
        } else if (hrs <= 30 && proj <= 40) {
          hoursCheck = { id: "hrs", label: "Calibrated weekly input", status: "warn", principle: "Planning Fallacy", detail: proj.toFixed(0) + " h/wk combined deep work is ambitious — leave room for Other work." };
        } else {
          hoursCheck = { id: "hrs", label: "Calibrated weekly input", status: "fail", principle: "Planning Fallacy", detail: hrs + " h/wk (" + proj.toFixed(0) + " h/wk total) risks chronic missed targets. Lower to a steady pace." };
        }
      }

      const isWish = GUIDE_WISH_STARTERS.some(p => lower.startsWith(p));
      const idCheck = isWish
        ? { id: "id", label: "Actionable Quest identity", status: "fail", principle: "Process vs. Outcome", detail: "Phrased as an abstract wish. Frame it around a concrete craft or pursuit." }
        : words.length < 2
        ? { id: "id", label: "Actionable Quest identity", status: "warn", principle: "Goal Specificity", detail: "Give it a vivid 2–6 word mission name instead of a single generic word." }
        : trimmed.length > 70
        ? { id: "id", label: "Actionable Quest identity", status: "warn", principle: "Cognitive Load", detail: "Trim the title to a crisp headline and put details in Description." }
        : { id: "id", label: "Actionable Quest identity", status: "pass", principle: "Goal Specificity", detail: "Memorable, concrete mission title that anchors daily tasks." };

      const purposeCheck = trimmedDesc.length >= 24
        ? { id: "why", label: "Intrinsic purpose & scope", status: "pass", principle: "Self-Determination Theory", detail: "Clearly states what moves this Quest forward and why it matters." }
        : trimmedDesc.length > 0
        ? { id: "why", label: "Intrinsic purpose & scope", status: "warn", principle: "Self-Determination Theory", detail: "Add a bit more context on what work counts and why it matters to you." }
        : { id: "why", label: "Intrinsic purpose & scope", status: "fail", principle: "Self-Determination Theory", detail: "Missing description — stating why it matters sustains follow-through." };

      const checks = [capCheck, hoursCheck, idCheck, purposeCheck];
      const score = checks.reduce((acc, c) => acc + (c.status === "pass" ? 2 : c.status === "warn" ? 1 : 0), 0);
      const verdict = score >= 7 ? "strong" : score >= 4 ? "fair" : "weak";
      const summary = verdict === "strong" ? "Well-calibrated Quest — focused scope, realistic budget, and clear purpose."
        : verdict === "fair" ? "Solid foundation — review the tips below so this Quest sticks long-term."
        : "High risk of friction or burnout — narrow scope, calibrate hours, and state why it matters.";
      return { verdict, score, maxScore: 8, summary, checks };
    }

    function auditGuideWorkspace() {
      const activeQuests = state.quests.filter(q => !q.archived);
      const activeQuestCount = activeQuests.length;
      const weeklyBudgetHours = Number(activeQuests.reduce((a, q) => {
        const n = Number(q.targetWeeklyHours);
        return a + (Number.isFinite(n) ? Math.max(0, n) : 0);
      }, 0).toFixed(1));
      const openTasks = state.tasks.filter(t => t.status === "queued" || t.status === "active");
      let strongCount = 0;
      const tasksToSharpen = [];
      for (const t of openTasks) {
        const ev = evaluateGuideTaskDraft(t.title, t.notes);
        if (ev.verdict === "strong") {
          strongCount++;
        } else if (ev.verdict !== "empty" && tasksToSharpen.length < 5) {
          const issue = ev.checks.find(c => c.status === "fail") || ev.checks.find(c => c.status === "warn");
          if (issue) tasksToSharpen.push({ id: t.id, title: t.title, tip: issue.detail });
        }
      }
      const clarityPct = openTasks.length > 0 ? Math.round((strongCount / openTasks.length) * 100) : 100;
      return { activeQuestCount, weeklyBudgetHours, openTaskCount: openTasks.length, strongCount, clarityPct, tasksToSharpen };
    }

    function saveGuideTask() {
      const title = guideTaskTitle.trim();
      if (!title) {
        const el = document.getElementById("guideTaskTitleInput");
        if (el) el.focus();
        showToast("Enter a task title first");
        return;
      }
      playCompleteSound();
      const now = Date.now();
      const pending = state.tasks.filter(t => t.status === "queued" || t.status === "active").sort(compareRank);
      const rank = pending.length > 0 ? (Number(pending[0].rank) || 0) - 1000 : 1000;
      const qId = resolveComposerQuestId(guideTaskQuestId);
      state.tasks.push({
        id: "tsk-" + now + "-" + Math.random().toString(36).slice(2, 6),
        title,
        notes: guideTaskNotes.trim(),
        questId: qId,
        status: "queued",
        rank,
        accumulatedSeconds: 0,
        scheduledDate: toLocalDateKey(now),
        createdAt: now,
        updatedAt: now
      });
      guideTaskTitle = "";
      guideTaskNotes = "";
      commitLocalChange();
      showToast("Added to today's queue");
    }
