        }).join("") + `</div>
          <div class="guide-principle-card">
            <div class="hero-eyebrow" style="margin-bottom:8px;">30-Second Pre-Flight Checklist</div>
            ${[
              "Do I have 1 to 3 active Quests (not 6+)?",
              "Is my combined weekly target realistic (12–25 h/wk)?",
              "Does today's #1 task start with a concrete physical verb?",
              "Can I finish today's #1 task in one 20–90 minute bout?"
            ].map(item => `
              <div style="display:flex;align-items:flex-start;gap:8px;padding:7px 0;font-size:13px;color:var(--text-2);line-height:1.4;">
                <span style="color:var(--emerald);font-weight:700;flex-shrink:0;">✓</span>
                <span>${escapeHtml(item)}</span>
              </div>
            `).join("")}
          </div>
        `;
      } else {
        const chosenQuestId = resolveComposerQuestId(guideTaskQuestId);
        const ev = guideLabMode === "task"
          ? evaluateGuideTaskDraft(guideTaskTitle, guideTaskNotes)
          : evaluateGuideQuestDraft(guideQuestTitle, guideQuestDesc, guideQuestHours, audit.activeQuestCount, audit.weeklyBudgetHours);
        const qColor = audit.activeQuestCount === 0 ? "var(--cyan)" : (audit.activeQuestCount <= 3 ? "var(--emerald)" : "var(--amber)");
        const bColor = audit.weeklyBudgetHours === 0 ? "var(--muted)" : (audit.weeklyBudgetHours <= 25 ? "var(--emerald)" : (audit.weeklyBudgetHours <= 35 ? "var(--amber)" : "var(--rose)"));
        const cColor = audit.openTaskCount === 0 ? "var(--muted)" : (audit.clarityPct >= 70 ? "var(--emerald)" : "var(--amber)");

        bodyHtml = `
          <div class="guide-kpi-row">
            <div class="guide-kpi">
              <div class="hero-eyebrow" style="margin:0;">Quests</div>
              <div class="guide-kpi-val" style="color:${qColor};" data-guide-audit="quests">${audit.activeQuestCount}</div>
              <div class="guide-kpi-sub">ideal: 1–3</div>
            </div>
            <div class="guide-kpi">
              <div class="hero-eyebrow" style="margin:0;">Budget</div>
              <div class="guide-kpi-val" style="color:${bColor};" data-guide-audit="hours">${audit.weeklyBudgetHours}h</div>
              <div class="guide-kpi-sub">12–25 h/wk</div>
            </div>
            <div class="guide-kpi">
              <div class="hero-eyebrow" style="margin:0;">Clarity</div>
              <div class="guide-kpi-val" style="color:${cColor};" data-guide-audit="clarity">${audit.openTaskCount === 0 ? "–" : audit.clarityPct + "%"}</div>
              <div class="guide-kpi-sub">${audit.openTaskCount === 0 ? "no open" : audit.strongCount + "/" + audit.openTaskCount + " strong"}</div>
            </div>
          </div>

          ${audit.tasksToSharpen.length > 0 ? `
            <div class="guide-principle-card">
              <div class="hero-eyebrow" style="margin-bottom:4px;">Open tasks to sharpen (${audit.tasksToSharpen.length})</div>
              ${audit.tasksToSharpen.map(item => `
                <div class="guide-sharpen-row">
                  <div style="min-width:0;flex:1;">
                    <div style="font-size:13px;font-weight:600;color:var(--white);overflow-wrap:anywhere;">${escapeHtml(item.title)}</div>
                    <div style="font-size:11px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere;">${escapeHtml(item.tip)}</div>
                  </div>
                  <button class="sync-chip pressable" style="flex-shrink:0;" onclick="loadTaskIntoGuideTester(${jsArg(item.id)})">Test</button>
                </div>
              `).join("")}
            </div>
          ` : ""}

          <div class="guide-principle-card">
            <div class="hero-eyebrow" style="margin-bottom:10px;">Interactive Draft Tester</div>
            <div class="segmented-control" role="group" aria-label="Draft type">
              <button class="seg-option ${guideLabMode === "task" ? "active" : ""}" aria-pressed="${guideLabMode === "task"}" onclick="playClickSound();guideLabMode='task';renderApp();">Test a Task</button>
              <button class="seg-option ${guideLabMode === "quest" ? "active" : ""}" aria-pressed="${guideLabMode === "quest"}" onclick="playClickSound();guideLabMode='quest';renderApp();">Test a Quest</button>
            </div>

            <div class="sheet-pill-group" style="margin-bottom:14px;">
              ${(guideLabMode === "task" ? GUIDE_TASK_PRESETS : GUIDE_QUEST_PRESETS).map(p => `
                <button class="sheet-pill pressable" style="${p.kind === "strong" ? "border-color:rgb(var(--c-success) / 0.3);color:var(--emerald);" : ""}" onclick="${guideLabMode === "task" ? `loadGuideTaskPreset(${jsArg(p.id)})` : `loadGuideQuestPreset(${jsArg(p.id)})`}">${escapeHtml(p.label)}</button>
              `).join("")}
            </div>

            <div class="guide-workshop-split">
              <div>
            ${guideLabMode === "task" ? `
              <label class="sheet-label" for="guideTaskTitleInput">Task Title</label>
              <input id="guideTaskTitleInput" class="sheet-input" placeholder="e.g. Draft 400 words for essay #4" value="${escapeHtml(guideTaskTitle)}" enterkeyhint="done" oninput="guideTaskTitle=this.value;updateGuideEvalLive();" onkeydown="if(isSubmitKey(event)) saveGuideTask();" />

              <label class="sheet-label" for="guideTaskNotesInput">Definition of Done (Optional Notes)</label>
              <textarea maxlength="20000" id="guideTaskNotesInput" class="sheet-input" rows="2" placeholder="What does finished look like for this bout?" oninput="guideTaskNotes=this.value;updateGuideEvalLive();">${escapeHtml(guideTaskNotes)}</textarea>

              <div class="sheet-label">Assign to Quest</div>
              <div class="sheet-pill-group" role="group" aria-label="Assign to Quest" style="margin-bottom:14px;">
                ${activeQuestsList().map(q => {
                  const sel = chosenQuestId === q.id;
                  const hex = ACCENT_HEX[q.accentColor] || ACCENT_HEX.slate;
                  return `<button class="sheet-pill ${sel ? "selected" : ""}" aria-pressed="${sel}" onclick="playClickSound();guideTaskQuestId=${jsArg(q.id)};renderApp();"><span style="width:8px;height:8px;border-radius:50%;background:${hex};flex-shrink:0;"></span><span>${escapeHtml(q.title)}</span></button>`;
                }).join("")}
                <button class="sheet-pill ${chosenQuestId === null ? "selected" : ""}" aria-pressed="${chosenQuestId === null}" onclick="playClickSound();guideTaskQuestId=null;renderApp();"><span style="width:8px;height:8px;border-radius:50%;background:var(--slate);flex-shrink:0;"></span><span>Other</span></button>
              </div>

              <button class="guide-action-btn pressable" onclick="saveGuideTask()">+ Add to Today's Queue</button>
            ` : `
              <label class="sheet-label" for="guideQuestTitleInput">Quest Title</label>
              <input id="guideQuestTitleInput" class="sheet-input" placeholder="e.g. Ship v1 of my audio plugin" value="${escapeHtml(guideQuestTitle)}" enterkeyhint="done" oninput="guideQuestTitle=this.value;updateGuideEvalLive();" onkeydown="if(isSubmitKey(event)) saveGuideQuest();" />

              <label class="sheet-label" for="guideQuestDescInput">Why it matters &amp; what moves it forward</label>
              <textarea maxlength="20000" id="guideQuestDescInput" class="sheet-input" rows="2" placeholder="Core milestones and why this pursuit matters..." oninput="guideQuestDesc=this.value;updateGuideEvalLive();">${escapeHtml(guideQuestDesc)}</textarea>

              <label class="sheet-label" for="guideQuestHoursInput">Weekly Target Hours</label>
              <input id="guideQuestHoursInput" type="number" inputmode="numeric" min="1" max="100" class="sheet-input" value="${escapeHtml(guideQuestHours)}" enterkeyhint="done" oninput="guideQuestHours=this.value;updateGuideEvalLive();" onkeydown="if(isSubmitKey(event)) saveGuideQuest();" />

              <div class="sheet-label">Accent Color</div>
              <div class="sheet-pill-group" role="group" aria-label="Quest accent color" style="margin-bottom:14px;">
                ${QUEST_COLOR_KEYS.map(col => `
                  <button class="sheet-pill ${guideQuestColor === col ? "selected" : ""}" aria-pressed="${guideQuestColor === col}" onclick="playClickSound();guideQuestColor=${jsArg(col)};renderApp();"><span style="width:9px;height:9px;border-radius:50%;background:${ACCENT_HEX[col]};flex-shrink:0;"></span><span style="text-transform:capitalize;">${col}</span></button>
                `).join("")}
              </div>

              <button class="guide-action-btn pressable" onclick="saveGuideQuest()">+ Create Quest</button>
            `}
              </div>

              <div id="guideEvalBox" style="margin-top:16px;padding:14px;border-radius:14px;border:1px solid var(--border);background:var(--bg);">
                ${renderGuideEvalHtml(ev)}
              </div>
            </div>
          </div>
        `;
      }

      return `
        <div class="hero-bar">
          <div>
            <div class="hero-eyebrow">Behavioral Science</div>
            <h1 class="hero-title">Quest &amp; Task Guide</h1>
          </div>
          <button class="sync-chip pressable" onclick="switchView(${jsArg(guideReturnView || "quests")})">← Back</button>
        </div>
        ${tabBar}
        ${bodyHtml}
      `;
    }

    // Main Render Engine
    function renderApp() {
      renderCount++;
      renderWaitingForBlur = false;
      renderWaitingForGesture = false;
      flushFieldDrafts(); // typed-but-uncommitted text must not be replaced by the stored value
      const activeQuests = activeQuestsList();
      if (filterQuestId !== "ALL" && !activeQuests.some(q => q.id === filterQuestId)) filterQuestId = "ALL";
      updateHeaderStatus();
      appVersionLabel();
      const topHeader = document.getElementById("topHeader");
      const fabBtn = document.getElementById("fabBtn");
      const container = document.getElementById("mainContainer");
      const now = Date.now();
      const todayKey = toLocalDateKey(now);
      lastRenderedDateKey = todayKey;
      const prevStrip = container.querySelector(".chip-strip");
      const chipScrollLeft = prevStrip ? prevStrip.scrollLeft : 0;
      const focused = document.activeElement;
      const focusKey = focused && container.contains(focused) ? focusKeyOf(focused) : null;

      if (topHeader) topHeader.style.display = activeView === "focus" ? "none" : "flex";
      if (fabBtn) fabBtn.style.display = (activeView === "command" || activeView === "plan") ? "inline-flex" : "none";
      setAttrIfChanged(document.body, "data-view", activeView); // toast position (above the FAB or not)

      const last7Keys = new Set();
      for (let i = 0; i < 7; i++) last7Keys.add(dayKeyOffset(-i, now));

      const af = state.activeFocus;
      const activeTaskObj = af && af.activeTaskId ? state.tasks.find(t => t.id === af.activeTaskId) : null;
      const liveDelta = af && af.isRunning && af.sessionStartedAt ? Math.max(0, Math.floor((now - af.sessionStartedAt) / 1000)) : 0;

      // =====================================================================
      // VIEW 1: TODAY (Spotlight #1 Hero + Compact Queue + Timeline)
      // =====================================================================
      if (activeView === "command") {
        const todayQuestSec = state.timeLogs
          .filter(l => l.dateKey === todayKey && l.questId !== null)
          .reduce((a, b) => a + b.durationSeconds, 0) + (activeTaskObj && activeTaskObj.questId !== null ? liveDelta : 0);

        const weekQuestSec = state.timeLogs
          .filter(l => last7Keys.has(l.dateKey) && l.questId !== null)
          .reduce((a, b) => a + b.durationSeconds, 0) + (activeTaskObj && activeTaskObj.questId !== null ? liveDelta : 0);

        const totalTargetHrs = activeQuests.reduce((a, q) => a + (Number(q.targetWeeklyHours) || 0), 0);
        const weekPct = totalTargetHrs > 0 ? Math.min(100, Math.round(((weekQuestSec / 3600) / totalTargetHrs) * 100)) : 0;

        const eyebrowDate = new Date(now).toLocaleDateString("en-US", { weekday: "long", month: "short", day: "numeric" });

        let pending = state.tasks
          .filter(t => (t.status === "queued" || t.status === "active") && isTaskVisibleToday(t, todayKey))
          .sort(compareRank);
        if (filterQuestId !== "ALL") {
          pending = pending.filter(t => t.questId === filterQuestId);
        }

        const questQueue = pending.filter(t => t.questId !== null);
        const otherQueue = pending.filter(t => t.questId === null);
        // "Completed today": only tasks finished today (respecting the quest filter)
        const completedToday = state.tasks
          .filter(t => t.status === "completed" && t.completedAt && toLocalDateKey(t.completedAt) === todayKey)
          .filter(t => filterQuestId === "ALL" || t.questId === filterQuestId)
          .sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0));
        const completedList = showAllCompletedToday ? completedToday : completedToday.slice(0, COMPLETED_PREVIEW);
        const filterQuest = filterQuestId !== "ALL" ? activeQuests.find(q => q.id === filterQuestId) : null;

        const todayLogs = state.timeLogs
          .filter(l => l.dateKey === todayKey)
          .sort((a, b) => a.startTime - b.startTime);

        const heroTask = questQueue[0] || null;
        const restQuestQueue = questQueue.slice(1);

        let heroHtml = "";
        if (heroTask) {
          const hq = state.quests.find(x => x.id === heroTask.questId);
          const hHex = ACCENT_HEX[hq ? hq.accentColor : "cyan"];
          const isRunningHero = af && af.activeTaskId === heroTask.id && af.isRunning;
          const hSec = (heroTask.accumulatedSeconds || 0) + (isRunningHero ? liveDelta : 0);

          heroHtml = `
            <div class="spotlight-card" data-flip-task-id="${escapeHtml(heroTask.id)}" style="border-color:${accentAlpha(hHex, 0.267)};">
              <div class="spotlight-top">
                <div style="display:flex;align-items:center;gap:8px;min-width:0;">
                  <span class="next-badge" style="flex-shrink:0;">#01 Next up</span>
                  <span style="display:inline-flex;align-items:center;gap:5px;min-width:0;font-size:12px;font-weight:500;color:${hHex};">
                    <span style="width:7px;height:7px;border-radius:50%;background:${hHex};flex-shrink:0;"></span>
                    <span style="min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(hq ? hq.title : "Quest")}</span>
                  </span>
                  ${checklistBadgeHtml(heroTask)}
                </div>
                <button class="more-dots-btn" onclick="openTaskInspectorSheet(${jsArg(heroTask.id)})" aria-label="Task options for ${escapeHtml(heroTask.title)}">${SVG_MORE}</button>
              </div>

              <h2 class="spotlight-title" role="button" onclick="initializeFocus(${jsArg(heroTask.id)})">${escapeHtml(heroTask.title)}</h2>
              ${heroTask.notes ? `<p class="spotlight-notes">${escapeHtml(heroTask.notes)}</p>` : ""}

              <div class="spotlight-actions">
                <button class="btn-primary-focus pressable" style="background:${hHex};" onclick="initializeFocus(${jsArg(heroTask.id)})">
                  ${SVG_PLAY}
                  <span>${isRunningHero ? "Open Focus" : "Start Focus"}</span>
                  ${hSec > 0 || isRunningHero ? `<span style="font-family:var(--font-mono);font-size:12px;opacity:0.8;" data-task-timer="${escapeHtml(heroTask.id)}" data-prefix="· ">· ${formatChrono(hSec)}</span>` : ""}
                </button>
                <button class="btn-complete-circle pressable" onclick="completeTaskDirect(${jsArg(heroTask.id)})" aria-label="Complete ${escapeHtml(heroTask.title)}">
                  ${SVG_CHECK}
                </button>
              </div>
            </div>
          `;
        }

        container.innerHTML = `
          <!-- Clean Single-Line Hero Bar -->
          <div class="hero-bar">
            <div>
              <div class="hero-eyebrow">${eyebrowDate}</div>
              <h1 class="hero-title">Today</h1>
            </div>

            <button type="button" class="hero-stats-pill pressable" onclick="switchView('telemetry')" aria-label="Open weekly review: ${formatTelemetryDuration(todayQuestSec, '0.0h')} today, ${formatTelemetryDuration(weekQuestSec, '0.0h')} of ${totalTargetHrs} weekly hours">
              <div style="display:flex;align-items:baseline;gap:4px;">
                <span style="font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--white);font-variant-numeric:tabular-nums;">${formatTelemetryDuration(todayQuestSec, "0.0h")}</span>
                <span style="font-size:11px;color:var(--muted);">today</span>
              </div>
              <div style="height:4px;width:100%;background:rgb(var(--c-ink) / 0.08);border-radius:999px;overflow:hidden;margin:5px 0 4px;">
                <div style="height:100%;width:${weekPct}%;background:var(--cyan);border-radius:999px;"></div>
              </div>
              <div style="font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums;">${formatTelemetryDuration(weekQuestSec, "0.0h")} / ${totalTargetHrs}h wk <span aria-hidden="true" style="color:var(--cyan);font-weight:700;">›</span></div>
            </button>
          </div>

          <!-- Segmented Control (Phone switcher; Tablet shows both Queue & Day Timeline side-by-side) -->
          <div class="segmented-control today-sub-tabs" role="group" aria-label="Today view">
            <button class="seg-option ${homeSubTab === 'queue' ? 'active' : ''}" aria-pressed="${homeSubTab === 'queue'}" onclick="homeSubTab='queue';renderApp();">
              Priority Queue (${questQueue.length})
            </button>
            <button class="seg-option ${homeSubTab === 'timeline' ? 'active' : ''}" aria-pressed="${homeSubTab === 'timeline'}" onclick="homeSubTab='timeline';renderApp();">
              Day Timeline (${todayLogs.length})
            </button>
          </div>

          <div class="today-tablet-split">
            <div class="today-pane today-queue-pane ${homeSubTab === 'queue' ? 'is-active' : ''}">
              <!-- Single-Row Filter Strip -->
              ${activeQuests.length ? `
              <div class="chip-strip" role="group" aria-label="Filter by quest">
                <button class="filter-pill ${filterQuestId === 'ALL' ? 'active' : ''}" aria-pressed="${filterQuestId === 'ALL'}" onclick="filterQuestId='ALL';renderApp();">All Quests</button>
                ${activeQuests.map(q => `
                  <button class="filter-pill ${filterQuestId === q.id ? 'active' : ''}" aria-pressed="${filterQuestId === q.id}" onclick="filterQuestId=(filterQuestId===${jsArg(q.id)}?'ALL':${jsArg(q.id)});renderApp();">
                    <span style="width:7px;height:7px;border-radius:50%;background:${ACCENT_HEX[q.accentColor] || ACCENT_HEX.slate};"></span>
                    <span>${escapeHtml(q.title)}</span>
                  </button>
                `).join("")}
              </div>
              ` : ""}

              <!-- #01 Spotlight Hero Card -->
              ${heroHtml}

              <!-- Up Next Queue -->
              ${restQuestQueue.length > 0 ? `<div class="section-header-label" data-flip-key="sec-upnext">Up Next (${restQuestQueue.length})</div>` : ""}
              ${restQuestQueue.map(t => renderCompactQueueCard(t)).join("")}

              ${questQueue.length === 0 ? (
                filterQuest
                  ? emptyCardHtml("Nothing open in " + filterQuest.title, "Add the next step for this quest, or look at everything.", [
                      { label: "+ Add a step", primary: true, onclick: `openNewTaskSheet(${jsArg(filterQuest.id)})` },
                      { label: "Show all quests", onclick: "filterQuestId='ALL';renderApp();" }
                    ])
                  : (!state.tasks.length && !activeQuests.length)
                    ? emptyCardHtml("A clean slate", "Add the one task that matters most today. Quests group bigger goals and track their weekly hours.", [
                        { label: "+ New Task", primary: true, onclick: "openNewTaskSheet()" },
                        { label: "New Quest", onclick: "openNewQuestSheet()" }
                      ])
                    : !activeQuests.length
                      ? emptyCardHtml("No quest work queued", "Create a quest to give your most important work a home.", [
                          { label: "New Quest", onclick: "openNewQuestSheet()" }
                        ])
                      : emptyCardHtml("Your Quest queue is clear", "Queue the next step of a quest to see it here as #1.", [
                          { label: "+ New Task", primary: true, onclick: "openNewTaskSheet()" }
                        ])
              ) : ""}

              <!-- Other Work -->
              ${otherQueue.length > 0 ? `
                <div class="section-header-label" data-flip-key="sec-other">Other Work</div>
                ${otherQueue.map(t => renderCompactQueueCard(t)).join("")}
              ` : ""}

              <!-- Completed Today -->
              ${completedToday.length > 0 ? `
                <div class="section-header-label" data-flip-key="sec-completed">Completed today (${completedToday.length})</div>
                ${completedList.map(t => renderCompletedCard(t, true)).join("")}
                ${completedToday.length > COMPLETED_PREVIEW ? `
                  <button class="show-more-btn" data-flip-key="btn-showmore" onclick="showAllCompletedToday=!showAllCompletedToday;renderApp();">
                    ${showAllCompletedToday ? "Show less ↑" : `Show all ${completedToday.length} ↓`}
                  </button>
                ` : ""}
              ` : ""}
            </div>

            <div class="today-pane today-timeline-pane ${homeSubTab === 'timeline' ? 'is-active' : ''}">
              <div class="today-timeline-tablet-head">
                <span>Today's Timeline</span>
                <span style="font-family:var(--font-mono);color:var(--dim);text-transform:none;letter-spacing:0;">${todayLogs.length} session${todayLogs.length === 1 ? "" : "s"}</span>
              </div>
              ${renderTimelineHtml(todayLogs, activeTaskObj, af, liveDelta)}
            </div>
          </div>
        `;
      }

      // =====================================================================
      // VIEW 2: PLAN THE WEEK
      // =====================================================================
      else if (activeView === "plan") {
        const cols = [];
        for (let i = -2; i <= 2; i++) {
          const dk = dayKeyOffset(planDayOffset + i, now);
          const d = noonOfDateKey(dk);
          cols.push({
            dateKey: dk,
            weekday: d.toLocaleDateString("en-US", { weekday: "short" }),
            dayNum: String(d.getDate()),
            fullLabel: d.toLocaleDateString("en-US", { weekday: "long", month: "short", day: "numeric" }),
            monthYear: d.toLocaleDateString("en-US", { month: "long", year: "numeric" }),
            isToday: dk === todayKey
          });
        }
        if (!cols.some(c => c.dateKey === selectedPlanDateKey)) {
          selectedPlanDateKey = cols[2].dateKey;
        }
        const activeCol = cols.find(c => c.dateKey === selectedPlanDateKey) || cols[2];
        const dayTasks = state.tasks
          .filter(t => planColumnKey(t, todayKey) === activeCol.dateKey)
          .sort(compareRank);
        const pendingDay = dayTasks.filter(t => t.status === "queued" || t.status === "active");
        const completedDay = dayTasks.filter(t => t.status === "completed");

        if (isTabletPlanBoard()) {
          container.innerHTML = `
            <div class="hero-bar">
              <div>
                <div class="hero-eyebrow">${activeCol.monthYear}</div>
                <h1 class="hero-title">Plan the week</h1>
              </div>
              <div class="step-chip-row">
                <button class="sync-chip step-chip" aria-label="Previous day" onclick="planDayOffset--;selectedPlanDateKey=dayKeyOffset(planDayOffset);renderApp();">‹</button>
                <button class="sync-chip step-chip" onclick="planDayOffset=0;selectedPlanDateKey=toLocalDateKey();renderApp();">Today</button>
                <button class="sync-chip step-chip" aria-label="Next day" onclick="planDayOffset++;selectedPlanDateKey=dayKeyOffset(planDayOffset);renderApp();">›</button>
              </div>
            </div>

            <div class="plan-board-grid">
              ${cols.map(c => {
                const colTasks = state.tasks
                  .filter(t => planColumnKey(t, todayKey) === c.dateKey)
                  .sort(compareRank);
                const colPending = colTasks.filter(t => t.status === "queued" || t.status === "active");
                const colDone = colTasks.filter(t => t.status === "completed");
                const cnt = colPending.length;
                const isSel = c.dateKey === activeCol.dateKey;
                return `
                  <div class="plan-col-panel ${c.isToday ? 'is-today' : ''} ${isSel ? 'is-selected' : ''}" data-plan-col="${escapeHtml(c.dateKey)}">
                    <button class="plan-day-card pressable ${isSel ? 'active' : ''} ${c.isToday ? 'today-mark' : ''}" aria-pressed="${isSel}" aria-label="${escapeHtml(c.fullLabel)}${c.isToday ? ", today" : ""}, ${cnt} open" onclick="selectedPlanDateKey=${jsArg(c.dateKey)};renderApp();">
                      <span style="font-size:11px;font-weight:700;letter-spacing:calc(0.06em * var(--label-track));text-transform:var(--label-case);color:${c.isToday ? 'var(--amber)' : 'var(--muted)'};">${c.weekday}${c.isToday ? ' · TODAY' : ''}</span>
                      <span style="font-family:var(--font-display);font-size:22px;font-weight:700;margin:4px 0;color:var(--white);">${c.dayNum}</span>
                      <span style="font-size:11px;color:var(--dim);">${cnt} open${colDone.length ? ' · ' + colDone.length + ' done' : ''}</span>
                    </button>
                    <div class="plan-col-tasks">
                      ${colPending.length === 0 && colDone.length === 0 ? `<div class="plan-col-empty">Nothing planned</div>` : ""}
                      ${colPending.map(t => renderCompactQueueCard(t)).join("")}
                      ${colDone.length > 0 ? `<div class="section-header-label" style="margin:12px 0 8px 2px;">Completed (${colDone.length})</div>` : ""}
                      ${colDone.map(t => renderCompletedCard(t, false)).join("")}
                    </div>
                    <button class="plan-col-add-btn pressable" onclick="openNewTaskSheet(undefined, ${jsArg(c.dateKey)})">+ Add for ${escapeHtml(c.weekday)}</button>
                  </div>
                `;
              }).join("")}
            </div>
          `;
        } else {
          container.innerHTML = `
            <div class="hero-bar">
              <div>
                <div class="hero-eyebrow">${activeCol.monthYear}</div>
                <h1 class="hero-title">Plan the week</h1>
              </div>
              <div class="step-chip-row">
                <button class="sync-chip step-chip" aria-label="Previous day" onclick="planDayOffset--;selectedPlanDateKey=dayKeyOffset(planDayOffset);renderApp();">‹</button>
                <button class="sync-chip step-chip" onclick="planDayOffset=0;selectedPlanDateKey=toLocalDateKey();renderApp();">Today</button>
                <button class="sync-chip step-chip" aria-label="Next day" onclick="planDayOffset++;selectedPlanDateKey=dayKeyOffset(planDayOffset);renderApp();">›</button>
              </div>
            </div>

            <div class="plan-strip">
              ${cols.map(c => {
                const cnt = state.tasks.filter(t => planColumnKey(t, todayKey) === c.dateKey && t.status !== "completed").length;
                return `
                  <button class="plan-day-card pressable ${c.dateKey === activeCol.dateKey ? 'active' : ''} ${c.isToday ? 'today-mark' : ''}" aria-pressed="${c.dateKey === activeCol.dateKey}" aria-label="${escapeHtml(c.fullLabel)}${c.isToday ? ", today" : ""}, ${cnt} open" onclick="selectedPlanDateKey=${jsArg(c.dateKey)};renderApp();">
                    <span style="font-size:11px;font-weight:600;color:${c.isToday ? 'var(--amber)' : 'var(--muted)'};">${c.weekday}</span>
                    <span style="font-family:var(--font-display);font-size:18px;font-weight:700;margin:3px 0;">${c.dayNum}</span>
                    <span style="font-size:10px;color:var(--dim);">${cnt} open</span>
                  </button>
                `;
              }).join("")}
            </div>

            <div class="section-header-label" style="margin-top:4px;">${activeCol.fullLabel} ${activeCol.isToday ? '· TODAY' : ''}</div>

            ${pendingDay.length === 0 && completedDay.length === 0 ? emptyCardHtml(
              "Nothing planned for " + activeCol.weekday,
              activeCol.isToday ? "Add what you want to get done today." : "Plan ahead: tasks added here are scheduled for this day.",
              [{ label: "+ Add for " + activeCol.weekday, primary: true, onclick: `openNewTaskSheet(undefined, ${jsArg(activeCol.dateKey)})` }]
            ) : ""}

            ${pendingDay.map(t => renderCompactQueueCard(t)).join("")}

            ${completedDay.length > 0 ? `<div class="section-header-label" data-flip-key="sec-plan-completed">Completed (${completedDay.length})</div>` : ""}
            ${completedDay.map(t => renderCompletedCard(t, false)).join("")}
          `;
        }
      }

      // =====================================================================
      // VIEW 3: FOCUS HUD (Distraction-Free Full-Screen Stopwatch)
      // =====================================================================
      else if (activeView === "focus") {
        if (!activeTaskObj) {
          // same pick as initializeFocus(): today's (or unscheduled) queue, quest work first
          const queued = state.tasks
            .filter(t => t.status === "queued" && isTaskVisibleToday(t, todayKey))
            .sort(compareRank);
          const topTask = queued.find(t => t.questId !== null) || queued[0] || null;
          const doneToday = state.tasks.filter(t => t.status === "completed" && t.completedAt && toLocalDateKey(t.completedAt) === todayKey).length;
          const laterCount = state.tasks.filter(t => t.status === "queued" && t.scheduledDate && t.scheduledDate > todayKey).length;
          const topQuest = topTask ? state.quests.find(x => x.id === topTask.questId) : null;

          container.innerHTML = `
            <div class="focus-idle-stage">
              <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;">
                <div class="hero-eyebrow">Focus Mode</div>
                ${topTask ? `
                  ${topQuest ? `<div style="margin-top:10px;font-size:12px;color:${ACCENT_HEX[topQuest.accentColor] || ACCENT_HEX.slate};max-width:100%;overflow-wrap:anywhere;">${escapeHtml(topQuest.title)}</div>` : ""}
                  <h2 style="font-family:var(--font-display);font-size:24px;font-weight:600;margin:10px 0 24px;line-height:1.3;max-width:100%;overflow-wrap:anywhere;">${escapeHtml(topTask.title)}</h2>
                  <button class="btn-primary-focus pressable" style="max-width:240px;width:100%;flex:none;padding:0 24px;" onclick="initializeFocus(${jsArg(topTask.id)})">
                    ${SVG_PLAY}
                    <span>Start Focus Session</span>
                  </button>
                  <button class="text-action" style="margin-top:16px;color:var(--muted);" onclick="switchView('command')">← Back to Today</button>
                ` : `
                  <h2 style="font-family:var(--font-display);font-size:22px;font-weight:600;margin:14px 0 6px;">${doneToday ? "All done for today" : "Nothing queued for today"}</h2>
                  <p style="font-size:13px;color:var(--muted);margin:0 0 20px;max-width:280px;line-height:1.45;">
                    ${doneToday ? `${doneToday} task${doneToday === 1 ? "" : "s"} completed today.` : "Add a task to start a focus session."}
                    ${laterCount ? ` ${laterCount} planned for later.` : ""}
                  </p>
                  <button class="empty-action primary" onclick="openNewTaskSheet()">+ New Task</button>
                `}
              </div>
              <div class="focus-footer">${focusSyncIndicatorHtml()}</div>
            </div>
          `;
        } else {
          const q = state.quests.find(x => x.id === activeTaskObj.questId);
          const hex = ACCENT_HEX[q ? q.accentColor : "slate"] || ACCENT_HEX.slate;
          // slate as text is below 4.5:1 on the page background: the state line uses --muted then
          const stateColor = !af.isRunning ? "var(--dim)" : hex === ACCENT_HEX.slate ? "var(--muted)" : hex;
          const totalElapsed = (activeTaskObj.accumulatedSeconds || 0) + liveDelta;

          container.innerHTML = `
            <div class="focus-stage">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
                <div style="display:flex;align-items:center;gap:8px;min-width:0;font-size:11px;font-weight:700;letter-spacing:calc(0.14em * var(--label-track));text-transform:var(--label-case);color:var(--muted);">
                  <span style="width:8px;height:8px;border-radius:50%;background:${hex};box-shadow:0 0 calc(8px * var(--glow)) ${hex};flex-shrink:0;"></span>
                  <span style="min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Focus · ${escapeHtml(q ? q.title : "Other")}</span>
                </div>
                <button class="sync-chip pressable" onclick="returnToQueueFromFocus()" aria-label="End session and go back to Today" style="flex-shrink:0;">${SVG_BACK.replace('width="20" height="20"', 'width="15" height="15"')}<span aria-hidden="true">End session</span></button>
              </div>

              <div class="focus-center">
                <div class="focus-quest-pill" style="border:1px solid ${accentAlpha(hex, 0.333)};background:${accentAlpha(hex, 0.071)};">
                  <span style="width:7px;height:7px;border-radius:50%;background:${hex};"></span>
                  <span>${escapeHtml(q ? q.title : "Other work")}</span>
                </div>

                <h1 class="focus-task-title">
                  ${escapeHtml(activeTaskObj.title)}
                </h1>

                ${focusSunArcHtml(totalElapsed)}

                <div id="focusBigChrono" class="focus-chrono">
                  ${formatChrono(totalElapsed)}
                </div>

                <div class="focus-state" style="color:${stateColor};">
                  ${af.isRunning ? "● Running" : "Paused"}
                </div>

                <div class="focus-actions">
                  <button class="pressable" onclick="toggleTimerPause()" style="height:var(--touch-min);border-radius:14px;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--white);font-family:var(--font-display);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;">
                    ${af.isRunning ? SVG_PAUSE : SVG_PLAY}
                    <span>${af.isRunning ? "Pause" : "Resume"}</span>
                  </button>
                  <button class="pressable" onclick="completeActiveTaskAndNext()" style="height:var(--touch-min);border-radius:14px;border:none;background:var(--emerald);color:rgb(var(--c-on-accent));font-family:var(--font-display);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;">
                    ${SVG_CHECK}
                    <span>Complete</span>
                  </button>
                </div>

                <div class="focus-notes">
                  <textarea maxlength="20000" class="focus-notes-input" rows="2" placeholder="Tap to add session notes..." aria-label="Session notes" oninput="draftTaskField(${jsArg(activeTaskObj.id)}, 'notes', this.value)" onchange="saveTaskText(${jsArg(activeTaskObj.id)}, 'notes', this.value)">${escapeHtml(activeTaskObj.notes || "")}</textarea>
                </div>
              </div>

              <div class="focus-footer">
                ${focusSyncIndicatorHtml()}
                ${af.isRunning ? `<span aria-hidden="true">·</span><span>Screen stays awake</span>` : ""}
              </div>
            </div>
          `;
        }
      }

      // =====================================================================
      // VIEW 4: QUESTS (Active Quests & Weekly Input Hours + Completed Quests)
      // =====================================================================
      else if (activeView === "quests") {
        const completedQuests = state.quests
          .filter(q => q.archived)
          .sort((a, b) => ((b.completedAt || b.updatedAt || 0) - (a.completedAt || a.updatedAt || 0)));

        // Single-pass O(L) aggregation of 7-day and all-time logged seconds per quest.
        const weekSecByQuest = new Map();
        const totalSecByQuest = new Map();
        for (const l of state.timeLogs) {
          if (!l.questId) continue;
          totalSecByQuest.set(l.questId, (totalSecByQuest.get(l.questId) || 0) + l.durationSeconds);
          if (last7Keys.has(l.dateKey)) {
            weekSecByQuest.set(l.questId, (weekSecByQuest.get(l.questId) || 0) + l.durationSeconds);
          }
        }
        // ...and one O(T) pass groups each quest's open tasks and the ones finished today.
        const pendingByQuest = new Map();
        const completedTodayByQuest = new Map();
        for (const t of state.tasks) {
          if (!t.questId) continue;
          let group = null;
          if (isOpenTask(t, todayKey)) group = pendingByQuest;
          else if (t.status === "completed" && t.completedAt && toLocalDateKey(t.completedAt) === todayKey) group = completedTodayByQuest;
          if (!group) continue;
          const list = group.get(t.questId);
          if (list) list.push(t);
          else group.set(t.questId, [t]);
        }
        pendingByQuest.forEach(list => list.sort(compareRank));
        completedTodayByQuest.forEach((list, questId) => {
          completedTodayByQuest.set(questId, list.sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0)).slice(0, 3));
        });

        container.innerHTML = `
          <div class="hero-bar">
            <div>
              <div class="hero-eyebrow">Vertical Coherence</div>
              <h1 class="hero-title">Quests</h1>
            </div>
            <div class="step-chip-row">
              <button class="sync-chip pressable" onclick="openGuideView('quests')">
                Guide
              </button>
              <button class="sync-chip pressable" style="background:rgb(var(--c-accent) / 0.12);border-color:rgb(var(--c-accent) / 0.35);color:var(--cyan);font-weight:600;" onclick="openNewQuestSheet()">
                + New Quest
              </button>
            </div>
          </div>

          ${activeQuests.length === 0 ? emptyCardHtml(
            "No quests yet",
            "A quest groups the work that matters and tracks its weekly hours.",
            [
              { label: "Create your first quest", primary: true, onclick: "openNewQuestSheet()" },
              { label: "Read Quest Guide", onclick: "openGuideView('quests')" }
            ]
          ) : `<div class="quests-grid">` + activeQuests.map(quest => {
            const hex = ACCENT_HEX[quest.accentColor] || ACCENT_HEX.slate;
            const sec = weekSecByQuest.get(quest.id) || 0;
            const hrs = sec / 3600;
            const pct = Math.min(100, Math.round((hrs / Math.max(1, quest.targetWeeklyHours)) * 100));
            const qTasks = pendingByQuest.get(quest.id) || [];
            const qCompleted = completedTodayByQuest.get(quest.id) || [];

            return `
              <div class="review-card" style="padding:20px;">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;">
                  <div style="display:flex;align-items:flex-start;gap:10px;min-width:0;">
                    <span style="width:10px;height:10px;margin-top:7px;border-radius:50%;background:${hex};box-shadow:0 0 calc(8px * var(--glow)) ${hex};flex-shrink:0;"></span>
                    <h2 style="font-family:var(--font-display);font-size:19px;font-weight:700;line-height:1.26;letter-spacing:-0.015em;margin:0;min-width:0;overflow-wrap:anywhere;text-wrap:balance;">${escapeHtml(quest.title)}</h2>
                  </div>
                  <button class="sync-chip mini-chip-btn" onclick="openQuestEditorSheet(${jsArg(quest.id)})" aria-label="Edit quest ${escapeHtml(quest.title)}">Edit</button>
                </div>

                ${quest.description ? `<p style="font-size:13px;color:var(--muted);margin:8px 0 0;line-height:1.45;overflow-wrap:anywhere;">${escapeHtml(quest.description)}</p>` : ""}

                <div style="margin-top:16px;padding:14px;border-radius:14px;border:1px solid var(--border);background:var(--bg);">
                  <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 8px;">
                    <span style="font-size:11px;font-weight:700;letter-spacing:calc(0.12em * var(--label-track));text-transform:var(--label-case);color:var(--dim);">Quest Hours (7d)</span>
                    <span style="font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;"><strong style="font-family:var(--font-display);font-size:18px;color:var(--white);">${formatTelemetryDuration(sec, "0.0h")}</strong> / ${Number(quest.targetWeeklyHours) || 0}h (${pct}%)</span>
                  </div>
                  <div style="height:6px;background:rgb(var(--c-ink) / 0.06);border-radius:999px;overflow:hidden;margin-top:10px;">
                    <div style="height:100%;width:${pct}%;background:${hex};border-radius:999px;"></div>
                  </div>
                </div>

                <div style="display:flex;justify-content:space-between;align-items:center;margin:16px 0 10px;">
                  <span style="font-size:11px;font-weight:700;letter-spacing:calc(0.12em * var(--label-track));text-transform:var(--label-case);color:var(--dim);">Next Steps (${qTasks.length})</span>
                  <button class="text-action" onclick="openNewTaskSheet(${jsArg(quest.id)})" style="color:${hex};font-size:12px;margin:-14px -8px;" aria-label="Add a step to ${escapeHtml(quest.title)}">+ Add Step</button>
                </div>

                ${(expandedQuestIds.has(quest.id) ? qTasks : qTasks.slice(0, QUEST_STEPS_PREVIEW)).map(t => renderCompactQueueCard(t)).join("")}
                ${qTasks.length > QUEST_STEPS_PREVIEW ? `
                  <button class="show-more-btn" data-flip-key="${escapeHtml("quest-more:" + quest.id)}" onclick="toggleQuestExpanded(${jsArg(quest.id)})" aria-expanded="${expandedQuestIds.has(quest.id)}">
                    ${expandedQuestIds.has(quest.id) ? "Show less ↑" : `Show all ${qTasks.length} ↓`}
                  </button>
                ` : ""}
                ${qTasks.length === 0 ? `<div style="font-size:12px;color:var(--dim);padding:2px 2px 0;" data-flip-key="${escapeHtml("quest-empty:" + quest.id)}">No open steps yet.</div>` : ""}
                ${qCompleted.length > 0 ? `
                  <div data-flip-key="${escapeHtml("quest-done:" + quest.id)}" style="font-size:11px;font-weight:700;letter-spacing:calc(0.12em * var(--label-track));text-transform:var(--label-case);color:var(--dim);margin:14px 0 8px;">Completed today (${qCompleted.length})</div>
                  ${qCompleted.map(t => renderCompletedCard(t, true)).join("")}
                ` : ""}
              </div>
            `;
          }).join("") + `</div>`}

          ${completedQuests.length > 0 ? `
            <div class="section-header-label">Completed Quests (${completedQuests.length})</div>
            <div class="quests-grid">
            ${completedQuests.map(quest => {
              const hex = ACCENT_HEX[quest.accentColor] || ACCENT_HEX.slate;
              const totalSec = totalSecByQuest.get(quest.id) || 0;
              return `
                <div class="review-card" style="padding:18px;background:rgb(var(--p-1) / 0.72);">
                  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;">
                    <div style="display:flex;align-items:flex-start;gap:10px;min-width:0;">
                      <span style="width:9px;height:9px;margin-top:7px;border-radius:50%;background:${hex};opacity:0.65;flex-shrink:0;"></span>
                      <h3 style="font-family:var(--font-display);font-size:17px;font-weight:600;line-height:1.28;margin:0;min-width:0;color:var(--text-2);overflow-wrap:anywhere;text-wrap:balance;">${escapeHtml(quest.title)}</h3>
                    </div>
                    <span style="flex-shrink:0;font-size:11px;font-weight:600;color:var(--emerald);padding:3px 9px;border-radius:999px;border:1px solid rgb(var(--c-success) / 0.3);background:rgb(var(--c-success) / 0.08);">✓ Completed</span>
                  </div>
                  ${quest.description ? `<p style="font-size:12px;color:var(--dim);margin:6px 0 0;line-height:1.45;overflow-wrap:anywhere;">${escapeHtml(quest.description)}</p>` : ""}
                  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);">
                    <button class="sync-chip pressable" style="color:var(--dim);border-color:transparent;background:transparent;" onclick="deleteQuestItem(${jsArg(quest.id)})" aria-label="Delete quest ${escapeHtml(quest.title)}">Delete</button>
                    <div style="display:flex;align-items:center;gap:12px;">
                      <span style="font-family:var(--font-mono);font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;">${formatTelemetryDuration(totalSec, "0.0h")} logged</span>
                      <button class="sync-chip pressable" onclick="reopenQuestItem(${jsArg(quest.id)})" aria-label="Reopen quest ${escapeHtml(quest.title)}">Reopen</button>
                    </div>
                  </div>
                </div>
              `;
            }).join("")}
            </div>
          ` : ""}
        `;
      }

      // =====================================================================
      // VIEW 5: REVIEW & DEEP-WORK TELEMETRY (Day · Week · Month · Qtr · Year)
      // =====================================================================
      else if (activeView === "telemetry") {
        const safeOffset = Math.min(0, Math.trunc(Number(reviewWeekOffset) || 0));
        const todayNoon = noonOfDateKey(todayKey);

        const calendarSpanDays = (sKey, eKey) => {
          const sp = sKey.split("-").map(Number);
          const ep = eKey.split("-").map(Number);
          return Math.max(1, Math.round((Date.UTC(ep[0], ep[1] - 1, ep[2]) - Date.UTC(sp[0], sp[1] - 1, sp[2])) / 86400000) + 1);
        };
        const stepFromKey = (baseKey, deltaDays) => {
          const d = noonOfDateKey(baseKey);
          d.setDate(d.getDate() + deltaDays);
          return toLocalDateKey(d.getTime());
        };
        const completedTaskKey = (t) => (t ? completionDateKey(t) : null);

        let win;
        if (reviewHorizon === "day") {
          const dk = dayKeyOffset(safeOffset, now);
          const d = noonOfDateKey(dk);
          win = {
            horizon: "day",
            startKey: dk,
            endKey: dk,
            totalDays: 1,
            elapsedDays: 1,
            rangeLabel: d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }),
            heading: "Daily review",
            prevLabel: "Previous day",
            nextLabel: "Next day",
            currentLabel: "Today"
          };
        } else if (reviewHorizon === "month") {
          const first = new Date(todayNoon.getFullYear(), todayNoon.getMonth() + safeOffset, 1, 12);
          const last = new Date(first.getFullYear(), first.getMonth() + 1, 0, 12);
          const sKey = toLocalDateKey(first.getTime());
          const eKey = toLocalDateKey(last.getTime());
          const totalDays = last.getDate();
          win = {
            horizon: "month",
            startKey: sKey,
            endKey: eKey,
            totalDays,
            elapsedDays: safeOffset === 0 ? Math.max(1, todayNoon.getDate()) : totalDays,
            rangeLabel: first.toLocaleDateString("en-US", { month: "short", year: "numeric" }),
            heading: "Monthly review",
            prevLabel: "Previous month",
            nextLabel: "Next month",
            currentLabel: "This month"
          };
        } else if (reviewHorizon === "quarter") {
          const curQ = Math.floor(todayNoon.getMonth() / 3);
          const totalQ = todayNoon.getFullYear() * 4 + curQ + safeOffset;
          const qYear = Math.floor(totalQ / 4);
          const qIdx = ((totalQ % 4) + 4) % 4;
          const first = new Date(qYear, qIdx * 3, 1, 12);
          const last = new Date(qYear, qIdx * 3 + 3, 0, 12);
          const sKey = toLocalDateKey(first.getTime());
          const eKey = toLocalDateKey(last.getTime());
          const totalDays = calendarSpanDays(sKey, eKey);
          win = {
            horizon: "quarter",
            startKey: sKey,
            endKey: eKey,
            totalDays,
            elapsedDays: safeOffset === 0 ? Math.min(totalDays, calendarSpanDays(sKey, todayKey)) : totalDays,
            rangeLabel: "Q" + (qIdx + 1) + " " + qYear,
            heading: "Quarterly review",
            prevLabel: "Previous quarter",
            nextLabel: "Next quarter",
            currentLabel: "This qtr"
          };
        } else if (reviewHorizon === "year") {
          const yr = todayNoon.getFullYear() + safeOffset;
          const sKey = yr + "-01-01";
          const eKey = yr + "-12-31";
          const totalDays = calendarSpanDays(sKey, eKey);
          win = {
            horizon: "year",
            startKey: sKey,
            endKey: eKey,
            totalDays,
            elapsedDays: safeOffset === 0 ? Math.min(totalDays, calendarSpanDays(sKey, todayKey)) : totalDays,
            rangeLabel: String(yr),
            heading: "Yearly review",
            prevLabel: "Previous year",
            nextLabel: "Next year",
            currentLabel: "This year"
          };
        } else {
          const sKey = dayKeyOffset(safeOffset * 7 - 6, now);
          const eKey = dayKeyOffset(safeOffset * 7, now);
          const sd = noonOfDateKey(sKey);
          const ed = noonOfDateKey(eKey);
          win = {
            horizon: "week",
            startKey: sKey,
            endKey: eKey,
            totalDays: 7,
            elapsedDays: 7,
            rangeLabel: sd.toLocaleDateString("en-US", { month: "short", day: "numeric" }) + " – " + ed.toLocaleDateString("en-US", { month: "short", day: "numeric" }),
            heading: "Weekly review",
            prevLabel: "Previous week",
            nextLabel: "Next week",
            currentLabel: "This week"
          };
        }

        const selectedQuest = (reviewScope !== "ALL" && reviewScope !== "OTHER")
          ? state.quests.find(q => q.id === reviewScope) || null
          : null;
        const effectiveScope = (reviewScope !== "ALL" && reviewScope !== "OTHER" && !selectedQuest) ? "ALL" : reviewScope;
        const matchesScope = (qId) => {
          const norm = qId || null;
          if (effectiveScope === "ALL") return norm !== null;
          if (effectiveScope === "OTHER") return norm === null;
          return norm === effectiveScope;
        };

        const scopeHex = selectedQuest
          ? (ACCENT_HEX[selectedQuest.accentColor] || ACCENT_HEX.amber)
          : effectiveScope === "OTHER"
          ? "var(--muted)"
          : ACCENT_HEX.amber;

        // Build horizon buckets
        const buckets = [];
        if (win.horizon === "day") {
          const labels = ["12a", "4a", "8a", "12p", "4p", "8p"];
          const curHour = new Date(now).getHours();
          for (let i = 0; i < 6; i++) {
            buckets.push({ key: win.startKey + "-b" + i, label: labels[i], scopeSec: 0, tasks: 0, isCurrent: win.startKey === todayKey && Math.floor(curHour / 4) === i });
          }
        } else if (win.horizon === "week") {
          for (let i = 0; i < 7; i++) {
            const dk = stepFromKey(win.startKey, i);
            const d = noonOfDateKey(dk);
            buckets.push({ key: dk, label: d.toLocaleDateString("en-US", { weekday: "short" }), scopeSec: 0, tasks: 0, isCurrent: dk === todayKey });
          }
        } else if (win.horizon === "month") {
          const ym = win.startKey.slice(0, 7);
          let sd = 1, wk = 1;
          while (sd <= win.totalDays) {
            const ed = Math.min(win.totalDays, sd + 6);
            const sk = ym + "-" + String(sd).padStart(2, "0");
            const ek = ym + "-" + String(ed).padStart(2, "0");
            buckets.push({ key: ym + "-w" + wk, label: sd + "–" + ed, scopeSec: 0, tasks: 0, isCurrent: todayKey >= sk && todayKey <= ek });
            sd += 7;
            wk++;
          }
        } else if (win.horizon === "quarter") {
          const sp = win.startKey.split("-").map(Number);
          for (let i = 0; i < 3; i++) {
            const d = new Date(sp[0], sp[1] - 1 + i, 1, 12);
            const ym = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
            buckets.push({ key: ym, label: d.toLocaleDateString("en-US", { month: "short" }), scopeSec: 0, tasks: 0, isCurrent: todayKey.startsWith(ym) });
          }
        } else {
          const yr = Number(win.startKey.slice(0, 4));
          for (let m = 0; m < 12; m++) {
            const d = new Date(yr, m, 1, 12);
            const ym = yr + "-" + String(m + 1).padStart(2, "0");
            const sm = d.toLocaleDateString("en-US", { month: "short" });
            buckets.push({ key: ym, label: sm.slice(0, 1), scopeSec: 0, tasks: 0, isCurrent: todayKey.startsWith(ym) });
          }
        }

        const bucketIndex = (dk, ts) => {
          if (win.horizon === "day") {
            if (typeof ts === "number" && Number.isFinite(ts) && ts > 0) return Math.min(5, Math.max(0, Math.floor(new Date(ts).getHours() / 4)));
            return 2;
          }
          if (win.horizon === "week") return calendarSpanDays(win.startKey, dk) - 1;
          if (win.horizon === "month") return Math.floor(((Number(dk.slice(8, 10)) || 1) - 1) / 7);
          if (win.horizon === "quarter") return Math.min(2, Math.max(0, Number(dk.slice(5, 7)) - Number(win.startKey.slice(5, 7))));
          return Math.min(11, Math.max(0, (Number(dk.slice(5, 7)) || 1) - 1));
        };

        const byQuestSec = new Map();
        const byQuestTasks = new Map();
        const activeDaysSet = new Set();
        const focusActiveDaysSet = new Set();
        const scopedLogs = [];
        let questSec = 0;
        let otherSec = 0;
        let scopeSec = 0;
        let sessionsCount = 0;
        let longestSessionSec = 0;

        for (const l of state.timeLogs) {
          if (!l || typeof l.dateKey !== "string") continue;
          if (l.dateKey < win.startKey || l.dateKey > win.endKey) continue;
          const dur = Math.max(0, Number(l.durationSeconds) || 0);
          const qId = l.questId || null;
          if (qId !== null) {
            questSec += dur;
            byQuestSec.set(qId, (byQuestSec.get(qId) || 0) + dur);
          } else {
            otherSec += dur;
          }
          const inScope = matchesScope(qId);
          if (inScope) {
            scopeSec += dur;
            if (dur > 0) {
              sessionsCount++;
              if (dur > longestSessionSec) longestSessionSec = dur;
              activeDaysSet.add(l.dateKey);
              focusActiveDaysSet.add(l.dateKey);
            }
            const b = buckets[bucketIndex(l.dateKey, l.startTime)];
            if (b && dur > 0) b.scopeSec += dur;
          }
          if (effectiveScope === "ALL" || inScope) scopedLogs.push(l);
        }
        scopedLogs.sort((a, b) => (Number(b.startTime) || 0) - (Number(a.startTime) || 0));

        let completedTasksCount = 0;
        let stepTasksCompleted = 0;
        let habitTasksCompleted = 0;
        let otherTasksCompleted = 0;

        for (const t of state.tasks) {
          const dk = completedTaskKey(t);
          if (!dk || dk < win.startKey || dk > win.endKey) continue;
          const qId = t.questId || null;
          if (qId !== null) byQuestTasks.set(qId, (byQuestTasks.get(qId) || 0) + 1);
          else otherTasksCompleted++;
          const inScope = effectiveScope === "ALL" ? true : matchesScope(qId);
          if (!inScope) continue;
          completedTasksCount++;
          if (t.habitId) habitTasksCompleted++;
          else stepTasksCompleted++;
          if (matchesScope(qId)) activeDaysSet.add(dk);
          const b = buckets[bucketIndex(dk, t.completedAt)];
          if (b) b.tasks += 1;
        }

        const chartBuckets = buckets.map(b => ({
          ...b,
          hours: Number((b.scopeSec / 3600).toFixed(1))
        }));

        const grandSec = questSec + otherSec;
        const focusH = Number((scopeSec / 3600).toFixed(1));

        let weeklyTargetBase = 0;
        if (effectiveScope === "ALL") {
          weeklyTargetBase = activeQuests.reduce((a, q) => a + (Number(q.targetWeeklyHours) || 0), 0);
        } else if (selectedQuest) {
          weeklyTargetBase = Number(selectedQuest.targetWeeklyHours) || 0;
        }
        const totalTargetH = weeklyTargetBase <= 0
          ? 0
          : win.horizon === "week"
          ? weeklyTargetBase
          : win.horizon === "day"
          ? Number((weeklyTargetBase / 7).toFixed(1))
          : Math.round((weeklyTargetBase * win.totalDays) / 7);

        const targetPct = totalTargetH > 0 ? Math.round(((scopeSec / 3600) / totalTargetH) * 100) : 0;
        const activeDaysCount = activeDaysSet.size;
        const focusDenomDays = Math.max(1, focusActiveDaysSet.size > 0 ? focusActiveDaysSet.size : activeDaysCount);
        const dailyAvgSec = scopeSec / focusDenomDays;
        const consistencyPct = Math.min(100, Math.round((activeDaysCount / Math.max(1, win.elapsedDays)) * 100));
        const focusPct = grandSec > 0 ? Math.round((scopeSec / grandSec) * 100) : 0;
        const overallQuestPct = grandSec > 0 ? Math.round((questSec / grandSec) * 100) : 0;
        const avgBoutMin = sessionsCount > 0 && scopeSec > 0 ? Math.max(1, Math.round(scopeSec / sessionsCount / 60)) : 0;
        const maxBoutMin = longestSessionSec > 0 ? Math.max(1, Math.round(longestSessionSec / 60)) : 0;

        const maxBucketVal = reviewChartMetric === "tasks"
          ? Math.max(4, ...chartBuckets.map(b => b.tasks))
          : Math.max(1800, ...chartBuckets.map(b => b.scopeSec));

        const hoursByQuest = state.quests
          .map(q => {
            const sec = byQuestSec.get(q.id) || 0;
            const qTasks = byQuestTasks.get(q.id) || 0;
            return { quest: q, sec, hours: Number((sec / 3600).toFixed(1)), tasks: qTasks };
          })
          .filter(x => !x.quest.archived || x.sec > 0 || x.tasks > 0)
          .sort((a, b) => (b.sec - a.sec) || (b.tasks - a.tasks) || ((a.quest.slotIndex || 0) - (b.quest.slotIndex || 0)));
        const maxQuestSec = Math.max(1800, ...hoursByQuest.map(x => x.sec));

        // 16-week Monday-aligned Activity Heatmap
        const HEATMAP_WEEKS = 16;
        const mondayDow = (todayNoon.getDay() + 6) % 7;
        const hmStartKey = stepFromKey(todayKey, -mondayDow - (HEATMAP_WEEKS - 1) * 7);
        const hmMap = new Map();
        for (const l of state.timeLogs) {
          if (!l || typeof l.dateKey !== "string" || l.dateKey < hmStartKey || l.dateKey > todayKey) continue;
          const inHm = effectiveScope === "ALL" ? true : matchesScope(l.questId || null);
          if (!inHm) continue;
          const dur = Math.max(0, Number(l.durationSeconds) || 0);
          if (dur <= 0) continue;
          const cur = hmMap.get(l.dateKey) || { sec: 0, tasks: 0, sessions: 0 };
          cur.sec += dur;
          cur.sessions += 1;
          hmMap.set(l.dateKey, cur);
        }
        for (const t of state.tasks) {
          const dk = completedTaskKey(t);
          if (!dk || dk < hmStartKey || dk > todayKey) continue;
          const inHm = effectiveScope === "ALL" ? true : matchesScope(t.questId || null);
          if (!inHm) continue;
          const cur = hmMap.get(dk) || { sec: 0, tasks: 0, sessions: 0 };
          cur.tasks += 1;
          hmMap.set(dk, cur);
        }

        const hmBaseRgb = selectedQuest
          ? (ACCENT_RGB[selectedQuest.accentColor] || ACCENT_RGB.amber)
          : effectiveScope === "OTHER"
          ? ACCENT_RGB.slate
          : ACCENT_RGB.amber;
        const hmLevelBg = [
          "rgb(var(--c-ink) / 0.05)",
          `rgb(${hmBaseRgb} / 0.22)`,
          `rgb(${hmBaseRgb} / 0.44)`,
          `rgb(${hmBaseRgb} / 0.72)`,
          `rgb(${hmBaseRgb})`
        ];

        const hmCols = [];
        const wdTotals = Array.from({ length: 7 }, () => ({ sec: 0, tasks: 0, days: 0 }));
        const wdNames = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
        let prevHmMonth = -1;
        let hmActiveDays = 0;
        let hmRunStreak = 0;
        let hmBestStreak = 0;
        let inspectedCell = null;
        let todayCell = null;

        for (let w = 0; w < HEATMAP_WEEKS; w++) {
          let mLabel = "";
          const cells = [];
          for (let dow = 0; dow < 7; dow++) {
            const dk = stepFromKey(hmStartKey, w * 7 + dow);
            const d = noonOfDateKey(dk);
            if (dow === 0) {
              const m = d.getMonth();
              if (m !== prevHmMonth) {
                mLabel = d.toLocaleDateString("en-US", { month: "short" });
                prevHmMonth = m;
              }
            }
            const isFuture = dk > todayKey;
            const rec = isFuture ? null : hmMap.get(dk);
            const sec = rec ? rec.sec : 0;
            const tCount = rec ? rec.tasks : 0;
            const sCount = rec ? rec.sessions : 0;
            const hrs = Number((sec / 3600).toFixed(1));
            const score = (sec / 3600) + tCount * 0.35;
            const lvl = isFuture || (sec <= 0 && tCount <= 0) ? 0 : score < 1 ? 1 : score < 2.5 ? 2 : score < 4.5 ? 3 : 4;
            const shortLbl = d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });

            if (!isFuture) {
              wdTotals[dow].sec += sec;
              wdTotals[dow].tasks += tCount;
              wdTotals[dow].days += 1;
              if (sec > 0 || tCount > 0) {
                hmActiveDays++;
                hmRunStreak++;
                if (hmRunStreak > hmBestStreak) hmBestStreak = hmRunStreak;
              } else {
                hmRunStreak = 0;
              }
            }
            const cellObj = { dateKey: dk, shortLbl, sec, hours: hrs, tasks: tCount, sessions: sCount, lvl, isToday: dk === todayKey, isFuture };
            if (cellObj.isToday) todayCell = cellObj;
            if (!isFuture && selectedReviewHeatmapKey === dk) inspectedCell = cellObj;
            cells.push(cellObj);
          }
          hmCols.push({ weekKey: cells[0].dateKey, monthLabel: mLabel, cells });
        }
        if (!inspectedCell) inspectedCell = todayCell;

        let hmCurrentStreak = 0;
        const todayHm = hmMap.get(todayKey);
        const startOff = todayHm && (todayHm.sec > 0 || todayHm.tasks > 0) ? 0 : -1;
        for (let off = startOff; ; off--) {
          const dk = stepFromKey(todayKey, off);
          if (dk < hmStartKey) break;
          const r = hmMap.get(dk);
          if (r && (r.sec > 0 || r.tasks > 0)) hmCurrentStreak++;
          else break;
        }

        let bestWd = null;
        let bestWdScore = 0;
        for (let dow = 0; dow < 7; dow++) {
          const wt = wdTotals[dow];
          const sc = wt.sec / 3600 + wt.tasks * 0.25;
          if (sc > bestWdScore && wt.days > 0) {
            bestWdScore = sc;
            bestWd = { label: wdNames[dow], avgHours: Number((wt.sec / 3600 / wt.days).toFixed(1)) };
          }
        }

        const horizonTabs = [
          ["day", "Day"],
          ["week", "Week"],
          ["month", "Month"],
          ["quarter", "Qtr"],
          ["year", "Year"]
        ];

        container.innerHTML = `
          <div class="hero-bar">
            <div>
              <div class="hero-eyebrow">${escapeHtml(win.rangeLabel)}</div>
              <h1 class="hero-title">${escapeHtml(win.heading)}</h1>
            </div>
            <div class="step-chip-row">
              <button class="sync-chip step-chip" aria-label="${escapeHtml(win.prevLabel)}" onclick="reviewWeekOffset--;reviewSessionLimit=REVIEW_SESSION_PAGE;renderApp();">‹</button>
              <button class="sync-chip step-chip" onclick="reviewWeekOffset=0;reviewSessionLimit=REVIEW_SESSION_PAGE;renderApp();" ${safeOffset === 0 ? "disabled" : ""}>${escapeHtml(win.currentLabel)}</button>
              <button class="sync-chip step-chip" aria-label="${escapeHtml(win.nextLabel)}" onclick="if(reviewWeekOffset<0){reviewWeekOffset++;reviewSessionLimit=REVIEW_SESSION_PAGE;renderApp();}" ${safeOffset < 0 ? "" : "disabled"}>›</button>
            </div>
          </div>

          <div class="review-horizon-bar" role="group" aria-label="Review timeframe">
            ${horizonTabs.map(([id, lbl]) => `
              <button class="review-horizon-btn ${win.horizon === id ? "active" : ""}" aria-pressed="${win.horizon === id}" onclick="reviewHorizon=${jsArg(id)};reviewWeekOffset=0;reviewSessionLimit=REVIEW_SESSION_PAGE;renderApp();">${lbl}</button>
            `).join("")}
          </div>

          <div class="chip-strip" role="group" aria-label="Filter review by quest">
            <button class="filter-pill ${effectiveScope === "ALL" ? "active" : ""}" aria-pressed="${effectiveScope === "ALL"}" onclick="reviewScope='ALL';reviewSessionLimit=REVIEW_SESSION_PAGE;renderApp();">
              <span>All Quests</span>
            </button>
            ${state.quests.map(q => {
              const qHex = ACCENT_HEX[q.accentColor] || ACCENT_HEX.slate;
              const isSel = effectiveScope === q.id;
              return `
                <button class="filter-pill ${isSel ? "active" : ""}" aria-pressed="${isSel}" onclick="reviewScope=${jsArg(isSel ? "ALL" : q.id)};reviewSessionLimit=REVIEW_SESSION_PAGE;renderApp();">
                  <span style="width:7px;height:7px;border-radius:50%;background:${qHex};flex-shrink:0;"></span>
                  <span>${escapeHtml(q.title)}</span>
                </button>
              `;
            }).join("")}
            <button class="filter-pill ${effectiveScope === "OTHER" ? "active" : ""}" aria-pressed="${effectiveScope === "OTHER"}" onclick="reviewScope=${jsArg(effectiveScope === "OTHER" ? "ALL" : "OTHER")};reviewSessionLimit=REVIEW_SESSION_PAGE;renderApp();">
              <span style="width:7px;height:7px;border-radius:50%;background:var(--neutral-dot);flex-shrink:0;"></span>
              <span>Other</span>
            </button>
          </div>

          <div class="review-kpi-grid">
            <div class="review-card" style="grid-column:span 2;margin-bottom:0;">
              <div class="hero-eyebrow" style="overflow-wrap:anywhere;">${effectiveScope === "OTHER" ? "Other Work Hours" : selectedQuest ? escapeHtml(selectedQuest.title) + " · Hours" : "Quest Hours"}</div>
              <div style="display:flex;align-items:baseline;gap:8px;margin-top:6px;font-variant-numeric:tabular-nums;">
                <span style="font-family:var(--font-display);font-size:36px;font-weight:700;color:${scopeHex};">${formatTelemetryDuration(scopeSec, "0.0h")}</span>
                ${effectiveScope !== "OTHER" ? `<span style="font-size:16px;color:var(--dim);">/ ${totalTargetH}h</span>` : ""}
                <span style="margin-left:auto;font-size:12px;color:var(--muted);">${effectiveScope === "OTHER" ? "Unassigned work" : `${targetPct}% of target`}</span>
              </div>
            </div>

            <div class="review-card" style="margin-bottom:0;">
              <div class="hero-eyebrow">Daily Average</div>
              <div style="font-family:var(--font-display);font-size:28px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;">${formatTelemetryDuration(dailyAvgSec, "0.0h")}</div>
              <div style="font-size:11px;color:var(--dim);margin-top:4px;font-variant-numeric:tabular-nums;">${activeDaysCount}/${win.elapsedDays}d active (${consistencyPct}%)</div>
            </div>

            <div class="review-card" style="margin-bottom:0;">
              <div class="hero-eyebrow">${effectiveScope === "ALL" ? "Quest vs Other" : "Focus Share"}</div>
              <div style="font-family:var(--font-display);font-size:28px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;">${focusPct}<span style="font-size:16px;color:var(--dim);">%</span></div>
              <div style="font-size:11px;color:var(--dim);margin-top:4px;font-variant-numeric:tabular-nums;">Of ${formatTelemetryDuration(grandSec, "0.0h")} total</div>
            </div>

            <div class="review-card" style="margin-bottom:0;" data-review-stat="tasks">
              <div class="hero-eyebrow">Tasks Completed</div>
              <div style="font-family:var(--font-display);font-size:26px;font-weight:700;margin-top:6px;color:var(--emerald);font-variant-numeric:tabular-nums;">${completedTasksCount}</div>
              <div style="font-size:11px;color:var(--dim);margin-top:4px;font-variant-numeric:tabular-nums;">${stepTasksCompleted} steps · ${habitTasksCompleted} habits</div>
            </div>

            <div class="review-card" style="margin-bottom:0;" data-review-stat="sessions">
              <div class="hero-eyebrow">Focus Sessions</div>
              <div style="font-family:var(--font-display);font-size:26px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;">${sessionsCount}</div>
              <div style="font-size:11px;color:var(--dim);margin-top:4px;font-variant-numeric:tabular-nums;">${sessionsCount > 0 ? `Avg ${avgBoutMin}m · Max ${maxBoutMin}m` : "No bouts logged"}</div>
            </div>
          </div>

          <div class="review-tablet-split">
          <div class="review-card">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px;">
              <div class="hero-eyebrow" style="margin-bottom:0;">${reviewChartMetric === "tasks" ? "Completed Tasks" : "Focus Hours"} · ${win.horizon === "day" ? "By Block" : win.horizon === "week" ? "Per Day" : win.horizon === "month" ? "By Week" : "Per Month"}</div>
              <div style="display:flex;gap:8px;flex-shrink:0;">
                <button class="sync-chip mini-chip-btn" aria-pressed="${reviewChartMetric === "hours"}" style="${reviewChartMetric === "hours" ? "background:var(--surface-3);color:var(--white);border-color:var(--border-strong);" : "color:var(--muted);"}" onclick="reviewChartMetric='hours';renderApp();">Hours</button>
                <button class="sync-chip mini-chip-btn" aria-pressed="${reviewChartMetric === "tasks"}" style="${reviewChartMetric === "tasks" ? "background:var(--surface-3);color:var(--white);border-color:var(--border-strong);" : "color:var(--muted);"}" onclick="reviewChartMetric='tasks';renderApp();">Tasks</button>
              </div>
            </div>
            <div style="display:grid;grid-template-columns:repeat(${chartBuckets.length}, minmax(0, 1fr));gap:${chartBuckets.length > 8 ? "4px" : "8px"};align-items:end;">
              ${chartBuckets.map(d => {
                const val = reviewChartMetric === "tasks" ? d.tasks : d.scopeSec;
                const barPct = val > 0 ? Math.max(8, Math.round((val / maxBucketVal) * 100)) : 3;
                const topLabel = reviewChartMetric === "tasks"
                  ? (d.tasks >= 1000 ? (d.tasks / 1000).toFixed(1) + "k" : String(d.tasks))
                  : chartBuckets.length > 8 && d.scopeSec > 0 && d.scopeSec < 360000
                    // ~20 px year columns can't fit "42.5h": whole hours (or "<1h") stay readable
                    ? (d.scopeSec < 3600 ? "&lt;1h" : Math.round(d.scopeSec / 3600) + "h")
                    : formatTelemetryDuration(d.scopeSec, "0h", true);
                return `
                  <div style="display:flex;flex-direction:column;align-items:center;min-width:0;">
                    <span style="font-family:var(--font-mono);font-size:${chartBuckets.length > 8 ? "9px" : "10px"};font-variant-numeric:tabular-nums;margin-bottom:8px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:${d.isCurrent ? scopeHex : (val > 0 ? "var(--text-2)" : "var(--dim)")};">
                      ${topLabel}
                    </span>
                    <div class="review-bar-track">
                      <div style="width:100%;height:${barPct}%;border-radius:6px 6px 2px 2px;background:${d.isCurrent ? scopeHex : (val > 0 ? "rgb(var(--p-edge-2))" : "rgb(var(--c-ink) / 0.05)")};"></div>
                    </div>
                    <span style="font-size:${chartBuckets.length > 8 ? "10px" : "11px"};margin-top:8px;color:${d.isCurrent ? scopeHex : "var(--dim)"};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;">${escapeHtml(d.label)}</span>
                  </div>
                `;
              }).join("")}
            </div>
          </div>

          <div class="review-card" data-review-heatmap="true">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;">
              <div>
                <div class="hero-eyebrow" style="margin-bottom:2px;">Activity Heatmap · 16 Weeks</div>
                <div style="font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;">${hmActiveDays} active ${hmActiveDays === 1 ? "day" : "days"} · Streak ${hmCurrentStreak}d · Best ${hmBestStreak}d${bestWd ? " · Peak " + bestWd.label : ""}</div>
              </div>
            </div>
            <div class="heatmap-months">
              ${hmCols.map(c => `<span>${escapeHtml(c.monthLabel)}</span>`).join("")}
            </div>
            <div class="heatmap-body">
              <div class="heatmap-weekdays">
                <span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span><span>Sun</span>
              </div>
              <div class="heatmap-cols">
                ${hmCols.map(col => `
                  <div class="heatmap-col">
                    ${col.cells.map(cell => cell.isFuture ? `<span style="aspect-ratio:1/1;width:100%;"></span>` : `
                      <div class="heatmap-cell ${inspectedCell && inspectedCell.dateKey === cell.dateKey ? "selected" : ""} ${cell.isToday ? "today" : ""}" role="button" tabindex="0" data-hm-key="${escapeHtml(cell.dateKey)}" data-hm-text="${escapeHtml(cell.shortLbl + " · " + formatTelemetryDuration(cell.sec, "0.0h") + " · " + cell.tasks + " " + (cell.tasks === 1 ? "task" : "tasks"))}" aria-label="${escapeHtml(cell.shortLbl + ": " + formatTelemetryDuration(cell.sec, "0h") + ", " + cell.tasks + " tasks")}" onclick="selectedReviewHeatmapKey=${jsArg(cell.dateKey)};renderApp();" style="background:${hmLevelBg[cell.lvl]};"></div>
                    `).join("")}
                  </div>
                `).join("")}
              </div>
            </div>
            <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--border);font-size:11px;color:var(--text-2);font-variant-numeric:tabular-nums;">
              <span data-hm-readout>${inspectedCell ? `${escapeHtml(inspectedCell.shortLbl)} · ${formatTelemetryDuration(inspectedCell.sec, "0.0h")} · ${inspectedCell.tasks} ${inspectedCell.tasks === 1 ? "task" : "tasks"}` : "Tap a day to inspect"}</span>
              <span style="display:inline-flex;align-items:center;gap:3px;color:var(--dim);font-size:10px;">
                Less
