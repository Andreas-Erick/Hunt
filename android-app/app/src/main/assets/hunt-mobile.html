<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" id="viewportMeta" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#08090c" />
  <script>
    // Look (ADR-0005), applied before the stylesheet so the page never flashes the other palette.
    // Per device and never synced. Neon (no attribute) is the default.
    (function () {
      try {
        var look = localStorage.getItem("hunt-look");
        if (look === "dawn" || look === "neon") document.documentElement.dataset.theme = look;
        if (look === "dawn") document.querySelector("meta[name=theme-color]").setAttribute("content", "#101826");
      } catch (e) {
        // Storage blocked (WebView without DOM storage, private mode): Neon is a safe default, nothing is lost.
      }
    })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Hunt" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <!-- Non-render-blocking: the app paints immediately with system fonts, web fonts swap in when (and if) they arrive. -->
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" /></noscript>
  <title>Hunt</title>
  <style>
    :root {
      /* Looks (ADR-0005). Every colour is a token written as "R G B" channels; Neon is the original palette,
         Dawn (:root[data-theme="dawn"], below) redefines the same names. Shared names match src/app/globals.css;
         --p-* are this page's own grounds. No data-theme attribute means Neon. */
      --c-ink: 255 255 255;
      --c-black: 0 0 0;
      --c-edge: 44 47 58;
      --c-slate-400: 148 163 184;
      --c-accent: 0 240 255;
      --c-accent-2: 0 210 255;
      --c-on-accent: 5 7 10;
      --c-success: 0 255 157;
      --c-warning: 255 184 0;
      --c-danger: 255 42 95;
      --c-danger-soft: 255 107 144;
      --q-cyan: 0 240 255;
      --q-emerald: 0 255 157;
      --q-amber: 255 184 0;
      --q-purple: 179 136 255;
      --q-rose: 255 107 157;
      --q-sky: 56 189 248;
      --q-orange: 255 133 71;
      --q-lime: 163 230 53;
      --q-slate: 100 116 139;
      --p-0: 8 9 12;
      --p-deep: 9 11 15;
      --p-bar: 11 13 18;
      --p-1: 17 19 25;
      --p-sheet: 19 22 31;
      --p-card: 20 24 34;
      --p-card-2: 15 18 25;
      --p-2: 22 25 34;
      --p-3: 28 32 43;
      --p-edge-2: 59 63 76;
      --p-scrim: 5 7 11;
      --p-strike: 163 171 188;
      --p-text: 248 250 252;
      --p-text-2: 203 213 225;
      --p-muted: 148 163 184;
      --p-dim: 124 138 160; /* >= 4.5:1 on every surface it is used on (was #64748b, ~3.8:1) */
      --p-neutral-dot: 102 112 127; /* calm "working on the phone" state: neither success nor warning */
      --glow: 1; /* multiplies every glow's alpha and blur; Dawn has none */
      --hatch: 1; /* striped logged blocks on the day timeline; Dawn uses a flat tint */
      --label-case: uppercase; /* section labels: tracked capitals in Neon, sentence case in Dawn */
      --label-track: 1;
      --font-sans: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-display: "Space Grotesk", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --font-heading: var(--font-display); /* page titles and the focus clock */
      --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, "Roboto Mono", "Droid Sans Mono", monospace;

      /* Names the rules use, resolved from the tokens above. */
      --bg: rgb(var(--p-0));
      --surface: rgb(var(--p-1));
      --surface-2: rgb(var(--p-2));
      --surface-3: rgb(var(--p-3));
      --border: rgb(var(--c-ink) / 0.07);
      --border-strong: rgb(var(--c-ink) / 0.14);
      --white: rgb(var(--c-ink));
      --text: rgb(var(--p-text));
      --text-2: rgb(var(--p-text-2));
      --muted: rgb(var(--p-muted));
      --dim: rgb(var(--p-dim));
      --cyan: rgb(var(--c-accent));
      --emerald: rgb(var(--c-success));
      --amber: rgb(var(--c-warning));
      --rose: rgb(var(--c-danger));
      --slate: rgb(var(--q-slate));
      --neutral-dot: rgb(var(--p-neutral-dot));
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-left: env(safe-area-inset-left, 0px);   /* landscape cutouts / rounded corners */
      --safe-right: env(safe-area-inset-right, 0px);
      --touch-min: 48px; /* Android minimum touch target (48 dp) */
      --sheet-pad-bottom: 18px; /* bottom sheets' bottom padding (the sticky .sheet-actions bar covers it) */
      --kb: 0px; /* native Android 11+ IME height driven frame-by-frame by WindowInsetsAnimation (compositor only) */
      --kb-settled: 0px; /* settled IME height updated once after animation (zero per-frame layout reflow) */
    }

    /* Dawn: blue-hour grounds, cream text, the logo's gold as the only accent, no glows. */
    :root[data-theme="dawn"] {
      --c-ink: 237 230 216;
      --c-black: 8 12 21;
      --c-edge: 46 59 83;
      --c-slate-400: 150 160 180;
      --c-accent: 229 170 80;
      --c-accent-2: 214 152 62;
      --c-on-accent: 8 12 21;
      --c-success: 143 203 155;
      --c-warning: 236 145 104;
      --c-danger: 232 119 127;
      --c-danger-soft: 236 150 156;
      --q-cyan: 132 184 230;
      --q-emerald: 143 203 155;
      --q-amber: 229 170 80;
      --q-purple: 183 163 230;
      --q-rose: 230 154 182;
      --q-sky: 114 198 192;
      --q-orange: 236 145 104;
      --q-lime: 189 207 112;
      --q-slate: 108 120 145;
      --p-0: 16 24 38;
      --p-deep: 14 21 34;
      --p-bar: 19 28 43;
      --p-1: 23 33 51;
      --p-sheet: 27 38 57;
      --p-card: 27 38 57;
      --p-card-2: 21 31 48;
      --p-2: 31 43 64;
      --p-3: 38 51 74;
      --p-edge-2: 58 72 99;
      --p-scrim: 6 10 18;
      --p-strike: 154 163 181;
      --p-text: 237 230 216;
      --p-text-2: 201 203 209;
      --p-muted: 154 163 181;
      --p-dim: 148 157 176; /* >= 4.5:1 on --p-1 through --p-3 */
      --p-neutral-dot: 121 131 154;
      --glow: 0;
      --hatch: 0;
      --label-case: none;
      --label-track: 0;
      --font-sans: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --font-display: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --font-heading: "Newsreader", "Iowan Old Style", Georgia, serif;
      --font-mono: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    /* Hanken's tabular figures stand in for the mono face, so times still line up. */
    :root[data-theme="dawn"] body { font-variant-numeric: tabular-nums lining-nums; }
    :root[data-theme="dawn"] .hero-title { font-weight: 500; letter-spacing: -0.01em; }
    :root[data-theme="dawn"] .focus-chrono { font-weight: 400; letter-spacing: -0.02em; }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      /* clip (not hidden): hidden turned <body> into a scroll container and broke the sticky app bar */
      overflow-x: clip;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    @supports not (overflow-x: clip) {
      html { overflow-x: hidden; }
    }

    /* FAB clearance: the last row ends 8 px above the FAB's top edge in every layout
       (--fab-clear = FAB bottom + FAB height + 8 px - .screen-body's bottom padding). While toasts are
       up the FAB lifts by the real toast-stack height (--toast-stack, set in syncToastBodyClass), and
       the page gains the same extra room so the last row can still scroll clear of it. */
    body {
      --fab-clear: 120px; /* phone portrait: FAB 84 + 52, screen-body 24 */
      padding-bottom: calc(var(--fab-clear) + var(--toast-lift, 0px) + var(--safe-bottom));
    }
    body.has-toast {
      --toast-lift: var(--toast-stack, 48px);
    }

    button, input, textarea {
      font-family: inherit;
    }

    input, textarea {
      user-select: text;
    }

    /* Instant press feedback on every control (the tap highlight is disabled above). */
    button:not(:disabled):active,
    .queue-item-body:active,
    [role="button"]:active {
      opacity: 0.85;
    }
    button:disabled {
      cursor: default;
    }

    :where(button, a, input, textarea, select, [tabindex]):focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 2px;
    }

    .pressable {
      transition: transform 0.12s cubic-bezier(0.2, 0, 0, 1);
    }
    .pressable:active {
      transform: scale(0.985);
    }

    /* Invisible 48 px touch target around small controls (the visual size does not change). */
    .hit-target,
    .task-check-ring,
    .icon-circle-btn,
    .sync-chip,
    .live-timer-chip,
    .filter-pill,
    .sheet-close,
    .log-delete-btn {
      position: relative;
    }
    .hit-target::after,
    .task-check-ring::after,
    .icon-circle-btn::after,
    .sync-chip::after,
    .live-timer-chip::after,
    .filter-pill::after,
    .sheet-close::after,
    .log-delete-btn::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: max(100%, var(--touch-min));
      height: max(100%, var(--touch-min));
      transform: translate(-50%, -50%);
    }
    /* the check ring sits 12 px from its card's body: its target grows into the card's 18 px left
       padding instead, so the two never overlap */
    .task-check-ring::after {
      left: -15px;
      width: calc(100% + 26px);
      transform: translateY(-50%);
    }

    /* Sticky Top App Bar */
    .app-bar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: calc(58px + var(--safe-top));
      padding: var(--safe-top) calc(18px + var(--safe-right)) 0 calc(18px + var(--safe-left));
      /* solid: a blur under a 86 %-opaque bar was invisible but cost a GPU pass per scroll frame */
      background: rgb(var(--p-0));
      border-bottom: 1px solid rgb(var(--c-ink) / 0.05);
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: var(--touch-min);
      background: transparent;
      border: none;
      color: var(--white);
      padding: 0;
      cursor: pointer;
      flex-shrink: 0;
    }

    .brand-word {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .brand-version-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgb(var(--c-ink) / 0.03);
      color: var(--dim);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.01em;
      pointer-events: none;
    }

    .app-bar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    /* the live timer and the mute button keep their size on narrow screens; the sync chip gives way */
    #activeHeaderPill {
      flex-shrink: 0;
    }

    .live-timer-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 11px;
      border-radius: 999px;
      background: rgb(var(--c-success) / 0.12);
      border: 1px solid rgb(var(--c-success) / 0.32);
      color: var(--emerald);
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .sync-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 11px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-2);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }
    .sync-chip:disabled {
      opacity: 0.35;
    }

    /* Header sync chip: calm states. Offline is a normal mode of an offline-first app, not an error. */
    #syncChipBtn {
      /* stable width: "Synced · now" <-> "Syncing…" must not shift the header on every tap */
      min-width: 108px;
      max-width: 172px;
      justify-content: center;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }
    #headerSyncText {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    /* "pending" (changes waiting, nothing in flight) looks like "ok": the label is still "Synced · 2m" */
    #syncChipBtn[data-phase="ok"],
    #syncChipBtn[data-phase="pending"] {
      border-color: rgb(var(--c-success) / 0.22);
    }
    #syncChipBtn[data-phase="syncing"] {
      border-color: rgb(var(--c-accent) / 0.22);
    }
    #syncChipBtn[data-phase="offline"],
    #syncChipBtn[data-phase="connecting"] {
      color: var(--muted);
    }
    #syncChipBtn[data-phase="attention"] {
      border-color: rgb(var(--c-warning) / 0.3);
    }

    .step-chip {
      min-width: 38px;
      justify-content: center;
      padding: 0 10px;
    }
    .step-chip-row {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .icon-circle-btn {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 0;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }
    .icon-circle-btn.active {
      background: rgb(var(--c-accent) / 0.14);
      border-color: rgb(var(--c-accent) / 0.36);
      color: var(--cyan);
    }

    .dot-indicator {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--neutral-dot);
    }
    .dot-indicator.online {
      background: var(--emerald);
      box-shadow: 0 0 calc(8px * var(--glow)) var(--emerald);
    }
    .dot-indicator.offline {
      background: var(--neutral-dot);
    }
    .dot-indicator.connecting {
      background: transparent;
      box-shadow: inset 0 0 0 1.5px var(--muted);
      animation: syncPulse 1.8s ease-in-out infinite;
    }
    .dot-indicator.syncing {
      background: var(--cyan);
      box-shadow: 0 0 6px rgb(var(--c-accent) / calc(0.6 * var(--glow)));
      animation: syncPulse 1.2s ease-in-out infinite;
    }
    .dot-indicator.attention {
      background: var(--amber);
    }
    @keyframes syncPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.78); }
    }

    /* Main Content Container */
    .screen-body {
      position: relative;
      max-width: 560px;
      margin: 0 auto;
      padding: 18px 16px 24px;
    }
    body.keyboard-open:not(.sheet-open) .screen-body {
      padding-bottom: calc(24px + var(--kb-settled, 0px));
    }

    /* Hero Header Row */
    .hero-bar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .hero-eyebrow {
      font-size: 11px;
      font-weight: 600;
      text-transform: var(--label-case);
      letter-spacing: calc(0.12em * var(--label-track));
      color: var(--muted);
      margin-bottom: 3px;
    }

    .hero-title {
      font-family: var(--font-heading);
      font-size: clamp(23px, 5vw + 6px, 28px);
      font-weight: 700;
      letter-spacing: -0.03em;
      margin: 0;
      line-height: 1.1;
      color: var(--white);
    }

    .hero-stats-pill {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px 12px;
      min-width: 118px;
      min-height: var(--touch-min);
      color: inherit;
      text-align: right;
      cursor: pointer;
      transition: border-color 0.15s ease, background-color 0.15s ease, transform 0.12s cubic-bezier(0.2, 0, 0, 1);
    }

    /* Segmented Pill Bar */
    .segmented-control {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 3px;
      margin-bottom: 14px;
    }

    .seg-option {
      position: relative;
      min-height: var(--touch-min);
      padding: 8px 10px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }

    .seg-option.active {
      background: var(--surface-3);
      color: var(--white);
      box-shadow: 0 2px 8px rgb(var(--c-black) / 0.25);
    }

    /* Horizontal Filter Strip */
    .chip-strip {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      /* room for the pills' 48 px touch targets and the end pills' focus rings (a scroller clips
         them); the negative margin keeps the same visual spacing */
      padding: 9px 4px;
      margin: -9px -4px 11px;
      scrollbar-width: none;
      overscroll-behavior-x: contain;
    }
    .chip-strip::-webkit-scrollbar {
      display: none;
    }

    .filter-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 30px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
    }
    .filter-pill > span:last-child {
      max-width: 168px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .filter-pill.active {
      border-color: rgb(var(--c-ink) / 0.24);
      background: rgb(var(--c-ink) / 0.1);
      color: var(--white);
    }

    /* #1 Spotlight Hero Task Card */
    .spotlight-card {
      position: relative;
      border-radius: 20px;
      border: 1px solid rgb(var(--c-accent) / 0.28);
      background: linear-gradient(165deg, rgb(var(--p-card) / 0.98) 0%, rgb(var(--p-card-2) / 0.98) 100%);
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 12px 32px -12px rgb(var(--c-black) / 0.6), 0 0 24px -10px rgb(var(--c-accent) / calc(0.18 * var(--glow)));
      overflow: hidden;
    }

    .spotlight-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .next-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 6px;
      background: rgb(var(--c-ink) / 0.08);
      color: var(--white);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: calc(0.08em * var(--label-track));
      text-transform: var(--label-case);
    }

    .spotlight-title {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 600;
      line-height: 1.28;
      letter-spacing: -0.015em;
      color: var(--white);
      margin: 0 0 6px;
      cursor: pointer;
      overflow-wrap: anywhere; /* a long unbroken title wraps instead of widening the card */
      text-wrap: balance;
    }

    .spotlight-notes {
      font-size: 13px;
      color: var(--muted);
      margin: 0 0 16px;
      max-width: 68ch;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      overflow-wrap: anywhere; /* an unbroken URL wraps instead of being cut flat at the edge */
    }

    .spotlight-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
    }

    .btn-primary-focus {
      flex: 1;
      height: var(--touch-min);
      border-radius: 13px;
      border: none;
      background: var(--cyan);
      color: rgb(var(--c-on-accent));
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgb(var(--c-accent) / calc(0.25 * var(--glow)));
    }

    .btn-complete-circle {
      width: var(--touch-min);
      height: var(--touch-min);
      border-radius: 13px;
      border: 1px solid var(--border-strong);
      background: rgb(var(--c-ink) / 0.04);
      color: var(--text-2);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Compact Native Queue Row Cards (#02+) */
    .queue-item-card {
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 14px 14px 14px 18px;
      margin-bottom: 10px;
      overflow: hidden;
    }

    .queue-item-card.completed {
      opacity: 0.75; /* dimmed, but its muted text keeps >= 4.5:1 */
      background: rgb(var(--p-1) / 0.5);
    }
    .queue-item-card.completed.just-completed {
      opacity: 1;
      background: var(--surface);
      border-color: rgb(var(--c-success) / 0.36);
      box-shadow: 0 10px 26px -10px rgb(var(--c-success) / calc(0.32 * var(--glow)));
    }
    .queue-item-card.completed.just-completed .task-check-ring.done {
      animation: taskCheckPop 0.26s cubic-bezier(0.22, 1, 0.36, 1) 0.24s backwards;
    }
    .queue-item-card.completed.just-completed .task-check-ring.done polyline {
      stroke-dasharray: 24;
      stroke-dashoffset: 0;
      animation: taskCheckDraw 0.22s cubic-bezier(0.22, 1, 0.36, 1) 0.24s backwards;
    }
    @keyframes taskCompleteSettle {
      from {
        transform: translate3d(0, -10px, 0) scale(0.985);
        box-shadow: 0 0 22px -6px rgb(var(--c-success) / calc(0.35 * var(--glow)));
      }
      to {
        transform: translate3d(0, 0, 0) scale(1);
        box-shadow: none;
      }
    }
    @keyframes taskCheckPop {
      0% { transform: scale(0.75); }
      60% { transform: scale(1.16); }
      100% { transform: scale(1); }
    }
    @keyframes taskCheckDraw {
      from { stroke-dashoffset: 24; }
      to { stroke-dashoffset: 0; }
    }

    .card-edge-bar {
      position: absolute;
      left: 0;
      top: 10px;
      bottom: 10px;
      width: 3.5px;
      border-radius: 0 4px 4px 0;
    }

    .task-check-ring {
      width: 22px;
      height: 22px;
      margin-top: 1px;
      border-radius: 50%;
      border: 1.75px solid rgb(var(--c-ink) / 0.42); /* the only edge of "Mark complete": >= 3:1 on --surface */
      background: transparent;
      color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      cursor: pointer;
      flex-shrink: 0;
    }

    .task-check-ring.done {
      border-color: transparent;
      color: rgb(var(--c-on-accent));
    }
    /* A Habit day its Frequency does not ask for: nothing to tick */
    .task-check-ring:disabled {
      border-style: dashed;
      border-color: rgb(var(--c-ink) / 0.22);
      cursor: default;
    }

    /* A Count Habit's ring reads "+1": a tap adds one, a held press types an exact total. */
    .task-check-ring.count-plus {
      color: var(--text-2);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }
    .task-check-ring.count-plus.done {
      color: rgb(var(--c-on-accent));
    }
    .count-progress {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-2);
      font-variant-numeric: tabular-nums;
      min-width: 0;
      overflow-wrap: anywhere; /* the unit is user text */
    }

    .queue-item-body {
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    .queue-item-title {
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.38;
      margin-bottom: 6px;
      overflow-wrap: anywhere; /* never runs under the row's buttons */
      text-wrap: pretty;
      /* Cap very long titles at 3 lines; the full title shows in Focus and the inspector. */
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .queue-item-sub {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      font-size: 12px;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .quest-label-ellipsis {
      display: block;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .queue-item-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      margin-top: -3px;
    }

    /* Asymmetric 48 px hit areas so neighbouring targets never overlap (8 px gap between them; the
       dots reach into the card's 14 px right padding, the play button into the 12 px gap to the title). */
    .mini-play-btn,
    .more-dots-btn,
    .completed-delete-btn {
      position: relative;
    }
    .mini-play-btn::after {
      content: "";
      position: absolute;
      top: -8px;
      bottom: -8px;
      left: -10px;
      right: -4px;
    }
    .more-dots-btn::after {
      content: "";
      position: absolute;
      top: -9px;
      bottom: -9px;
      left: -4px;
      right: -14px;
    }
    .completed-delete-btn::after {
      content: "";
      position: absolute;
      top: -9px;
      bottom: -9px;
      left: -10px;
      right: -14px;
    }

    .completed-delete-btn {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--dim);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 0;
      margin-top: -2px;
      cursor: pointer;
      transition: color 0.14s ease, background-color 0.14s ease;
    }
    .completed-delete-btn:active {
      color: var(--rose);
      background: rgb(var(--c-danger) / 0.12);
    }

    .mini-play-btn {
      height: 32px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-2);
      font-family: var(--font-mono);
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }

    .more-dots-btn {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--dim);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 0;
      cursor: pointer;
    }

    .section-header-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: var(--label-case);
      letter-spacing: calc(0.14em * var(--label-track));
      color: var(--dim);
      margin: 20px 0 10px 2px;
    }

    /* Floating Action Button (+ FAB) */
    .fab-add {
      position: fixed;
      right: calc(18px + var(--safe-right));
      bottom: calc(84px + var(--safe-bottom));
      z-index: 32;
      height: 52px;
      padding: 0 20px;
      border-radius: 999px;
      border: 1px solid rgb(var(--c-accent) / 0.4);
      background: linear-gradient(135deg, rgb(var(--c-accent)) 0%, rgb(var(--c-accent-2)) 100%);
      color: rgb(var(--c-on-accent));
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 24px rgb(var(--c-accent) / calc(0.32 * var(--glow)));
      cursor: pointer;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.14s ease;
    }
    body.has-toast .fab-add {
      transform: translate3d(0, calc(-1 * var(--toast-stack, 48px)), 0);
    }

    /* Bottom Navigation Bar (5 Primary Destinations) */
    .bottom-nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 35;
      height: calc(68px + var(--safe-bottom));
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      background: rgb(var(--p-bar));
      border-top: 1px solid rgb(var(--c-ink) / 0.07);
      padding: 6px calc(6px + var(--safe-right)) calc(6px + var(--safe-bottom)) calc(6px + var(--safe-left));
    }

    .nav-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border: none;
      background: transparent;
      color: var(--dim);
      font-size: 11px;
      font-weight: 500;
      border-radius: 12px;
      cursor: pointer;
      padding: 4px 0;
    }

    .nav-tab.active {
      color: var(--white);
    }

    .nav-tab-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 26px;
      border-radius: 999px;
      transition: background 0.15s ease;
    }

    .nav-tab.active .nav-tab-pill {
      background: rgb(var(--c-accent) / 0.14);
      color: var(--cyan);
    }

    /* Top-Anchored Floating Modal Sheet: sits cleanly in the upper visible viewport above the
       keyboard zone from frame 0, so focused inputs are never occluded by the rising IME and
       Chromium never pans or shifts the background app. */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgb(var(--p-scrim) / 0.76);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: calc(var(--safe-top) + 14px) calc(12px + var(--safe-right)) 14px calc(12px + var(--safe-left));
      animation: fadeIn 0.16s ease-out;
    }

    .sheet-kb-lift {
      width: 100%;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .bottom-sheet {
      pointer-events: auto;
      container-type: inline-size;
      width: 100%;
      max-width: 540px;
      background: rgb(var(--p-sheet));
      border: 1px solid rgb(var(--c-ink) / 0.12);
      border-radius: 22px;
      padding: 16px 18px var(--sheet-pad-bottom);
      max-height: calc(100vh - var(--safe-top) - var(--eff-kb, 0px) - 28px);
      max-height: calc(100dvh - var(--safe-top) - var(--eff-kb, 0px) - 28px);
      overflow-y: auto;
      overscroll-behavior: contain;
      box-shadow: 0 20px 48px -12px rgb(var(--c-black) / 0.78);
      will-change: transform, opacity;
    }
    body.sheet-typing .bottom-sheet {
      max-height: min(54vh, calc(100vh - var(--safe-top) - var(--eff-kb, 0px) - 28px));
      max-height: min(54dvh, calc(100dvh - var(--safe-top) - var(--eff-kb, 0px) - 28px));
    }
    .quest-meta-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 88px;
      gap: 12px;
      align-items: start;
    }
    @container (max-width: 280px) {
      .quest-meta-grid {
        grid-template-columns: minmax(0, 1fr);
      }
    }
    /* Only a freshly opened sheet glides in; in-place updates never replay the animation. */
    .bottom-sheet.entering {
      animation: slideUp 0.18s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .sheet-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .sheet-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
    }
    .sheet-close {
      width: 36px;
      height: 36px;
      margin: -6px -8px -6px 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: transparent;
      border: none;
      border-radius: 12px;
      color: var(--muted);
      font-size: 22px;
      line-height: 1;
      padding: 0;
      cursor: pointer;
    }
    .sheet-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: var(--label-case);
      letter-spacing: calc(0.12em * var(--label-track));
      color: var(--dim);
      margin-bottom: 8px;
    }
    .sheet-footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .text-action {
      min-height: var(--touch-min);
      padding: 0 8px;
      margin: 0 -8px;
      border: none;
      border-radius: 10px;
      background: transparent;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .reminder-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .reminder-row .sheet-input {
      flex: 1 1 auto;
      min-width: 0;
      min-height: var(--touch-min);
      margin-bottom: 0;
      font-variant-numeric: tabular-nums;
    }
    .reminder-row .text-action {
      flex: 0 0 auto;
      margin: 0;
      color: var(--slate);
    }
    .reminder-notice {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: -4px 0 12px;
      font-size: 13px;
      line-height: 1.4;
      color: var(--slate);
    }
    .reminder-notice[hidden] {
      display: none;
    }
    .reminder-notice-text {
      flex: 1 1 auto;
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .reminder-notice .text-action {
      flex: 0 0 auto;
      margin: 0;
      min-height: var(--touch-min);
      white-space: nowrap;
      color: var(--cyan);
    }
    .danger-outline-btn {
      min-height: var(--touch-min);
      padding: 0 14px;
      border-radius: 12px;
      border: 1px solid rgb(var(--c-danger) / 0.35);
      background: rgb(var(--c-danger) / 0.08);
      color: var(--rose);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .sheet-handle {
      display: none;
    }

    .sheet-input {
      width: 100%;
      border-radius: 13px;
      border: 1px solid var(--border-strong);
      background: rgb(var(--p-deep));
      color: var(--white);
      padding: 13px 14px;
      font-size: 16px; /* below 16 px a focused field zooms the page in mobile browsers */
      outline: none;
      margin-bottom: 12px;
    }
    .sheet-input:focus {
      border-color: var(--cyan);
    }

    /* Checklist inside Task Options (rules: HuntCore.applyChecklistEdit) */
    .checklist-items {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-bottom: 8px;
    }
    .checklist-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .checklist-tick,
    .checklist-icon-btn {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: var(--touch-min);
      height: var(--touch-min);
      border: none;
      border-radius: 12px;
      background: transparent;
      color: var(--dim);
      cursor: pointer;
      transition: color 0.15s ease-out, background-color 0.15s ease-out, opacity 0.15s ease-out;
    }
    .checklist-icon-btn:active,
    .checklist-tick:active {
      background: var(--surface-2);
    }
    .checklist-icon-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }
    .checklist-tick-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 1.5px solid var(--border-strong);
      color: transparent;
    }
    .checklist-row.done .checklist-tick-box {
      background: var(--emerald);
      border-color: transparent;
      color: rgb(var(--c-on-accent));
    }
    .checklist-text {
      flex: 1;
      min-width: 0;
      min-height: var(--touch-min);
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      color: var(--white);
      padding: 0 8px;
      font-size: 16px; /* below 16 px a focused field zooms the page in mobile browsers */
      outline: none;
      text-overflow: ellipsis;
    }
    .checklist-text:focus {
      border-color: var(--cyan);
      background: rgb(var(--p-deep));
    }
    .checklist-row.done .checklist-text {
      color: var(--dim);
      text-decoration: line-through;
    }
    .checklist-add-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .checklist-add-row .sheet-input {
      flex: 1;
      min-width: 0;
      margin-bottom: 0;
    }
    .checklist-add-row .checklist-icon-btn {
      border: 1px solid var(--border-strong);
      color: var(--white);
    }
    /* Lists screen: standalone Lists (rules: HuntCore.applyListEdit; items reuse the Checklist rows) */
    .list-card {
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 10px 12px 12px;
      margin-bottom: 10px;
      min-width: 0;
    }
    .list-card-head {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      margin-bottom: 4px;
    }
    .list-title-input {
      font-weight: 600;
    }
    .list-progress {
      flex-shrink: 0;
      white-space: nowrap;
      font-size: 11px;
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      color: var(--dim);
    }
    .list-card .checklist-add-row {
      margin-bottom: 8px;
    }
    .list-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .list-action-btn {
      min-height: var(--touch-min);
      padding: 0 14px;
      border-radius: 12px;
      border: 1px solid var(--border-strong);
      background: transparent;
      color: var(--white);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s ease-out, opacity 0.15s ease-out;
    }
    .list-action-btn:active {
      background: var(--surface-2);
    }
    .list-action-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }
    .list-create-row {
      margin-bottom: 14px;
    }
    .checklist-badge {
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
      white-space: nowrap;
      font-size: 10px;
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      color: var(--dim);
      padding: 1px 6px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }
    .checklist-badge.complete {
      color: var(--emerald);
    }
    /* the browsers' default placeholder grey is below 4.5:1 on these dark fields */
    input::placeholder,
    textarea::placeholder {
      color: var(--dim);
      opacity: 1;
    }

    .sheet-pill-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .sheet-pill {
      position: relative;
      display: inline-flex;
      align-items: flex-start;
      gap: 7px;
      max-width: 100%;
      min-height: 40px;
      padding: 9px 13px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      line-height: 1.35;
      cursor: pointer;
      transition: background-color 0.12s ease, border-color 0.12s ease, color 0.12s ease;
      overflow-wrap: anywhere; /* a long quest title wraps inside the pill */
      text-align: left;
    }
    /* 40 px pill + 4 px above and below = 48 px; the group's 8 px gap keeps neighbours apart */
    .sheet-pill::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: -4px;
      bottom: -4px;
    }
    .sheet-pill > span:first-child {
      flex-shrink: 0; /* the colour dot keeps its size next to a wrapping title */
      margin-top: 4px;
    }

    .sheet-pill.selected {
      border-color: rgb(var(--c-ink) / 0.32);
      background: rgb(var(--c-ink) / 0.12);
      color: var(--white);
    }
    /* Frequency weekday chips: 7 in a row where they fit, each a 44 px target */
    .sheet-pill.weekday-pill {
      min-width: 44px;
      justify-content: center;
      padding: 9px 8px;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translate3d(0, -8px, 0) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
    }

    /* Plan Week 5-Day Strip */
    .plan-strip {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }

    .plan-day-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 4px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
    }

    .plan-day-card.active {
      border-color: rgb(var(--c-accent) / 0.45);
      background: var(--surface-2);
      color: var(--white);
    }

    .plan-day-card.today-mark {
      border-bottom: 2.5px solid var(--amber);
    }

    /* Review KPI Cards */
    .review-kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 136px), 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .review-card {
      container-type: inline-size;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 18px;
      margin-bottom: 14px;
    }
    /* queue rows inside a card (quest cards) sit one step up, so they read as nested, not as a second
       bordered box on the same surface */
    .review-card .queue-item-card:not(.completed),
    .review-card .queue-item-card.completed.just-completed {
      background: var(--surface-2);
    }

    .review-horizon-bar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 3px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 3px;
      margin-bottom: 14px;
    }
    .review-horizon-btn {
      min-height: var(--touch-min);
      padding: 0 4px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }
    .review-horizon-btn.active {
      background: var(--surface-3);
      color: var(--white);
      box-shadow: 0 2px 8px rgb(var(--c-black) / 0.28);
    }

    .review-quest-btn {
      display: block;
      width: 100%;
      min-height: var(--touch-min);
      padding: 10px 12px;
      margin-bottom: 8px;
      border-radius: 13px;
      border: 1px solid transparent;
      background: rgb(var(--c-ink) / 0.02);
      color: inherit;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }
    .review-quest-btn:last-child {
      margin-bottom: 0;
    }
    .review-quest-btn.selected {
      border-color: rgb(var(--c-ink) / 0.24);
      background: rgb(var(--c-ink) / 0.06);
    }

    .heatmap-months {
      display: grid;
      grid-template-columns: repeat(16, minmax(0, 1fr));
      gap: 3px;
      padding-left: 26px;
      margin-bottom: 4px;
      font-size: 9px;
      font-weight: 600;
      color: var(--dim);
    }
    .heatmap-body {
      display: flex;
      align-items: stretch;
      gap: 4px;
    }
    .heatmap-weekdays {
      display: grid;
      grid-template-rows: repeat(7, 1fr);
      gap: 3px;
      width: 22px;
      flex-shrink: 0;
      font-size: 9px;
      color: var(--dim);
      align-items: center;
    }
    .heatmap-cols {
      flex: 1;
      min-width: 0;
      display: grid;
      grid-template-columns: repeat(16, minmax(0, 1fr));
      gap: 3px;
      touch-action: pan-y; /* a sideways drag scrubs the days (scrubHeatmap); a vertical one still scrolls */
    }
    .heatmap-col {
      display: grid;
      grid-template-rows: repeat(7, 1fr);
      gap: 3px;
    }
    .heatmap-cell {
      aspect-ratio: 1 / 1;
      width: 100%;
      border-radius: 3px;
      border: none;
      padding: 0;
      cursor: pointer;
    }
    .heatmap-cell.selected {
      outline: 1.5px solid var(--white);
      outline-offset: 1px;
    }
    .heatmap-cell.today:not(.selected) {
      outline: 1px solid rgb(var(--c-ink) / 0.42);
    }

    .mini-chip-btn {
      height: 30px;
      font-size: 11px;
      padding: 0 12px;
      flex-shrink: 0; /* a long quest title never pushes Edit off-screen */
    }

    .log-delete-btn {
      width: 36px;
      height: 36px;
      margin: -8px -10px -8px 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--dim);
      font-size: 18px;
      line-height: 1;
      padding: 0;
      cursor: pointer;
    }

    /* Empty states */
    .empty-card {
      border: 1px dashed var(--border-strong);
      border-radius: 18px;
      padding: 32px 18px;
      text-align: center;
      margin-bottom: 12px;
    }
    .empty-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-2);
    }
    .empty-sub {
      font-size: 12px;
      color: var(--dim);
      margin: 6px auto 0;
      line-height: 1.45;
      max-width: 300px;
    }
    .empty-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }
    .empty-action {
      min-height: var(--touch-min);
      padding: 0 16px;
      border-radius: 12px;
      border: 1px solid var(--border-strong);
      background: var(--surface-2);
      color: var(--white);
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .empty-action.primary {
      border-color: transparent;
      background: var(--cyan);
      color: rgb(var(--c-on-accent));
    }
    .show-more-btn {
      display: block;
      width: 100%;
      min-height: var(--touch-min);
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Focus view (running/paused task). Compacted for short viewports in the max-height media query. */
    .focus-stage {
      min-height: 82vh;
      min-height: 82svh;
      min-height: 82dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 4px 0 8px;
    }
    .focus-idle-stage {
      min-height: 78vh;
      min-height: 78svh;
      min-height: 78dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .focus-center {
      text-align: center;
      margin: auto 0;
      padding: 24px 0;
    }
    .focus-quest-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      max-width: 100%;
      padding: 7px 14px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.35;
      color: var(--white);
      overflow-wrap: anywhere;
      text-wrap: balance;
    }
    .focus-quest-pill > span:first-child {
      flex-shrink: 0;
    }
    .focus-sun-arc {
      display: none; /* Dawn only */
      width: 100%;
      max-width: 340px;
      margin: 18px auto -14px;
    }
    :root[data-theme="dawn"] .focus-sun-arc { display: block; }
    @media (max-height: 560px) {
      /* short landscape: the clock keeps the room */
      :root[data-theme="dawn"] .focus-sun-arc { display: none; }
    }
    .focus-task-title {
      font-family: var(--font-display);
      font-size: clamp(20px, 5vw + 4px, 25px);
      font-weight: 600;
      line-height: 1.28;
      letter-spacing: -0.015em;
      margin: 18px auto 0;
      max-width: 420px;
      overflow-wrap: anywhere;
      text-wrap: balance;
    }
    .focus-chrono {
      font-family: var(--font-heading);
      font-size: clamp(52px, 18vw, 84px);
      font-weight: 700;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      margin: 28px 0 12px;
      max-width: 100%;
      color: var(--white);
    }
    .focus-state {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: calc(0.22em * var(--label-track));
      text-transform: var(--label-case);
      margin-bottom: 32px;
    }
    .focus-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      max-width: 340px;
      margin: 0 auto;
    }
    .focus-notes {
      margin-top: 28px;
      max-width: 340px;
      margin-left: auto;
      margin-right: auto;
    }
    .focus-notes-input {
      width: 100%;
      resize: none;
      border-radius: 13px;
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 10px 14px;
      text-align: center;
      font-size: 16px; /* same as .sheet-input: a smaller field is hard to edit */
      color: var(--text-2);
      outline: none;
    }
    .focus-notes-input:focus {
      border-color: var(--cyan);
    }

    /* Focus view: small sync indicator (the header is hidden there) */
    .focus-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0 6px;
      font-size: 11px;
      color: var(--dim);
    }
    .focus-sync-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: var(--touch-min);
      padding: 0 2px;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      cursor: pointer;
    }

    /* Toasts: sleek compact floating capsules anchored just above the bottom tab bar */
    .toast-host {
      position: fixed;
      left: calc(12px + var(--safe-left));
      right: calc(12px + var(--safe-right));
      bottom: calc(78px + var(--safe-bottom));
      z-index: 70;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      width: auto;
      max-width: min(100%, 400px); /* the host already subtracts the safe-area insets */
      min-height: 38px;
      padding: 7px 16px 7px 11px;
      border-radius: 999px;
      background: rgb(var(--p-card) / 0.96);
      border: 1px solid rgb(var(--c-ink) / 0.13);
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: -0.005em;
      box-shadow: 0 10px 28px -6px rgb(var(--c-black) / 0.72), 0 0 0 1px rgb(var(--c-accent) / calc(0.05 * var(--glow)));
      animation: toastIn 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .toast.has-action {
      height: 40px;
      min-height: 40px;
      padding: 0 4px 0 14px;
      gap: 0;
    }
    .toast.leaving {
      opacity: 0;
      transform: translate3d(0, 8px, 0) scale(0.97);
      transition: opacity 0.16s ease, transform 0.16s ease;
    }
    .toast-icon {
      width: 19px;
      height: 19px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: rgb(var(--c-success) / 0.15);
      color: var(--emerald);
    }
    .toast-icon.undo {
      display: none;
    }
    .toast-msg {
      flex: 0 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 2px 0;
    }
    .toast.has-action .toast-msg {
      padding-right: 12px;
    }
    .toast-action {
      position: relative;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: var(--touch-min);
      margin: -4px 0;
      padding: 0 13px 0 12px;
      border: none;
      border-radius: 0 999px 999px 0;
      background: transparent;
      color: var(--cyan);
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
    }
    .toast-action::before {
      content: "";
      position: absolute;
      left: 0;
      top: 50%;
      width: 1px;
      height: 14px;
      transform: translateY(-50%);
      background: rgb(var(--c-ink) / 0.14);
    }
    @keyframes toastIn {
      from { transform: translate3d(0, 10px, 0) scale(0.96); opacity: 0; }
      to { transform: translate3d(0, 0, 0) scale(1); opacity: 1; }
    }

    /* Sync sheet */
    .sync-status-card {
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 14px 16px;
      margin-bottom: 16px;
    }
    .sync-status-card[data-tone="ok"] { border-color: rgb(var(--c-success) / 0.22); }
    .sync-status-card[data-tone="attention"] { border-color: rgb(var(--c-warning) / 0.3); }
    .sync-headline {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 600;
      color: var(--white);
    }
    .sync-detail {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
      margin: 6px 0 0;
    }
    .sync-meta-line {
      font-size: 12px;
      color: var(--text-2);
      line-height: 1.45;
      margin-top: 8px;
      overflow-wrap: anywhere; /* a long MagicDNS host name wraps instead of panning the sheet sideways */
      font-variant-numeric: tabular-nums; /* the countdown keeps its width every second */
    }
    .sync-meta-line .sub {
      color: var(--dim);
    }
    .sync-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }
    .sync-badge.ok {
      border: 1px solid rgb(var(--c-success) / 0.3);
      background: rgb(var(--c-success) / 0.08);
      color: var(--emerald);
    }
    .route-pill .route-name {
      color: inherit;
      font-weight: 600;
    }
    .route-pill .route-addr {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--dim);
    }
    .route-pill.selected .route-addr {
      color: var(--muted); /* --dim is below 4.5:1 on the lighter selected background */
    }
    .route-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: inset 0 0 0 1.5px rgb(var(--c-ink) / 0.18);
    }
    .route-dot.ok { background: var(--emerald); box-shadow: none; }
    .route-dot.fail { background: transparent; box-shadow: inset 0 0 0 1.5px var(--neutral-dot); }
    .route-dot.skipped { background: transparent; box-shadow: inset 0 0 0 1.5px rgb(var(--c-ink) / 0.1); }
    .mono-input {
      font-family: var(--font-mono);
      color: var(--cyan);
    }
    /* Opens by animating its row height, so Sync Now slides instead of jumping. */
    .sync-hint {
      display: grid;
      grid-template-rows: 0fr;
      font-size: 12px;
      color: var(--amber);
      margin: 0;
      transition: grid-template-rows .18s ease-out, margin .18s ease-out;
    }
    .sync-hint > span {
      min-height: 0;
      overflow: hidden;
    }
    .sync-hint.has-text {
      grid-template-rows: 1fr;
      margin: -4px 0 10px;
    }
    .sync-now-btn {
      width: 100%;
      height: var(--touch-min);
      border: none;
      border-radius: 13px;
      background: var(--cyan);
      color: rgb(var(--c-on-accent));
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      margin-top: 4px;
    }
    .sync-now-btn:disabled {
      background: rgb(var(--c-accent) / 0.55);
    }
    .spinner {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid rgb(var(--p-scrim) / 0.25);
      border-top-color: rgb(var(--c-on-accent));
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .sync-result {
      font-size: 12px;
      line-height: 1.45;
      text-align: center;
      margin-top: 10px;
      color: var(--muted);
    }
    .sync-result:empty {
      display: none;
    }
    .sync-result .ok { color: var(--emerald); }
    .sync-result .warn { color: var(--amber); }
    .sync-footer {
      margin-top: 16px;
      text-align: center;
      font-size: 11px;
      color: var(--dim);
    }

    .timeline-empty {
      text-align: center;
      font-size: 13px;
      color: var(--text-2);
      padding: 2px 0 16px;
    }
    .timeline-empty span {
      display: block;
      font-size: 12px;
      color: var(--dim);
      margin-top: 4px;
    }

    /* Primary sheet actions (New Task, New/Edit Quest) stay in view when the sheet scrolls (keyboard
       open, short screens): the fields scroll under them. In a sheet that fits they sit where they
       always were. The negative margins let the bar's background cover the sheet's side and bottom
       padding, so nothing shows through below the buttons. */
    .sheet-actions {
      position: sticky;
      bottom: calc(0px - var(--sheet-pad-bottom));
      z-index: 2;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: -8px -18px calc(0px - var(--sheet-pad-bottom));
      padding: 10px 18px var(--sheet-pad-bottom);
      background: rgb(var(--p-sheet));
    }
    .sheet-actions.single {
      grid-template-columns: 1fr;
    }
    /* a field focused inside such a sheet is scrolled to above the sticky bar, not under it */
    .bottom-sheet:has(> .sheet-actions) {
      scroll-padding-bottom: calc(68px + var(--sheet-pad-bottom));
    }
    /* Landscape with the keyboard up (~170 px): a sticky bar would cover the field being typed in.
       The sheet then simply scrolls (Enter in the title submits, as before). */
    @media (max-height: 300px) {
      .sheet-actions {
        position: static;
      }
      .bottom-sheet:has(> .sheet-actions) {
        scroll-padding-bottom: 0;
      }
    }

    /* Short viewports (landscape phone; also portrait with the keyboard up): compact chrome so the
       content still shows. Focus keeps Pause / Complete above the fold; Today shows more than its header. */
    @media (max-height: 480px) {
      :root {
        --sheet-pad-bottom: 14px;
      }
      body {
        --fab-clear: 102px; /* FAB 62 + 48, screen-body 16 */
      }
      .app-bar {
        height: calc(48px + var(--safe-top));
      }
      .screen-body {
        padding: 10px 16px 16px;
      }
      .hero-bar {
        margin-bottom: 10px;
      }
      .hero-eyebrow {
        margin-bottom: 1px;
      }
      .hero-title {
        font-size: 22px;
      }
      /* one row: "0.4h today ▬▬ 0.4h / 17h wk" (the bar's size is inline, hence !important) */
      .hero-stats-pill {
        flex-direction: row;
        align-items: center;
        gap: 10px;
        padding: 6px 12px;
      }
      .hero-stats-pill > div:nth-child(2) {
        width: 56px !important;
        margin: 0 !important;
        flex-shrink: 0;
      }
      .segmented-control {
        margin-bottom: 10px;
      }
      .chip-strip {
        margin-bottom: 4px;
      }
      /* compact 32 px look, 48 px target: it grows into the hero bar's 10 px margin above and stops
         where the filter pills' targets begin below */
      .seg-option {
        min-height: 32px;
        padding: 5px 10px;
      }
      .seg-option::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: -12px;
        bottom: -4px;
      }
      .spotlight-card {
        padding: 12px 14px;
        margin-bottom: 12px;
      }
      .section-header-label {
        margin: 14px 0 8px 2px;
      }
      .bottom-nav-bar {
        height: calc(52px + var(--safe-bottom));
        padding: 2px calc(8px + var(--safe-right)) calc(2px + var(--safe-bottom)) calc(8px + var(--safe-left));
      }
      .nav-tab {
        position: relative;
        gap: 0;
        padding: 0;
      }
      /* labels hidden visually only: they stay the tabs' accessible names */
      .nav-tab > span {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        border: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
      }
      .nav-tab-pill {
        width: 52px;
        height: 32px;
      }
      .fab-add {
        bottom: calc(62px + var(--safe-bottom));
        height: var(--touch-min);
        padding: 0 16px;
      }
      .toast-host {
        bottom: calc(60px + var(--safe-bottom));
      }
      .focus-stage,
      .focus-idle-stage {
        min-height: 0;
        padding: 0;
      }
      .focus-center {
        margin: 0;
        padding: 6px 0 0;
      }
      .focus-quest-pill {
        display: none; /* the row above already names the quest */
      }
      .focus-task-title {
        font-size: 18px;
        margin-top: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .focus-chrono {
        font-size: 48px;
        margin: 8px 0 4px;
      }
      .focus-state {
        margin-bottom: 12px;
      }
      .focus-notes {
        margin-top: 12px;
      }
      .bottom-sheet {
        max-height: calc(100vh - var(--safe-top) - 20px);
        max-height: calc(100dvh - var(--safe-top) - 20px);
        padding-top: 12px;
      }
      .sheet-handle {
        margin-bottom: 8px;
      }
    }

    /* Portrait phone with on-screen keyboard open: WebView's adjustResize shrinks innerHeight
       below 480 px (e.g. 744 dp - 300 dp keyboard = 444 dp on Galaxy S), which would otherwise
       trigger the landscape compact rules above and shift the entire background app up and down!
       Portrait phones always have width <= 520 px, whereas landscape phones have width >= 560 px. */
    @media (max-height: 480px) and (max-width: 520px) {
      :root {
        --sheet-pad-bottom: 18px;
      }
      body {
        --fab-clear: 120px; /* same as phone portrait: the page must not shift when the keyboard opens */
      }
      .app-bar {
        height: calc(58px + var(--safe-top));
      }
      .screen-body {
        padding: 18px 16px 24px;
      }
      .hero-bar {
        margin-bottom: 18px;
      }
      .hero-eyebrow {
        margin-bottom: 3px;
      }
      .hero-title {
        font-size: 28px;
      }
      .hero-stats-pill {
        flex-direction: column;
        align-items: flex-end;
        gap: 0;
        padding: 8px 12px;
      }
      .hero-stats-pill > div:nth-child(2) {
        width: 100% !important;
        margin: 5px 0 4px !important;
      }
      .segmented-control {
        margin-bottom: 14px;
      }
      .chip-strip {
        margin-bottom: 11px;
      }
      .seg-option {
        min-height: var(--touch-min);
        padding: 8px 10px;
      }
      .spotlight-card {
        padding: 18px;
        margin-bottom: 18px;
      }
      .section-header-label {

    .guide-kpi-row {
