        title: titleEl.value.trim(),
        notes: notesEl ? notesEl.value.trim() : "",
        questId: resolveComposerQuestId(composerQuestId),
        status: "queued",
        rank,
        accumulatedSeconds: 0,
        scheduledDate,
        createdAt: now,
        updatedAt: now
      });
      closeSheet();
      composerDraft = null; // submitted: the next New Task starts empty
      storeComposerDraft();
      commitLocalChange();
      playTaskFlipGlide(firstRects, newTaskId);
      const tomorrowKey = dayKeyOffset(1, now);
      if (scheduledDate === todayKey) showToast(promoteToTop ? "Task added · #1 Today" : "Task added · Today");
      else if (scheduledDate === tomorrowKey) showToast("Added for tomorrow");
      else showToast("Added for " + dateKeyLabel(scheduledDate));
    }

    // ----- Checklist: the rules are HuntCore's (applyChecklistEdit, shared with the desktop) -----
    // "n/m" on a Task row; "" when the Task has no Checklist items.
    function checklistBadgeHtml(task) {
      const p = checklistProgress(task);
      if (!p) return "";
      return `<span class="checklist-badge${p.done === p.total ? " complete" : ""}" aria-label="Checklist: ${p.done} of ${p.total} done"><span aria-hidden="true">${p.done}/${p.total}</span></span>`;
    }

    // The item rows of the Checklist editor in Task Options (tick, rename in place, up/down, delete).
    function checklistItemsHtml(task) {
      return checklistRowsHtml(checklistOf(task), "task", task.id);
    }

    // Checklist item rows, shared by a Task's Checklist (owner "task") and a standalone List (owner
    // "list"): every control calls editChecklistRow. Ticked items stay in place, struck through.
    function checklistRowsHtml(items, owner, ownerId) {
      return items.map((it, i) => {
        const text = escapeHtml(it.text);
        return `
          <div class="checklist-row${it.done ? " done" : ""}">
            <button class="checklist-tick" role="checkbox" aria-checked="${it.done ? "true" : "false"}" aria-label="${text}" onclick="editChecklistRow(${jsArg(owner)}, ${jsArg(ownerId)}, 'toggle', ${jsArg(it.id)})"><span class="checklist-tick-box">${SVG_CHECK}</span></button>
            <input class="checklist-text" value="${text}" maxlength="${HuntCore.MAX_CHECKLIST_TEXT_LENGTH}" aria-label="Rename ${text}" onkeydown="if(isSubmitKey(event)) this.blur()" onchange="editChecklistRow(${jsArg(owner)}, ${jsArg(ownerId)}, 'rename', ${jsArg(it.id)}, this.value)" />
            <button class="checklist-icon-btn" aria-label="Move ${text} up" ${i === 0 ? "disabled" : ""} onclick="editChecklistRow(${jsArg(owner)}, ${jsArg(ownerId)}, 'move', ${jsArg(it.id)}, ${jsArg(i - 1)})">↑</button>
            <button class="checklist-icon-btn" aria-label="Move ${text} down" ${i === items.length - 1 ? "disabled" : ""} onclick="editChecklistRow(${jsArg(owner)}, ${jsArg(ownerId)}, 'move', ${jsArg(it.id)}, ${jsArg(i + 1)})">↓</button>
            <button class="checklist-icon-btn" aria-label="Delete ${text}" onclick="editChecklistRow(${jsArg(owner)}, ${jsArg(ownerId)}, 'remove', ${jsArg(it.id)})">✕</button>
          </div>`;
      }).join("");
    }

    function editChecklistRow(owner, ownerId, kind, itemId, arg) {
      if (owner === "list") editListItems(ownerId, kind, itemId, arg);
      else editTaskChecklist(ownerId, kind, itemId, arg);
    }

    // ----- Lists: standalone Lists (no date, no Quest, no focus time); the rules are HuntCore's -----
    function listsSorted() {
      return asArray(state.lists).slice().sort(compareRank);
    }

    function findList(listId) {
      return asArray(state.lists).find(l => l.id === listId) || null;
    }

    function renderListsViewHtml() {
      const lists = listsSorted();
      const cards = lists.map(l => {
        const title = escapeHtml(l.title);
        const p = listProgress(l);
        return `
          <section class="list-card" aria-label="${title}">
            <div class="list-card-head">
              <input class="checklist-text list-title-input" value="${title}" maxlength="${HuntCore.MAX_LIST_TITLE_LENGTH}" aria-label="Rename ${title}" onkeydown="if(isSubmitKey(event)) this.blur()" onchange="renameListById(${jsArg(l.id)}, this.value)" />
              <span class="list-progress" aria-label="${p.done} of ${p.total} ticked"><span aria-hidden="true">${p.done}/${p.total}</span></span>
              <button class="checklist-icon-btn" aria-label="Delete List ${title}" onclick="deleteListById(${jsArg(l.id)})">${SVG_TRASH}</button>
            </div>
            <div class="checklist-items">${checklistRowsHtml(listItemsOf(l), "list", l.id)}</div>
            <div class="checklist-add-row">
              <input id="listNew-${escapeHtml(l.id)}" class="sheet-input" maxlength="${HuntCore.MAX_CHECKLIST_TEXT_LENGTH}" placeholder="Add an item..." aria-label="New item" onkeydown="if(isSubmitKey(event)) addItemToList(${jsArg(l.id)})" />
              <button class="checklist-icon-btn" aria-label="Add item" onclick="addItemToList(${jsArg(l.id)})">+</button>
            </div>
            <div class="list-actions">
              <button class="list-action-btn" aria-label="Clear ticked" ${p.done === 0 ? "disabled" : ""} onclick="editListItems(${jsArg(l.id)}, 'clearTicked')">Clear ticked</button>
              <button class="list-action-btn" aria-label="Untick all" ${p.done === 0 ? "disabled" : ""} onclick="editListItems(${jsArg(l.id)}, 'untickAll')">Untick all</button>
            </div>
          </section>`;
      }).join("");
      return `
        <div class="hero-bar">
          <div>
            <div class="hero-eyebrow">No dates · No Quests</div>
            <h1 class="hero-title">Lists</h1>
          </div>
        </div>
        <div class="checklist-add-row list-create-row">
          <input id="listCreateNew" class="sheet-input" maxlength="${HuntCore.MAX_LIST_TITLE_LENGTH}" placeholder="Name a new List..." aria-label="New List name" onkeydown="if(isSubmitKey(event)) createListFromInput()" />
          <button class="checklist-icon-btn" aria-label="Create List" onclick="createListFromInput()">+</button>
        </div>
        ${lists.length === 0
          ? emptyCardHtml("No Lists yet", "Name one above, then add its items: a shopping list, a packing list.", [])
          : `<div class="habits-grid">${cards}</div>`}
      `;
    }

    // Keeps the keyboard up on a field the re-render just replaced (adding several items in a row).
    function refocusField(id) {
      const el = document.getElementById(id);
      if (el) focusQuietly(el);
    }

    function createListFromInput() {
      const input = document.getElementById("listCreateNew");
      if (!input || !input.value.trim()) return;
      const lists = listsSorted();
      const last = lists[lists.length - 1];
      const now = Date.now();
      const list = buildList({ id: newListId(now), title: input.value, rank: (last ? Number(last.rank) || 0 : 0) + 1000, now });
      if (!list) return;
      playClickSound();
      if (!state.lists) state.lists = [];
      state.lists.push(list);
      input.value = "";
      commitLocalChange();
      refocusField("listNew-" + list.id);
    }

    // A blank or unchanged name redraws the old one.
    function renameListById(listId, value) {
      const l = findList(listId);
      if (!l) return;
      const title = cleanListTitle(String(value));
      if (!title || title === l.title) { renderApp(); return; }
      l.title = title;
      l.updatedAt = nextStamp(l);
      commitLocalChange();
    }

    // One item edit, Clear ticked or Untick all through the shared rule; a refused one just redraws.
    function editListItems(listId, kind, itemId, arg) {
      const l = findList(listId);
      if (!l) return;
      const edit = kind === "rename" ? { kind, id: itemId, text: String(arg) }
        : kind === "move" ? { kind, id: itemId, toIndex: Number(arg) }
        : { kind, id: itemId };
      const next = applyListEdit(l, edit);
      if (!next) { renderApp(); return; }
      if (kind === "toggle" || kind === "clearTicked" || kind === "untickAll") playClickSound();
      l.items = next;
      l.updatedAt = nextStamp(l);
      commitLocalChange();
    }

    function addItemToList(listId) {
      const fieldId = "listNew-" + listId;
      const input = document.getElementById(fieldId);
      const l = findList(listId);
      if (!input || !l || !input.value.trim()) return;
      const next = applyListEdit(l, { kind: "add", id: newChecklistItemId(), text: input.value });
      if (!next) return;
      l.items = next;
      l.updatedAt = nextStamp(l);
      input.value = "";
      commitLocalChange();
      refocusField(fieldId);
    }

    // Deletes a List (tombstoned, so it never comes back from the laptop); Undo restores it.
    function deleteListById(listId) {
      const l = findList(listId);
      if (!l) return;
      playClickSound();
      const removed = cloneJson(l);
      const hadTomb = asArray(state.deletedListIds).includes(listId);
      if (!state.deletedListIds) state.deletedListIds = [];
      if (!hadTomb) state.deletedListIds.push(listId);
      state.lists = asArray(state.lists).filter(x => x.id !== listId);
      commitLocalChange();
      showToast("List deleted · " + shortTitle(removed.title), {
        holdSync: !hadTomb,
        undo: () => undoDeleteList(removed, hadTomb)
      });
    }

    function undoDeleteList(removed, hadTomb) {
      if (findList(removed.id)) return;
      if (!hadTomb) state.deletedListIds = asArray(state.deletedListIds).filter(id => id !== removed.id);
      if (!state.lists) state.lists = [];
      state.lists.push(removed);
      commitLocalChange();
    }

    // The Checklist section of Task Options; "" for a habit day Task (it never holds a Checklist).
    function checklistEditorHtml(task) {
      if (!canHoldChecklist(task)) return "";
      return `
          <div class="sheet-label">Checklist</div>
          <div role="group" aria-label="Checklist">
            <div id="sheetChecklistItems" class="checklist-items">${checklistItemsHtml(task)}</div>
            <div class="checklist-add-row">
              <input id="sheetChecklistNew" class="sheet-input" maxlength="${HuntCore.MAX_CHECKLIST_TEXT_LENGTH}" placeholder="Add an item..." aria-label="New checklist item" onkeydown="if(isSubmitKey(event)) addChecklistItemFromSheet(${jsArg(task.id)})" />
              <button class="checklist-icon-btn" aria-label="Add checklist item" onclick="addChecklistItemFromSheet(${jsArg(task.id)})">+</button>
            </div>
          </div>`;
    }

    // One Checklist edit through the shared rule; a refused edit (blank rename) just redraws the rows.
    function editTaskChecklist(taskId, kind, itemId, arg) {
      const t = state.tasks.find(x => x.id === taskId);
      if (!t) return;
      const edit = kind === "rename" ? { kind, id: itemId, text: String(arg) }
        : kind === "move" ? { kind, id: itemId, toIndex: Number(arg) }
        : { kind, id: itemId };
      const next = applyChecklistEdit(t, edit);
      if (next) {
        t.checklist = next;
        t.updatedAt = nextStamp(t);
        commitLocalChange();
      }
      refreshSheetChecklist(t);
    }

    // Adds the typed item; the field stays (and keeps the keyboard up) for the next one.
    function addChecklistItemFromSheet(taskId) {
      const input = document.getElementById("sheetChecklistNew");
      const t = state.tasks.find(x => x.id === taskId);
      if (!input || !t || !input.value.trim()) return;
      const next = applyChecklistEdit(t, { kind: "add", id: newChecklistItemId(), text: input.value });
      if (!next) return;
      t.checklist = next;
      t.updatedAt = nextStamp(t);
      input.value = "";
      commitLocalChange();
      refreshSheetChecklist(t);
    }

    // Redraws only the item rows of the open Task Options sheet (the add field keeps focus).
    function refreshSheetChecklist(task) {
      const sc = document.getElementById("sheetContainer");
      const host = document.getElementById("sheetChecklistItems");
      if (!sc || !host || sc.dataset.sheet !== "task:" + task.id) return;

    }

    let selectedQuestColor = "cyan";
    let questFormBaseline = null; // the New Quest / Edit Quest form as it opened (readQuestForm())

    const QUEST_FORM_IDS = {
      create: ["newQuestTitleInput", "newQuestDescInput", "newQuestTargetInput"],
      edit: ["sheetQuestTitle", "sheetQuestDesc", "sheetQuestTarget"]
    };

    // The fields of the quest form open as sheet `kind` ("newQuest" | "quest:<id>"), or null.
    function questFormFields(kind) {
      const sc = document.getElementById("sheetContainer");
      if (!sc || !isSheetOpen() || sc.dataset.sheet !== kind) return null;
      const ids = kind === "newQuest" ? QUEST_FORM_IDS.create : kind.startsWith("quest:") ? QUEST_FORM_IDS.edit : null;
      const els = ids ? ids.map(id => document.getElementById(id)) : [];
      return els.length && els.every(Boolean) ? { title: els[0], desc: els[1], target: els[2] } : null;
    }

    // { kind, title, desc, target, color } of the quest form on screen, or null when none is open.
    function readQuestForm() {
      const sc = document.getElementById("sheetContainer");
      const kind = sc ? sc.dataset.sheet || "" : "";
      const f = questFormFields(kind);
      return f ? { kind, title: f.title.value, desc: f.desc.value, target: f.target.value, color: selectedQuestColor } : null;
    }

    // The quest form being dismissed: a Restore offer when it differs from how it opened, else null.
    function discardedQuestForm() {
      const opened = questFormBaseline;
      questFormBaseline = null;
      const values = readQuestForm();
      if (!opened || !values || JSON.stringify(values) === JSON.stringify(opened)) return null;
      return { message: "Quest edits discarded", undo: () => restoreQuestForm(values) };
    }

    // Restore: the sheet opens again (Edit Quest only while that quest still exists) with the typed
    // values; it still counts as changed, so dismissing it again offers Restore again.
    function restoreQuestForm(values) {
      const questId = values.kind === "newQuest" ? null : values.kind.slice("quest:".length);
      // the quest was deleted meanwhile (e.g. by a sync): nothing to reopen, the sheet open now stays
      if (questId !== null && !state.quests.some(q => q.id === questId)) return;
      if (isSheetOpen()) closeSheet(); // the sheet open now is dismissed the usual way
      if (questId === null) renderNewQuestSheet();
      else renderQuestEditorSheet(questId);
      const f = questFormFields(values.kind);
      if (!f) return;
      f.title.value = values.title;
      f.desc.value = values.desc;
      f.target.value = values.target;
      selectedQuestColor = values.color;
      selectPill(Array.from(document.querySelectorAll("#sheetContainer .sheet-pill[data-color]")).find(b => b.dataset.color === values.color));
    }

    function openNewQuestSheet() {
      playClickSound();
      renderNewQuestSheet();
    }

    function questColorPillsHtml() {
      return QUEST_COLOR_KEYS.map(col => `
              <button class="sheet-pill ${selectedQuestColor === col ? 'selected' : ''}" aria-pressed="${selectedQuestColor === col}" data-color="${escapeHtml(col)}" onclick="selectedQuestColor=${jsArg(col)};selectPill(this);">
                <span style="width:9px;height:9px;border-radius:50%;background:${ACCENT_HEX[col]};"></span>
                <span style="text-transform:capitalize;">${col}</span>
              </button>
            `).join("");
    }

    // Always fresh (closing a sheet discards it), so no value leaks from an earlier form.
    function renderNewQuestSheet() {
      selectedQuestColor = "cyan";
      showSheet("newQuest", `
          ${sheetHeaderHtml("New Quest")}

          <input id="newQuestTitleInput" class="sheet-input" placeholder="Quest title (e.g. Launch my idea)" aria-label="Quest Title" value="" enterkeyhint="done" onkeydown="if(isSubmitKey(event)) createNewQuestFromSheet()" />

          <textarea maxlength="20000" id="newQuestDescInput" class="sheet-input" rows="2" placeholder="Optional description — why this quest matters & what moves it forward" aria-label="Description" onkeydown="if(isSubmitKey(event)) createNewQuestFromSheet()"></textarea>

          <div class="quest-meta-grid">
            <div>
              <div class="sheet-label">Accent Color</div>
              <div class="sheet-pill-group" role="group" aria-label="Accent color">
                ${questColorPillsHtml()}
              </div>
            </div>
            <div>
              <label class="sheet-label" for="newQuestTargetInput">h / wk</label>
              <input id="newQuestTargetInput" type="number" inputmode="numeric" min="1" max="100" class="sheet-input" value="10" enterkeyhint="done" onkeydown="if(isSubmitKey(event)) createNewQuestFromSheet()" style="text-align:center;padding:10px 8px;" />
            </div>
          </div>

          <div class="sheet-actions single" style="margin-top:-4px;">
            <button class="pressable" onclick="createNewQuestFromSheet()" style="width:100%;height:var(--touch-min);border-radius:13px;border:none;background:var(--cyan);color:rgb(var(--c-on-accent));font-family:var(--font-display);font-weight:700;font-size:14px;cursor:pointer;">
              Create Quest
            </button>
          </div>
      `);
      questFormBaseline = readQuestForm();
      focusFieldSoon("newQuestTitleInput");
    }

    // The h / wk field: a positive number, clamped to the 1-100 the field (and desktop) allow;
    // null when it is blank or not a positive number.
    function parseWeeklyTarget(raw) {
      const n = Number(raw);
      if (String(raw).trim() === "" || !Number.isFinite(n) || n <= 0) return null;
      return Math.min(100, Math.max(1, n));
    }

    function createNewQuestFromSheet() {
      const tEl = document.getElementById("newQuestTitleInput");
      const dEl = document.getElementById("newQuestDescInput");
      const hEl = document.getElementById("newQuestTargetInput");
      if (!tEl || !tEl.value.trim()) {
        flagInvalidField(tEl);
        return;
      }
      const target = hEl ? parseWeeklyTarget(hEl.value) : 10;
      if (target === null) {
        flagInvalidField(hEl);
        return;
      }
      playCompleteSound();
      const now = Date.now();
      const title = tEl.value.trim();
      state.quests.push({
        id: "quest-" + now + "-" + Math.random().toString(36).slice(2, 6),
        slotIndex: activeQuestsList().length % 3,
        code: title.slice(0, 10).toUpperCase(),
        title,
        description: dEl ? dEl.value.trim() : "",
        accentColor: selectedQuestColor || "cyan",
        targetWeeklyHours: target,
        archived: false,
        createdAt: now,
        updatedAt: now
      });
      questFormBaseline = null; // committed: closing is not a discard
      closeSheet();
      commitLocalChange();
      showToast("Quest created · " + shortTitle(title));
    }

    function openQuestEditorSheet(questId) {
      playClickSound();
      renderQuestEditorSheet(questId);
    }

    // Always rendered from the quest itself: opening quest B after quest A shows B's values.
    function renderQuestEditorSheet(questId) {
      const q = state.quests.find(x => x.id === questId);
      if (!q) return;
      selectedQuestColor = q.accentColor || "cyan";

      // Complete / Delete sit in a footer row in the body, away from the sticky Save in the thumb zone
      // (same pattern as Task Options).
      showSheet("quest:" + q.id, `
          ${sheetHeaderHtml("Edit Quest")}

          <label class="sheet-label" for="sheetQuestTitle">Quest Title</label>
          <input id="sheetQuestTitle" class="sheet-input" value="${escapeHtml(q.title)}" enterkeyhint="done" onkeydown="if(isSubmitKey(event)) saveQuestFromSheet(${jsArg(q.id)})" />

          <label class="sheet-label" for="sheetQuestDesc">Description</label>
          <textarea maxlength="20000" id="sheetQuestDesc" class="sheet-input" rows="2" onkeydown="if(isSubmitKey(event)) saveQuestFromSheet(${jsArg(q.id)})">${escapeHtml(q.description || "")}</textarea>

          <div class="quest-meta-grid">
            <div>
              <div class="sheet-label">Accent Color</div>
              <div class="sheet-pill-group" role="group" aria-label="Accent color">
                ${questColorPillsHtml()}
              </div>
            </div>
            <div>
              <label class="sheet-label" for="sheetQuestTarget">h / wk</label>
              <input id="sheetQuestTarget" type="number" inputmode="numeric" min="1" max="100" class="sheet-input" value="${escapeHtml(q.targetWeeklyHours)}" enterkeyhint="done" onkeydown="if(isSubmitKey(event)) saveQuestFromSheet(${jsArg(q.id)})" style="text-align:center;padding:10px 8px;" />
            </div>
          </div>

          <div class="sheet-footer-row" style="margin:4px 0 18px;justify-content:${!q.archived ? "space-between" : "flex-end"};">
            ${!q.archived ? `<button class="text-action" onclick="completeQuestItem(${jsArg(q.id)})" style="color:var(--emerald);">✓ Complete Quest</button>` : ""}
            <button class="danger-outline-btn" onclick="deleteQuestItem(${jsArg(q.id)})">Delete Quest</button>
          </div>

          <div class="sheet-actions single" style="margin-top:-2px;">
            <button class="pressable" onclick="saveQuestFromSheet(${jsArg(q.id)})" style="height:var(--touch-min);border-radius:13px;border:none;background:var(--cyan);color:rgb(var(--c-on-accent));font-family:var(--font-display);font-weight:700;font-size:14px;cursor:pointer;">
              Save Changes
            </button>
          </div>
      `);
      questFormBaseline = readQuestForm();
    }

    function saveQuestFromSheet(questId) {
      playClickSound();
      const q = state.quests.find(x => x.id === questId);
      if (!q) return;
      const sc = document.getElementById("sheetContainer");
      if (!sc || sc.dataset.sheet !== "quest:" + questId) return; // the form on screen belongs to another quest
      const tEl = document.getElementById("sheetQuestTitle");
      const dEl = document.getElementById("sheetQuestDesc");
      const hEl = document.getElementById("sheetQuestTarget");
      const before = JSON.stringify(q);
      if (tEl && tEl.value.trim()) q.title = tEl.value.trim();
      if (dEl) q.description = dEl.value.trim();
      const target = hEl ? parseWeeklyTarget(hEl.value) : null;
      if (target !== null) q.targetWeeklyHours = target; // blank or invalid keeps the saved target, like a blank title
      q.accentColor = selectedQuestColor || q.accentColor;
      questFormBaseline = null; // committed: closing is not a discard
      closeSheet();
      if (JSON.stringify(q) === before) return; // nothing edited: no write, no sync
      q.updatedAt = nextStamp(q);
      commitLocalChange();
      showToast("Quest saved");
    }

    function completeQuestItem(questId) {
      playCompleteSound();
      const now = Date.now();
      const quest = state.quests.find(q => q.id === questId);
      questFormBaseline = null;
      if (!quest) {
        closeSheet();
        return;
      }
      const prevArchived = !!quest.archived;
      const prevCompletedAt = quest.completedAt;
      quest.archived = true;
      quest.completedAt = now;
      const completedStamp = nextStamp(quest, now);
      quest.updatedAt = completedStamp;

      const unassigned = [];
      const todayKey = toLocalDateKey(now);
      state.tasks.forEach(t => {
        if (t.questId === questId && isOpenTask(t, todayKey)) {
          const unlinkedAt = nextStamp(t, now);
          unassigned.push({ id: t.id, questId: t.questId, unlinkedAt });
          t.questId = null;
          t.updatedAt = unlinkedAt;
        }
      });
      const unassignedHabits = [];
      asArray(state.habits).forEach(h => {
        if (h.questId === questId) {
          const unlinkedAt = nextStamp(h, now);
          unassignedHabits.push({ id: h.id, questId: h.questId, unlinkedAt });
          h.questId = null;
          h.updatedAt = unlinkedAt;
        }
      });
      closeSheet();
      commitLocalChange();
      showToast("Quest completed · " + shortTitle(quest.title), {
        undo: () => undoCompleteQuest(questId, completedStamp, prevArchived, prevCompletedAt, unassigned, unassignedHabits)
      });
    }

    function undoCompleteQuest(questId, completedStamp, prevArchived, prevCompletedAt, unassigned, unassignedHabits) {
      const quest = state.quests.find(q => q.id === questId);
      if (!quest || !quest.archived || quest.updatedAt !== completedStamp) return;
      quest.archived = prevArchived;
      if (prevCompletedAt === undefined) delete quest.completedAt;
      else quest.completedAt = prevCompletedAt;
      quest.updatedAt = nextStamp(quest);
      asArray(unassignedHabits).forEach(u => {
        const h = asArray(state.habits).find(x => x.id === u.id);
        if (h && h.questId === null && h.updatedAt === u.unlinkedAt) {
          h.questId = u.questId;
          h.updatedAt = nextStamp(h);
        }
      });
      asArray(unassigned).forEach(u => {
        const t = state.tasks.find(x => x.id === u.id);
        if (t && t.questId === null && t.updatedAt === u.unlinkedAt) {
          t.questId = u.questId;
          t.updatedAt = nextStamp(t);
        }
      });
      commitLocalChange();
    }

    function reopenQuestItem(questId) {
      playLockSound();
      const quest = state.quests.find(q => q.id === questId);
      if (!quest) return;
      quest.archived = false;
      delete quest.completedAt;
      quest.updatedAt = nextStamp(quest);
      commitLocalChange();
      showToast("Quest reopened · " + shortTitle(quest.title));
    }

    function deleteQuestItem(questId) {
      playClickSound();
      const now = Date.now();
      const quest = state.quests.find(q => q.id === questId);
      questFormBaseline = null; // its sheet closes as a delete (with its own Undo), not as a discard
      if (!quest) {
        closeSheet();
        return;
      }
      const removed = cloneJson(quest);
      const hadTombstone = asArray(state.deletedQuestIds).includes(questId);
      if (!state.deletedQuestIds) state.deletedQuestIds = [];
      if (!hadTombstone) state.deletedQuestIds.push(questId);
      state.quests = state.quests.filter(q => q.id !== questId);
      const unassigned = [];
      state.tasks.forEach(t => {
        if (t.questId === questId) {
          const unlinkedAt = nextStamp(t, now);
          unassigned.push({ id: t.id, questId: t.questId, updatedAt: t.updatedAt, unlinkedAt });
          t.questId = null;
          t.updatedAt = unlinkedAt;
        }
      });
      const unassignedHabits = [];
      asArray(state.habits).forEach(h => {
        if (h.questId === questId) {
          const unlinkedAt = nextStamp(h, now);
          unassignedHabits.push({ id: h.id, questId: h.questId, updatedAt: h.updatedAt, unlinkedAt });
          h.questId = null;
          h.updatedAt = unlinkedAt;
        }
      });
      closeSheet();
      commitLocalChange();
      showToast("Quest deleted · " + shortTitle(removed.title), {
        holdSync: !hadTombstone,
        undo: () => undoDeleteQuest(removed, hadTombstone, unassigned, unassignedHabits)
      });
    }

    // Restores the quest object and re-links the tasks it un-assigned (those not edited since: still
    // carrying the unlink stamp). The re-link is a new edit (R6), so it also wins if the unlink synced.
    function undoDeleteQuest(removed, hadTombstone, unassigned, unassignedHabits) {
      if (state.quests.some(q => q.id === removed.id)) return;
      if (!hadTombstone) state.deletedQuestIds = asArray(state.deletedQuestIds).filter(id => id !== removed.id);
      state.quests.push(removed);
      state.quests.sort((a, b) => (a.slotIndex || 0) - (b.slotIndex || 0));
      asArray(unassignedHabits).forEach(u => {
        const h = asArray(state.habits).find(x => x.id === u.id);
        if (h && h.updatedAt === u.unlinkedAt && h.questId === null) {
          h.questId = u.questId;
          h.updatedAt = nextStamp(h);
        }
      });
      unassigned.forEach(u => {
        const t = state.tasks.find(x => x.id === u.id);
        if (t && t.questId === null && t.updatedAt === u.unlinkedAt) {
          t.questId = u.questId;
          t.updatedAt = nextStamp(t);
        }
      });
      commitLocalChange();
    }

    function isSyncSheetOpen() {
      const sc = document.getElementById("sheetContainer");
      return isSheetOpen() && !!sc && sc.dataset.sheet === "sync";
    }

    // ----- Sync sheet: truthful status, real routes, Sync Now with an in-place result -----
    // Human-readable failure reasons (contract reasons + JS-side ones). Offline reasons are calm.
    const SYNC_REASON_INFO = {
      unreachable: { title: "Laptop not reachable", detail: "It may be asleep, on another network, or Tailscale is off on this phone." },
      no_network: { title: "No network connection", detail: "Connect to Wi-Fi or mobile data and Hunt syncs on its own." },
      refused: { title: "Hunt isn't running on the laptop", detail: "The laptop answered, but the Hunt server is not running. Start Hunt on your laptop." },
      server_timeout: { title: "Laptop server not responding", detail: "Hunt on the laptop accepted the connection but did not answer in time." },
      js_timeout: { title: "The laptop took too long", detail: "The sync did not finish in time." },
      auth: { title: "Not paired, or the key was rejected", detail: "Paste the pairing link from the desktop Phone & Sync window into Laptop address, or scan the QR code and tap Pair Android App." },
      too_large: { title: "Data too large to sync", detail: "The laptop rejected the sync because the data is too large." },
      bad_response: { title: "Unexpected answer", detail: "Something answered at this address, but it is not the Hunt sync server." },
      busy: { title: "Still finishing the last sync", detail: "Try again in a moment." },
      error: { title: "Couldn't sync", detail: "Something went wrong while syncing." }
    };

    function syncReasonInfo(reason) {
      if (SYNC_REASON_INFO[reason]) return SYNC_REASON_INFO[reason];
      const m = /^http_(\d+)$/.exec(reason || "");
      if (m) return { title: "Laptop server error", detail: "Hunt on the laptop hit an error. Restart Hunt on the laptop; the details are in hunt-server.log in its %TEMP% folder (HTTP " + m[1] + ")." };
      return SYNC_REASON_INFO.error;
    }

    // { name: "Tailscale" | "Local network" | ..., address: "192.168.1.5" }
    function describeRoute(url) {
      const { host, port } = parseUrlHost(url);
      let name = "Custom";
      if (isTailscaleHost(host)) name = "Tailscale";
      else if (isPrivateHost(host)) name = "Local network";
      else if (host === "localhost" || host === "127.0.0.1") name = "This device";
      else if (location.host && location.host === host + (port ? ":" + port : "")) name = "This server";
      return { name, address: host + (port && port !== "3000" ? ":" + port : "") };
    }

    let appVersionCache = null;
    function appVersionLabel() {
      if (appVersionCache === null) {
        const v = bridgeCall("getAppVersion");
        appVersionCache = typeof v === "string" ? v.trim() : "";
      }
      const ver = appVersionCache || APP_VERSION;
      const badge = document.getElementById("headerVersionBadge");
      if (badge) setTextIfChanged(badge, "v" + ver);
      if (window.AndroidBridge) return "Hunt for Android (Phone & Tablet) · v" + ver;
      return "Hunt · web companion · v" + ver;
    }

    // Sheet-local UI state (survives in-place refreshes; reset when the sheet is opened fresh).
    const syncSheetUi = { urlDirty: false, hint: "" };
    let lastManualSyncResult = null; // { ...result, at } of the last Sync Now from the sheet
    let shownRouteUrls = [];

    // Look switch (ADR-0005): per device, kept in localStorage, never part of the synced state.
    const LOOK_KEY = "hunt-look";
    const LOOKS = [{ id: "neon", label: "Neon" }, { id: "dawn", label: "Dawn" }];
    const LOOK_THEME_COLOR = { neon: "#08090c", dawn: "#101826" }; // matches --p-0 in each look

    function currentLook() {
      return document.documentElement.dataset.theme === "dawn" ? "dawn" : "neon";
    }

    function setLook(look) {
      const next = look === "dawn" ? "dawn" : "neon";
      document.documentElement.dataset.theme = next;
      const meta = document.querySelector("meta[name=theme-color]");
      if (meta) meta.setAttribute("content", LOOK_THEME_COLOR[next]);
      try {
        localStorage.setItem(LOOK_KEY, next);
      } catch (e) {
        // Storage full or blocked: the look still applies now; only the choice is not remembered next launch.
      }
      document.querySelectorAll("[data-look-option]").forEach(btn => {
        const on = btn.dataset.lookOption === next;
        btn.classList.toggle("selected", on);
        btn.setAttribute("aria-pressed", String(on));
      });
      publishWidgetSnapshot(); // the widget follows the look
    }

    function openSyncSheet() {
      playClickSound();
      renderSyncSheet();
    }

    function renderSyncSheet() {
      if (isSyncSheetOpen()) {
        refreshSyncSheet();
        return;
      }
      syncSheetUi.urlDirty = false;
      syncSheetUi.hint = "";
      if (!manualSyncPromise) lastManualSyncResult = null;
      showSheet("sync", `
          <div class="sheet-handle" aria-hidden="true"></div>
          <div class="sheet-head">
            <div style="display:flex;align-items:center;gap:10px;min-width:0;">
              <span id="syncSheetDot" class="dot-indicator"></span>
              <h3 id="sheetTitle" class="sheet-title">Laptop sync</h3>
            </div>
            <button class="sheet-close" onclick="closeSheet()" aria-label="Close">×</button>
          </div>

          <div id="syncStatusCard" class="sync-status-card"></div>

          <div class="sheet-label">Route</div>
          <div id="syncRoutePills" class="sheet-pill-group" role="group" aria-label="Laptop route"></div>

          <div class="url-label-row">
            <label class="sheet-label" for="modalLaptopUrl">Laptop address</label>
            <button type="button" class="paste-link-btn hit-target pressable" onclick="pastePairingLinkFromClipboard()">Paste link</button>
          </div>
          <input id="modalLaptopUrl" class="sheet-input mono-input" type="url" inputmode="url" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="go" value="${escapeHtml(getLaptopBaseUrl())}" placeholder="Pairing link or http://&lt;laptop-ip&gt;:3000" oninput="syncSheetUi.urlDirty=true;setSyncHint('')" onchange="applyLaptopUrlInput(this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();manualSyncFromSheet();}" />
          <div id="syncUrlHint" class="sync-hint" role="alert"><span></span></div>

          <button id="syncNowBtn" class="sync-now-btn pressable" onclick="manualSyncFromSheet()"></button>
          <div id="syncResultLine" class="sync-result" aria-live="polite"></div>

          <div class="sheet-label" id="lookLabel" style="margin-top:14px;">Look</div>
          <div class="sheet-pill-group" role="group" aria-labelledby="lookLabel">
            ${LOOKS.map(l => `<button type="button" class="sheet-pill pressable ${currentLook() === l.id ? "selected" : ""}" data-look-option="${escapeHtml(l.id)}" aria-pressed="${currentLook() === l.id}" onclick="playClickSound();setLook(${jsArg(l.id)})">${escapeHtml(l.label)}</button>`).join("")}
          </div>

          <div class="sync-footer">${escapeHtml(appVersionLabel())}</div>
      `);
      refreshSyncSheet();

    async function pastePairingLinkFromClipboard() {
      playClickSound();
      const input = document.getElementById("modalLaptopUrl");
      try {
        if (navigator.clipboard && typeof navigator.clipboard.readText === "function") {
          const clip = await navigator.clipboard.readText();
          if (clip && clip.trim()) {
            if (input) input.value = clip.trim();
            applyLaptopUrlInput(clip.trim());
            return;
          }
        }
      } catch (e) {}
      if (input) {
        input.focus();
        if (typeof input.select === "function") input.select();
      }
      setSyncHint("Long-press inside the field above and tap Paste to insert the pairing link.");
    }

    function setSyncHint(text) {
      syncSheetUi.hint = text || "";
      renderSyncHint();
    }

    function renderSyncHint() {
      const el = document.getElementById("syncUrlHint");
      if (!el) return;
      setTextIfChanged(el.firstElementChild, syncSheetUi.hint);
      el.classList.toggle("has-text", !!syncSheetUi.hint);
    }

    function nextTryText() {
      if (syncRun.inFlight) return "Trying now…";
      if (!syncRun.dueAt) return syncRun.paused ? "Paused, tap Sync Now" : "";
      const s = Math.max(1, Math.ceil((syncRun.dueAt - Date.now()) / 1000));
      return "Next automatic try in " + s + " s";
    }

    function syncStatusCardHtml(model) {
      const phase = model.phase;
      const last = syncRun.lastResult;
      let headline;
      let detail = "";
      if (phase === "connecting") {
        headline = "Connecting to your laptop…";
        detail = "Everything you do is saved on this phone first.";
      } else if (phase === "syncing") {
        headline = "Syncing with your laptop…";
      } else if (phase === "ok" || phase === "pending") {
        // pending: nothing is being sent right now; the "waiting to sync" line below says what is left
        headline = "Synced with your laptop";
      } else {
        const info = syncReasonInfo(syncMeta.lastError);
        headline = info.title;
        detail = info.detail;
        if (phase === "offline") detail += " Your tasks and focus sessions are saved on this phone and merge automatically when you reconnect.";
      }
      const lines = [];
      lines.push(syncMeta.lastOkAt
        ? `Last synced ${escapeHtml(relativeLong(syncMeta.lastOkAt))} <span class="sub">· ${escapeHtml(absoluteTime(syncMeta.lastOkAt))}</span>`
        : `<span class="sub">Not synced with a laptop yet</span>`);
      const healthy = phase === "ok" || phase === "pending" || (phase === "syncing" && isLaptopReachable);
      if (healthy && syncMeta.lastUrl) {
        const r = describeRoute(syncMeta.lastUrl);
        lines.push(`via ${escapeHtml(r.name)} <span class="sub">· ${escapeHtml(r.address)}</span>`);
      }
      if ((phase === "offline" || phase === "attention") && last && !last.ok && asArray(last.attempts).length) {
        // routes native never started ("skipped_*": VPN off, time limit) are not listed as tried
        const tried = [];
        const notTried = [];
        asArray(last.attempts).forEach(a => {
          const name = describeRoute(normalizeLaptopUrl(a.url) || a.url).name;
          const skip = skippedRouteNote(a.reason);
          const list = skip === null ? tried : notTried;
          const n = skip ? name + " (" + skip + ")" : name;
          if (!list.includes(n)) list.push(n);
        });
        const shortList = names => escapeHtml(names.slice(0, 3).join(", ")) + (names.length > 3 ? "…" : "");
        if (tried.length) lines.push(`<span class="sub">Tried ${shortList(tried)}</span>`);
        if (notTried.length) lines.push(`<span class="sub">Not tried: ${shortList(notTried)}</span>`);
      }
      if (phase === "offline" || phase === "attention") lines.push(`<span class="sub" id="syncNextTry"></span>`);
      const pending = model.pending;
      if (pending) lines.push(`${pending} change${pending === 1 ? "" : "s"} on this phone waiting to sync`);
      else if (syncMeta.lastOkAt && phase !== "connecting") lines.push(`<span class="sub">All changes synced</span>`);

      // shown only when true (the last round trip was accepted); a rejected key is the headline instead
      let badge = "";
      if (last && last.ok && isLaptopReachable) {
        const routes = buildCandidateUrls().length;
        badge = `<span class="sync-badge ok">● Pairing key accepted${routes > 1 ? " · auto-failover across " + routes + " routes" : ""}</span>`;
      }

      const dotCls = model.dot;
      return `
        <div class="sync-headline"><span class="dot-indicator ${dotCls}"></span><span>${escapeHtml(headline)}</span></div>
        ${detail ? `<p class="sync-detail">${escapeHtml(detail)}</p>` : ""}
        ${lines.map(l => `<div class="sync-meta-line">${l}</div>`).join("")}
        ${badge}
      `;
    }

    // Native reports routes it never started as "skipped_*" (skipped_no_vpn: Tailscale address while
    // the VPN is off; skipped_budget: the sync's time limit ran out first). null = really tried.
    function skippedRouteNote(reason) {
      const r = String(reason || "");
      if (!/^skipped/.test(r)) return null;
      if (r === "skipped_no_vpn") return "VPN off";
      if (r === "skipped_budget") return "time limit";
      return "";
    }

    function routePillsHtml() {
      const primary = getLaptopBaseUrl();
      shownRouteUrls = sanitizeUrlList([primary, ...syncMeta.lanUrls]);
      const last = syncRun.lastResult;
      return shownRouteUrls.map((url, i) => {
        const r = describeRoute(url);
        const attempt = last ? asArray(last.attempts).find(a => normalizeLaptopUrl(a.url) === url) : null;
        const answered = !!(last && last.ok && normalizeLaptopUrl(last.url) === url);
        const skip = attempt ? skippedRouteNote(attempt.reason) : null;
        const status = answered ? "ok" : attempt ? (skip !== null ? "skipped" : "fail") : "";
        const statusText = answered ? "answered last sync"
          : skip !== null ? "not tried" + (skip ? " (" + skip + ")" : "")
          : attempt ? "not reachable last time" : "not tried yet";
        const selected = url === primary;
        return `<button class="sheet-pill route-pill ${selected ? "selected" : ""}" aria-pressed="${selected}" aria-label="${escapeHtml(r.name + " " + r.address + ", " + statusText)}" onclick="chooseLaptopUrlAt(${i})">
            <span class="route-dot ${status}"></span><span class="route-name">${escapeHtml(r.name)}</span><span class="route-addr">${escapeHtml(r.address)}</span>
          </button>`;
      }).join("");
    }

    function manualResultHtml() {
      if (manualSyncPromise) return "";
      const r = lastManualSyncResult;
      if (!r || r.reason === "bad_url") return "";
      if (r.ok) {
        const via = r.url ? " via " + describeRoute(normalizeLaptopUrl(r.url) || r.url).name : "";
        return `<span class="ok">✓ Synced ${escapeHtml(relativeLong(r.at))}${escapeHtml(via)}</span>`;
      }
      const info = syncReasonInfo(r.reason);
      if (isAttentionReason(r.reason)) return `<span class="warn">${escapeHtml(info.title)}</span>`;
      return `<span>${escapeHtml(info.title)}. Your changes are safe on this phone.</span>`;
    }

    // Updates the open sync sheet in place (no re-open, no slide-up, the URL field keeps its text/caret).
    function refreshSyncSheet() {
      if (!isSyncSheetOpen()) return;
      const model = syncChipModel(false);
      const dot = document.getElementById("syncSheetDot");
      if (dot && dot.className !== "dot-indicator " + model.dot) dot.className = "dot-indicator " + model.dot;
      const card = document.getElementById("syncStatusCard");
      setHtmlIfChanged(card, syncStatusCardHtml(model));
      setAttrIfChanged(card, "data-tone", model.phase === "ok" || model.phase === "pending" ? "ok" : model.phase === "attention" ? "attention" : "neutral");
      setTextIfChanged(document.getElementById("syncNextTry"), nextTryText());
      setHtmlIfChanged(document.getElementById("syncRoutePills"), routePillsHtml());
      const input = document.getElementById("modalLaptopUrl");
      const url = getLaptopBaseUrl();
      if (input && !syncSheetUi.urlDirty && document.activeElement !== input && input.value !== url) input.value = url;
      renderSyncHint();
      const btn = document.getElementById("syncNowBtn");
      const running = !!manualSyncPromise;
      if (btn) {
        setHtmlIfChanged(btn, running ? `<span class="spinner" aria-hidden="true"></span><span>Syncing…</span>` : `<span aria-hidden="true">↻</span><span>Sync Now</span>`);
        if (btn.disabled !== running) btn.disabled = running;
        setAttrIfChanged(btn, "aria-busy", running ? "true" : "false");
      }
      setHtmlIfChanged(document.getElementById("syncResultLine"), manualResultHtml());
    }

    // A pasted pairing link: its key is saved (APK: native storage; browser copy: localStorage) and the
    // link's origin continues as the laptop address. -> { address, paired } or { error: hint text }.
    function takePairingLink(typed) {
      const link = parsePairingLink(typed);
      if (!link) return { address: typed, paired: false };
      if (link.error) return { error: "That pairing link is incomplete. Copy it again from the laptop's Phone & Sync window." };
      if (!storePairingToken(link.token)) return { error: "This phone did not accept that pairing key. Copy the link again from the laptop's Phone & Sync window." };
      syncRun.routeEpoch++; // a request still out was sent with the old key: Sync Now must not reuse its answer
      return { address: link.url, paired: true };
    }

    // Sync Now with the address or key just chosen; a Sync Now still running used the previous ones, so
    // the new attempt runs right after it (an automatic one when the sheet was closed meanwhile: that
    // Sync Now may have paused syncing, and nothing else would try the new key).
    function manualSyncWithNewSettings() {
      if (manualSyncPromise) manualSyncPromise.then(() => { if (isSyncSheetOpen()) manualSyncFromSheet(); else kickSync(); });
      else manualSyncFromSheet();
    }

    // Typed address or pasted pairing link: validated, saved (tried first next time), pills updated in
    // place. A new pairing key is tried right away (fromSyncNow: the calling Sync Now does that).
    function applyLaptopUrlInput(value, fromSyncNow) {
      const typed = String(value || "").trim();
      if (!typed) {
        setSyncHint("Paste the pairing link from the laptop's Phone & Sync window, or enter its address, for example http://<laptop-ip>:3000");
        return false;
      }
      const pairing = takePairingLink(typed);
      if (pairing.error) {
        setSyncHint(pairing.error);
        return false;
      }
      const clean = normalizeLaptopUrl(pairing.address);
      if (!clean) {
        setSyncHint("That doesn't look like an address or a pairing link. Try http://<laptop-ip>:3000");
        return false;
      }
      syncSheetUi.urlDirty = false;
      setSyncHint("");
      if (clean !== getLaptopBaseUrl()) setLaptopBaseUrl(clean);
      const input = document.getElementById("modalLaptopUrl");
      // a pasted key never stays visible in the field
      if (input && (pairing.paired || document.activeElement !== input) && input.value !== clean) input.value = clean;
      refreshSyncSheet();
      if (pairing.paired && !fromSyncNow) manualSyncWithNewSettings();
      return true;
    }

    // Tapping a route makes it the preferred one and tries it right away.
    function chooseLaptopUrlAt(index) {
      const url = shownRouteUrls[index];
      if (url) chooseLaptopUrl(url);
    }

    function chooseLaptopUrl(url) {
      const pairing = takePairingLink(String(url || "").trim());
      if (pairing.error) {
        setSyncHint(pairing.error);
        return;
      }
      const clean = normalizeLaptopUrl(pairing.address);
      if (!clean) return;
      const input = document.getElementById("modalLaptopUrl");
      if (input) input.value = clean;
      syncSheetUi.urlDirty = false;
      setSyncHint("");
      if (clean !== getLaptopBaseUrl()) setLaptopBaseUrl(clean);
      refreshSyncSheet();
      manualSyncWithNewSettings();
    }

    // Sync Now: keep an edited address, then await the REAL result and show it in place.
    async function manualSyncFromSheet() {
      if (manualSyncPromise) return manualSyncPromise; // double tap: same round trip
      const input = document.getElementById("modalLaptopUrl");
      if (input && isSyncSheetOpen() && normalizeLaptopUrl(input.value) !== getLaptopBaseUrl()) {
        if (!applyLaptopUrlInput(input.value, true)) return syncFailure("bad_url");
      }
      playClickSound();
      lastManualSyncResult = null;
      const promise = syncNow();
      refreshSyncSheet(); // spinner + "Syncing…" right away
      let result;
      try {
        result = await promise;
      } catch (e) {
        result = syncFailure("error");
      }
      lastManualSyncResult = { ...result, at: Date.now() };
      // syncNow's promise settles before its finally() clears manualSyncPromise: wait one turn
      await Promise.resolve();
      if (isSyncSheetOpen()) refreshSyncSheet();
      return result;
    }

    // =========================================================================
    // DAILY HABITS: create, edit, delete (with Undo), toggle today & focus
    // =========================================================================
    let selectedHabitQuestId = null;
    // The Frequency being edited in an open Habit sheet (chosen weekdays may still be empty).
    let habitFrequencyDraft = { type: "everyDay" };

    function habitFrequencyPickerHtml() {
      const chosen = habitFrequencyDraft.type === "weekdays" ? habitFrequencyDraft.weekdays : null;
      const weekdays = chosen ? `
        <div class="sheet-pill-group" role="group" aria-label="Habit weekdays">
          ${HuntCore.HABIT_WEEKDAYS.map(d => {
            const on = chosen.includes(d.day);
            return `<button class="sheet-pill weekday-pill ${on ? "selected" : ""}" aria-label="${d.name}" aria-pressed="${on}" onclick="toggleHabitWeekday(${jsArg(d.day)})">${d.label}</button>`;
          }).join("")}
        </div>
        ${chosen.length ? "" : `<div style="margin:-8px 0 16px;font-size:12px;color:var(--dim);">Pick at least one day</div>`}` : "";
      return `
        <div class="sheet-pill-group" role="group" aria-label="Habit frequency">
          <button class="sheet-pill ${chosen ? "" : "selected"}" aria-label="Every day" aria-pressed="${!chosen}" onclick="setHabitFrequencyType('everyDay')">Every day</button>
          <button class="sheet-pill ${chosen ? "selected" : ""}" aria-label="Chosen days" aria-pressed="${!!chosen}" onclick="setHabitFrequencyType('weekdays')">Chosen days</button>
        </div>
        ${weekdays}`;
    }

    // Redraws the picker in place and puts focus back on the chip that was pressed.
    function renderHabitFrequencyPicker(focusLabel) {
      const el = document.getElementById("habitFrequencyPicker");
      if (!el) return;
      el.innerHTML = habitFrequencyPickerHtml();
      const again = focusLabel ? el.querySelector(`[aria-label="${focusLabel}"]`) : null;
      if (again) focusQuietly(again);
    }

    function setHabitFrequencyType(type) {
      playClickSound();
      if (type === "everyDay") habitFrequencyDraft = { type: "everyDay" };
      else if (habitFrequencyDraft.type !== "weekdays") habitFrequencyDraft = { type: "weekdays", weekdays: [] };
      renderHabitFrequencyPicker(type === "everyDay" ? "Every day" : "Chosen days");
    }

    function toggleHabitWeekday(dayArg) {
      const day = Number(dayArg); // jsArg passes the weekday as a string
      if (habitFrequencyDraft.type !== "weekdays") return;
      playClickSound();
      const days = habitFrequencyDraft.weekdays;
      const weekdays = days.includes(day) ? days.filter(d => d !== day) : days.concat(day).sort((a, b) => a - b);
      habitFrequencyDraft = { type: "weekdays", weekdays };
      const named = HuntCore.HABIT_WEEKDAYS.find(d => d.day === day);
      renderHabitFrequencyPicker(named ? named.name : null);
    }

    // The draft as a valid Frequency, or null (no weekday chosen yet): the picker is flagged then.
    function habitFrequencyFromDraft() {
      const frequency = HuntCore.parseHabitFrequency(habitFrequencyDraft);
      if (!frequency) flagInvalidField(document.querySelector('#habitFrequencyPicker [aria-label="Chosen days"]'));
      return frequency;
    }

    function openNewHabitSheet(preselectQuestId) {
      playClickSound();
      selectedHabitKind = "check";
      const activeQuests = activeQuestsList();
      selectedHabitQuestId = preselectQuestId !== undefined
        ? preselectQuestId
        : (activeQuests[0] ? activeQuests[0].id : null);
      habitFrequencyDraft = { type: "everyDay" };

      showSheet("newHabit", `
          ${sheetHeaderHtml("New Daily Habit")}

          <input id="newHabitTitleInput" class="sheet-input" placeholder="e.g. Read 20 pages, Review flashcards..." aria-label="Habit title" enterkeyhint="done" onkeydown="if(isSubmitKey(event)) saveNewHabit()" />
          <textarea maxlength="20000" id="newHabitNotesInput" class="sheet-input" rows="2" placeholder="Optional description copied to each day's task..." aria-label="Habit description" onkeydown="if(isSubmitKey(event)) saveNewHabit()"></textarea>

          <div class="sheet-label">Kind</div>
          <div class="sheet-pill-group" role="radiogroup" aria-label="Habit Kind">
            <button class="sheet-pill selected" role="radio" aria-checked="true" data-habit-kind="check" onclick="selectHabitKind(this, 'check')">Check</button>
            <button class="sheet-pill" role="radio" aria-checked="false" data-habit-kind="count" onclick="selectHabitKind(this, 'count')">Count</button>
          </div>
          <div id="newHabitCountFields" hidden>
            <div style="display:flex;gap:8px;">
              <input id="newHabitTargetInput" class="sheet-input" inputmode="decimal" placeholder="Daily target" aria-label="Daily target" style="flex:1;min-width:0;" onkeydown="if(isSubmitKey(event)) saveNewHabit()" />
              <input id="newHabitUnitInput" class="sheet-input" maxlength="40" placeholder="Unit (e.g. miles)" aria-label="Unit" style="flex:1;min-width:0;" onkeydown="if(isSubmitKey(event)) saveNewHabit()" />
            </div>
          </div>
          <div class="sheet-label">Frequency</div>
          <div id="habitFrequencyPicker">${habitFrequencyPickerHtml()}</div>

          <div class="sheet-label">Assign to Quest</div>
          <div class="sheet-pill-group" role="group" aria-label="Habit quest">
            ${activeQuests.map(q => `
              <button class="sheet-pill ${selectedHabitQuestId === q.id ? 'selected' : ''}" aria-pressed="${selectedHabitQuestId === q.id}" onclick="selectPill(this);selectedHabitQuestId=${jsArg(q.id)};">
                <span style="width:8px;height:8px;border-radius:50%;background:${ACCENT_HEX[q.accentColor] || ACCENT_HEX.slate};"></span>
                <span>${escapeHtml(q.title)}</span>
              </button>
            `).join("")}
            <button class="sheet-pill ${selectedHabitQuestId === null ? 'selected' : ''}" aria-pressed="${selectedHabitQuestId === null}" onclick="selectPill(this);selectedHabitQuestId=null;">
              <span style="width:8px;height:8px;border-radius:50%;background:var(--slate);"></span>
              <span>Other work</span>
            </button>
          </div>

          <div class="sheet-actions single">
            <button class="pressable" onclick="saveNewHabit()" style="width:100%;height:var(--touch-min);border-radius:14px;border:none;background:var(--cyan);color:rgb(var(--c-on-accent));font-family:var(--font-display);font-weight:700;font-size:14px;cursor:pointer;">
              + Add Daily Habit
            </button>
          </div>
      `);
      focusFieldSoon("newHabitTitleInput");
    }

    function saveNewHabit() {
      const tEl = document.getElementById("newHabitTitleInput");
      const nEl = document.getElementById("newHabitNotesInput");
      const title = tEl ? tEl.value.trim().slice(0, 300) : "";
      if (!title) {
        flagInvalidField(tEl);
        return;
      }
      const kind = selectedHabitKind === "count" ? "count" : "check";
      const targetEl = document.getElementById("newHabitTargetInput");
      const unitEl = document.getElementById("newHabitUnitInput");
      const target = kind === "count" ? parseCountAmount(targetEl ? targetEl.value : "") : null;
      if (kind === "count" && !HuntCore.isCountTarget(target)) {
        flagInvalidField(targetEl);
        return;
      }
      const frequency = habitFrequencyFromDraft();
      if (!frequency) return;
      playCompleteSound();
      const now = Date.now();
      const habits = asArray(state.habits).slice().sort(compareRank);
      const rank = habits.length ? (Number(habits[habits.length - 1].rank) || 0) + 1000 : 1000;
      const habit = {
        id: "hab-" + now + "-" + Math.random().toString(36).slice(2, 6),
        title,
        notes: nEl ? nEl.value.trim() : "",
        questId: selectedHabitQuestId || null,
        rank,
        createdAt: now,
        updatedAt: now,
        kind
      };
      if (kind === "count") {
        habit.target = target;
        habit.unit = unitEl ? unitEl.value.trim().slice(0, HuntCore.MAX_COUNT_UNIT_LENGTH) : "";
      }
      const todayKey = toLocalDateKey(now);
      const frequencyHistory = HuntCore.withHabitFrequency(habit, frequency, todayKey);
      if (frequencyHistory.length > 0) habit.frequencyHistory = frequencyHistory;
      const firstRects = captureTaskFlipRects();
      if (!state.habits) state.habits = [];
      state.habits.push(habit);
      materializeDailyHabitsInto(state, todayKey);
      closeSheet();
      commitLocalChange();
      playTaskFlipGlide(firstRects, habitTaskId(habit.id, todayKey));
      showToast("Habit added · " + shortTitle(title));
    }

    function openHabitEditorSheet(habitId) {
      playClickSound();
      const h = asArray(state.habits).find(x => x.id === habitId);
      if (!h) return;
      selectedHabitQuestId = h.questId || null;
      habitFrequencyDraft = habitFrequencyOn(h, toLocalDateKey());

      showSheet("habit:" + h.id, `
          ${sheetHeaderHtml("Edit Daily Habit")}

          <input id="editHabitTitleInput" class="sheet-input" value="${escapeHtml(h.title)}" aria-label="Habit title" enterkeyhint="done" onkeydown="if(isSubmitKey(event)) saveHabitEdits(${jsArg(h.id)})" />
          <textarea maxlength="20000" id="editHabitNotesInput" class="sheet-input" rows="2" placeholder="Optional default notes..." aria-label="Habit notes">${escapeHtml(h.notes || "")}</textarea>

          <div class="sheet-label">Kind</div>
          <div style="font-size:13px;color:var(--text-2);margin-bottom:6px;">${habitKindOf(h) === "count" ? "Count Habit" : "Check Habit"}</div>
          ${habitKindOf(h) === "count" ? `
            <div style="display:flex;gap:8px;">
              <input id="editHabitTargetInput" class="sheet-input" inputmode="decimal" value="${escapeHtml(formatCountAmount(countTargetOf(h)))}" placeholder="Daily target" aria-label="Daily target" style="flex:1;min-width:0;" />
              <input id="editHabitUnitInput" class="sheet-input" maxlength="40" value="${escapeHtml(h.unit || "")}" placeholder="Unit (e.g. miles)" aria-label="Unit" style="flex:1;min-width:0;" />
            </div>
          ` : ""}
          <div class="sheet-label">Frequency · applies from today</div>
          <div id="habitFrequencyPicker">${habitFrequencyPickerHtml()}</div>

          <div class="sheet-label">Assigned Quest</div>
          <div class="sheet-pill-group" role="group" aria-label="Habit quest">
            ${activeQuestsList().map(q => `
              <button class="sheet-pill ${selectedHabitQuestId === q.id ? 'selected' : ''}" aria-pressed="${selectedHabitQuestId === q.id}" onclick="selectPill(this);selectedHabitQuestId=${jsArg(q.id)};">
                <span style="width:8px;height:8px;border-radius:50%;background:${ACCENT_HEX[q.accentColor] || ACCENT_HEX.slate};"></span>
                <span>${escapeHtml(q.title)}</span>
              </button>
            `).join("")}
            <button class="sheet-pill ${selectedHabitQuestId === null ? 'selected' : ''}" aria-pressed="${selectedHabitQuestId === null}" onclick="selectPill(this);selectedHabitQuestId=null;">
              <span style="width:8px;height:8px;border-radius:50%;background:var(--slate);"></span>
              <span>Other work</span>
            </button>
          </div>

          ${habitSkipTodayHtml(h)}

          <div class="sheet-footer-row" style="margin-top:8px;">
            <button class="danger-outline-btn" onclick="deleteHabitItem(${jsArg(h.id)})">Delete Habit</button>
            <button class="pressable" onclick="saveHabitEdits(${jsArg(h.id)})" style="height:var(--touch-min);padding:0 22px;border-radius:12px;border:none;background:var(--cyan);color:rgb(var(--c-on-accent));font-family:var(--font-display);font-weight:700;font-size:13px;cursor:pointer;">Save</button>
          </div>
      `);
    }

    // The sheet's "Skip today" row: only for a scheduled day still waiting to be done (not ticked,
    // not Skipped, no focus running on it). An unscheduled day has no Outcome, so no row.
    function habitSkipTodayHtml(h) {
      const todayKey = toLocalDateKey();
      const today = summarizeHabitDays(state.tasks, todayKey, asArray(state.habits)).summaryFor(h.id);
      if (today.outcomeOn(todayKey) !== "open" || (today.todayTask && today.todayTask.status === "active")) return "";
      return `
          <div class="sheet-label">Today</div>
          <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:12px;">
            <button class="sync-chip pressable" style="height:var(--touch-min);padding:0 16px;" onclick="setHabitTodaySkipped(${jsArg(h.id)}, true)" aria-label="Skip today: ${escapeHtml(h.title)}">Skip today</button>
            <span style="font-size:12px;color:var(--muted);line-height:1.35;flex:1;min-width:160px;">Sick or travelling? A Skipped day neither breaks nor adds to the streak.</span>
          </div>`;
    }

    function saveHabitEdits(habitId) {
      const h = asArray(state.habits).find(x => x.id === habitId);
      if (!h) { closeSheet(); return; }
      const tEl = document.getElementById("editHabitTitleInput");
      const nEl = document.getElementById("editHabitNotesInput");
      const title = tEl ? tEl.value.trim().slice(0, 300) : "";
      if (!title) {
        flagInvalidField(tEl);
        return;
      }
      const frequency = habitFrequencyFromDraft();
      if (!frequency) return;
      playClickSound();
      const now = Date.now();
      const todayKey = toLocalDateKey(now);
      const prev = cloneJson(h);
      const nextNotes = nEl ? nEl.value.trim() : (h.notes || "");
      const nextQuestId = selectedHabitQuestId || null;
      let nextTarget = null;
      let nextUnit = null;
      if (habitKindOf(h) === "count") {
        const targetEl = document.getElementById("editHabitTargetInput");
        const unitEl = document.getElementById("editHabitUnitInput");
        nextTarget = parseCountAmount(targetEl ? targetEl.value : "");
        if (!HuntCore.isCountTarget(nextTarget)) {
          flagInvalidField(targetEl);
          return;
        }
        nextUnit = unitEl ? unitEl.value.trim().slice(0, HuntCore.MAX_COUNT_UNIT_LENGTH) : (h.unit || "");
      }
      const before = JSON.stringify(h);
      h.title = title;
      h.notes = nextNotes;
      h.questId = nextQuestId;
      if (nextTarget !== null) {
        h.target = nextTarget;
        h.unit = nextUnit;
      }
      // A Frequency change applies from today; earlier days keep the Frequency they had.
      const frequencyHistory = HuntCore.withHabitFrequency(h, frequency, todayKey);
      if (frequencyHistory.length > 0 || h.frequencyHistory) h.frequencyHistory = frequencyHistory;
      closeSheet();
      if (JSON.stringify(h) === before) return;
      h.updatedAt = nextStamp(h, now);
      // Today's day Task follows the edit (shared rule): set aside, brought back or kept aligned.
      const todayId = habitTaskId(h.id, todayKey);
      const todayTask = HuntCore.habitTodayTaskAfterEdit(prev, h, state.tasks.find(t => t.id === todayId), todayKey, now);
      if (todayTask && !asArray(state.deletedTaskIds).includes(todayId)) {
        state.tasks = state.tasks.filter(t => t.id !== todayId).concat(todayTask).sort(compareRank);
      }
      commitLocalChange();
      showToast("Habit saved");
    }

    function deleteHabitItem(habitId) {
      playClickSound();
      const h = asArray(state.habits).find(x => x.id === habitId);
      if (!h) { closeSheet(); return; }
      const removed = cloneJson(h);
      const hadHabitTomb = asArray(state.deletedHabitIds).includes(habitId);
      if (!state.deletedHabitIds) state.deletedHabitIds = [];
      if (!hadHabitTomb) state.deletedHabitIds.push(habitId);
      state.habits = asArray(state.habits).filter(x => x.id !== habitId);

      const todayTid = habitTaskId(habitId, toLocalDateKey());
      const todayTask = state.tasks.find(t => t.id === todayTid);
      let removedTask = null;
      let hadTaskTomb = false;
      if (todayTask && todayTask.status === "queued" && (todayTask.accumulatedSeconds || 0) === 0) {
        removedTask = cloneJson(todayTask);
        hadTaskTomb = asArray(state.deletedTaskIds).includes(todayTid);
        if (!state.deletedTaskIds) state.deletedTaskIds = [];
        if (!hadTaskTomb) state.deletedTaskIds.push(todayTid);
        state.tasks = state.tasks.filter(t => t.id !== todayTid);
      }
      closeSheet();
      commitLocalChange();
      showToast("Habit deleted · " + shortTitle(removed.title), {
        holdSync: !hadHabitTomb,
        undo: () => undoDeleteHabit(removed, hadHabitTomb, removedTask, hadTaskTomb)
      });
    }

    function undoDeleteHabit(removed, hadHabitTomb, removedTask, hadTaskTomb) {
      if (asArray(state.habits).some(x => x.id === removed.id)) return;
      if (!hadHabitTomb) state.deletedHabitIds = asArray(state.deletedHabitIds).filter(id => id !== removed.id);
      if (!state.habits) state.habits = [];
      unlinkDeletedQuest(removed);
      state.habits.push(removed);
      state.habits.sort(compareRank);
      if (removedTask && !state.tasks.some(t => t.id === removedTask.id)) {
        if (!hadTaskTomb) state.deletedTaskIds = asArray(state.deletedTaskIds).filter(id => id !== removedTask.id);
        unlinkDeletedQuest(removedTask);
        state.tasks.push(removedTask);
        state.tasks.sort(compareRank);
      }
      commitLocalChange();
    }

    function toggleHabitToday(habitId) {
      const todayKey = toLocalDateKey();
      const tid = habitTaskId(habitId, todayKey);
      let t = state.tasks.find(x => x.id === tid);
      if (!t) {
        // Re-materialize if needed (even if user had dismissed today's copy earlier).
        const h = asArray(state.habits).find(x => x.id === habitId);
        if (!h || !isHabitScheduledOn(h, todayKey)) return;
        state.deletedTaskIds = asArray(state.deletedTaskIds).filter(id => id !== tid);
        t = buildHabitTaskRow(h, todayKey);
        state.tasks.push(t);
        state.tasks.sort(compareRank);
      }
      if (t.status === "completed") reopenTaskDirect(t.id);
      else completeTaskDirect(t.id);
    }

    // Sets today's day of a Habit aside (Skipped) or back to an ordinary day, with the shared rule
    // (HuntCore.skipHabitDayRow, the desktop's too). A Skipped day leaves Today and the Day Widget and
    // neither adds to nor breaks the Streak.
    function setHabitTodaySkipped(habitId, skipped) {
      const todayKey = toLocalDateKey();
      const tid = habitTaskId(habitId, todayKey);
      let t = state.tasks.find(x => x.id === tid);
      if (!t) {
        const h = asArray(state.habits).find(x => x.id === habitId);
        if (!h || !isHabitScheduledOn(h, todayKey)) return;
        state.deletedTaskIds = asArray(state.deletedTaskIds).filter(id => id !== tid);
        t = buildHabitTaskRow(h, todayKey);
        state.tasks.push(t);
        state.tasks.sort(compareRank);
      }
      closeSheet();
      if (Boolean(t.skipped) === Boolean(skipped)) return;
      playClickSound();
      Object.assign(t, HuntCore.skipHabitDayRow(t, Boolean(skipped), Date.now()));
      if (!t.skipped) delete t.skipped;
      commitLocalChange();
    }

    function focusHabitToday(habitId) {
      const todayKey = toLocalDateKey();
      const tid = habitTaskId(habitId, todayKey);
      let t = state.tasks.find(x => x.id === tid);
      if (!t) {
        const h = asArray(state.habits).find(x => x.id === habitId);
        if (!h || !isHabitScheduledOn(h, todayKey)) return;
        state.deletedTaskIds = asArray(state.deletedTaskIds).filter(id => id !== tid);
        t = buildHabitTaskRow(h, todayKey);
        state.tasks.push(t);
        state.tasks.sort(compareRank);
      }
      if (t.status === "completed") reopenTaskDirect(t.id);
      initializeFocus(t.id);
    }

    // =========================================================================
    // COUNT HABITS: +1, a held press for an exact total (shared Count rule)
    // =========================================================================

    // The Count Habit a day Task belongs to, or null for any other Task.
    function countHabitOfTask(task) {
      if (!task || !task.habitId) return null;
      const h = asArray(state.habits).find(x => x.id === task.habitId);
      return h && habitKindOf(h) === "count" ? h : null;
    }

    // Writes a Count Habit's total for `dateKey`: "+1" adds one, a number sets it exactly. The day's
    // Task is created first when missing (as toggleHabitToday does); the shared rule completes it once
    // the total reaches the target and reopens it below.
    function logHabitCount(habitId, dateKey, amount) {
      const h = asArray(state.habits).find(x => x.id === habitId);
      if (!h || habitKindOf(h) !== "count") return;
      const tid = habitTaskId(habitId, dateKey);
      let t = state.tasks.find(x => x.id === tid);
      if (!t) {
        state.deletedTaskIds = asArray(state.deletedTaskIds).filter(id => id !== tid);
        t = buildHabitTaskRow(h, dateKey);
        state.tasks.push(t);
        state.tasks.sort(compareRank);
      }
      const wasMet = habitDayAmount(t) >= countTargetOf(h);
      const now = Date.now();
      const next = amount === "+1" ? HuntCore.addHabitDayCount(t, h, now) : HuntCore.setHabitDayAmount(t, h, amount, now);
      const firstRects = captureTaskFlipRects();
      if (!wasMet && habitDayAmount(next) >= countTargetOf(h)) playCompleteSound();
      else playClickSound();
      for (const k of Object.keys(t)) if (!(k in next)) delete t[k];
      Object.assign(t, next);
      commitLocalChange();
      playTaskFlipGlide(firstRects, tid);
    }

    // A held press on a +1 ring: after HABIT_LONG_PRESS_MS it opens exact entry, and the click that
    // ends the press adds nothing. A long touch in the WebView also fires `contextmenu`, which opens
    // it at once (and right-click does on a desktop browser).
    const HABIT_LONG_PRESS_MS = 500;
    let countPressTimer = null;
    let countPressLongId = null;
    function countPressStart(habitId) {
      countPressEnd();
      countPressLongId = null;
      countPressTimer = setTimeout(() => {
        countPressTimer = null;
        countPressLongId = habitId;
        openHabitAmountSheet(habitId);
      }, HABIT_LONG_PRESS_MS);
    }
    function countPressEnd() {
      if (countPressTimer) clearTimeout(countPressTimer);
      countPressTimer = null;
    }
    function countPressContext(event, habitId) {
      if (event) event.preventDefault();
      countPressEnd();
      if (countPressLongId !== habitId) openHabitAmountSheet(habitId);
      countPressLongId = habitId;
    }
    function countPressClick(habitId) {
      if (countPressLongId === habitId) {
        countPressLongId = null;
        return;
      }
      logHabitCount(habitId, toLocalDateKey(), "+1");
    }

    // The +1 ring of a Count Habit row (Habits card and Today row).
    function countPlusButtonHtml(h, met, hex) {
      return `<button class="task-check-ring count-plus ${met ? "done" : ""}" style="${met ? `background:${hex};` : ""}margin-top:2px;" onclick="countPressClick(${jsArg(h.id)})" onpointerdown="countPressStart(${jsArg(h.id)})" onpointerup="countPressEnd()" onpointerleave="countPressEnd()" onpointercancel="countPressEnd()" oncontextmenu="countPressContext(event, ${jsArg(h.id)})" aria-label="Add 1 to ${escapeHtml(h.title)}" title="Add 1 (hold to type a total)">+1</button>`;
    }

    function openHabitAmountSheet(habitId) {
      const h = asArray(state.habits).find(x => x.id === habitId);
      if (!h || habitKindOf(h) !== "count") return;
      const t = state.tasks.find(x => x.id === habitTaskId(habitId, toLocalDateKey()));
      showSheet("habitAmount:" + h.id, `
          ${sheetHeaderHtml("Today's total")}
          <div class="sheet-label">${escapeHtml(h.title)} · target ${escapeHtml(formatCountAmount(countTargetOf(h)))}${h.unit ? " " + escapeHtml(h.unit) : ""}</div>
          <input id="habitAmountInput" class="sheet-input" inputmode="decimal" enterkeyhint="done" value="${escapeHtml(formatCountAmount(habitDayAmount(t)))}" aria-label="Today's total for ${escapeHtml(h.title)}" onkeydown="if(isSubmitKey(event)) saveHabitAmount(${jsArg(h.id)})" />
          <div class="sheet-actions single">
            <button class="pressable" data-action="save-habit-amount" onclick="saveHabitAmount(${jsArg(h.id)})" style="width:100%;height:var(--touch-min);border-radius:14px;border:none;background:var(--cyan);color:rgb(var(--c-on-accent));font-family:var(--font-display);font-weight:700;font-size:14px;cursor:pointer;">
              Set total
            </button>
          </div>
      `);
      focusFieldSoon("habitAmountInput");
    }

    function saveHabitAmount(habitId) {
      const el = document.getElementById("habitAmountInput");
      const amount = parseCountAmount(el ? el.value : "");
      if (amount === null) {
        flagInvalidField(el);
        return;
      }
      closeSheet();
      logHabitCount(habitId, toLocalDateKey(), amount);
    }

    // The Habit Kind choice of the new-habit sheet (fixed once the Habit is made).
    let selectedHabitKind = "check";
    function selectHabitKind(btn, kind) {
      selectedHabitKind = kind;
      if (btn && btn.parentElement) {
        btn.parentElement.querySelectorAll('[role="radio"]').forEach(b => {
          const on = b === btn;
          b.classList.toggle("selected", on);
          b.setAttribute("aria-checked", on ? "true" : "false");
        });
      }
      const fields = document.getElementById("newHabitCountFields");
      if (fields) fields.hidden = kind !== "count";
    }

    // Render Compact Queue Row Card (#02+)
    function renderCompactQueueCard(task) {
      const q = state.quests.find(x => x.id === task.questId);
      const hex = ACCENT_HEX[q ? q.accentColor : "slate"];
      const af = state.activeFocus;
      const isRunningHere = af && af.activeTaskId === task.id && af.isRunning;
      const delta = isRunningHere && af.sessionStartedAt ? Math.max(0, Math.floor((Date.now() - af.sessionStartedAt) / 1000)) : 0;
      const totalSec = (task.accumulatedSeconds || 0) + delta;
      const title = escapeHtml(task.title);
      const countHabit = countHabitOfTask(task);

      return `
        <div class="queue-item-card" data-flip-task-id="${escapeHtml(task.id)}">
          <div class="card-edge-bar" style="background:${hex};"></div>

          ${countHabit ? countPlusButtonHtml(countHabit, false, hex) : `
          <button class="task-check-ring" onclick="completeTaskDirect(${jsArg(task.id)})" aria-label="Complete ${title}">
            ${SVG_CHECK}
          </button>`}

          <div class="queue-item-body" role="button" onclick="initializeFocus(${jsArg(task.id)})">
            <div class="queue-item-title">${title}</div>
            ${task.notes ? `<div style="font-size:12px;color:var(--dim);margin-top:3px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(task.notes)}</div>` : ""}
            <div class="queue-item-sub">
              <span style="display:inline-flex;align-items:center;gap:5px;min-width:0;max-width:100%;">
                <span style="width:6px;height:6px;border-radius:50%;background:${hex};flex-shrink:0;"></span>
                <span class="quest-label-ellipsis">${escapeHtml(q ? q.title : "Other work")}</span>
              </span>
              ${task.habitId ? `<span style="font-size:10px;color:var(--dim);padding:1px 6px;border-radius:999px;border:1px solid var(--border);flex-shrink:0;">Daily</span>` : ""}
              ${countHabit ? `<span class="count-progress">${escapeHtml(countProgressLabel(countHabit, habitDayAmount(task)))}</span>` : ""}
              ${checklistBadgeHtml(task)}
            </div>
          </div>

          <div class="queue-item-right">
            <button class="mini-play-btn" onclick="initializeFocus(${jsArg(task.id)})" aria-label="${isRunningHere ? "Open focus on" : "Start focus on"} ${title}">
              ${totalSec > 0 || isRunningHere ? `<span data-task-timer="${escapeHtml(task.id)}" data-prefix="">${formatChrono(totalSec)}</span>` : ""}
              ${SVG_PLAY}
            </button>
            <button class="more-dots-btn" onclick="openTaskInspectorSheet(${jsArg(task.id)})" aria-label="Task options for ${title}">
              ${SVG_MORE}
            </button>
          </div>
        </div>
      `;
    }

    function renderCompletedCard(t, showTime) {
      const q = state.quests.find(x => x.id === t.questId);
      const hex = ACCENT_HEX[q ? q.accentColor : "slate"] || ACCENT_HEX.slate;
      const fresh = justCompletedTaskId === t.id;
      if (fresh) justCompletedTaskId = null;
      const title = escapeHtml(t.title);
      return `
        <div class="queue-item-card completed${fresh ? " just-completed" : ""}" data-flip-task-id="${escapeHtml(t.id)}">
          <div class="card-edge-bar" style="background:${hex};"></div>
          <button class="task-check-ring done" style="background:${hex};" onclick="reopenTaskDirect(${jsArg(t.id)})" aria-label="Reopen ${title}">${SVG_CHECK}</button>
          <div class="queue-item-body">
            <div class="queue-item-title" style="text-decoration:line-through;color:var(--muted);">${title}</div>
            <div class="queue-item-sub">
              <span class="quest-label-ellipsis">${escapeHtml(q ? q.title : "Other work")}</span>
              ${showTime && t.accumulatedSeconds > 0 ? `<span style="font-family:var(--font-mono);flex-shrink:0;font-variant-numeric:tabular-nums;">· ${formatChrono(t.accumulatedSeconds)}</span>` : ""}
            </div>
          </div>
          <button class="completed-delete-btn" onclick="deleteTaskItem(${jsArg(t.id)})" aria-label="Delete completed task ${title}">${SVG_TRASH}</button>
        </div>
      `;
    }

        </div>
      `;
    }
