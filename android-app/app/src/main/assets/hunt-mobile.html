    function evaluateGuideTaskDraft(title, notes) {
      const trimmed = typeof title === "string" ? title.trim() : "";
      const trimmedNotes = typeof notes === "string" ? notes.trim() : "";
      if (!trimmed) {
        return { verdict: "empty", score: 0, maxScore: 8, summary: "Type a task draft or tap an example to get instant science feedback.", checks: [] };
      }
      const sample = trimmed.slice(0, 1000);
      const words = sample.split(/\s+/).filter(Boolean);
      const lower = sample.toLowerCase();
      const firstToken = (words[0] || "").replace(/^[^A-Za-z0-9\u00C0-\u024F]+|[^A-Za-z0-9\u00C0-\u024F]+$/g, "").toLowerCase();
      const startsVague = GUIDE_VAGUE_STARTERS.some(p => lower === p.trim() || lower.startsWith(p));
      let verbCheck;
      if (startsVague) {
        verbCheck = { id: "verb", label: "Concrete starting verb", status: "fail", principle: "Implementation Intentions", detail: "Starts with a vague filler phrase. Replace it with a physical verb (Draft, Sketch, Implement, Run)." };
      } else if (GUIDE_CONCRETE_VERBS.has(firstToken)) {
        verbCheck = { id: "verb", label: "Concrete starting verb", status: "pass", principle: "Implementation Intentions", detail: 'Opens with an observable action ("' + words[0] + '"), removing initiation friction.' };
      } else if (firstToken && !/^[a-z]+$/.test(firstToken)) {
        verbCheck = { id: "verb", label: "Concrete starting verb", status: words.length >= 3 ? "pass" : "warn", principle: "Implementation Intentions", detail: words.length >= 3 ? "Multi-word phrasing — make sure it opens with a concrete physical action." : "Add a concrete starting verb so the first 30 seconds are clear." };
      } else {
        verbCheck = { id: "verb", label: "Concrete starting verb", status: "fail", principle: "Implementation Intentions", detail: "Reads like a topic/noun. Start with a concrete verb (Draft, Build, Fix, Review, Run)." };
      }

      let specCheck;
      if (words.length < 3) {
        specCheck = { id: "spec", label: "Specific next step", status: "fail", principle: "Goal Specificity", detail: "Too brief — name the specific section, artifact, or route." };
      } else if (trimmed.length > 120 || words.length > 20) {
        specCheck = { id: "spec", label: "Specific next step", status: "warn", principle: "Cognitive Load", detail: "Keep the title punchy and move supporting details into Notes." };
      } else {
        specCheck = { id: "spec", label: "Specific next step", status: "pass", principle: "Goal Specificity", detail: "Specific enough to act on immediately without re-planning." };
      }

      const bundles = (lower.match(/\band\b|&|;/g) || []).length;
      const oversized = GUIDE_OVERSIZED.some(p => lower.includes(p));
      let sizeCheck;
      if (oversized || bundles >= 2) {
        sizeCheck = { id: "size", label: "Single-sitting size (20–90m)", status: "fail", principle: "Zeigarnik Effect", detail: "Looks like a bundled mini-project. Split into single-sitting tasks." };
      } else if (bundles === 1 && words.length > 10) {
        sizeCheck = { id: "size", label: "Single-sitting size (20–90m)", status: "warn", principle: "Zeigarnik Effect", detail: "Two joined clauses — verify both fit inside one 20–90 min bout." };
      } else {
        sizeCheck = { id: "size", label: "Single-sitting size (20–90m)", status: "pass", principle: "Zeigarnik Effect", detail: "Focused on one cohesive action rather than a multi-day project." };
      }

      const hasQty = /\b\d+\b/.test(lower);
      const hasBound = /\b(intro|section|chapter|draft|wireframe|prototype|tests?|bug|fix|page|email|km|miles?|minutes?|min|hours?|summary|outline|notes|checklist|pr|review|v1)\b/.test(lower);
      let doneCheck;
      if (trimmedNotes.length >= 12 || (hasQty && words.length >= 3)) {
        doneCheck = { id: "done", label: "Clear finish line", status: "pass", principle: "Progress Principle", detail: trimmedNotes.length >= 12 ? "Clear completion criteria captured in Notes." : "Measurable boundary gives a clean completion signal." };
      } else if (hasBound && words.length >= 4) {
        doneCheck = { id: "done", label: "Clear finish line", status: "pass", principle: "Progress Principle", detail: "Names a concrete deliverable you can cleanly check off." };
      } else {
        doneCheck = { id: "done", label: "Clear finish line", status: "warn", principle: "Progress Principle", detail: "Add a quantity (e.g., '3 wireframes', '500 words') or a 1-line Definition of Done in Notes." };
      }

      const checks = [verbCheck, specCheck, sizeCheck, doneCheck];
      const score = checks.reduce((acc, c) => acc + (c.status === "pass" ? 2 : c.status === "warn" ? 1 : 0), 0);
      const verdict = score >= 7 ? "strong" : score >= 4 ? "fair" : "weak";
      const summary = verdict === "strong" ? "Ready for Focus — clear action, realistic scope, and a clean finish line."
        : verdict === "fair" ? "Good start — tighten the highlighted items so starting feels effortless."
        : "Too ambiguous or oversized — sharpen the starting verb and narrow it to one sitting.";
      return { verdict, score, maxScore: 8, summary, checks };
    }

    function evaluateGuideQuestDraft(title, desc, hoursVal, existingCount, existingHours) {
      const trimmed = typeof title === "string" ? title.trim() : "";
      const trimmedDesc = typeof desc === "string" ? desc.trim() : "";
      if (!trimmed) {
        return { verdict: "empty", score: 0, maxScore: 8, summary: "Draft a Quest title, purpose, and weekly hours to test its design.", checks: [] };
      }
      const sample = trimmed.slice(0, 1000);
      const words = sample.split(/\s+/).filter(Boolean);
      const lower = sample.toLowerCase();
      const hrs = Number(hoursVal);
      const exCnt = Number.isFinite(existingCount) ? Math.max(0, Math.floor(existingCount)) : 0;
      const exHrs = Number.isFinite(existingHours) ? Math.max(0, existingHours) : 0;
      const totalCnt = exCnt + 1;

      const capCheck = totalCnt <= 3
        ? { id: "cap", label: "Goal shielding (1–3 Quests)", status: "pass", principle: "Goal Shielding", detail: "Fits the 1–3 active Quest sweet spot (" + totalCnt + " total)." }
        : totalCnt === 4
        ? { id: "cap", label: "Goal shielding (1–3 Quests)", status: "warn", principle: "Goal Shielding", detail: "You already have 3 active Quests — adding a 4th can dilute attention." }
        : { id: "cap", label: "Goal shielding (1–3 Quests)", status: "fail", principle: "Goal Shielding", detail: totalCnt + " active Quests exceeds working-memory limits. Retire one first." };

      let hoursCheck;
      if (!Number.isFinite(hrs) || hrs < 1) {
        hoursCheck = { id: "hrs", label: "Calibrated weekly input", status: "fail", principle: "Planning Fallacy", detail: "Set a realistic weekly target of at least 1 hour." };
      } else {
        const proj = exHrs + hrs;
        if (hrs <= 20 && proj <= 30) {
          hoursCheck = { id: "hrs", label: "Calibrated weekly input", status: "pass", principle: "Goal-Setting Theory", detail: hrs + " h/wk (" + proj.toFixed(0) + " h/wk total) sits in a sustainable range." };
        } else if (hrs <= 30 && proj <= 40) {
          hoursCheck = { id: "hrs", label: "Calibrated weekly input", status: "warn", principle: "Planning Fallacy", detail: proj.toFixed(0) + " h/wk combined deep work is ambitious — leave room for Other work." };
        } else {
          hoursCheck = { id: "hrs", label: "Calibrated weekly input", status: "fail", principle: "Planning Fallacy", detail: hrs + " h/wk (" + proj.toFixed(0) + " h/wk total) risks chronic missed targets. Lower to a steady pace." };
        }
      }

      const isWish = GUIDE_WISH_STARTERS.some(p => lower.startsWith(p));
      const idCheck = isWish
        ? { id: "id", label: "Actionable Quest identity", status: "fail", principle: "Process vs. Outcome", detail: "Phrased as an abstract wish. Frame it around a concrete craft or pursuit." }
        : words.length < 2
        ? { id: "id", label: "Actionable Quest identity", status: "warn", principle: "Goal Specificity", detail: "Give it a vivid 2–6 word mission name instead of a single generic word." }
        : trimmed.length > 70
        ? { id: "id", label: "Actionable Quest identity", status: "warn", principle: "Cognitive Load", detail: "Trim the title to a crisp headline and put details in Description." }
        : { id: "id", label: "Actionable Quest identity", status: "pass", principle: "Goal Specificity", detail: "Memorable, concrete mission title that anchors daily tasks." };

      const purposeCheck = trimmedDesc.length >= 24
        ? { id: "why", label: "Intrinsic purpose & scope", status: "pass", principle: "Self-Determination Theory", detail: "Clearly states what moves this Quest forward and why it matters." }
        : trimmedDesc.length > 0
        ? { id: "why", label: "Intrinsic purpose & scope", status: "warn", principle: "Self-Determination Theory", detail: "Add a bit more context on what work counts and why it matters to you." }
        : { id: "why", label: "Intrinsic purpose & scope", status: "fail", principle: "Self-Determination Theory", detail: "Missing description — stating why it matters sustains follow-through." };

      const checks = [capCheck, hoursCheck, idCheck, purposeCheck];
      const score = checks.reduce((acc, c) => acc + (c.status === "pass" ? 2 : c.status === "warn" ? 1 : 0), 0);
      const verdict = score >= 7 ? "strong" : score >= 4 ? "fair" : "weak";
      const summary = verdict === "strong" ? "Well-calibrated Quest — focused scope, realistic budget, and clear purpose."
        : verdict === "fair" ? "Solid foundation — review the tips below so this Quest sticks long-term."
        : "High risk of friction or burnout — narrow scope, calibrate hours, and state why it matters.";
      return { verdict, score, maxScore: 8, summary, checks };
    }

    function auditGuideWorkspace() {
      const activeQuests = state.quests.filter(q => !q.archived);
      const activeQuestCount = activeQuests.length;
      const weeklyBudgetHours = Number(activeQuests.reduce((a, q) => {
        const n = Number(q.targetWeeklyHours);
        return a + (Number.isFinite(n) ? Math.max(0, n) : 0);
      }, 0).toFixed(1));
      const todayKey = toLocalDateKey();
      const openTasks = state.tasks.filter(t => isOpenTask(t, todayKey));
      let strongCount = 0;
      const tasksToSharpen = [];
      for (const t of openTasks) {
        const ev = evaluateGuideTaskDraft(t.title, t.notes);
        if (ev.verdict === "strong") {
          strongCount++;
        } else if (ev.verdict !== "empty" && tasksToSharpen.length < 5) {
          const issue = ev.checks.find(c => c.status === "fail") || ev.checks.find(c => c.status === "warn");
          if (issue) tasksToSharpen.push({ id: t.id, title: t.title, tip: issue.detail });
        }
      }
      const clarityPct = openTasks.length > 0 ? Math.round((strongCount / openTasks.length) * 100) : 100;
      return { activeQuestCount, weeklyBudgetHours, openTaskCount: openTasks.length, strongCount, clarityPct, tasksToSharpen };
    }

    function saveGuideTask() {
      const title = guideTaskTitle.trim();
      if (!title) {
        const el = document.getElementById("guideTaskTitleInput");
        if (el) el.focus();
        showToast("Enter a task title first");
        return;
      }
      playCompleteSound();
      const now = Date.now();
      const todayKey = toLocalDateKey(now);
      const pending = state.tasks.filter(t => isOpenTask(t, todayKey)).sort(compareRank);
      const rank = pending.length > 0 ? (Number(pending[0].rank) || 0) - 1000 : 1000;
      const qId = resolveComposerQuestId(guideTaskQuestId);
      state.tasks.push({
        id: "tsk-" + now + "-" + Math.random().toString(36).slice(2, 6),
        title,
        notes: guideTaskNotes.trim(),
        questId: qId,
        status: "queued",
        rank,
        accumulatedSeconds: 0,
        scheduledDate: toLocalDateKey(now),
        createdAt: now,
        updatedAt: now
      });
      guideTaskTitle = "";
      guideTaskNotes = "";
      commitLocalChange();
      showToast("Added to today's queue");
    }
