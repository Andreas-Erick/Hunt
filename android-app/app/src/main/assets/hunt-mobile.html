        if (stage !== "down") return;
        if (e.type === "pointercancel") {
          finish(false);
          return;
        }
        stage = "up";
        clearTimeout(timer);
        timer = setTimeout(() => finish(false), 350);
      };
      const onClick = () => {
        if (stage === "up") finish(false); // capture phase: the deferred render runs after the tap's handlers
      };
      document.addEventListener("pointerup", onUp, true);
      document.addEventListener("pointercancel", onUp, true);
      document.addEventListener("click", onClick, true);
      timer = setTimeout(() => finish(true), 1500);
    }

    // ----- Header sync chip -----
    // phase: "connecting" (first attempt of this session still pending) | "syncing" (a request is in
    // flight for a user Sync Now, or pushing changes to a reachable laptop) | "pending" (laptop reachable,
    // changes waiting for the next sync, nothing in flight: the chip keeps its "Synced · 2m" label) |
    // "ok" | "offline" (calm: everything works on the phone) | "attention" (the laptop answered but
    // refused: pairing key, size, server error). Background retries while offline never flash "Syncing…".
    function isAttentionReason(reason) {
      return reason === "auth" || reason === "too_large" || reason === "bad_response" || /^http_\d+$/.test(reason || "");
    }

    // One failed poll right after a success (flaky Wi-Fi) does not flip the chip; the next one decides.
    // Never for a failed Sync Now: the user asked, so the chip, the status card and the result line
    // all show that failure.
    function inReconnectGrace() {
      return !isLaptopReachable && !networkDown && syncRun.failures === 1 && syncRun.okThisSession > 0 &&
        !syncRun.lastManual && Date.now() - syncMeta.lastOkAt < 20000 && !isAttentionReason(syncMeta.lastError);
    }

    function getSyncPhase() {
      const pending = pendingChangeCount();
      // a Sync Now waiting for the automatic request it joined counts as syncing too
      if (syncRun.inFlight && (syncRun.manual || manualSyncPromise)) return "syncing";
      if (!syncRun.results) return "connecting";
      if (!isLaptopReachable && !inReconnectGrace()) return isAttentionReason(syncMeta.lastError) ? "attention" : "offline";
      if (syncRun.inFlight && pending > 0) return "syncing";
      return pending > 0 ? "pending" : "ok";
    }

    function getSyncStatus() {
      return {
        phase: getSyncPhase(),
        pending: pendingChangeCount(),
        inFlight: !!syncRun.inFlight,
        failures: syncRun.failures,
        retryAt: syncRun.retryAt,
        lastOkAt: syncMeta.lastOkAt,
        lastAttemptAt: syncMeta.lastAttemptAt,
        lastError: syncMeta.lastError,
        lastUrl: syncMeta.lastUrl,
        lanUrls: syncMeta.lanUrls.slice(),
        lastResult: syncRun.lastResult
      };
    }

    // "now", "4m", "3h", "2d": compact age for the chip.
    function relativeShort(ts) {
      const s = Math.max(0, (Date.now() - ts) / 1000);
      if (s < 60) return "now";
      if (s < 3600) return Math.floor(s / 60) + "m";
      if (s < 86400) return Math.floor(s / 3600) + "h";
      return Math.floor(s / 86400) + "d";
    }

    // "just now", "4 min ago", "3 h ago", "2 days ago": for sentences in the sync sheet.
    function relativeLong(ts) {
      const s = Math.max(0, (Date.now() - ts) / 1000);
      if (s < 45) return "just now";
      if (s < 3600) return Math.max(1, Math.round(s / 60)) + " min ago";
      if (s < 86400) return Math.floor(s / 3600) + " h ago";
      const d = Math.floor(s / 86400);
      return d === 1 ? "yesterday" : d + " days ago";
    }

    // "today 14:32" or "Tue, Nov 18 14:32". English like every other label (not the device locale),
    // 24 h like the Day Timeline.
    function absoluteTime(ts) {
      const d = new Date(ts);
      const time = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
      if (toLocalDateKey(ts) === toLocalDateKey()) return "today " + time;
      return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }) + " " + time;
    }

    // Everything the chip (and the Focus-view indicator) shows, derived from scheduler + device meta.
    // compact: shorter offline label while the live timer pill shares the header (360 px screens).
    function syncChipModel(compact) {
      const phase = getSyncPhase();
      const pending = pendingChangeCount();
      let label;
      if (phase === "connecting") label = "Connecting…";
      else if (phase === "syncing") label = "Syncing…"; // only while a request is really in flight
      // "pending" (e.g. the 5 s Undo hold after a delete): nothing is being sent yet, so keep the last label
      else if (phase === "ok" || phase === "pending") label = syncMeta.lastOkAt ? "Synced · " + relativeShort(syncMeta.lastOkAt) : "Synced";
      else if (phase === "attention") label = "Check sync";
      else if (pending) label = compact ? pending + " unsynced" : "Offline · " + pending + " unsynced";
      else label = "On phone";
      const dot = { connecting: "connecting", syncing: "syncing", pending: "online", ok: "online", attention: "attention" }[phase] || "offline";
      return { phase, label, dot, pending };
    }

    function setTextIfChanged(el, text) {
      if (el && el.textContent !== text) el.textContent = text;
    }

    function setAttrIfChanged(el, name, value) {
      if (el && el.getAttribute(name) !== value) el.setAttribute(name, value);
    }

    // Replaces innerHTML only when the generated markup differs from what this element last received.
    function setHtmlIfChanged(el, html) {
      if (!el || el.__huntHtml === html) return false;
      el.__huntHtml = html;
      el.innerHTML = html;
      return true;
    }

    function paintSyncIndicator(dotId, textId, buttonId, model) {
      const dot = document.getElementById(dotId);
      const txt = document.getElementById(textId);
      const btn = document.getElementById(buttonId);
      if (dot) {
        const cls = "dot-indicator " + model.dot;
        if (dot.className !== cls) dot.className = cls;
        setAttrIfChanged(dot, "data-phase", model.phase);
      }
      setTextIfChanged(txt, model.label);
      if (btn) {
        setAttrIfChanged(btn, "data-phase", model.phase);
        setAttrIfChanged(btn, "aria-label", "Sync status: " + model.label + ". Open sync settings");
      }
    }

    // Renders the header chip, the Focus-view indicator and an open sync sheet from sync meta.
    // Touches the DOM only where something visibly changed (idle syncs cause zero mutations).
    function updateSyncIndicator() {
      const pill = document.getElementById("activeHeaderPill");
      const compact = !!(pill && pill.firstElementChild);
      paintSyncIndicator("headerSyncDot", "headerSyncText", "syncChipBtn", syncChipModel(compact));
      if (document.getElementById("focusSyncText")) {
        paintSyncIndicator("focusSyncDot", "focusSyncText", "focusSyncBtn", syncChipModel(false));
      }
      if (isSyncSheetOpen()) refreshSyncSheet();
    }

    // Markup for the Focus view's indicator (rendered with the view, then kept current in place).
    function focusSyncIndicatorHtml() {
      const m = syncChipModel(false);
      return `<button class="focus-sync-btn" id="focusSyncBtn" data-phase="${m.phase}" onclick="openSyncSheet()" aria-label="Sync status: ${escapeHtml(m.label)}. Open sync settings">
          <span id="focusSyncDot" class="dot-indicator ${m.dot}" data-phase="${m.phase}"></span><span id="focusSyncText">${escapeHtml(m.label)}</span>
        </button>`;
    }

    function updateHeaderStatus() {
      const pillContainer = document.getElementById("activeHeaderPill");
      if (pillContainer) {
        const af = state.activeFocus;
        const activeTask = af && af.activeTaskId ? state.tasks.find(t => t.id === af.activeTaskId) : null;
        let html = "";
        let chrono = "";
        if (activeTask && activeView !== "focus") {
          const delta = af.isRunning && af.sessionStartedAt ? Math.max(0, Math.floor((Date.now() - af.sessionStartedAt) / 1000)) : 0;
          chrono = formatChrono((activeTask.accumulatedSeconds || 0) + delta);
          html = `<button class="live-timer-chip pressable" onclick="switchView('focus')" aria-label="${af.isRunning ? "Focus running" : "Focus paused"}: ${escapeHtml(activeTask.title)}. Open Focus"><span style="width:6px;height:6px;border-radius:50%;background:${af.isRunning ? "var(--emerald)" : "var(--neutral-dot)"};"></span><span id="headerChronoText">${chrono}</span></button>`;
        }
        // rebuild only when the pill itself changes; otherwise just keep its time current
        const key = html.replace(/<span id="headerChronoText">[^<]*<\/span>/, "");
        if (pillContainer.__huntKey !== key) {
          pillContainer.__huntKey = key;
          pillContainer.innerHTML = html;
        } else if (chrono) {
          setTextIfChanged(document.getElementById("headerChronoText"), chrono);
        }
      }
      updateSyncIndicator();
    }

    function setActiveView(view) {
      if (view === "review") view = "telemetry";
      activeView = view;
      ["command", "plan", "focus", "quests", "habits", "lists"].forEach(id => {
        const btn = document.getElementById("nav-" + id);
        if (!btn) return;
        const cls = id === view ? "nav-tab active" : "nav-tab";
        if (btn.className !== cls) btn.className = cls;
        if (id === view) setAttrIfChanged(btn, "aria-current", "page");
        else if (btn.hasAttribute("aria-current")) btn.removeAttribute("aria-current");
      });
      const reviewBtn = document.getElementById("reviewBtn");
      if (reviewBtn) {
        const rCls = view === "telemetry" ? "icon-circle-btn pressable active" : "icon-circle-btn pressable";
        if (reviewBtn.className !== rCls) reviewBtn.className = rCls;
        if (view === "telemetry") setAttrIfChanged(reviewBtn, "aria-current", "page");
        else if (reviewBtn.hasAttribute("aria-current")) reviewBtn.removeAttribute("aria-current");
      }
      if (document.body) setAttrIfChanged(document.body, "data-view", view);
    }

    function switchView(view) {
      playClickSound();
      const changed = (view === "review" ? "telemetry" : view) !== activeView;
      setActiveView(view);
      renderApp();
      if (changed) scrollPageToTop(); // a new screen starts at its top, not at the old scroll offset
    }

    function scrollPageToTop() {
      if (!((window.scrollY || window.pageYOffset || 0) > 0)) return;
      const se = document.scrollingElement || document.documentElement;
      if (se) se.scrollTop = 0;
    }

    function switchGuideTab(tab) {
      playClickSound();
      const changed = tab !== guideTab;
      guideTab = tab;
      renderApp();
      if (changed) scrollPageToTop();
    }

    // ----- Lifecycle: native events + page visibility -----
    function onAppHidden() {
      appInBackground = true;
      pointerIsDown = false; // a gesture never continues across backgrounding (no stuck deferred render)
      flushFieldDrafts();
      persistPending = false; // written right here, synchronously
      persistState();
      saveSyncMeta(true);
      // unsent New Task text (device-local, never synced): survives Android killing the app
      const sc = document.getElementById("sheetContainer");
      if (isSheetOpen() && sc && sc.dataset.sheet === "newTask") captureComposerDraft();
      storeComposerDraft();
      clearSyncTimer();
    }

    function onAppVisible() {
      const wasHidden = appInBackground;
      appInBackground = false;
      syncRun.failures = Math.min(syncRun.failures, 1);
      syncRun.retryAt = 0;
      const ticked = drainPendingTicks(); // widget ticks whose signal reached no page (see __huntPendingTicksArrived)
      if (wasHidden || ticked) renderAppSafely(); // time-dependent views (timers, date rollover)
      refreshReminderNotice(); // back from the notification or exact-alarm settings
      kickSync();
    }

    function onNetworkOnline() {
      networkDown = false;
      syncRun.failures = 0;
      syncRun.retryAt = 0;
      kickSync();
    }

    function onNetworkOffline() {
      networkDown = true;
      if (syncRun.results) isLaptopReachable = false;
      updateSyncIndicator();
    }

    window.__huntLifecycle = function (phase) {
      if (phase === "pause") onAppHidden();
      else if (phase === "resume") onAppVisible();
    };

    window.__huntNetwork = function (info) {
      if (info && info.online) onNetworkOnline();
      else onNetworkOffline();
    };

    // Android Back: close a sheet, else return to Today; false lets native move the task to the back.
    window.__huntBack = function () {
      if (isSheetOpen()) {
        closeSheet();
        return true;
      }
      if (activeView !== "command") {
        switchView("command");
        return true;
      }
      return false;
    };

    // ----- On-screen keyboard: hide the bottom nav + FAB while typing -----
    // With adjustResize the WebView shrinks above the keyboard, so the fixed nav (and the FAB) would sit
    // on top of the keyboard and squeeze the field being typed in. body.keyboard-open hides them while a
    // text field has focus AND the viewport is clearly shorter than its full height at this width (so
    // closing the keyboard with Back, which keeps the field focused, brings them back). Without any
    // height reading a focused field alone decides. Checked again by tick() while the class is set.
    // innerWidth -> { max, min, suspect }: tallest/shortest viewport height seen at that width. suspect =
    // the first reading at this width came while typing (e.g. rotated with the keyboard up), so it may
    // already be keyboard-reduced; trusted once a keyboard transition (>=15% height change) was seen at
    // this width, or once no field has focus. Android may report the full height first and the reduced
    // one right after (or the other way round), both orders must work.
    const viewportHeights = {};
    let nativeImeActive = !!window.__huntNativeImeBoot;
    let lastNativeImeDp = 0;
    let basePortraitInnerH = window.innerHeight || 0;
    let kbSettleTimer = 0;
    if (nativeImeActive && document.body) document.body.classList.add("native-ime");

    function updateEffectiveKb(dp) {
      const curH = window.innerHeight || 0;
      if (dp <= 20 && curH > 0) basePortraitInnerH = Math.max(basePortraitInnerH, curH);
      const shrunkByWebView = basePortraitInnerH > curH && curH > 0 ? (basePortraitInnerH - curH) : 0;
      const eff = Math.max(0, dp - shrunkByWebView);
      document.documentElement.style.setProperty("--eff-kb", eff + "px");
      return eff;
    }

    function scheduleSettledKb(dp) {
      clearTimeout(kbSettleTimer);
      if (dp <= 20) {
        document.documentElement.style.setProperty("--kb-settled", "0px");
        updateEffectiveKb(0);
        return;
      }
      kbSettleTimer = setTimeout(() => {
        document.documentElement.style.setProperty("--kb-settled", dp + "px");
        // the part of the keyboard over the page (a WebView that did shrink already moved its bottom up)
        revealFocusedEntry(updateEffectiveKb(dp));
      }, 140);
    }

    // Native IME path (adjustNothing + overlays-content): nothing resizes when the keyboard opens, so
    // the browser never scrolls the focused field into view itself. Once the keyboard has settled, a
    // page field it covers (e.g. the Focus-view notes) scrolls up to just above it; the --kb-settled
    // padding on .screen-body gives the room. Sheet fields lift with the sheet instead.
    function revealFocusedEntry(kbPx) {
      const el = document.activeElement;
      if (!isTextEntry(el) || typeof el.getBoundingClientRect !== "function") return;
      const sc = document.getElementById("sheetContainer");
      if (sc && sc.contains(el)) return;
      try {
        const covered = el.getBoundingClientRect().bottom - ((window.innerHeight || 0) - kbPx - 16);
        if (covered > 0) window.scrollBy({ top: covered, behavior: prefersReducedMotionMobile() ? "auto" : "smooth" });
      } catch (e) {}
    }

    // Called frame-by-frame by MainActivity's WindowInsetsAnimation.Callback on Android 11+.
    window.__huntSetIme = function (rawDp) {
      if (!nativeImeActive) {
        nativeImeActive = true;
        if (document.body) document.body.classList.add("native-ime");
        const m = document.getElementById("viewportMeta");
        if (m && !(m.getAttribute("content") || "").includes("interactive-widget")) {
          m.setAttribute("content", "width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=overlays-content");
        }
      }
      const dp = typeof rawDp === "number" && Number.isFinite(rawDp)
        ? Math.max(0, Math.min(1200, Math.round(rawDp)))
        : 0;
      if (dp !== lastNativeImeDp) {
        lastNativeImeDp = dp;
        document.documentElement.style.setProperty("--kb", dp + "px");
        scheduleSettledKb(dp);
      }
      const body = document.body;
      if (!body) return;
      const open = dp > 20;
      const typing = open && isTextEntry(document.activeElement);
      if (body.classList.contains("keyboard-open") !== open) {
        body.classList.toggle("keyboard-open", open);
      }
      if (body.classList.contains("keyboard-typing") !== typing) {
        body.classList.toggle("keyboard-typing", typing);
      }
    };

    function isTextEntry(el) {
      if (!el || el.disabled || el.readOnly) return false;
      if (el.tagName === "TEXTAREA") return true;
      if (el.tagName === "INPUT") return !/^(button|checkbox|color|file|hidden|image|radio|range|reset|submit)$/i.test(el.type || "text");
      return el.isContentEditable === true;
    }

    function updateKeyboardClass() {
      const body = document.body;
      if (!body) return;
      if (nativeImeActive) {
        const open = lastNativeImeDp > 20;
        const typing = open && isTextEntry(document.activeElement);
        body.classList.toggle("keyboard-open", open);
        body.classList.toggle("keyboard-typing", typing);
        return;
      }
      const vv = window.visualViewport;
      const h = (vv && vv.height) || window.innerHeight || 0;
      const w = Math.round(window.innerWidth || 0);
      const typing = isTextEntry(document.activeElement);
      let vh = w ? viewportHeights[w] : null;
      if (w && h && !vh) {
        vh = viewportHeights[w] = { max: h, min: h, suspect: typing };
      } else if (vh && h) {
        if (h > vh.max) vh.max = h;
        if (h < vh.min) vh.min = h;
      }
      if (vh && vh.suspect && (!typing || vh.max >= vh.min / 0.85)) vh.suspect = false;
      const full = vh ? vh.max : 0;
      const shrunk = !h || !full || (vh && vh.suspect) || h < full * 0.85;
      const open = typing && shrunk;
      const vvKb = open && vv && window.innerHeight
        ? Math.max(0, Math.round(window.innerHeight - vv.height - (vv.offsetTop || 0)))
        : 0;
      document.documentElement.style.setProperty("--kb", vvKb + "px");
      document.documentElement.style.setProperty("--kb-settled", vvKb + "px");
      body.classList.toggle("keyboard-typing", open);
      if (body.classList.contains("keyboard-open") === open) return;
      body.classList.toggle("keyboard-open", open);
      // Only scroll a sheet field if it is actually clipped below the sheet's visible area;
      // scrolling a field that is already in view at the top of the sheet causes a visible jerk.
      const el = document.activeElement;
      const sc = document.getElementById("sheetContainer");
      const sheet = sc ? sc.querySelector(".bottom-sheet") : null;
      if (open && sheet && sheet.contains(el) && typeof el.scrollIntoView === "function") {
        setTimeout(() => {
          if (document.activeElement !== el) return;
          try {
            const sr = sheet.getBoundingClientRect();
            const er = el.getBoundingClientRect();
            if (sr.height > 0 && er.bottom > sr.bottom - 64) {
              el.scrollIntoView({ block: "nearest", behavior: "smooth" });
            }
          } catch (e) {}
        }, 100);
      }
    }

    function syncSheetTypingClass() {
      if (!document.body) return;
      const sc = document.getElementById("sheetContainer");
      const active = document.activeElement;
      const inSheet = !!(sc && isSheetOpen() && active && sc.contains(active) && isTextEntry(active));
      document.body.classList.toggle("sheet-typing", inSheet);
    }

    function installKeyboardHooks() {
      updateKeyboardClass(); // records the full height at boot (keyboard closed)
      document.addEventListener("focusin", () => {
        syncSheetTypingClass();
        updateKeyboardClass();
      });
      // focus moving between two fields: focusout then focusin in the same task, so no flash
      document.addEventListener("focusout", () => setTimeout(() => {
        syncSheetTypingClass();
        updateKeyboardClass();
      }, 0));
      window.addEventListener("resize", updateKeyboardClass);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", updateKeyboardClass);
        window.visualViewport.addEventListener("scroll", updateKeyboardClass);
      }
    }

    // UI-only listeners: keep the keyboard open while choosing a pill in a sheet, Escape closes a sheet
    // (browser copy), a no-op touchstart so :active press feedback also works in mobile Safari, and
    // press-and-scrub on the Review heatmap (scrubHeatmap).
    // 5 weekday columns need ~1180px for readable titles; narrower screens use the day strip.
    const PLAN_BOARD_QUERY = "(min-width: 1180px)";
    function isTabletPlanBoard() {
      try {
        return !!(window.matchMedia && window.matchMedia(PLAN_BOARD_QUERY).matches);
      } catch (e) {
        return false;
      }
    }

    function installUiHooks() {
      const sc = document.getElementById("sheetContainer");
      if (sc) {
        sc.addEventListener("mousedown", e => {
          const pill = e.target && e.target.closest ? e.target.closest(".sheet-pill") : null;
          const el = document.activeElement;
          if (pill && el && sc.contains(el) && /^(INPUT|TEXTAREA)$/.test(el.tagName)) e.preventDefault();
        });
      }
      document.addEventListener("keydown", e => {
        if (e.key === "Escape" && isSheetOpen()) closeSheet();
      });
      document.addEventListener("touchstart", () => {}, { passive: true });
      const onHeatmapPointer = e => {
        const cols = e.target && e.target.closest ? e.target.closest(".heatmap-cols") : null;
        if (cols) scrubHeatmap(e, cols);
      };
      document.addEventListener("pointerdown", onHeatmapPointer);
      document.addEventListener("pointermove", onHeatmapPointer);
      // the scrub only moved the outline and the readout in place: one full render when the finger lifts
      const onHeatmapPointerEnd = () => {
        if (!heatmapScrubPending) return;
        heatmapScrubPending = false;
        renderAppSafely();
      };
      document.addEventListener("pointerup", onHeatmapPointerEnd);
      document.addEventListener("pointercancel", onHeatmapPointerEnd);
      try {
        const planMq = window.matchMedia && window.matchMedia(PLAN_BOARD_QUERY);
        if (planMq && typeof planMq.addEventListener === "function") {
          planMq.addEventListener("change", () => {
            if (activeView === "plan") renderAppSafely();
          });
        }
      } catch (e) {}
    }

    function installLifecycleHooks() {
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) onAppHidden();
        else onAppVisible();
      });
      window.addEventListener("pagehide", onAppHidden);
      window.addEventListener("pageshow", e => { if (e.persisted) onAppVisible(); });
      window.addEventListener("online", onNetworkOnline);
      window.addEventListener("offline", onNetworkOffline);
      document.addEventListener("pointerdown", () => { pointerIsDown = true; }, true);
      document.addEventListener("pointerup", () => { pointerIsDown = false; }, true);
      document.addEventListener("pointercancel", () => { pointerIsDown = false; }, true);
    }

    function afterFirstPaint(fn) {
      if (typeof requestAnimationFrame === "function" && !document.hidden) {
        requestAnimationFrame(() => setTimeout(fn, 0));
      } else {
        setTimeout(fn, 0);
      }
    }

    // =========================================================================
    // TOASTS: brief confirmations and Undo. One host, auto-dismiss.
    // A delete's tombstone is written immediately (safe if the app is killed); while its Undo toast is
    // up, automatic syncs wait (holdSync) so Undo can still take the tombstone back.
    // An Undo (or Restore) window always runs its full time: a tap on the toast outside its button does
    // nothing, and a new toast replaces the oldest plain one. At most two are visible, unless several
    // Undo windows are open at once (e.g. three quick deletes): those stack until they end.
    // =========================================================================
    const TOAST_MS = 2400;
    const UNDO_TOAST_MS = 5000;
    const MAX_TOASTS = 2;
    const toasts = []; // { el, timer, expiresAt, undo, holdSync, done }
    const SVG_TOAST_CHECK = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
    const SVG_TOAST_UNDO = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>`;

    function syncToastBodyClass() {
      const body = document.body;
      if (!body) return;
      body.classList.toggle("has-toast", toasts.length > 0);
      if (toasts.length) {
        // the FAB lifts by the live stack (1 or more toasts, 8 px apart) plus an 8 px gap
        const stack = toasts.reduce((h, t) => h + (t.el.offsetHeight || 40), 0) + 8 * (toasts.length - 1);
        body.style.setProperty("--toast-stack", (stack + 8) + "px");
      }
    }

    function showToast(message, opts) {
      opts = opts || {};
      const host = document.getElementById("toastHost");
      if (!host) return null;
      while (toasts.length >= MAX_TOASTS) {
        const victim = toasts.find(t => !t.undo);
        if (!victim) break;
        finishToast(victim, false);
      }
      const ms = opts.ms || (opts.undo ? UNDO_TOAST_MS : TOAST_MS);
      const hasAction = !!opts.undo;
      const el = document.createElement("div");
      el.className = hasAction ? "toast has-action" : "toast";
      el.innerHTML = `<span class="toast-icon${hasAction ? " undo" : ""}" aria-hidden="true">${hasAction ? SVG_TOAST_UNDO : SVG_TOAST_CHECK}</span>` +
        `<span class="toast-msg">${escapeHtml(message)}</span>` +
        (hasAction ? `<button class="toast-action" type="button">${escapeHtml(opts.actionLabel || "Undo")}</button>` : "");
      const toast = { el, timer: 0, expiresAt: Date.now() + ms, undo: opts.undo || null, holdSync: !!(opts.undo && opts.holdSync), done: false };
      toast.timer = setTimeout(() => finishToast(toast, false), ms);
      el.addEventListener("click", e => {
        const undoTapped = !!(e.target && e.target.closest && e.target.closest(".toast-action"));
        if (toast.undo && !undoTapped) return; // a stray tap must not end the Undo window early
        finishToast(toast, undoTapped);
      });
      host.appendChild(el);
      toasts.push(toast);
      syncToastBodyClass();
      // the commit already armed a debounced sync: push it behind the Undo window
      if (toast.holdSync && syncRun.dueAt) scheduleSync(Math.max(0, syncRun.dueAt - Date.now()));
      return toast;
    }

    function finishToast(toast, runUndo) {
      if (!toast || toast.done) return;
      toast.done = true;
      const i = toasts.indexOf(toast);
      if (i >= 0) toasts.splice(i, 1);
      syncToastBodyClass();
      clearTimeout(toast.timer);
      const el = toast.el;
      el.classList.add("leaving");
      setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 160);
      if (runUndo && toast.undo) {
        playClickSound();
        toast.undo();
      } else if (toast.holdSync) {
        requestSyncSoon(); // the Undo window closed: let the delete go out now
      }
    }

    function settleHeldToasts() {
      toasts.filter(t => t.holdSync).forEach(t => finishToast(t, false));
    }

    // ms until no Undo toast holds automatic syncs back (0 = no hold). The hold lasts while such a toast
    // exists (not just by the clock): after a pause its timer may fire late, and Undo stays tappable.
    function syncHoldRemaining() {
      let until = 0;
      toasts.forEach(t => { if (t.holdSync && t.expiresAt > until) until = t.expiresAt; });
      return until ? Math.max(100, until - Date.now() + 50) : 0;
    }

    function cloneJson(value) {
      return value === undefined ? undefined : JSON.parse(JSON.stringify(value));
    }

    function shortTitle(text) {
      const s = String(text || "").trim();
      return s.length > 42 ? s.slice(0, 41) + "…" : s;
    }

    // =========================================================================
    // CORE FOCUS & TASK OPERATIONS (every mutation ends in commitLocalChange)
    // =========================================================================
    // Logs a running session (default: the current focus) up to endAt (default: now) under the shared id
    // log-<sessionStartedAt>-<taskId> (R3) and adds it to the task's counter. Skipped (returns 0: no log,
    // no counter change) when that session is already logged or its log was deleted: same id, a tombstone
    // for that id, or any log with the same task + start time (the other device ended this very session).
    // The caller's action (pause, complete, switch, return) goes ahead either way.
    function flushActiveBurst(endAt, focus) {
      const af = focus || state.activeFocus;
      if (!isRunningSession(af)) return 0;
      const task = state.tasks.find(t => t.id === af.activeTaskId);
      if (!task) return 0;
      const logId = sessionLogId(task.id, af.sessionStartedAt);
      if (state.timeLogs.some(l => l.id === logId) || asArray(state.deletedLogIds).includes(logId) ||
        isSessionLogged(state.timeLogs, af)) return 0;
      const now = Date.now();
      const end = Number.isFinite(endAt) ? endAt : now;
      const q = state.quests.find(x => x.id === task.questId);
      const log = HuntCore.buildBurstLog(task, q, af.sessionStartedAt, end);
      task.accumulatedSeconds = (task.accumulatedSeconds || 0) + log.durationSeconds;
      task.updatedAt = nextStamp(task, now);
      state.timeLogs.unshift(log);
      return log.durationSeconds;
    }

    // Runs one event through the SHARED focus state machine (HuntCore.transitionFocus, the same one the
    // desktop uses) and applies the local writes it asks for to `state`, in order. Returns the transition.
    function applyFocusEvent(event, now) {
      const transition = HuntCore.transitionFocus(HuntCore.toFocusSession(state.activeFocus), event, now);
      for (const effect of transition.effects) {
        if (effect.kind === "flush") {
          flushActiveBurst(effect.endAt, { activeTaskId: effect.taskId, isRunning: true, sessionStartedAt: effect.sessionStartedAt, updatedAt: 0 });
          continue;
        }
        const task = state.tasks.find(t => t.id === effect.taskId);
        if (!task) continue;
        if (effect.kind === "requeueIfActive") {
          if (task.status === "active") setTaskStatus(task, "queued", now);
        } else if (effect.kind === "markQueued") {
          setTaskStatus(task, "queued", now);
        } else if (effect.kind === "markActive") {
          setTaskStatus(task, "active", now);
        }
      }
      state.activeFocus = HuntCore.fromFocusSession(transition.session);
      return transition;
    }

    function setTaskStatus(task, status, now) {
      task.status = status;
      task.updatedAt = nextStamp(task, now);
    }

    // The Plan the week column a task renders in: its scheduledDate, or today when unscheduled. A dateless
    // daily habit row has no day of its own, so as a missed day it is in no column (null). Dated missed
    // days stay under their own past column as history.
    function planColumnKey(task, todayKey) {
      if (!task.scheduledDate && isMissedHabitTask(task, todayKey)) return null;
      return task.scheduledDate || todayKey;
    }

    // Builds the day Tasks of `dateKey` that are missing, only for Habits whose Frequency asks for
    // that day; existing and tombstoned ids are left alone (shared rule HuntCore.missingHabitRows).
    function materializeDailyHabitsInto(targetState, dateKey) {
      if (!asArray(targetState.habits).length) return 0;
      if (!Array.isArray(targetState.tasks)) targetState.tasks = [];
      const rows = HuntCore.missingHabitRows(targetState, dateKey);
      rows.forEach(row => targetState.tasks.push(row));
      if (rows.length > 0) targetState.tasks.sort(compareRank);
      return rows.length;
    }

    function materializeDailyHabits(dateKey) {
      const dk = dateKey || toLocalDateKey();
      const added = materializeDailyHabitsInto(state, dk);
      if (added > 0) commitLocalChange();
      return added;
    }

    function initializeFocus(taskId) {
      closeSheet();
      const cur = state.activeFocus;
      if (taskId && cur && cur.activeTaskId === taskId && cur.isRunning && cur.sessionStartedAt) {
        // already running: just open it (restarting would silently drop the running burst)
        playClickSound();
        setActiveView("focus");
        renderApp();
        return;
      }
      playLockSound();
      const now = Date.now();
      let target = taskId ? state.tasks.find(t => t.id === taskId) : null;
      if (!target) {
        // No task named: leave the current session first (logged, its task back in the queue), so the
        // shared "next task" rule can pick it again.
        const left = state.activeFocus && state.activeFocus.activeTaskId ? applyFocusEvent({ type: "leave" }, now) : null;
        const todayKey = toLocalDateKey(now);
        target = HuntCore.pickNextFocusTask(state.tasks, todayKey) ||
          state.tasks.find(t => t.status === "queued" && !isMissedHabitTask(t, todayKey));
        if (!target) {
          if (left) commitLocalChange();
          return;
        }
      }
      // "start" ends a session on another task (log + requeue) and marks the target active.
      applyFocusEvent({ type: "start", taskId: target.id }, now);
      setActiveView("focus");
      commitLocalChange();
    }

    function toggleTimerPause() {
      playClickSound();
      const af = state.activeFocus;
      if (!af || !af.activeTaskId) return;
      const running = HuntCore.toFocusSession(af).status === "running";
      applyFocusEvent({ type: running ? "pause" : "resume" }, Date.now());
      commitLocalChange();
    }

    function returnToQueueFromFocus() {
      playClickSound();
      applyFocusEvent({ type: "leave" }, Date.now());
      setActiveView("command");
      commitLocalChange();
    }

    function completeActiveTaskAndNext() {
      playCompleteSound();
      const af = state.activeFocus;
      if (!af || !af.activeTaskId) return;
      const twoBeatScene = activeView !== "focus" ? captureTwoBeatTaskScene(af.activeTaskId) : null;
      const now = Date.now();
      const currentTask = state.tasks.find(t => t.id === af.activeTaskId);
      if (!currentTask) return;

      if (af.isRunning && af.sessionStartedAt) {
        flushActiveBurst();
      } else if ((currentTask.accumulatedSeconds || 0) === 0) {
        // completed without ever running: log one second so the task shows in the done-list
        flushActiveBurst(now, { ...af, isRunning: true, sessionStartedAt: now - 1000 });
      }

      Object.assign(currentTask, HuntCore.completeTaskRow(currentTask, now));
      justCompletedTaskId = currentTask.id;

      const nextTask = HuntCore.pickNextFocusTask(state.tasks, toLocalDateKey(now));
      // the task is done: focus goes idle with no further writes
      applyFocusEvent({ type: "clear" }, now);
      if (activeView === "focus" && !nextTask) {
        setActiveView("command");
      }
      commitLocalChange();
      if (twoBeatScene) playTwoBeatTaskCompletion(twoBeatScene, currentTask.id);
      showToast(nextTask ? "Completed · " + shortTitle(currentTask.title) : "Completed · queue clear for today");
    }

    function prefersReducedMotionMobile() {
      try {
        return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
      } catch (e) {
        return false;
      }
    }

    // Captures pre-completion card geometry and builds an in-place visual ghost so Beat 1
    // (check fill + stroke draw + title strikethrough) runs calmly in place for 230ms before
    // Beat 2 smoothly collapses the queue and glides the completed card into Completed.
    function captureTwoBeatTaskScene(taskId) {
      const root = document.getElementById("mainContainer");
      if (!root || typeof root.animate !== "function" || prefersReducedMotionMobile()) return null;
      const allCards = Array.from(root.querySelectorAll("[data-flip-task-id]"));
      const sourceEl = allCards.find(el => el.getAttribute("data-flip-task-id") === taskId && !el.classList.contains("completed"));
      if (!sourceEl) return null;
      const rootRect = root.getBoundingClientRect();
      const sourceRect = sourceEl.getBoundingClientRect();
      if (sourceRect.width <= 0 || sourceRect.height <= 0) return null;

      const itemRects = new Map();
      const hadEmptyCard = !!root.querySelector(".empty-card");
      allCards.forEach(el => {
        const id = el.getAttribute("data-flip-task-id");
        if (!id || id === taskId) return;
        const prefix = el.classList.contains("completed") ? "done:" : "open:";
        itemRects.set(prefix + id, el.getBoundingClientRect());
      });
      root.querySelectorAll("[data-flip-key]").forEach(el => {
        const key = el.getAttribute("data-flip-key");
        if (key) itemRects.set("flow:" + key, el.getBoundingClientRect());
      });

      const taskObj = state.tasks.find(x => x.id === taskId);
      const q = taskObj ? state.quests.find(x => x.id === taskObj.questId) : null;
      const hex = ACCENT_HEX[q ? q.accentColor : "emerald"] || ACCENT_HEX.emerald;

      const ghost = sourceEl.cloneNode(true);
      ghost.removeAttribute("id");
      ghost.removeAttribute("data-flip-task-id");
      ghost.setAttribute("aria-hidden", "true");
      ghost.querySelectorAll("[id],[data-flip-task-id],[onclick]").forEach(node => {
        node.removeAttribute("id");
        node.removeAttribute("data-flip-task-id");
        node.removeAttribute("onclick");
      });
      ghost.style.position = "absolute";
      ghost.style.top = (sourceRect.top - rootRect.top) + "px";
      ghost.style.left = (sourceRect.left - rootRect.left) + "px";
      ghost.style.width = sourceRect.width + "px";
      ghost.style.margin = "0";
      ghost.style.pointerEvents = "none";
      ghost.style.zIndex = "20";

      const checkBtn = ghost.querySelector(".task-check-ring, .btn-complete-circle");
      if (checkBtn) {
        checkBtn.style.background = hex;
        checkBtn.style.borderColor = "transparent";
        checkBtn.style.color = "rgb(var(--c-on-accent))";
        checkBtn.style.boxShadow = "0 0 calc(14px * var(--glow)) -2px " + hex;
        checkBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgb(var(--c-on-accent))" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline data-ghost-check="1" points="20 6 9 17 4 12" style="stroke-dasharray:24;stroke-dashoffset:0;"/></svg>`;
      }
      const titleEl = ghost.querySelector(".queue-item-title, .spotlight-title");
      if (titleEl) {
        titleEl.style.color = "var(--muted)";
        titleEl.style.textDecoration = "line-through";
        titleEl.style.textDecorationColor = "rgb(var(--p-strike) / 0.85)";
      }
      const focusBtn = ghost.querySelector(".btn-primary-focus");
      if (focusBtn) {
        focusBtn.style.opacity = "0.4";
      }

      return { ghost, itemRects, hadEmptyCard, sourceTop: sourceRect.top - rootRect.top };
    }

    function playTwoBeatTaskCompletion(scene, taskId) {
      if (!scene || !scene.ghost || prefersReducedMotionMobile()) return;
      const root = document.getElementById("mainContainer");
      if (!root || typeof root.animate !== "function") return;

      const BEAT1_MS = 230;
      const FLOW_MS = 320;
      const EASE = "cubic-bezier(0.22, 1, 0.36, 1)";
      const ghost = scene.ghost;
      // Both beats move toward the task's own Completed card (never past it); with none in this
      // view, the ghost fades in place.
      const arrivalEl = Array.from(root.querySelectorAll("[data-flip-task-id]")).find(el =>
        el.getAttribute("data-flip-task-id") === taskId && el.classList.contains("completed") &&
        el.getClientRects().length > 0);
      const travel = arrivalEl
        ? arrivalEl.getBoundingClientRect().top - root.getBoundingClientRect().top - scene.sourceTop
        : 0;
      // With no other task card between the task and its Completed card (the last open task,
      // say), a fade out and back in reads as the task vanishing and reappearing; the card
      // instead stays visible and glides the whole way.
      const rootTop = root.getBoundingClientRect().top;
      const pathTop = Math.min(scene.sourceTop, scene.sourceTop + travel);
      const pathBottom = Math.max(scene.sourceTop, scene.sourceTop + travel);
      const glidesStraight = !!arrivalEl && !Array.from(root.querySelectorAll("[data-flip-task-id]")).some(el => {
        if (el === arrivalEl || el.getClientRects().length === 0) return false;
        const top = el.getBoundingClientRect().top - rootTop;
        return top >= pathTop - 1 && top < pathBottom - 1;
      });
      const ghostDrift = glidesStraight ? 0 : Math.max(-12, Math.min(12, travel));
      const arrivalOffset = glidesStraight ? -travel : Math.max(-16, Math.min(16, -travel));
      root.appendChild(ghost);

      let cleaned = false;
      const removeGhost = () => {
        if (cleaned) return;
        cleaned = true;
        if (ghost.parentNode) ghost.parentNode.removeChild(ghost);
      };

      const checkBtn = ghost.querySelector(".task-check-ring, .btn-complete-circle");
      if (checkBtn && typeof checkBtn.animate === "function") {
        checkBtn.animate(
          [
            { transform: "scale(0.78)" },
            { transform: "scale(1.14)", offset: 0.6 },
            { transform: "scale(1)" }
          ],
          { duration: 210, easing: EASE }
        );
      }
      const checkPoly = ghost.querySelector("[data-ghost-check]");
      if (checkPoly && typeof checkPoly.animate === "function") {
        checkPoly.animate(
          [{ strokeDashoffset: "24" }, { strokeDashoffset: "0" }],
          { duration: 185, easing: EASE }
        );
      }

      // Straight glide: the ghost covers Beat 1, then hands over to the Completed card,
      // which already sits under it at full opacity.
      const ghostAnim = glidesStraight
        ? ghost.animate(
          [
            { opacity: 1, transform: "translate3d(0, 0, 0) scale(1)" },
            { opacity: 1, transform: "translate3d(0, 0, 0) scale(1)" }
          ],
          { duration: BEAT1_MS }
        )
        : ghost.animate(
          [
            { opacity: 1, transform: "translate3d(0, 0, 0) scale(1)", offset: 0 },
            { opacity: 1, transform: "translate3d(0, 0, 0) scale(1)", offset: 0.48 },
            { opacity: 0, transform: `translate3d(0, ${ghostDrift}px, 0) scale(0.98)`, offset: 1 }
          ],
          { duration: 480, easing: EASE, fill: "forwards" }
        );
      if (ghostAnim && typeof ghostAnim.addEventListener === "function") {
        ghostAnim.addEventListener("finish", removeGhost);
        ghostAnim.addEventListener("cancel", removeGhost);
      }
      setTimeout(removeGhost, 540);

      if (!scene.hadEmptyCard) {
        const emptyEl = root.querySelector(".empty-card");
        if (emptyEl && typeof emptyEl.animate === "function") {
          emptyEl.animate(
            [
              { opacity: 0, transform: "translate3d(0, 8px, 0)" },
              { opacity: 1, transform: "translate3d(0, 0, 0)" }
            ],
            { delay: BEAT1_MS + 10, duration: 280, easing: EASE, fill: "backwards" }
          );
        }
      }

      root.querySelectorAll("[data-flip-task-id]").forEach(el => {
        if (typeof el.animate !== "function") return;
        const id = el.getAttribute("data-flip-task-id");
        if (!id) return;
        const isDone = el.classList.contains("completed");
        if (el === arrivalEl) {
          el.animate(
            [
              glidesStraight
                ? { opacity: 1, transform: `translate3d(0, ${arrivalOffset}px, 0)` }
                : { opacity: 0, transform: `translate3d(0, ${arrivalOffset}px, 0) scale(0.985)` },
              { opacity: 1, transform: "translate3d(0, 0, 0) scale(1)" }
            ],
            { delay: glidesStraight ? BEAT1_MS : BEAT1_MS + 15, duration: FLOW_MS, easing: EASE, fill: "backwards" }
          );
          return;
        }
        const first = scene.itemRects.get((isDone ? "done:" : "open:") + id);
        if (!first) return;
        const last = el.getBoundingClientRect();
        const dx = first.left - last.left;
        const dy = first.top - last.top;
        if (Math.abs(dx) < 1 && Math.abs(dy) < 1.5) return;
        el.animate(
          [
            { transform: `translate3d(${dx}px, ${dy}px, 0)` },
            { transform: "translate3d(0, 0, 0)" }
          ],
          { delay: BEAT1_MS, duration: FLOW_MS, easing: EASE, fill: "backwards" }
        );
      });

      root.querySelectorAll("[data-flip-key]").forEach(el => {
        if (typeof el.animate !== "function") return;
        const key = el.getAttribute("data-flip-key");
        if (!key) return;
        const first = scene.itemRects.get("flow:" + key);
        if (!first) {
          el.animate(
            [
              { opacity: 0, transform: "translate3d(0, 6px, 0)" },
              { opacity: 1, transform: "translate3d(0, 0, 0)" }
            ],
            { delay: BEAT1_MS + 10, duration: 260, easing: EASE, fill: "backwards" }
          );
          return;
        }
        const last = el.getBoundingClientRect();
        const dx = first.left - last.left;
        const dy = first.top - last.top;
        if (Math.abs(dx) < 1 && Math.abs(dy) < 1.5) return;
        el.animate(
          [
            { transform: `translate3d(${dx}px, ${dy}px, 0)` },
            { transform: "translate3d(0, 0, 0)" }
          ],
          { delay: BEAT1_MS, duration: FLOW_MS, easing: EASE, fill: "backwards" }
        );
      });
    }

    function captureTaskFlipRects() {
      const rects = new Map();
      const root = document.getElementById("mainContainer");
      if (!root) return rects;
      root.querySelectorAll("[data-flip-task-id]").forEach(el => {
        const id = el.getAttribute("data-flip-task-id");
        if (id) rects.set(id, el.getBoundingClientRect());
      });
      return rects;
    }

    function playTaskFlipGlide(firstRects, movedTaskId) {
      if (!firstRects || !firstRects.size || prefersReducedMotionMobile()) return;
      const root = document.getElementById("mainContainer");
      if (!root) return;
      root.querySelectorAll("[data-flip-task-id]").forEach(el => {
        if (typeof el.animate !== "function") return;
        const id = el.getAttribute("data-flip-task-id");
        const isMoved = id === movedTaskId;
        if (isMoved) {
          el.animate(
            [
              { opacity: 0, transform: "translate3d(0, 12px, 0) scale(0.985)" },
              { opacity: 1, transform: "translate3d(0, 0, 0) scale(1)" }
            ],
            { duration: 280, easing: "cubic-bezier(0.22, 1, 0.36, 1)" }
          );
          return;
        }
        const first = id ? firstRects.get(id) : null;
        if (!first) return;
        const last = el.getBoundingClientRect();
        const dx = first.left - last.left;
        const dy = first.top - last.top;
        if (Math.abs(dx) < 1 && Math.abs(dy) < 2) return;
        el.animate(
          [
            { transform: `translate3d(${dx}px, ${dy}px, 0)` },
            { transform: "translate3d(0, 0, 0)" }
          ],
          { duration: 280, easing: "cubic-bezier(0.22, 1, 0.36, 1)" }
        );
      });
    }

    // A double-tap on a ✓ would complete the next task too: it re-renders into
    // the same spot (no FLIP shield with reduced motion). Same rule as the
    // desktop's `e.detail > 1` guard, keyed on time because the second tap
    // lands on a freshly rendered button.
    const DOUBLE_TAP_COMPLETE_MS = 400;
    let lastDirectCompleteAt = -Infinity;

    function completeTaskDirect(taskId) {
      // A Count Habit's day is counted, not ticked: every "complete" path adds one (shared +1 rule).
      const countTask = state.tasks.find(x => x.id === taskId);
      if (countTask && countHabitOfTask(countTask)) {
        logHabitCount(countTask.habitId, countTask.scheduledDate || toLocalDateKey(), "+1");
        return;
      }
      const tapAt = Date.now();
      if (tapAt - lastDirectCompleteAt < DOUBLE_TAP_COMPLETE_MS) return;
      lastDirectCompleteAt = tapAt;
      closeSheet();
      if (state.activeFocus && state.activeFocus.activeTaskId === taskId) {
        completeActiveTaskAndNext();
        return;
      }
      playCompleteSound();
      const twoBeatScene = captureTwoBeatTaskScene(taskId);
      const now = Date.now();
      const t = state.tasks.find(x => x.id === taskId);
      if (!t) return;
      const prev = { status: t.status, completedAt: t.completedAt };
      Object.assign(t, HuntCore.completeTaskRow(t, now));
      justCompletedTaskId = taskId;
      commitLocalChange();
      if (twoBeatScene) playTwoBeatTaskCompletion(twoBeatScene, taskId);
      // Undo is a new edit (newer updatedAt), so it also wins if the completion already synced.
      showToast("Completed · " + shortTitle(t.title), { undo: () => undoCompleteTask(taskId, now, prev) });
    }

    function undoCompleteTask(taskId, completedAt, prev) {
      const t = state.tasks.find(x => x.id === taskId);
      if (!t || t.status !== "completed" || t.completedAt !== completedAt) return; // changed since
      const firstRects = captureTaskFlipRects();
      t.status = prev.status && prev.status !== "completed" ? prev.status : "queued";
      if (prev.completedAt === undefined || prev.completedAt === null) delete t.completedAt;
      else t.completedAt = prev.completedAt;
      t.updatedAt = nextStamp(t);
      commitLocalChange();
      playTaskFlipGlide(firstRects, taskId);
    }

    function reopenTaskDirect(taskId) {
      const countTask = state.tasks.find(x => x.id === taskId);
      if (countTask && countHabitOfTask(countTask)) {
        // A Count Habit's day is reopened by clearing its total.
        logHabitCount(countTask.habitId, countTask.scheduledDate || toLocalDateKey(), 0);
        return;
      }
      playClickSound();
      const firstRects = captureTaskFlipRects();
      const now = Date.now();
      const t = state.tasks.find(x => x.id === taskId);
      if (!t) return;
      t.status = "queued";
      t.completedAt = undefined;
      t.updatedAt = nextStamp(t, now);
      commitLocalChange();
      playTaskFlipGlide(firstRects, taskId);
    }

    // Only the moved task changes (rank above the current top): a reorder never overrides edits or
    // completions the laptop made to other tasks.
    function promoteTaskToTop(taskId) {
      closeSheet();
      playClickSound();
      const todayKey = toLocalDateKey();
      const pending = state.tasks.filter(t => isOpenTask(t, todayKey)).sort(compareRank);
      const idx = pending.findIndex(t => t.id === taskId);
      if (idx <= 0) return;
      const moved = pending[idx];
      moved.rank = (Number(pending[0].rank) || 0) - 1000;
      moved.updatedAt = nextStamp(moved);
      commitLocalChange();
    }

    // Deletes write the tombstone immediately; Undo restores the exact previous objects and removes the
    // tombstone through the normal commit path (the hold keeps the tombstone on the phone meanwhile).
    function deleteTaskItem(taskId) {
      closeSheet();
      playClickSound();
      const task = state.tasks.find(t => t.id === taskId);
      if (!task) return;
      const deletedAt = Date.now();
      const removed = cloneJson(task);
      const prevFocus = cloneJson(state.activeFocus);
      const hadTombstone = asArray(state.deletedTaskIds).includes(taskId);
      if (!state.deletedTaskIds) state.deletedTaskIds = [];
      if (!hadTombstone) state.deletedTaskIds.push(taskId);
      state.tasks = state.tasks.filter(t => t.id !== taskId);
      let focusAfter = null;
      if (state.activeFocus && state.activeFocus.activeTaskId === taskId) {
        state.activeFocus = emptyFocus(nextStamp(state.activeFocus, deletedAt));
        focusAfter = JSON.stringify(state.activeFocus);
      }
      commitLocalChange();
      showToast("Deleted · " + shortTitle(removed.title), {
        holdSync: !hadTombstone,
        undo: () => undoDeleteTask(removed, hadTombstone, prevFocus, focusAfter, deletedAt)
      });
    }

    // Restores the task. If focus is still where the delete left it, its running session comes back
    // too. If focus moved on meanwhile, the task returns to the queue (R6 stamp) and the session it was
    // running in is logged up to the delete time (R3 id + dedupe), so that time is not lost.
    // A row restored by Undo must not point at a Quest deleted since: unlink it,
    // as deleting that Quest did to its other rows (a new edit, R6).
    function unlinkDeletedQuest(row) {
      if (row && row.questId && asArray(state.deletedQuestIds).includes(row.questId)) {
        row.questId = null;
        row.updatedAt = nextStamp(row);
      }
    }

    function undoDeleteTask(removed, hadTombstone, prevFocus, focusAfter, deletedAt) {
      if (state.tasks.some(t => t.id === removed.id)) return;
      if (!hadTombstone) state.deletedTaskIds = asArray(state.deletedTaskIds).filter(id => id !== removed.id);
      unlinkDeletedQuest(removed);
      state.tasks.push(removed);
      if (focusAfter && JSON.stringify(state.activeFocus) === focusAfter) {
        // a new edit (R6): it also wins if the cleared focus already synced
        state.activeFocus = { ...prevFocus, updatedAt: nextStamp(state.activeFocus) };
      } else {
        const now = Date.now();
        if (focusAfter && isRunningSession(prevFocus) && prevFocus.activeTaskId === removed.id) {
          flushActiveBurst(Number.isFinite(deletedAt) ? deletedAt : now, prevFocus);
          state.timeLogs.sort((a, b) => (b.startTime || 0) - (a.startTime || 0));
        }
        const cur = state.activeFocus;
        if (removed.status === "active" && !(cur && cur.activeTaskId === removed.id)) {
          removed.status = "queued";
          removed.updatedAt = nextStamp(removed, now);
        }
      }
      state.tasks.sort(compareRank);
      commitLocalChange();
    }

    function deleteLogItem(logId) {
      playClickSound();
      const log = state.timeLogs.find(l => l.id === logId);
      if (!log) return;
      const removed = cloneJson(log);
      const hadTombstone = asArray(state.deletedLogIds).includes(logId);
      if (!state.deletedLogIds) state.deletedLogIds = [];
      if (!hadTombstone) state.deletedLogIds.push(logId);
      state.timeLogs = state.timeLogs.filter(l => l.id !== logId);
      commitLocalChange();
      showToast("Session deleted · " + shortTitle(removed.taskTitleSnapshot), {
        holdSync: !hadTombstone,
        undo: () => undoDeleteLog(removed, hadTombstone)
      });
    }

    function undoDeleteLog(removed, hadTombstone) {
      if (state.timeLogs.some(l => l.id === removed.id)) return;
      if (!hadTombstone) state.deletedLogIds = asArray(state.deletedLogIds).filter(id => id !== removed.id);
      state.timeLogs.push(removed);
      state.timeLogs.sort((a, b) => (b.startTime || 0) - (a.startTime || 0));
      commitLocalChange();
    }

    // =========================================================================
    // SLIDE-UP BOTTOM SHEETS (New Task Composer, Task Inspector, Quest Editor)
    // =========================================================================
    function isSheetOpen() {
      const sc = document.getElementById("sheetContainer");
      return !!sc && sc.style.display !== "none" && sc.style.display !== "";
    }

    // Closing DISCARDS the sheet's DOM, so the next sheet never reads a previous form's stale inputs
    // (Edit Quest showing/saving another quest's values, New Task re-opening with the last task).
    // discardDraft: the × button of New Task drops the unsent text; Back / backdrop keep it as a draft.
    // Typed text is never dropped silently: New Quest / Edit Quest dismissed with changes (Back,
    // backdrop, Escape, ×) and New Task closed with × while it has text show a toast whose Restore
    // brings the sheet back as it was. Saving, creating or deleting clears the form first (no toast).
    let sheetLockedScrollY = 0;
    let sheetScrollIsLocked = false;

    function lockBackgroundScroll() {
      if (sheetScrollIsLocked || !document.body) return;
      sheetLockedScrollY = window.scrollY || document.documentElement.scrollTop || 0;
      sheetScrollIsLocked = true;
      document.body.style.position = "fixed";
      document.body.style.top = (-sheetLockedScrollY) + "px";
      document.body.style.left = "0";
      document.body.style.right = "0";
      document.body.style.width = "100%";
    }

    function unlockBackgroundScroll() {
      if (!sheetScrollIsLocked || !document.body) return;
      const restoreY = sheetLockedScrollY;
      sheetScrollIsLocked = false;
      sheetLockedScrollY = 0;
      document.body.style.position = "";
      document.body.style.top = "";
      document.body.style.left = "";
      document.body.style.right = "";
      document.body.style.width = "";
      if (restoreY > 0) {
        try { window.scrollTo(0, restoreY); } catch (e) {}
      }
    }

    function clearSheetExitLayer() {
      const prev = document.getElementById("sheetExitLayer");
      if (prev && prev.parentNode) prev.parentNode.removeChild(prev);
    }

    // Plays a non-blocking GPU fade-out so closing/submitting a floating sheet dissolves smoothly
    // in place without racing the dismissing keyboard, while keeping #sheetContainer cleanup 100 % synchronous.
    // Snapshot of the live sheet's box and scroll offset, taken by closeSheet() before it blurs the field
    // and drops .sheet-typing (which would change the sheet's max-height and position).
    function snapshotSheetGeometry(sc) {
      const sheet = sc && sc.querySelector(".bottom-sheet");
      if (!sheet) return null;
      const r = sheet.getBoundingClientRect();
      return { left: r.left, top: r.top, width: r.width, height: r.height, scrollTop: sheet.scrollTop };
    }

    function playSheetExitGlide(sc, geo) {
      if (!sc || !isSheetOpen() || typeof sc.animate !== "function" || prefersReducedMotionMobile()) return;
      const sheet = sc.querySelector(".bottom-sheet");
      if (!sheet) return;
      geo = geo || snapshotSheetGeometry(sc);
      clearSheetExitLayer();
      const layer = document.createElement("div");
      layer.id = "sheetExitLayer";
      layer.setAttribute("aria-hidden", "true");
      layer.style.cssText = "position:fixed;inset:0;z-index:59;pointer-events:none;background:rgb(var(--p-scrim) / 0.76);";
      const clone = sheet.cloneNode(true);
      clone.classList.remove("entering");
      clone.removeAttribute("role");
      clone.removeAttribute("aria-modal");
      clone.removeAttribute("aria-labelledby");
      clone.querySelectorAll("[id],[onclick],[oninput],[onchange],[onkeydown]").forEach(node => {
        node.removeAttribute("id");
        node.removeAttribute("onclick");
        node.removeAttribute("oninput");
        node.removeAttribute("onchange");
        node.removeAttribute("onkeydown");
      });
      clone.style.pointerEvents = "none";
      // The ghost sits exactly where the live sheet was, at the same size and scroll offset.
      clone.style.position = "fixed";
      clone.style.left = geo.left + "px";
      clone.style.top = geo.top + "px";
      clone.style.width = geo.width + "px";
      clone.style.height = geo.height + "px";
      clone.style.maxWidth = "none";
      clone.style.maxHeight = "none";
      clone.style.margin = "0";
      layer.appendChild(clone);
      document.body.appendChild(layer);
      clone.scrollTop = geo.scrollTop;

      let done = false;
      const cleanup = () => {
        if (done) return;
        done = true;
        if (layer.parentNode) layer.parentNode.removeChild(layer);
      };
      const bgAnim = layer.animate([{ opacity: 1 }, { opacity: 0 }], {
        duration: 150,
        easing: "cubic-bezier(0.22, 1, 0.36, 1)",
        fill: "forwards"
      });
      if (typeof clone.animate === "function") {
        clone.animate(
          [
            { opacity: 1, transform: "translate3d(0, 0, 0) scale(1)" },
            { opacity: 0, transform: "translate3d(0, -6px, 0) scale(0.985)" }
          ],
          { duration: 150, easing: "cubic-bezier(0.22, 1, 0.36, 1)", fill: "forwards" }
        );
      }
      if (bgAnim && typeof bgAnim.addEventListener === "function") {
        bgAnim.addEventListener("finish", cleanup);
        bgAnim.addEventListener("cancel", cleanup);
      }
      setTimeout(cleanup, 190);
    }

    function closeSheet(discardDraft) {
      const sc = document.getElementById("sheetContainer");
      if (!sc) return;
      const exitGeo = snapshotSheetGeometry(sc); // before the blur / class changes below move the sheet
      // Blur first so a pending onchange (Task Options title / notes) commits before the sheet goes away.
      const el = document.activeElement;
      if (el && el !== document.body && sc.contains(el) && typeof el.blur === "function") el.blur();
      if (document.body) {
        document.body.classList.remove("keyboard-typing");
        document.body.classList.remove("sheet-typing");
      }
      let restore = discardedQuestForm();
      if (sc.dataset.sheet === "newTask") {
        captureComposerDraft();
        if (discardDraft === true && composerDraft) {
          restore = draftRestoreOffer(composerDraft, composerDateKey);
          composerDraft = null;
        }
        storeComposerDraft();
      }
      playSheetExitGlide(sc, exitGeo);
      sc.style.display = "none";
      sc.innerHTML = "";
      delete sc.dataset.sheet;
      ["topHeader", "apkPairBannerHost", "mainContainer", "fabBtn", "bottomNav"].forEach(id => {
        const bgEl = document.getElementById(id);
        if (bgEl) bgEl.removeAttribute("inert");
      });
      if (document.body) document.body.classList.remove("sheet-open");
      unlockBackgroundScroll();
      const opener = sheetOpener;
      sheetOpener = null;
      if (opener) {
        const back = opener.el.isConnected ? opener.el : findByFocusKey(document, opener.key);
        if (back && !back.closest("[inert]")) focusQuietly(back);
      }
      if (restore) showToast(restore.message, { actionLabel: "Restore", undo: restore.undo });
    }

    // Focus that survives a re-render: renderApp replaces the view's markup, so a focused control is
    // found again by its id, or else by its onclick (which names its own task, quest, habit or tab).
    // Text fields are left out: renderAppSafely already waits for their blur.
    function focusKeyOf(el) {
      if (!el || el === document.body || typeof el.getAttribute !== "function" || isTextEntry(el)) return null;
      const id = el.id || "";
      const onclick = el.getAttribute("onclick") || "";
      return id || onclick ? { id, onclick } : null;
    }

    function findByFocusKey(root, key) {
      if (!key) return null;
      if (key.id) {
        const byId = document.getElementById(key.id);
        if (byId) return byId;
      }
      if (!key.onclick) return null;
      for (const el of root.querySelectorAll("[onclick]")) {
        if (el.getAttribute("onclick") === key.onclick) return el;
      }
      return null;
    }

    function focusQuietly(el) {
      try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); }
    }

    // The control that opened the sheet (TalkBack / keyboard focus goes back to it on close).
    let sheetOpener = null;

    // Opens (or swaps) the sheet. Only a sheet that was closed glides up; swapping content in an open
    // sheet does not replay the animation.
    function showSheet(kind, innerHtml) {
      const sc = document.getElementById("sheetContainer");
      if (!sc) return null;
      clearSheetExitLayer();
      const wasOpen = isSheetOpen();
      if (wasOpen && sc.dataset.sheet === "newTask" && kind !== "newTask") {
        captureComposerDraft();
        storeComposerDraft();
      }
      if (!wasOpen) {
        const opener = document.activeElement;
        sheetOpener = opener && opener !== document.body && !sc.contains(opener)
          ? { el: opener, key: focusKeyOf(opener) }
          : null;
      }
      lockBackgroundScroll();
      sc.dataset.sheet = kind;
      sc.style.display = "flex";
      sc.innerHTML = `<div class="sheet-kb-lift"><div class="bottom-sheet${wasOpen ? "" : " entering"}" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">${innerHtml}</div></div>`;
      const sheetEl = sc.querySelector(".bottom-sheet.entering");
      if (sheetEl) {
        sheetEl.addEventListener("animationend", () => sheetEl.classList.remove("entering"), { once: true });
      }
      ["topHeader", "apkPairBannerHost", "mainContainer", "fabBtn", "bottomNav"].forEach(id => {
        const bgEl = document.getElementById(id);
        if (bgEl) bgEl.setAttribute("inert", "");
      });
      if (document.body) document.body.classList.add("sheet-open");
      // Focus belongs inside the dialog; a form sheet then moves it on to its first field (focusFieldSoon).
      const closeBtn = sc.querySelector(".sheet-close");
      if (closeBtn && !sc.contains(document.activeElement)) focusQuietly(closeBtn);
      return sc;
    }

    // Shown at boot when the saved state couldn't be used. Never silent: the app would otherwise look empty.
    function openLoadRecoverySheet() {
      const blocked = persistBlocked;
      const text = blocked
        ? "Hunt couldn't read the data saved on this phone, and there wasn't room to keep a backup copy. Nothing will be written over it until you choose. Changes you make now are not saved yet."
        : "Hunt couldn't read the data saved on this phone, so it started empty. A copy of the unreadable data was kept on the phone.";
      showSheet("loadRecovery", `
          ${sheetHeaderHtml("Saved data couldn't be loaded")}
          <p style="margin:0 0 10px;font-size:14px;line-height:1.5;color:var(--text-2);">${text}</p>
          <p style="margin:0 0 16px;font-size:14px;line-height:1.5;color:var(--text-2);">Syncing with your laptop brings back everything it has.</p>
          <div class="sheet-footer-row">
            ${blocked ? `<button class="danger-outline-btn" onclick="allowSavingAfterLoadFailure()">Save over it</button>` : "<span></span>"}
            <button class="pressable" onclick="closeSheet();openSyncSheet();" style="min-height:var(--touch-min);padding:0 18px;border-radius:13px;border:none;background:var(--cyan);color:rgb(var(--c-on-accent));font-family:var(--font-display);font-weight:700;font-size:14px;cursor:pointer;">Sync from laptop</button>
          </div>
      `);
    }

    function allowSavingAfterLoadFailure() {
      persistBlocked = false;
      recordMobileBreadcrumb("WARN", "storage", "persist_unblocked", {});
      closeSheet();
      persistState();
      drainPendingTicksAndRender(); // widget ticks waited, untouched, while saving was blocked
      showToast("Changes on this phone are saved again");
    }

    // discardDraftOnClose: × of the New Task sheet drops the unsent text (closeSheet(true)).
    function sheetHeaderHtml(title, discardDraftOnClose) {
      const closeArg = discardDraftOnClose ? "true" : "";
      return `
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="sheet-head">
          <h3 id="sheetTitle" class="sheet-title">${title}</h3>
          <button class="sheet-close" onclick="closeSheet(${closeArg})" aria-label="Close">×</button>
        </div>`;
    }

    // Pill groups update in place (no re-render: the sheet stays put and the keyboard stays open).
    function selectPill(btn) {
      if (!btn || !btn.parentElement) return;
      btn.parentElement.querySelectorAll(".sheet-pill").forEach(b => {
        const on = b === btn;
        b.classList.toggle("selected", on);
        b.setAttribute("aria-pressed", on ? "true" : "false");
      });
    }

    // Forms submit on Enter in a one-line field, and on Ctrl/Cmd+Enter in a textarea (Enter adds a line).
    function isSubmitKey(event) {
      if (!event || event.key !== "Enter" || event.isComposing) return false;
      if (event.target && event.target.tagName === "TEXTAREA" && !(event.ctrlKey || event.metaKey)) return false;
      event.preventDefault();
      return true;
    }

    function focusFieldSoon(id) {
      // Focus synchronously inside the tap gesture with preventScroll so Android starts the IME
      // on the exact same frame as the sheet entrance instead of shifting the sheet 60ms later.
      const inp = document.getElementById(id);
      if (inp) {
        try { inp.focus({ preventScroll: true }); } catch (e) { inp.focus(); }
        return;
      }
      setTimeout(() => {
        const el = document.getElementById(id);
        if (el) {
          try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); }
        }
      }, 16);
    }

    // Unsent New Task text survives an accidental dismiss; submitting clears it, × too (with Restore in
    // its toast). It also survives Android killing the app in the background: onAppHidden() saves it
    // under a device-local key (never part of the synced state) and the next launch shows it again in
    // the next New Task sheet.
    const COMPOSER_DRAFT_KEY = "hunt-composer-draft-v1";
    let storedComposerDraftJson = null; // what COMPOSER_DRAFT_KEY holds ("" = nothing); skips redundant writes
    let composerDraft = loadComposerDraft();

    function loadComposerDraft() {
      try {
        const raw = localStorage.getItem(COMPOSER_DRAFT_KEY);
        storedComposerDraftJson = raw || "";
        const d = raw ? JSON.parse(raw) : null;
        if (d && typeof d.title === "string" && typeof d.notes === "string" && (d.title.trim() || d.notes.trim())) {
          return { title: d.title, notes: d.notes };
        }
      } catch (e) {}
      return null;
    }

    // Mirrors composerDraft into localStorage (removes the key when there is no draft).
    function storeComposerDraft() {
      const json = composerDraft ? JSON.stringify({ title: composerDraft.title, notes: composerDraft.notes }) : "";
      if (json === storedComposerDraftJson) return;
      try {
        if (json) localStorage.setItem(COMPOSER_DRAFT_KEY, json);
        else localStorage.removeItem(COMPOSER_DRAFT_KEY);
        storedComposerDraftJson = json;
      } catch (e) {}
    }

    function captureComposerDraft() {
      const t = document.getElementById("sheetTaskTitle");
      const n = document.getElementById("sheetTaskNotes");
      const title = t ? t.value : "";
      const notes = n ? n.value : "";
      composerDraft = title.trim() || notes.trim() ? { title, notes } : null;
    }

    function draftRestoreOffer(draft, dateKey) {
      return { message: "Draft discarded", undo: () => restoreComposerDraft(draft, dateKey) };
    }

    // Restore of a New Task draft dropped with ×: the sheet comes back with it. A different draft kept
    // meanwhile (Back / backdrop) is offered back in turn, so neither is lost silently.
    function restoreComposerDraft(draft, dateKey) {
      if (isSheetOpen()) closeSheet(); // the sheet open now is dismissed the usual way
      const replaced = composerDraft;
      const replacedDateKey = composerDateKey;
      composerDraft = draft;
      composerDateKey = dateKey;
      storeComposerDraft();
      renderNewTaskSheet();
      focusFieldSoon("sheetTaskTitle");
      if (replaced && (replaced.title !== draft.title || replaced.notes !== draft.notes)) {
        const offer = draftRestoreOffer(replaced, replacedDateKey);
        showToast(offer.message, { actionLabel: "Restore", undo: offer.undo });
      }
    }

    // Default composer quest: the remembered choice if it is still active, "Other" (null) if chosen,
    // otherwise the first active quest (never a hardcoded, completed or deleted id).
    function resolveComposerQuestId(questId) {
      if (questId === null) return null;
      const active = activeQuestsList();
      if (questId !== undefined && active.some(q => q.id === questId)) return questId;
      return active.length ? active[0].id : null;
    }

    // composerQuestId holds the user's explicit choice only (undefined = none yet, null = "Other work");
    // the effective quest is resolved at render/submit, so opening the composer before any quest
    // existed does not pin later tasks to "Other work".
    function openNewTaskSheet(preselectedQuestId, preselectedDateKey) {
      playClickSound();
      if (preselectedQuestId !== undefined) composerQuestId = preselectedQuestId;
      composerDateKey = preselectedDateKey || (activeView === "plan" ? selectedPlanDateKey : toLocalDateKey());
      renderNewTaskSheet();
      focusFieldSoon("sheetTaskTitle");
    }

    // Rendered once per open (fresh inputs, or the unsent draft); pills then update in place.
    function renderNewTaskSheet() {
      const shownQuestId = resolveComposerQuestId(composerQuestId); // a sync may have removed the chosen quest
      const todayKey = toLocalDateKey();
      const tomorrowKey = dayKeyOffset(1);
      const draft = composerDraft || { title: "", notes: "" };
      const otherDay = composerDateKey !== todayKey && composerDateKey !== tomorrowKey;

      showSheet("newTask", `
          ${sheetHeaderHtml("New Task", true)}

          <input id="sheetTaskTitle" class="sheet-input" placeholder="What moves the needle?" value="${escapeHtml(draft.title)}" enterkeyhint="done" aria-label="Task title" onkeydown="if(event.key==='Enter') submitNewTaskFromSheet(true)" />
          <textarea id="sheetTaskNotes" class="sheet-input" maxlength="20000" rows="2" placeholder="Optional description / session notes..." aria-label="Notes" onkeydown="if(isSubmitKey(event)) submitNewTaskFromSheet(true)">${escapeHtml(draft.notes)}</textarea>

          <div class="sheet-label">Quest</div>
          <div class="sheet-pill-group" role="group" aria-label="Quest">
            ${activeQuestsList().map(q => `
              <button class="sheet-pill ${shownQuestId === q.id ? 'selected' : ''}" aria-pressed="${shownQuestId === q.id}" onclick="composerQuestId=${jsArg(q.id)};selectPill(this);">
                <span style="width:8px;height:8px;border-radius:50%;background:${ACCENT_HEX[q.accentColor] || ACCENT_HEX.slate};"></span>
                <span>${escapeHtml(q.title)}</span>
              </button>
            `).join("")}
            <button class="sheet-pill ${shownQuestId === null ? 'selected' : ''}" aria-pressed="${shownQuestId === null}" onclick="composerQuestId=null;selectPill(this);">
              <span style="width:8px;height:8px;border-radius:50%;background:var(--slate);"></span>
              <span>Other work</span>
            </button>
          </div>

          <div class="sheet-label">Schedule</div>
          <div class="sheet-pill-group" role="group" aria-label="Schedule">
            <button class="sheet-pill ${composerDateKey === todayKey ? 'selected' : ''}" aria-pressed="${composerDateKey === todayKey}" onclick="composerDateKey=${jsArg(todayKey)};selectPill(this);">Today</button>
            <button class="sheet-pill ${composerDateKey === tomorrowKey ? 'selected' : ''}" aria-pressed="${composerDateKey === tomorrowKey}" onclick="composerDateKey=${jsArg(tomorrowKey)};selectPill(this);">Tomorrow</button>
            ${otherDay ? `<button class="sheet-pill selected" aria-pressed="true" onclick="composerDateKey=${jsArg(composerDateKey)};selectPill(this);">${escapeHtml(dateKeyLabel(composerDateKey))}</button>` : ""}
          </div>

          <div class="sheet-actions">
            <button class="pressable" onclick="submitNewTaskFromSheet(true)" style="height:var(--touch-min);border-radius:13px;border:none;background:var(--cyan);color:rgb(var(--c-on-accent));font-family:var(--font-display);font-weight:700;font-size:14px;cursor:pointer;">
              ↑ Add to Top (#1)
            </button>
            <button class="pressable" onclick="submitNewTaskFromSheet(false)" style="height:var(--touch-min);border-radius:13px;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--white);font-family:var(--font-display);font-weight:600;font-size:14px;cursor:pointer;">
              ↓ Add to Bottom
            </button>
          </div>
      `);
    }

    // "Thu, Nov 20" for a YYYY-MM-DD key (local date).
    function dateKeyLabel(dateKey) {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateKey || "");
      if (!m) return dateKey || "";
      const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
      return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
    }

    // Empty / invalid required field: focus it and outline it in rose until the user types again.
    function flagInvalidField(el) {
      if (!el) return;
      el.focus();
      el.style.borderColor = "var(--rose)";
      el.setAttribute("aria-invalid", "true");
      el.addEventListener("input", () => {
        el.style.borderColor = "";
        el.removeAttribute("aria-invalid");
      }, { once: true });
    }

    function submitNewTaskFromSheet(promoteToTop) {
      const titleEl = document.getElementById("sheetTaskTitle");
      const notesEl = document.getElementById("sheetTaskNotes");
      if (!titleEl || !titleEl.value.trim()) {
        flagInvalidField(titleEl);
        return;
      }
      playClickSound();
      const now = Date.now();
      const todayKey = toLocalDateKey(now);
      const pending = state.tasks.filter(t => isOpenTask(t, todayKey)).sort(compareRank);
      let rank = 1000;
      if (pending.length > 0) {
        // Add to top: just above the current #1 (only the new task is written; no rank collapse).
        rank = promoteToTop ? (Number(pending[0].rank) || 0) - 1000 : pending[pending.length - 1].rank + 1000;
      }
      const scheduledDate = composerDateKey || toLocalDateKey(now);
      const newTaskId = "tsk-" + now + "-" + Math.random().toString(36).slice(2, 6);
      const firstRects = captureTaskFlipRects();
      state.tasks.push({
        id: newTaskId,
