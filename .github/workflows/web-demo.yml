name: Web demo

# The static browser demo (ADR-0010): built and smoke-tested on every push to any branch
# and on pull requests. Release tags attach hunt-web-demo.zip in release.yml instead.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-demo:
    name: Build & smoke-test the browser demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # playwright.webdemo.config.ts runs `npm run build:web` (out/, base path /demos/hunt)
      # and serves it behind an iframe host page on port 4174.
      - name: Build and smoke-test the demo
        run: npm run test:web-demo

      - name: Report the demo's size
        run: node scripts/build-web-demo.mjs --no-build

      - name: Upload the static folder
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hunt-web-demo
          path: out/
          retention-days: 7

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-web
          path: |
            playwright-report-web/
            test-results/
          retention-days: 7
