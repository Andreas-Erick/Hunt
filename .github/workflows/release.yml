name: Release Desktop & Android Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.5.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify:
    name: Verify Suite & Typecheck
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite
        run: npm test

      - name: TypeScript typecheck
        run: npx tsc --noEmit

  build-android:
    name: Build Android APK
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Ensure Android build-tools & platform SDK
        shell: bash
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          (yes || true) | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            "build-tools;36.0.0" \
            "platforms;android-36" > /dev/null

      - name: Prepare signing keystore (optional release override)
        id: sign
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "keystore=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
            echo "cert_pin=skip" >> "$GITHUB_OUTPUT"
          else
            echo "keystore=android-app/keystore/hunt-debug.keystore" >> "$GITHUB_OUTPUT"
            echo "cert_pin=0d15a3169448449637e71bba9e5e22ed4bd951f78970de42d06fad8def1d111d" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & verify signed APK
        shell: bash
        env:
          BUILD_TOOLS_VERSION: "36.0.0"
          PLATFORM: "android-36"
          KEYSTORE: ${{ steps.sign.outputs.keystore }}
          EXPECTED_CERT_SHA256: ${{ steps.sign.outputs.cert_pin }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS || 'android' }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS || 'android' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'androiddebugkey' }}
        run: |
          mkdir -p dist/release
          bash android-app/build-apk.sh "./android-app" "./dist/release/Hunt-Mobile-${{ needs.verify.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/release/Hunt-Mobile-${{ needs.verify.outputs.version }}.apk

  build-desktop:
    name: Build Windows Desktop Installer & Portable Zip
    needs: [verify, build-android]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Download freshly built Android APK into public/
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist/apk

      - name: Copy APK into public/Hunt-Mobile.apk for desktop Phone & Sync download
        shell: pwsh
        run: |
          Copy-Item -Force "dist/apk/Hunt-Mobile-${{ needs.verify.outputs.version }}.apk" "public/Hunt-Mobile.apk"

      - name: Install dependencies
        run: npm ci

      - name: Build standalone Next.js desktop bundle
        shell: pwsh
        env:
          HUNT_STANDALONE: "1"
        run: npm run build

      - name: Stage self-contained Hunt Desktop directory (with bundled node.exe)
        shell: pwsh
        run: |
          $stage = "dist\desktop-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          New-Item -ItemType Directory -Force -Path "dist\release" | Out-Null

          Copy-Item -Recurse -Force ".next\standalone\*" $stage
          New-Item -ItemType Directory -Force -Path "$stage\.next\static" | Out-Null
          Copy-Item -Recurse -Force ".next\static\*" "$stage\.next\static"
          Copy-Item -Recurse -Force "public" "$stage\public"

          # Bundle Node.js runtime so end users do not need Node.js installed.
          $nodeExe = (Get-Command node).Source
          Copy-Item -Force $nodeExe "$stage\node.exe"

          # Copy desktop launchers and icon.
          Copy-Item -Force "Start-Hunt.bat","Start-Server.bat","Launch-Hunt.vbs","HUNT.ico" $stage

      - name: Build portable Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\desktop-stage\*" -DestinationPath "dist\release\Hunt-Desktop-Windows-${{ needs.verify.outputs.version }}.zip" -Force

      - name: Build Inno Setup Windows Installer (.exe)
        shell: pwsh
        run: |
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          & $iscc `
            "/DAppVersion=${{ needs.verify.outputs.version }}" `
            "/DStageDir=$(Resolve-Path dist\desktop-stage)" `
            "/DOutputDir=$(Resolve-Path dist\release)" `
            "installer\hunt-desktop.iss"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            dist/release/Hunt-Desktop-Setup-${{ needs.verify.outputs.version }}.exe
            dist/release/Hunt-Desktop-Windows-${{ needs.verify.outputs.version }}.zip

  publish-release:
    name: Publish GitHub Release
    needs: [verify, build-android, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: release-assets

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ needs.verify.outputs.tag }}"
          VERSION="${{ needs.verify.outputs.version }}"
          printf '%s\n' \
            "### Installers" \
            "- **Windows Desktop Installer:** \`Hunt-Desktop-Setup-${VERSION}.exe\` (bundles Node.js runtime + Start Menu/Desktop shortcuts)" \
            "- **Windows Portable Bundle:** \`Hunt-Desktop-Windows-${VERSION}.zip\`" \
            "- **Android Companion APK:** \`Hunt-Mobile-${VERSION}.apk\` (installs in-place without wiping data)" \
            "- **Checksums:** \`SHA256SUMS.txt\`" \
            > release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "Hunt ${TAG}" \
              --notes-file release-notes.md
          fi
