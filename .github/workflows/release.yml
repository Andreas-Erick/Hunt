name: Release Desktop & Android Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.5.2)"
        required: true
        type: string

# Read-only by default; only publish-release gets write access (it creates the Release).
permissions:
  contents: read

# Two runs for one tag would race on `gh release create`; queue the second instead.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Suite & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      # A manual dispatch builds the tag it names, never the dispatching branch HEAD.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Resolve release version
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify the release tag exists and is the checked-out source
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if ! TAG_COMMIT=$(git rev-parse --verify --quiet "refs/tags/${TAG}^{commit}"); then
            echo "::error::Tag ${TAG} does not exist. Push the tag before running a release."
            exit 1
          fi
          HEAD_COMMIT=$(git rev-parse HEAD)
          if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
            echo "::error::Checked-out commit ${HEAD_COMMIT} is not tag ${TAG} (${TAG_COMMIT})."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify package.json and AndroidManifest versions match the tag
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          MANIFEST_VERSION=$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' android-app/app/src/main/AndroidManifest.xml | head -n 1)
          STATUS=0
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::package.json version ${PKG_VERSION} does not match release version ${VERSION}."
            STATUS=1
          fi
          if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
            echo "::error::AndroidManifest versionName ${MANIFEST_VERSION:-<missing>} does not match release version ${VERSION}."
            STATUS=1
          fi
          exit "$STATUS"

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite
        run: npm test

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

  build-android:
    name: Build Android APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.verify.outputs.tag }}

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      # Same build-tools/platform as build-apk.sh's defaults (the local pipeline).
      - name: Ensure Android build-tools & platform SDK
        shell: bash
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          (yes || true) | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            "build-tools;36.1.0" \
            "platforms;android-36.1" > /dev/null

      - name: Prepare signing keystore (from repository secret)
        id: sign
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # The keystore is not tracked in git. It must come from the secret and
          # must be the SAME key the phone app was installed with: a different
          # certificate forces an uninstall, which wipes on-phone data.
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set (base64 of android-app/keystore/hunt-debug.keystore)"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "keystore=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
          echo "cert_pin=0d15a3169448449637e71bba9e5e22ed4bd951f78970de42d06fad8def1d111d" >> "$GITHUB_OUTPUT"

      - name: Build & verify signed APK
        shell: bash
        env:
          KEYSTORE: ${{ steps.sign.outputs.keystore }}
          EXPECTED_CERT_SHA256: ${{ steps.sign.outputs.cert_pin }}
          # The pinned key is a PKCS12 debug keystore whose store/key password is "android".
          # Secrets override these if the key is ever rotated. A wrong password fails signing,
          # and a wrong key fails build-apk.sh's cert pin, so neither can ship silently.
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS || 'android' }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS || 'android' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'androiddebugkey' }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir -p dist/release
          bash android-app/build-apk.sh "./android-app" "./dist/release/Hunt-Mobile-${VERSION}.apk"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: dist/release/Hunt-Mobile-${{ needs.verify.outputs.version }}.apk

  build-desktop:
    name: Build Windows Desktop Installer & Portable Zip
    needs: [verify, build-android]
    runs-on: windows-latest
    timeout-minutes: 30
    # Tag-derived values reach scripts through env, never pasted into the script text.
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.verify.outputs.tag }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Download freshly built Android APK into public/
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-apk
          path: dist/apk

      - name: Copy APK into public/Hunt-Mobile.apk for desktop Phone & Sync download
        shell: pwsh
        run: |
          Copy-Item -Force "dist/apk/Hunt-Mobile-$env:VERSION.apk" "public/Hunt-Mobile.apk"

      - name: Install dependencies
        run: npm ci

      - name: Build standalone Next.js desktop bundle
        shell: pwsh
        env:
          HUNT_STANDALONE: "1"
        run: npm run build

      - name: Stage self-contained Hunt Desktop directory (with bundled node.exe)
        shell: pwsh
        run: |
          $stage = "dist\desktop-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          New-Item -ItemType Directory -Force -Path "dist\release" | Out-Null

          Copy-Item -Recurse -Force ".next\standalone\*" $stage
          New-Item -ItemType Directory -Force -Path "$stage\.next\static" | Out-Null
          Copy-Item -Recurse -Force ".next\static\*" "$stage\.next\static"
          Copy-Item -Recurse -Force "public" "$stage\public"

          # Bundle Node.js runtime so end users do not need Node.js installed.
          $nodeExe = (Get-Command node).Source
          Copy-Item -Force $nodeExe "$stage\node.exe"

          # Copy desktop launchers and icons.
          Copy-Item -Force "Start-Hunt.bat","Start-Server.bat","Launch-Hunt.vbs","HUNT-Falcon.ico" $stage

      - name: Build portable Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\desktop-stage\*" -DestinationPath "dist\release\Hunt-Desktop-Windows-$env:VERSION.zip" -Force

      - name: Build Inno Setup Windows Installer (.exe)
        shell: pwsh
        run: |
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          & $iscc `
            "/DAppVersion=$env:VERSION" `
            "/DStageDir=$(Resolve-Path dist\desktop-stage)" `
            "/DOutputDir=$(Resolve-Path dist\release)" `
            "installer\hunt-desktop.iss"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-windows
          path: |
            dist/release/Hunt-Desktop-Setup-${{ needs.verify.outputs.version }}.exe
            dist/release/Hunt-Desktop-Windows-${{ needs.verify.outputs.version }}.zip

  build-web-demo:
    name: Build browser demo (static zip)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.verify.outputs.tag }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Served at /demos/hunt/ (ADR-0010); a site that serves it elsewhere rebuilds with
      # HUNT_WEB_BASE_PATH set.
      - name: Build the static demo into out/
        env:
          HUNT_WEB_BASE_PATH: /demos/hunt
        run: npm run build:web

      # The folder's contents sit at the zip's root: unzip straight into /demos/hunt/.
      - name: Zip the static folder
        shell: bash
        run: |
          mkdir -p dist/release
          (cd out && zip -r -X -q ../dist/release/hunt-web-demo.zip .)
          ls -l dist/release/hunt-web-demo.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-demo
          path: dist/release/hunt-web-demo.zip

  publish-release:
    name: Publish GitHub Release
    needs: [verify, build-android, build-desktop, build-web-demo]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ needs.verify.outputs.tag }}
      VERSION: ${{ needs.verify.outputs.version }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-apk
          path: release-assets

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-windows
          path: release-assets

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-demo
          path: release-assets

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          printf '%s\n' \
            "### Installers" \
            "- **Windows Desktop Installer:** \`Hunt-Desktop-Setup-${VERSION}.exe\` (bundles Node.js runtime + Start Menu/Desktop shortcuts)" \
            "- **Windows Portable Bundle:** \`Hunt-Desktop-Windows-${VERSION}.zip\`" \
            "- **Android Companion APK:** \`Hunt-Mobile-${VERSION}.apk\` (installs in-place without wiping data)" \
            "- **Browser demo:** \`hunt-web-demo.zip\` (static files for \`/demos/hunt/\`; sample data, no sync)" \
            "- **Checksums:** \`SHA256SUMS.txt\`" \
            > release-notes.md
          REPO="${{ github.repository }}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" release-assets/* \
              --repo "$REPO" \
              --title "Hunt ${TAG}" \
              --notes-file release-notes.md \
              --generate-notes
          fi
