name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      # Same command contributors run locally: lint, typecheck, tests, production build.
      - name: Lint, typecheck, test & build
        run: npm run check

  geometry:
    name: Layout geometry (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts builds the app (into .next/geometry) and starts it on port 3100.
      - name: Run layout geometry suite
        run: npm run test:geometry

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  apk:
    name: Android APK builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      # Same build-tools/platform as build-apk.sh's defaults (and release.yml).
      - name: Ensure Android build-tools & platform SDK
        shell: bash
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          (yes || true) | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            "build-tools;36.1.0" \
            "platforms;android-36.1" > /dev/null

      # Catches broken resources, manifest or Java before release. Signs with a
      # throwaway key, so the cert pin is skipped here; release.yml enforces it.
      - name: Build APK with a throwaway key
        shell: bash
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.keystore" -storetype PKCS12 \
            -alias androiddebugkey -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 1 -dname "CN=CI" > /dev/null
          KEYSTORE="$RUNNER_TEMP/ci.keystore" EXPECTED_CERT_SHA256=skip \
            bash android-app/build-apk.sh ./android-app "$RUNNER_TEMP/hunt-ci.apk"
